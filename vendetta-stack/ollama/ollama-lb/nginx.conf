# nginx.conf — ollama-lb (NGINX variant, compose profile `nginx-lb`): passive-health LB for the Ollama pool.
#
# Traces: PROMPT §1 Tier 4 (no single GPU node), PROMPT §3 (mTLS between tiers, no admin surface),
#         CONTRACT §8.1 (listens 127.0.0.1:11434 in the llm-gateway netns, mTLS to ollama-workers:11443),
#         CS3 §4.5 (LB topologies; hardened port of deployment/docker/ollama-lb/nginx.conf).
#
# HAProxy (haproxy.cfg) stays the default because it health-checks ACTIVELY and queues; this variant only
# has passive checks (max_fails/fail_timeout) and a connection cap (limit_conn) for backpressure.
# * least_conn: LLM requests are long and uneven; round-robin would starve slow nodes.
# * `server ... resolve` (nginx >= 1.27.3, open source) + upstream `resolver`: worker names are resolved at
#   runtime, so nginx starts even when DNS or every worker is down (the peers stay down until they resolve).
#   The resolver below is Docker's embedded DNS; on Kubernetes set it to the cluster DNS Service IP.
# * proxy buffering off + 600s read timeout: required for streamed (SSE / NDJSON) token output.
# * Files: /pki/ca.crt, /pki/ollama-lb.crt, /pki/ollama-lb.key (read-only). Mount this file at
#   /etc/nginx/nginx.conf:ro. All temp paths live under /tmp (tmpfs) so the root filesystem can be read-only.
# Validate: nginx -t -c /etc/nginx/nginx.conf   (needs the /pki files).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  log_format cs3 '$remote_addr "$request" $status $upstream_addr rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout cs3;
  server_tokens off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  upstream ollama_workers {
    zone ollama_workers 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    least_conn;
    server ollama-workers:11443 resolve max_fails=2 fail_timeout=15s;
    keepalive 32;
  }

  # Backpressure: more in-flight requests than the pool can serve are refused instead of queued unbounded.
  limit_conn_zone $server_name zone=ollama_total:1m;

  server {
    listen 127.0.0.1:11434;
    limit_conn ollama_total 64;
    limit_conn_status 503;
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host ollama-1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # mTLS to the worker proxies: client certificate = ollama-lb, server identity must be `ollama-1`.
    proxy_ssl_certificate /pki/ollama-lb.crt;
    proxy_ssl_certificate_key /pki/ollama-lb.key;
    proxy_ssl_trusted_certificate /pki/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name ollama-1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse on;

    # Model management and admin endpoints are never forwarded (nginx matches the normalised URI,
    # so //api/./pull and %2e variants resolve to the same location).
    location ~* ^/api/(pull|push|create|delete|copy|blobs)(/|$) { return 403; }
    location ~* ^/(admin|debug|metrics|stats|healthz|__control)(/|$) { return 403; }

    location ~* ^/(api/(chat|generate|tags|version|show|ps|embed|embeddings)|v1/(chat/completions|completions|models|embeddings)(/.*)?)?$ {
      proxy_pass https://ollama_workers;
    }

    location / { return 403; }
  }

  # Operations listener (same netns as the gateway): liveness and connection counters.
  server {
    listen 127.0.0.1:8404;
    access_log off;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /stub_status { stub_status; }
    location / { return 404; }
  }
}

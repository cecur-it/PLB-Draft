# /etc/newsyslog.d/cs3-ollama.conf — macOS counterpart of cs3-ollama.logrotate (installed by ollama/install-ollama.sh).
# Traces: PROMPT §1 Tier 4 (operational hygiene). Size-based rotation (10 MiB, 8 generations, bzip2) of the
# LaunchDaemon log files named in com.cecur-it.cs3-ollama.plist. launchd keeps its descriptor open, so
# `launchctl kickstart -k system/com.cecur-it.cs3-ollama` switches the daemon onto the fresh file.
# logfilename                              [owner:group]        mode count size  when flags
/var/lib/cs3-ollama/cs3-ollama.log         _cs3-ollama:daemon   640  8     10240 *    JN
/var/lib/cs3-ollama/cs3-ollama.err.log     _cs3-ollama:daemon   640  8     10240 *    JN

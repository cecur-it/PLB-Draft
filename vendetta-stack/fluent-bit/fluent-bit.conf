# Traces: PROMPT §1 Tier 1 (edge collector), §3 Data flow; CONTRACT §2 (ports), §3 (streams), §5 (wiring), §8.3 (legs)
#         deployment/agents/templates/fluent-bit-linux.conf (CS3 forwarder)
#
# Vendetta-stack edge collector, Fluent Bit 3.2.10 (classic format). Layout:
#   conf.d/*.conf      always loaded, in file-name order (filter order == load order)
#   enabled.d/*.conf   rendered at start by entrypoint.sh (legs/*.conf, inputs/*.conf); 00-noop.conf is always present
#                      so the @INCLUDE glob can never be empty (an empty glob is a fatal error)
#
# Delivery model: filesystem-buffered, at-least-once. Every input is storage.type filesystem with
# storage.pause_on_chunks_overlimit, every output has net.keepalive and bounded storage.total_limit_size, so a downstream
# outage backpressures the tails (they pause, they do not drop) and nothing is held only in memory.
#
# Leaky-bucket mapping (Vendetta agent client_buffer: events_per_second 500, queue_size 5000):
#   events_per_second 500 -> `throttle` filter Rate ${CS3_EPS_LIMIT} (70-filters-global.conf), applied ONLY to noisy,
#                            loss-tolerant tags; alerts, findings, audit events are never throttled;
#   queue_size 5000       -> Mem_Buf_Limit + storage.max_chunks_up below: when full, inputs pause and resume from the
#                            tail DB offset (no loss), where the Wazuh agent would drop.
#
# Environment: every ${VAR} used in this tree is exported with a default by entrypoint.sh (Fluent Bit has no ${VAR:-default}).

[SERVICE]
    Flush                       1
    Grace                       30
    Daemon                      off
    Log_Level                   ${FLB_LOG_LEVEL}
    Parsers_File                /etc/fluent-bit/parsers.conf
    Plugins_File                /etc/fluent-bit/plugins.conf
    Streams_File                /etc/fluent-bit/streams.conf
    HTTP_Server                 On
    HTTP_Listen                 0.0.0.0
    HTTP_Port                   2020
    Health_Check                On
    HC_Errors_Count             5
    HC_Retry_Failure_Count      5
    HC_Period                   60
    Hot_Reload                  On
    scheduler.base              3
    scheduler.cap               60
    storage.path                /var/log/fluent-bit/storage
    storage.sync                normal
    storage.checksum            on
    storage.backlog.mem_limit   64M
    storage.max_chunks_up       128
    storage.metrics             on
    storage.delete_irrecoverable_chunks on

@INCLUDE conf.d/*.conf
@INCLUDE enabled.d/*.conf

# Traces: PROMPT §1 Tier 1 (edge normalisation/enrichment), §3 Data flow; CONTRACT §3 (edge sanitization), §4.1 (severity map),
#         §8.3; deployment/agents/templates/fluent-bit-linux.conf + gateway.d/20-normalize.conf
# Filters that apply to every stream. Filter order == load order == the order below (60-ai-tier.conf runs first on purpose).
#
# Hash-chained gateway events (cs3.ai.inference, cs3.ai.tool_call) are NEVER passed through a record-mutating filter: Lua
# drops JSON null (`fallback_reason: null`) and would break the SHA-256 chain verified by the audit leg. They are only
# observed by the `expect` guard at the end of this file.

# ---- 0. Host-source tagger: `host.syslog` -> host.auth | host.audit | host.network | host.endpoint ---------------
# Syslog input carries everything an appliance cannot tag itself (one flat `host.syslog` stream). The manager leg routes only
# host.auth/audit/network/endpoint through the rule engine, so the stream is classified here, once, before any shaping.
# Ordered rules: a match drops the record from the original tag (KEEP=false), so the first hit wins. Idempotent — the rules
# match `host.syslog` only, so retagged records re-enter the chain and fall straight through to the shaping filters.
[FILTER]
    Name                          rewrite_tag
    Match                         host.syslog
    Alias                         host_source_tagger
    Rule                          $ident ^(auditd|audispd)$ host.audit false
    Rule                          $ident ^(sshd|sshd-session|sudo|su|systemd-logind|polkitd|login|gdm[-a-z]*|lightdm|cron|crond|atd)$ host.auth false
    Rule                          $message (IN=|OUT=|SRC=|DST=|PROTO=|SPT=|DPT=|MAC=) host.network false
    Rule                          $ident ^(ufw|nft|nftables|iptables|ip6tables|firewalld|pfsense|opnsense|fortigate|fortios|cisco|asa|paloalto|suricata|snort|zeek|bro|dnsmasq|named|unbound|dhcpd|openvpn|wireguard|frr|bird|quagga|strongswan|charon|pluto|snmpd|ntpd|chronyd|haproxy|nginx|apache2|httpd)$ host.network false
    Rule                          $ident .+ host.endpoint false
    Rule                          $message .+ host.endpoint false
    Emitter_Name                  host_source_emitter
    Emitter_Storage.type          filesystem
    Emitter_Mem_Buf_Limit         16M

# ---- 1. Host sources -> CS3 console ingest contract: { source, message, agentName } --------------------------------
# Order matters twice: the specific blocks run before the generic one (modify `Add` never overwrites, so the generic
# `source syslog` must come last to not shadow the more specific value), and each block renames `ident` -- the emitting
# program of a retagged syslog line -- into `source`, which becomes the RFC5424 appname the manager decoders key on.
# journald records carry the emitting program in SYSLOG_IDENTIFIER and the host in HOSTNAME (the systemd input strips the
# leading underscore). Both are promoted here, before the classifier in section 2b: `source` becomes the RFC3164 appname the
# manager decoders key on, and `host` becomes the device identity, so a journal line is not sent as `syslog@localhost`.
# `Add` never overwrites, so the plain `source syslog` fallback still covers a record that has no identifier.
[FILTER]
    Name                          modify
    Match                         host.journal
    Alias                         host_journal_shape
    Rename                        MESSAGE message
    Rename                        SYSLOG_IDENTIFIER source
    Rename                        HOSTNAME host
    Add                           source syslog
    Add                           agentName ${CS3_HOSTNAME}

[FILTER]
    Name                          modify
    Match                         host.auth
    Alias                         host_auth_shape
    Rename                        log message
    Rename                        ident source
    Add                           source auth.log
    Add                           agentName ${CS3_HOSTNAME}

# `log` keeps the whole audit line (it becomes `message`); the auditd parser adds type / audit_id / audit_body.
[FILTER]
    Name                          parser
    Match                         host.audit
    Alias                         host_audit_parse
    Key_Name                      log
    Parser                        auditd
    Reserve_Data                  On
    Preserve_Key                  On

[FILTER]
    Name                          modify
    Match                         host.audit
    Alias                         host_audit_shape
    Rename                        log message
    Rename                        ident source
    Add                           source auditd
    Add                           agentName ${CS3_HOSTNAME}

[FILTER]
    Name                          modify
    Match                         host.network
    Alias                         host_network_shape
    Rename                        ident source
    Add                           source network
    Add                           agentName ${CS3_HOSTNAME}

[FILTER]
    Name                          modify
    Match                         host.endpoint
    Alias                         host_endpoint_shape
    Rename                        ident source
    Add                           source endpoint
    Add                           agentName ${CS3_HOSTNAME}

# Catch-all: still-untagged syslog lines, and `agentName` for every host stream.
[FILTER]
    Name                          modify
    Match_Regex                   ^host\.(syslog|auth|audit|network|endpoint)$
    Alias                         host_syslog_shape
    Add                           source syslog
    Add                           agentName ${CS3_HOSTNAME}

# Windows agents forward Event Log records over `forward` (the winlog INPUT is Windows-only). A record whose payload is a
# JSON string in `log` is decoded by the `winlog` parser; records already structured pass through unchanged.
[FILTER]
    Name                          parser
    Match                         host.winlog
    Alias                         host_winlog_decode
    Key_Name                      log
    Parser                        winlog
    Reserve_Data                  On
    Preserve_Key                  Off

[FILTER]
    Name                          modify
    Match                         host.winlog
    Alias                         host_winlog_shape
    Rename                        Message message
    Add                           source windows_event
    Add                           agentName ${CS3_HOSTNAME}

# Console-bound logs: drop empty records so a blank line never turns a whole batch into a 400.
[FILTER]
    Name                          grep
    Match_Regex                   ^(host\..*|v1_logs)$
    Alias                         console_drop_empty
    Regex                         message .+

# ---- 2. Leaky bucket (Vendetta client_buffer events_per_second 500) -----------------------------------------------
# One shared bucket for the noisy, loss-tolerant streams only. Detection streams (vendetta.*, errow.findings, cs3.ai.*) are
# never throttled: when the downstream is slow they backpressure through Mem_Buf_Limit / storage pause instead.
[FILTER]
    Name                          throttle
    Match_Regex                   ^(host\.journal|errow\.(runtime_events|proxy|viewer|tui_events))$
    Alias                         leaky_bucket_noisy
    Rate                          ${CS3_EPS_LIMIT}
    Window                        10
    Interval                      1s

# ---- 2b. Journal classifier: host.journal -> host.auth|audit|network|endpoint ---------------------------------------
# The syslog tagger in section 0 can only see `host.syslog`. Journald is where endpoint events actually originate -- unit
# failures, kernel OOM/segfault, and container/workload output -- and those records were previously stranded on
# `host.journal`, which the manager leg does not route, so `host.endpoint` only ever came from appliance syslog lines.
#
# Placement is load-bearing: this runs AFTER the leaky bucket, because the bucket keys on `host.journal` and classifying
# earlier would move journal records out of the throttle and let a whole-journal burst (CS3_JOURNAL_ALL=true) bypass
# CS3_EPS_LIMIT. Retagged records re-enter the chain at the top and reach the section 1 shapes for their new tag; those
# shapes only `Add source <family>`, which does not overwrite the program name set by host_journal_shape.
#
# Deliberately not a catch-all: an unclassified journal line stays on `host.journal` (console only) instead of pushing the
# entire journal into the manager's rule engine. Identifiers mirror the syslog tagger's lists so the same program lands in
# the same family whichever way it arrived.
[FILTER]
    Name                          rewrite_tag
    Match                         host.journal
    Alias                         host_journal_tagger
    Rule                          $source ^(auditd|audispd|audit)$ host.audit false
    Rule                          $source ^(sshd|sshd-session|sudo|su|systemd-logind|polkitd|login|gdm[-a-z]*|lightdm|cron|crond|atd)$ host.auth false
    Rule                          $source ^(ufw|nft|nftables|iptables|ip6tables|firewalld|suricata|snort|zeek|bro|dnsmasq|named|unbound|dhcpd|openvpn|wireguard|frr|bird|quagga|strongswan|charon|pluto|snmpd|ntpd|chronyd|haproxy|nginx|apache2|httpd|NetworkManager|systemd-networkd|systemd-resolved|dhclient|dhcpcd|tailscaled)$ host.network false
    Rule                          $source ^(docker|dockerd|containerd|containerd-shim|podman|conmon|crio|runc|kubelet|k3s|k3s-agent|systemd|kernel)$ host.endpoint false
    Rule                          $message (segfault|core\sdumped|[Oo]ut\sof\s[Mm]emory|oom-kill|Killed\sprocess|Failed\sto\sstart|exited\swith|Start\srequest\srepeated) host.endpoint false
    Emitter_Name                  host_journal_emitter
    Emitter_Storage.type          filesystem
    Emitter_Mem_Buf_Limit         16M


# ---- 3. Classification / enrichment (Lua, stream_processors.lua) --------------------------------------------------
# Filter order == load order == the order below (60-ai-tier.conf runs first on purpose).
[FILTER]
    Name                          lua
    Match_Regex                   ^vendetta\..*$
    Alias                         vendetta_classify
    script                        /etc/fluent-bit/stream_processors.lua
    call                          classify_vendetta

[FILTER]
    Name                          lua
    Match_Regex                   ^(vendetta\..*|errow\.findings)$
    Alias                         mitre_enrich
    script                        /etc/fluent-bit/stream_processors.lua
    call                          mitre_enrich

[FILTER]
    Name                          lua
    Match_Regex                   ^errow\..*$
    Alias                         errow_normalize
    script                        /etc/fluent-bit/stream_processors.lua
    call                          errow_normalize

# vendetta.alerts -> vendetta.fim | vendetta.vulnerability | vendetta.sca (derived from rule.groups by classify_vendetta).
# Re-emitted records re-enter the chain under the new tag; every filter in this file is idempotent.
[FILTER]
    Name                          rewrite_tag
    Match                         vendetta.alerts
    Alias                         vendetta_stream_retag
    Rule                          $stream ^fim$ vendetta.fim false
    Rule                          $stream ^vulnerability$ vendetta.vulnerability false
    Rule                          $stream ^sca$ vendetta.sca false
    Emitter_Name                  vendetta_stream_emitter
    Emitter_Storage.type          filesystem
    Emitter_Mem_Buf_Limit         32M

# ---- 4. Edge sanitisation of EVERY string field of every stream except the hash-chained gateway events -------------
# Same algorithm as deployment/agents/templates/gateway.d/cs3-otlp-normalize.lua (control chars, UTF-8-safe truncation at
# CS3_MESSAGE_MAX_CHARS, Bearer / key=value redaction), applied recursively.
[FILTER]
    Name                          lua
    Match_Regex                   ^(?!cs3\.ai\.(inference|tool_call)$).*$
    Alias                         cs3_sanitize
    script                        /etc/fluent-bit/stream_processors.lua
    call                          cs3_sanitize

# ---- 5. Integrity guard for hash-chained gateway events (observe only, never mutates) -----------------------------
[FILTER]
    Name                          expect
    Match                         cs3.ai.inference
    Alias                         chain_guard_inference
    key_exists                    chain_id
    key_exists                    seq
    key_exists                    prev_hash
    key_exists                    hash
    action                        warn

[FILTER]
    Name                          expect
    Match                         cs3.ai.tool_call
    Alias                         chain_guard_tool_call
    key_exists                    chain_id
    key_exists                    seq
    key_exists                    prev_hash
    key_exists                    hash
    action                        warn

# Stream-processor windows (streams.conf) are per edge node; Fluentd exposes them as gauges, so the node name is the label that
# keeps two edge nodes from overwriting each other's series (verified on 3.2.10: filters do see stream-processor output).
[FILTER]
    Name                          modify
    Match                         cs3.sp.*
    Alias                         sp_edge_node
    Add                           edge_node ${CS3_HOSTNAME}

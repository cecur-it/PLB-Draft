# Traces: PROMPT §1 Tier 1 (edge collector), §4 AI tier; CONTRACT §2 (9880 http in), §4.3 (gateway events), §8.3 (test hook)
# HTTP ingest: the llm-gateway POSTs its events to http://fluent-bit:9880/<tag> (tag == URI path, e.g. /cs3.ai.inference,
# /cs3.ai.tool_call, /cs3.ai.enrichment) and the smoke test posts /host.journal and /vendetta.alerts through the SAME
# filters/outputs as the real inputs.
# The request MUST carry `Content-Type: application/json` (otherwise Fluent Bit answers 400); the body may be one object
# or an array. Success is 201. The port has no authentication: keep it on the edge/aggregation networks only (network policy),
# a record posted here is routed purely by its tag.
[INPUT]
    Name                          http
    Alias                         gateway_events_http
    Listen                        0.0.0.0
    Port                          9880
    buffer_max_size               4M
    buffer_chunk_size             512K
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

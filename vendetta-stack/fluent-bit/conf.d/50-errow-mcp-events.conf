# Traces: PROMPT §1 Tier 1 (Errow MCP/TUI -> edge); CONTRACT §2 (ERROW_TUI_PORT), §3 (errow.mcp_events, errow.tooling,
#         errow.tui_events), §4.5 (MCP bridge), §8.4

# errow-mcp events (event_type mcp_exec). The gateway's cs3.ai.tool_call events arrive on the http input (9880) and are
# routed by Fluentd into the same errow-mcp-* index.
[INPUT]
    Name                          tail
    Alias                         errow_mcp_events_tail
    Tag                           errow.mcp_events
    Path                          /var/log/errow/mcp_events.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-mcp-events.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               2M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Tool executions (sub-stream of runtime events, index errow-tooling-*).
[INPUT]
    Name                          tail
    Alias                         errow_tooling_tail
    Tag                           errow.tooling
    Path                          /var/log/errow/tooling.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-tooling.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               2M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# TUI bridge: forward listener on ${ERROW_TUI_PORT} (default 24225). Errow's own TUI IPC is an inherited socketpair FD /
# loopback socket; this port belongs to the bridge. The pinned forward input has no `Tag` property, so incoming tags get the
# prefix `errow.tui_events.`, a marker key is added and rewrite_tag collapses them to exactly `errow.tui_events`.
# That tag is matched ONLY by the Fluentd forward output (90-outputs.conf); no leg regex can match it.
[INPUT]
    Name                          forward
    Alias                         errow_tui_forward_in
    Listen                        0.0.0.0
    Port                          ${ERROW_TUI_PORT}
    Tag_Prefix                    errow.tui_events.
    Buffer_Chunk_Size             256k
    Buffer_Max_Size               2M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[INPUT]
    Name                          tail
    Alias                         errow_tui_events_tail
    Tag                           errow.tui_events
    Path                          /var/log/errow/tui_events.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-tui-events.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 4MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[FILTER]
    Name                          modify
    Match                         errow.tui_events.*
    Alias                         errow_tui_mark
    Add                           _cs3_route tui

[FILTER]
    Name                          rewrite_tag
    Match                         errow.tui_events.*
    Alias                         errow_tui_retag
    Rule                          $_cs3_route ^tui$ errow.tui_events false
    Emitter_Name                  errow_tui_emitter
    Emitter_Storage.type          filesystem
    Emitter_Mem_Buf_Limit         8M

[FILTER]
    Name                          modify
    Match                         errow.tui_events
    Alias                         errow_tui_unmark
    Remove                        _cs3_route

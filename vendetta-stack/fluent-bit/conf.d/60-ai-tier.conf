# Traces: PROMPT §4 AI tier (sovereign Ollama), CS3 §4.3 telemetry-loop prevention; CONTRACT §3 (cs3.ai.ollama), §5, §8.3;
#         deployment/agents/templates/gateway.d/60-ai-tier.conf
# Ollama's journald entries must NEVER reach the Console ingest leg, `vendetta-alerts-*` or the gateway /triage endpoint:
# an inference-server "error" line would be flagged and offered for triage by the very model server that produced it
# (feedback loop). They are retagged `cs3.ai.ollama`, which
#   * no Console-leg regex can match (Match_Regex in legs/10-console.conf lists only host.*, v1_logs, vendetta.*),
#   * is excluded from the Fluentd forward output (Match_Regex in 90-outputs.conf),
#   * reaches only the ESOC OTLP leg, the SIEM NDJSON leg (when enabled) and the always-on local safety file.
#
# Filter-order rule: this file loads BEFORE 70-filters-global.conf, whose host.journal normalisation (Rename MESSAGE,
# Add source syslog) would otherwise run first and leave records with source=syslog. rewrite_tag(keep=false) removes the
# original from the chain, so host.journal normalisation never sees Ollama entries.
#
# The same rule serves the real `systemd` input (inputs/systemd.conf, rendered when a journal is mounted) and the
# `http` test hook (POST /host.journal {"SYSTEMD_UNIT":"ollama.service","MESSAGE":"..."}).

[FILTER]
    Name                          rewrite_tag
    Match                         host.journal
    Alias                         cs3_ai_retag
    Rule                          $SYSTEMD_UNIT ^(cs3-ollama|ollama)\.service$ cs3.ai.ollama false
    Emitter_Name                  cs3_ai_tag_emitter
    Emitter_Storage.type          filesystem
    Emitter_Mem_Buf_Limit         16M

[FILTER]
    Name                          modify
    Match                         cs3.ai.ollama
    Alias                         cs3_ai_ollama_shape
    Rename                        MESSAGE message
    Add                           source cs3-ai-ollama
    Add                           agentName ${CS3_HOSTNAME}

# Go panics / fatal errors arrive as one journal entry per stderr line; stitch them into one record.
[FILTER]
    Name                          multiline
    Match                         cs3.ai.ollama
    Alias                         cs3_ai_ollama_multiline
    multiline.key_content         message
    multiline.parser              ollama_go_panic
    Emitter_Name                  cs3_ai_multiline_emitter
    Emitter_Storage.type          filesystem
    Emitter_Mem_Buf_Limit         16M

# slog (`time=... level=... source=... msg=...`) and GIN access lines -> structured fields; message is preserved.
[FILTER]
    Name                          parser
    Match                         cs3.ai.ollama
    Alias                         cs3_ai_ollama_parser
    Key_Name                      message
    Parser                        ollama_slog
    Parser                        ollama_gin
    Reserve_Data                  On
    Preserve_Key                  On

# The `file` output writes bare maps without a timestamp, so stamp @timestamp from the event time.
[FILTER]
    Name                          lua
    Match                         cs3.ai.ollama
    Alias                         cs3_ai_ollama_stamp
    script                        /etc/fluent-bit/stream_processors.lua
    call                          cs3_stamp
    time_as_table                 on

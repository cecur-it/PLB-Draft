# Traces: PROMPT §1 Tier 1 (Vendetta agents -> edge), §3 Data flow; CONTRACT §2 (volumes), §3 (vendetta.* streams)
# Inputs for the Vendetta (Wazuh-compatible) manager alerts and for agents / other edge nodes forwarding to this node.
# Classification into vendetta.fim|vulnerability|sca happens in 70-filters-global.conf (it needs rule.groups).

# /var/vendetta/logs/alerts/alerts.json: one JSON alert per line, rotated daily by the manager (Rotate_Wait covers the
# rename window). Read_from_Head is safe: the DB keeps the offset and OpenSearch upserts by alert id (idempotent replay).
[INPUT]
    Name                          tail
    Alias                         vendetta_alerts_tail
    Tag                           vendetta.alerts
    Path                          /var/vendetta/logs/alerts/alerts.json
    Parser                        vendetta_alert_json
    DB                            /var/log/fluent-bit/db/vendetta-alerts.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               2M
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Agents and other edge nodes (Fluent Bit forward output / Fluentd out_forward). Tags are kept as sent (host.*, v1_logs,
# vendetta.*). TLS is optional because agent fleets differ; with FLB_FORWARD_TLS=on the listener presents
# /pki/fluent-bit.crt and verifies client certificates against /pki/ca.crt.
[INPUT]
    Name                          forward
    Alias                         edge_forward_in
    Listen                        0.0.0.0
    Port                          24224
    Buffer_Chunk_Size             1M
    Buffer_Max_Size               8M
    tls                           ${FLB_FORWARD_TLS}
    tls.verify                    ${FLB_FORWARD_TLS_VERIFY}
    tls.ca_file                   ${FLB_FORWARD_TLS_CA_FILE}
    tls.crt_file                  ${FLB_FORWARD_TLS_CRT_FILE}
    tls.key_file                  ${FLB_FORWARD_TLS_KEY_FILE}
    Mem_Buf_Limit                 32MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Traces: PROMPT §1 Tier 1 (Errow findings -> edge); CONTRACT §3 (errow.findings), §8.4/§15 (shipper shapes);
#         errow/errow/report/sarif.py (SARIF 2.1.0 result shape)
# One NDJSON record per SARIF `result` (+ matching `rule`), written by errow-shipper to /var/log/errow/findings.ndjson.
# Errow itself rewrites findings.sarif atomically (not JSONL, not ~/.errow), hence the shipper; the tail below reads the
# shipper's idempotent NDJSON. The SARIF keys are NEVER renamed here: renames happen only in the OpenSearch ingest pipelines.
[INPUT]
    Name                          tail
    Alias                         errow_findings_tail
    Tag                           errow.findings
    Path                          /var/log/errow/findings.ndjson
    Parser                        errow_sarif_result
    DB                            /var/log/fluent-bit/db/errow-findings.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             128k
    Buffer_Max_Size               4M
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

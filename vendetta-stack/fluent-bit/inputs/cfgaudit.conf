# Optional, manually generated Cfgaudit findings/run summaries. Raw device configurations are never tailed.
[INPUT]
    Name                          tail
    Alias                         cfgaudit_findings_tail
    Tag                           cfgaudit.findings
    Path                          ${CFGAUDIT_REPORTS_DIR}/findings.ndjson
    Parser                        cfgaudit_ndjson
    DB                            /var/log/fluent-bit/db/cfgaudit-findings.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              10
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[INPUT]
    Name                          tail
    Alias                         cfgaudit_runs_tail
    Tag                           cfgaudit.runs
    Path                          ${CFGAUDIT_REPORTS_DIR}/runs.ndjson
    Parser                        cfgaudit_ndjson
    DB                            /var/log/fluent-bit/db/cfgaudit-runs.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              10
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 4MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

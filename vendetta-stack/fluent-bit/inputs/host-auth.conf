# Traces: PROMPT §1 Tier 1 (host auth log); deployment/agents/templates/fluent-bit-linux.conf
# Rendered into enabled.d/ by entrypoint.sh when /var/log/auth.log or /var/log/secure exists (and CS3_HOST_LOGS is not false).
[INPUT]
    Name                          tail
    Alias                         host_auth_tail
    Tag                           host.auth
    Path                          /var/log/auth.log,/var/log/secure
    Path_Key                      file
    DB                            /var/log/fluent-bit/db/host-auth.db
    DB.sync                       normal
    Skip_Long_Lines               On
    Read_from_Head                False
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

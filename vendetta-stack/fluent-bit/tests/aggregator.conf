# Traces: PROMPT §4 Phase 4 (validation); CONTRACT §5. Test-only stand-in for fluentd-1/-2: a second Fluent Bit that terminates
# the mTLS Forward connection and writes every received record, with its tag, to /out/${AGG_NAME}.log (out_file default
# format: `tag: [time, {record}]`). Used by tests/test_legs.sh to prove WHICH tags the edge forward output delivers.
[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224
    tls          on
    tls.verify   on
    tls.ca_file  /pki/ca.crt
    tls.crt_file /pki/${AGG_NAME}.crt
    tls.key_file /pki/${AGG_NAME}.key

[OUTPUT]
    Name         file
    Match        *
    Path         /out
    File         ${AGG_NAME}.log
    Mkdir        true

# Traces: PROMPT §1 Tier 1 -> ESOC (Leg 2); CONTRACT §8.3 (Leg2); deployment/agents/templates/gateway.d/40-esoc-otlp.conf
# Rendered into enabled.d/ when CS3_ESOC_ENABLED=true. OTLP/gRPC over mTLS to the central ESOC.
# Variables: CS3_ESOC_HOST, CS3_ESOC_PORT, CS3_ESOC_GRPC, CS3_ESOC_TLS, CS3_ESOC_CA_FILE, CS3_ESOC_CERT_FILE,
# CS3_ESOC_KEY_FILE, CS3_AGENT_ID, CS3_HEALTH_SCRAPE_SEC.
#
# Unlike the Console leg this leg carries `cs3.ai.*` (including cs3.ai.ollama). Delivery is at-least-once: unlimited retries
# with backoff over filesystem-buffered chunks, so an ESOC outage never degrades local detection.
# Pinned 3.2.10 limitation: the opentelemetry/http outputs reject `tls.min_version` (also in legs/30-siem.conf), so the TLS floor is whatever OpenSSL negotiates
# with the ESOC endpoint; enforce TLS 1.3 server-side (mTLS stays on: tls.verify + client cert/key).

# Sensor self-telemetry (input/output records, retries, drops, storage usage): an ESOC control plane alerts on cadence loss
# (suppression) or on rising retries / buffer depth (egress tampering, exhaustion).
[INPUT]
    Name                          fluentbit_metrics
    Alias                         cs3_health_metrics
    Tag                           cs3.health.metrics
    scrape_interval               ${CS3_HEALTH_SCRAPE_SEC}
    scrape_on_start               true

[OUTPUT]
    Name                          opentelemetry
    Alias                         esoc_otlp
    Match_Regex                   ^(host\..*|v1_logs|cs3\.ai\..*)$
    Host                          ${CS3_ESOC_HOST}
    Port                          ${CS3_ESOC_PORT}
    grpc                          ${CS3_ESOC_GRPC}
    compress                      gzip
    add_label                     agent_id ${CS3_AGENT_ID}
    Retry_Limit                   False
    Workers                       2
    net.connect_timeout           10
    net.keepalive                 on
    storage.total_limit_size      2G
    tls                           ${CS3_ESOC_TLS}
    tls.verify                    On
    tls.ca_file                   ${CS3_ESOC_CA_FILE}
    tls.crt_file                  ${CS3_ESOC_CERT_FILE}
    tls.key_file                  ${CS3_ESOC_KEY_FILE}

[OUTPUT]
    Name                          opentelemetry
    Alias                         esoc_otlp_metrics
    Match                         cs3.health.metrics
    Host                          ${CS3_ESOC_HOST}
    Port                          ${CS3_ESOC_PORT}
    grpc                          ${CS3_ESOC_GRPC}
    compress                      gzip
    add_label                     agent_id ${CS3_AGENT_ID}
    Retry_Limit                   False
    Workers                       1
    net.connect_timeout           10
    net.keepalive                 on
    storage.total_limit_size      256M
    tls                           ${CS3_ESOC_TLS}
    tls.verify                    On
    tls.ca_file                   ${CS3_ESOC_CA_FILE}
    tls.crt_file                  ${CS3_ESOC_CERT_FILE}
    tls.key_file                  ${CS3_ESOC_KEY_FILE}

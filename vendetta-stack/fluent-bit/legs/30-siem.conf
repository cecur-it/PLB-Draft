# Traces: PROMPT §1 Tier 1 -> SIEM (Leg 3); CONTRACT §8.3 (Leg3); deployment/agents/templates/gateway.d/50-siem-http.conf
# Rendered into enabled.d/ when CS3_SIEM_ENABLED=true. NDJSON over HTTPS, gzip, disk-buffered.
# Variables: CS3_SIEM_HOST, CS3_SIEM_PORT, CS3_SIEM_URI, CS3_SIEM_TLS, CS3_SIEM_CA_FILE, CS3_SIEM_FORMAT (json_lines),
# CS3_SIEM_AUTH_SCHEME, CS3_SIEM_TOKEN (from CS3_SIEM_TOKEN_FILE), CS3_AGENT_ID, CS3_HOSTNAME.
# Carries host.*, v1_logs and every cs3.ai.* stream (including cs3.ai.ollama).
[OUTPUT]
    Name                          http
    Alias                         siem_http
    Match_Regex                   ^(host\..*|v1_logs|cs3\.ai\..*)$
    Host                          ${CS3_SIEM_HOST}
    Port                          ${CS3_SIEM_PORT}
    URI                           ${CS3_SIEM_URI}
    Format                        ${CS3_SIEM_FORMAT}
    Compress                      gzip
    Header                        Authorization ${CS3_SIEM_AUTH_SCHEME} ${CS3_SIEM_TOKEN}
    Header                        X-Origin-Sensor CS3-Edge
    Header                        X-CS3-Agent ${CS3_AGENT_ID}
    Header                        X-Enterprise-Source ${CS3_HOSTNAME}
    Retry_Limit                   False
    Workers                       2
    net.connect_timeout           10
    net.keepalive                 on
    storage.total_limit_size      1G
    tls                           ${CS3_SIEM_TLS}
    tls.verify                    On
    tls.ca_file                   ${CS3_SIEM_CA_FILE}

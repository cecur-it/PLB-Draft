# Traces: PROMPT §1 Tier 1 -> Console (Leg 1); CONTRACT §8.3 (Leg1); demo/demo-100226/server/routes/cecur.ts (POST /api/cecur/logs/ingest)
# Rendered into enabled.d/ when CS3_CONSOLE_ENABLED=true. Variables: CS3_HOST, CS3_PORT, CS3_TLS, CS3_CA_FILE, CS3_INGEST_KEY
# (read by entrypoint.sh from CS3_INGEST_KEY_FILE; never written to disk or into this file).
#
# The regex lists ONLY host.*, v1_logs and the four vendetta.* streams: it structurally cannot match `cs3.ai.*`
# (so `cs3.ai.ollama` never reaches the Console), nor errow.*.
# The Console route requires a string `message` and `source` and caps a batch at CS3_INGEST_MAX_BATCH (default 1000) and
# the body at CS3_JSON_LIMIT (default 2mb): keep Flush at 1 s and raise those two Console limits if a 413/400 appears in the
# output's retry log (every non-2xx is retried).
[OUTPUT]
    Name                          http
    Alias                         console_ingest
    Match_Regex                   ^(host\..*|v1_logs|vendetta\.alerts|vendetta\.fim|vendetta\.vulnerability|vendetta\.sca)$
    Host                          ${CS3_HOST}
    Port                          ${CS3_PORT}
    URI                           /api/cecur/logs/ingest
    Format                        json
    Compress                      gzip
    Header                        X-API-Key ${CS3_INGEST_KEY}
    Retry_Limit                   False
    Workers                       2
    net.connect_timeout           10
    net.keepalive                 on
    storage.total_limit_size      2G
    tls                           ${CS3_TLS}
    tls.verify                    On
    tls.ca_file                   ${CS3_CA_FILE}

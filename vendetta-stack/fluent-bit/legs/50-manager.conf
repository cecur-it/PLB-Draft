# Traces: manager integration (item 1). Inbound: host.* -> manager rule engine. Outbound: manager alerts -> CS3.
# CONTRACT: demo/demo-100226/server/routes/cecur.ts (POST /api/cecur/manager/alerts), vendetta/manager/cs3-rules.xml
#
# Rendered into enabled.d/ when CS3_MANAGER_ENABLED=true. Variables: CS3_HOST, CS3_PORT, CS3_TLS, CS3_CA_FILE,
# CS3_INGEST_KEY, CS3_MANAGER_HOST, CS3_MANAGER_PORT, FLB_MANAGER_ALERTS_PATH.
#
# Two directions, deliberately asymmetric:
#
#   1. host.syslog / auth / audit / network / endpoint are copied into the manager's syslog remote so they reach its decoder and
#      rule engine. The vendetta.* streams are NOT copied — they are already manager output and copying them back
#      produces a feedback loop.
#   2. The manager's alerts.json is tailed and posted to /api/cecur/manager/alerts, which keeps the rule ID, the original
#      event timestamp, the agent identity and rule.level. Nothing is parsed or summarised here: the manager is the
#      decision point, CS3 only adapts the record.
#
# Fail-closed: Retry_Limit False plus filesystem storage. A CS3 outage or an audit-degraded 503 parks alerts on disk and
# replays them; the adapter dedupes within CS3_ALERT_DEDUP_WINDOW_S (default 300 s) so a replay does not double rows.
[INPUT]
    Name                          tail
    Alias                         manager_alerts
    Path                          ${FLB_MANAGER_ALERTS_PATH}
    Path_Key                      alert_source
    Tag                           manager.alerts
    Parser                        vendetta_alert_json
    Read_from_Head                true
    DB                            /var/log/fluent-bit/manager-alerts.db
    Refresh_Interval              5
    Rotate_Wait                   10
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Marks the stream so manager alerts stay distinguishable from log legs in the per-output metrics.
[FILTER]
    Name                          record_modifier
    Match                         manager.alerts
    Record                        flb_stream manager-alerts

# ---- outbound leg: manager alerts into CS3 ----------------------------------------------
[OUTPUT]
    Name                          http
    Alias                         manager_alert_ingest
    Match_Regex                   ^(manager\.alerts)$
    Host                          ${CS3_HOST}
    Port                          ${CS3_PORT}
    URI                           /api/cecur/manager/alerts
    Format                        json
    Compress                      gzip
    Header                        X-API-Key ${CS3_INGEST_KEY}
    Retry_Limit                   False
    Workers                       2
    net.connect_timeout           10
    net.keepalive                 on
    storage.total_limit_size      1G
    tls                           ${CS3_TLS}
    tls.verify                    On
    tls.ca_file                   ${CS3_CA_FILE}

# ---- inbound leg: host logs into the manager rule engine --------------------------------
# rfc3164, not rfc5424: wazuh-remoted only pre-decodes the classic header into timestamp/hostname/program_name, and
# program_name is exactly what the manager-side decoders key on. An rfc5424 frame arrives undecoded and only ever matches
# the generic catch-alls. appname carries the CS3 source so the decoder sees the real program name.
[OUTPUT]
    Name                          syslog
    Alias                         manager_rule_engine
    Match_Regex                   ^(host\.(syslog|auth|audit|network|endpoint))$
    Host                          ${CS3_MANAGER_HOST}
    Port                          ${CS3_MANAGER_PORT}
    Mode                          udp
    syslog_format                 rfc3164
    syslog_appname_key            source
    syslog_message_key            message
    syslog_hostname_key           host
    Retry_Limit                   3

# Traces: PROMPT §5 Observability (alert rules are tested, not assumed), CONTRACT §4.4
# promtool unit tests for alerts.yml: synthetic series with the exact metric/label names of the pinned components.
# Run by prometheus/tests/validate.sh:  promtool test rules /etc/prometheus/tests/alerts.test.yml
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  - name: audit chain break pages once it persists
    interval: 1m
    input_series:
      - series: 'llm_gateway_audit_chain_ok{job="llm-gateway",instance="llm-gateway:9101"}'
        values: '1 1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: LlmAuditChainBroken
        exp_alerts: []
      - eval_time: 6m
        alertname: LlmAuditChainBroken
        exp_alerts:
          - exp_labels: {severity: critical, component: llm-gateway}
            exp_annotations:
              summary: "LLM audit hash chain is broken or not fully spooled"
              description: "llm_gateway_audit_chain_ok == 0: tampering, a corrupt spool or a gap in the chain. Treat as an AU-9 integrity incident."
              runbook: "docs/runbooks.md#llm-audit-chain-broken"

  - name: healthy gateway raises none of the SLO alerts
    interval: 1m
    input_series:
      - series: 'up{job="llm-gateway",instance="llm-gateway:9101"}'
        values: '1x30'
      - series: 'llm_gateway_audit_chain_ok{job="llm-gateway",instance="llm-gateway:9101"}'
        values: '1x30'
      - series: 'llm_gateway_requests_total{job="llm-gateway",role="triage",engine="nemotron-3-nano:30b",fallback="false"}'
        values: '0+10x30'
      - series: 'llm_gateway_spool_depth{job="llm-gateway"}'
        values: '0x30'
      - series: 'llm_gateway_queue_depth{job="llm-gateway"}'
        values: '3x30'
    alert_rule_test:
      - {eval_time: 25m, alertname: LlmGatewayDown, exp_alerts: []}
      - {eval_time: 25m, alertname: LlmAuditChainBroken, exp_alerts: []}
      - {eval_time: 25m, alertname: LlmNoInferenceTraffic, exp_alerts: []}
      - {eval_time: 25m, alertname: LlmHeuristicFallbackRatioHigh, exp_alerts: []}
      - {eval_time: 25m, alertname: LlmQueueSaturated, exp_alerts: []}
      - {eval_time: 25m, alertname: LlmSpoolBacklogGrowing, exp_alerts: []}

  - name: Fluent Bit chunk retry exhaustion is critical immediately
    interval: 1m
    input_series:
      - series: 'fluentbit_output_retries_failed_total{job="fluent-bit",instance="fluent-bit:2020",name="fluentd_forward"}'
        values: '0 0 0 0 0 4 4 4 4 4'
    alert_rule_test:
      - eval_time: 3m
        alertname: FluentBitRetriesExhausted
        exp_alerts: []
      - eval_time: 7m
        alertname: FluentBitRetriesExhausted
        exp_alerts:
          - exp_labels: {severity: critical, component: fluent-bit, instance: "fluent-bit:2020", name: fluentd_forward}
            exp_annotations:
              summary: "Fluent Bit output fluentd_forward gave up on chunks"
              description: "4 chunks exhausted Retry_Limit on fluentd_forward (fluent-bit:2020) in 10 minutes and were discarded."
              runbook: "docs/runbooks.md#fluent-bit-data-loss"

  - name: Fluentd emit stall needs forwarding traffic and silence at OpenSearch
    interval: 1m
    input_series:
      - series: 'fluentd_output_status_emit_records{job="fluentd",node="fluentd-1",plugin_id="opensearch",type="opensearch"}'
        values: '100x40'
      - series: 'fluentd_output_status_emit_records{job="fluentd",node="fluentd-2",plugin_id="opensearch",type="opensearch"}'
        values: '0+50x40'
      - series: 'fluentbit_output_proc_records_total{job="fluent-bit",instance="fluent-bit:2020",name="fluentd_forward"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FluentdEmitStall
        exp_alerts:
          - exp_labels: {severity: critical, component: fluentd, node: fluentd-1}
            exp_annotations:
              summary: "Fluentd fluentd-1 emits nothing to OpenSearch while Fluent Bit keeps forwarding"
              description: "Fluent Bit's forward output processes records but the OpenSearch outputs of fluentd-1 received none for 10 minutes: routing, TLS client-cert or label wiring problem."
              runbook: "docs/runbooks.md#fluentd-emit-stall"

  - name: Fluentd emit stall stays quiet when nothing is forwarded
    interval: 1m
    input_series:
      - series: 'fluentd_output_status_emit_records{job="fluentd",node="fluentd-1",plugin_id="opensearch",type="opensearch"}'
        values: '100x40'
      - series: 'fluentbit_output_proc_records_total{job="fluent-bit",instance="fluent-bit:2020",name="fluentd_forward"}'
        values: '500x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: FluentdEmitStall, exp_alerts: []}

  - name: both Fluentd aggregators absent
    interval: 1m
    input_series:
      - series: 'up{job="fluentd",instance="fluentd-1:24231",node="fluentd-1"}'
        values: '0x10'
      - series: 'up{job="fluentd",instance="fluentd-2:24231",node="fluentd-2"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: FluentdAllNodesDown
        exp_alerts:
          - exp_labels: {severity: critical, component: fluentd}
            exp_annotations:
              summary: "No Fluentd aggregator is reachable"
              description: "Both fluentd-1 and fluentd-2 are down or not scraped; Fluent Bit buffers to disk but nothing reaches OpenSearch."
              runbook: "docs/runbooks.md#fluentd-node-down"
      - eval_time: 5m
        alertname: FluentdNodeDown
        exp_alerts:
          - exp_labels: {severity: warning, component: fluentd, job: fluentd, instance: "fluentd-1:24231", node: fluentd-1}
            exp_annotations:
              summary: "Fluentd fluentd-1 is not scraped"
              description: "One aggregator is gone; the other still accepts the edge traffic (active-active) but there is no redundancy."
              runbook: "docs/runbooks.md#fluentd-node-down"
          - exp_labels: {severity: warning, component: fluentd, job: fluentd, instance: "fluentd-2:24231", node: fluentd-2}
            exp_annotations:
              summary: "Fluentd fluentd-2 is not scraped"
              description: "One aggregator is gone; the other still accepts the edge traffic (active-active) but there is no redundancy."
              runbook: "docs/runbooks.md#fluentd-node-down"

  - name: Fluentd buffer almost full is critical
    interval: 1m
    input_series:
      - series: 'fluentd_output_status_buffer_available_space_ratio{job="fluentd",node="fluentd-2",plugin_id="opensearch-llm-audit",type="opensearch"}'
        values: '10x10'
      - series: 'fluentd_output_status_buffer_available_space_ratio{job="fluentd",node="fluentd-2",plugin_id="dead_letter_error",type="file"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: FluentdBufferNearlyFull
        exp_alerts:
          - exp_labels: {severity: critical, component: fluentd, node: fluentd-2, plugin_id: opensearch-llm-audit}
            exp_annotations:
              summary: "Fluentd buffer opensearch-llm-audit on fluentd-2 has 10% space left"
              description: "overflow_action block backpressures Fluent Bit once the file buffer is full (best-effort legs drop the oldest chunk instead)."
              runbook: "docs/runbooks.md#fluentd-buffer-nearly-full"

  - name: gateway failover cascade is detected per transition
    interval: 1m
    input_series:
      - series: 'llm_gateway_failover_total{job="llm-gateway",from="triage",to="forensic",reason="timeout"}'
        values: '0+3x30'
      - series: 'llm_gateway_failover_total{job="llm-gateway",from="forensic",to="heuristics",reason="backend_unavailable"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LlmGatewayFailover
        exp_alerts:
          - exp_labels: {severity: warning, component: llm-gateway, from: triage, to: forensic, reason: timeout}
            exp_annotations:
              summary: "LLM tier failover triage -> forensic (timeout) at 3/min"
              description: "The triage -> forensic -> heuristics cascade is engaging repeatedly: Ollama timeouts, GPU maintenance or a backend outage."
              runbook: "docs/runbooks.md#llm-failover"

  - name: p95 triage latency above SLO warns but is not yet critical
    interval: 1m
    input_series:
      - series: 'llm_gateway_triage_latency_seconds_bucket{job="llm-gateway",le="10"}'
        values: '0+4x40'
      - series: 'llm_gateway_triage_latency_seconds_bucket{job="llm-gateway",le="30"}'
        values: '0+10x40'
      - series: 'llm_gateway_triage_latency_seconds_bucket{job="llm-gateway",le="60"}'
        values: '0+40x40'
      - series: 'llm_gateway_triage_latency_seconds_bucket{job="llm-gateway",le="+Inf"}'
        values: '0+40x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LlmTriageLatencyP95High
        exp_alerts:
          - exp_labels: {severity: warning, component: llm-gateway}
            exp_annotations:
              summary: "p95 triage latency 58s (SLO 30s)"
              description: "Backend latency per analysed record (queue wait excluded) is above the 30 s SLO for 10 minutes."
              runbook: "docs/runbooks.md#llm-triage-latency"
      - {eval_time: 30m, alertname: LlmTriageLatencyP95Critical, exp_alerts: []}

  - name: prompt injection burst and schema violations
    interval: 1m
    input_series:
      - series: 'llm_gateway_prompt_injection_blocked_total{job="llm-gateway"}'
        values: '0+5x20'
      - series: 'llm_gateway_output_schema_violations_total{job="llm-gateway"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: LlmPromptInjectionBurst
        exp_alerts:
          - exp_labels: {severity: warning, component: llm-gateway}
            exp_annotations:
              summary: "25 prompt-injection attempts blocked in 5 minutes"
              description: "Log content is being crafted against the AI tier (the records were triaged defensively); review the source hosts."
              runbook: "docs/runbooks.md#llm-prompt-injection-burst"
      - eval_time: 20m
        alertname: LlmSchemaViolations
        exp_alerts:
          - exp_labels: {severity: warning, component: llm-gateway}
            exp_annotations:
              summary: "15 model outputs failed JSON-schema validation in 15 minutes"
              description: "The model answers outside AIIncidentAnalysis; a model or prompt regression, or an adversarial input."
              runbook: "docs/runbooks.md#llm-schema-violations"

  - name: audit spool that keeps growing escalates
    interval: 1m
    input_series:
      - series: 'llm_gateway_spool_depth{job="llm-gateway",instance="llm-gateway:9101"}'
        values: '1000+100x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: LlmSpoolBacklogGrowing
        exp_alerts:
          - exp_labels: {severity: warning, component: llm-gateway}
            exp_annotations:
              summary: "Gateway spool holds 4k undelivered audit events and keeps growing"
              description: "Fluent Bit at :9880 is unreachable or rejecting; events are safe on disk but not yet in OpenSearch."
              runbook: "docs/runbooks.md#llm-audit-spool-backlog"

  - name: idle but healthy gateway only produces the info alert
    interval: 5m
    input_series:
      - series: 'up{job="llm-gateway",instance="llm-gateway:9101"}'
        values: '1x40'
      - series: 'llm_gateway_requests_total{job="llm-gateway",role="triage",engine="nemotron-3-nano:30b",fallback="false"}'
        values: '5x40'
    alert_rule_test:
      - eval_time: 120m
        alertname: LlmNoInferenceTraffic
        exp_alerts:
          - exp_labels: {severity: info, component: llm-gateway}
            exp_annotations:
              summary: "The LLM gateway answered no record in the last hour"
              description: "The gateway is up but Fluentd's /triage leg delivers nothing: no alerts, a gated severity regex, or a broken http-llm-triage output."
              runbook: "docs/runbooks.md#llm-no-inference-traffic"

  - name: GPU memory pressure and MCP denial burst
    interval: 1m
    input_series:
      - series: 'ollama_gpu_memory_util{job="llm-gateway",instance="llm-gateway:9101"}'
        values: '0.97x30'
      - series: 'llm_gateway_mcp_tool_calls_total{job="llm-gateway",tool="nmap_scan",decision="denied"}'
        values: '0+3x20'
      - series: 'llm_gateway_mcp_tool_calls_total{job="llm-gateway",tool="nmap_scan",decision="allowed"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OllamaGpuMemoryHigh
        exp_alerts:
          - exp_labels: {severity: warning, component: ollama, instance: "llm-gateway:9101"}
            exp_annotations:
              summary: "Ollama GPU memory at 97%"
              description: "Model eviction and OOM-driven failovers are likely; reduce concurrency or move the forensic model to another worker."
              runbook: "docs/runbooks.md#ollama-gpu-memory"
      - eval_time: 10m
        alertname: McpDeniedCallBurst
        exp_alerts:
          - exp_labels: {severity: warning, component: errow-mcp, tool: nmap_scan}
            exp_annotations:
              summary: "15 MCP calls to nmap_scan were denied in 5 minutes"
              description: "The policy (scope, allowlist, rate limit, approvals) refused repeated tool calls: a prompt-injection attempt or a misconfigured agent."
              runbook: "docs/runbooks.md#errow-mcp-denied-burst"

<!--
  vendetta/ossec-hooks.conf — the ONLY manager-side configuration the vendetta-stack needs.
  Merge these blocks into the manager's /var/ossec/etc/ossec.conf (inside the existing <ossec_config>),
  then restart the manager. Nothing here replaces ossec.conf, internal_options.conf or cluster.json.

  This snippet is the manual path. If you run the bundled manager through docker-compose (or the Helm chart) the equivalent
  syslog receiver is spliced in automatically at boot together with the CS3 rule block 110000-110999 — see
  docs/MANAGER-INTEGRATION.md. Everything below still applies: the hooks here are independent of the patch.

  Install on every AGENT that may be isolated:
    install -o root -g ossec -m 0750 vendetta/active-response/host-isolate.sh /var/ossec/active-response/bin/host-isolate.sh
    printf '%s\n' <manager-ip> [<jump-host-ip> ...] > /var/ossec/etc/isolate-allow.conf   # REQUIRED, see script header
-->
<ossec_config>
  <!-- Fluent Bit tails logs/alerts/alerts.json (read-only mount of the manager logs volume). -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
  </global>

  <!-- Keep level 1-2 noise out of the pipeline; the LLM path additionally only sees medium+ alerts. -->
  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <!-- Target of errow-feedback's live active-response call (ERROW_FEEDBACK_AR_COMMAND=!host-isolate.sh). -->
  <command>
    <name>host-isolate</name>
    <executable>host-isolate.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>
</ossec_config>

# Traces: PROMPT §3 Data flow (routing), CONTRACT §3 (stream -> index), §5 (sinks), §8.3 (telemetry-loop prevention)
# Root-scope routing. Every <match> fans out with `copy` + `relabel` so each sink has its own buffer, its own failure domain and
# its own <label> pipeline (defined in 20-60 and enabled.d/). First match wins, so the cs3.ai.ollama guard is FIRST.
#
#   cs3.ai.ollama      -> @ESOC_SIEM only          (NEVER OpenSearch / http-llm-triage / Console; filter 13 stamps leg:"esoc+siem")
#   vendetta.*         -> @OS_VENDETTA (alias vendetta-alerts upsert) + @LLM_TRIAGE (severity-gated)
#   errow.findings     -> errow-findings-* + errow-sarif-* + vendetta-alerts (pipeline sarif-to-vendetta-alert) + feedback loop (>= high)
#                         + optional triage / Errow cloud retest / Vendetta active-response
#   errow.*            -> errow-<stream>-* (prefix map in 21)
#   cs3.ai.inference   -> cs3-ai-inference-* + cs3-ai-audit-* + alert enrichment (12)
#   cs3.ai.tool_call   -> errow-mcp-* + cs3-ai-audit-*
#   cs3.ai.enrichment  -> vendetta-alerts upsert (12)
#   cs3.sp.*           -> Prometheus gauges (Fluent Bit stream processor results)
#   host.* / v1_logs   -> @ESOC_SIEM (only present when other edge nodes/agents forward them here)
# `copy_mode deep` is used wherever a downstream label rewrites records, so one sink can never alter another sink's copy.

<match cs3.ai.ollama>
  @type relabel
  @id route_ai_ollama
  @label @ESOC_SIEM
</match>

<match vendetta.*>
  @type copy
  @id route_vendetta
  copy_mode shallow
  <store>
    @type relabel
    @label @OS_VENDETTA
  </store>
  <store ignore_error>
    @type relabel
    @label @LLM_TRIAGE
  </store>
</match>

<match errow.findings>
  @type copy
  @id route_errow_findings
  copy_mode deep
  <store>
    @type relabel
    @label @OS_ERROW_FINDINGS
  </store>
  <store>
    @type relabel
    @label @ERROW_SARIF
  </store>
  <store>
    @type relabel
    @label @OS_ERROW_ALERTS
  </store>
  <store ignore_error>
    @type relabel
    @label @FEEDBACK_LOOP
  </store>
  <store ignore_error>
    @type relabel
    @label @LLM_TRIAGE
  </store>
  <store ignore_error>
    @type relabel
    @label @ERROW_CLOUD
  </store>
  <store ignore_error>
    @type relabel
    @label @VENDETTA_EXECD
  </store>
</match>

<match cfgaudit.findings>
  @type relabel
  @id route_cfgaudit_findings
  @label @OS_CFGAUDIT_FINDINGS
</match>

<match cfgaudit.runs>
  @type relabel
  @id route_cfgaudit_runs
  @label @OS_CFGAUDIT_RUNS
</match>

<match errow.**>
  @type relabel
  @id route_errow_generic
  @label @OS_ERROW
</match>

<match cs3.ai.inference>
  @type copy
  @id route_ai_inference
  copy_mode deep
  <store>
    @type relabel
    @label @OS_AI_INFERENCE
  </store>
  <store>
    @type relabel
    @label @OS_AI_AUDIT
  </store>
  <store>
    @type relabel
    @label @AI_ALERT_KNOWN
  </store>
  <store>
    @type relabel
    @label @AI_ALERT_ORPHAN
  </store>
  <store>
    @type prometheus
    @id metric_ai_inference
    <metric>
      name cs3_pipeline_ai_inference_total
      type counter
      desc cs3.ai.inference events accepted by this aggregator
    </metric>
    <metric>
      name cs3_pipeline_ai_gpu_seconds_total
      type counter
      desc GPU seconds metered on cs3.ai.inference events
      key gpu_seconds
    </metric>
  </store>
</match>

<match cs3.ai.tool_call>
  @type copy
  @id route_ai_tool_call
  copy_mode deep
  <store>
    @type relabel
    @label @OS_AI_TOOL_CALL
  </store>
  <store>
    @type relabel
    @label @OS_AI_AUDIT
  </store>
</match>

<match cs3.ai.enrichment>
  @type relabel
  @id route_ai_enrichment
  @label @AI_ENRICHMENT
</match>

<match cs3.sp.*>
  @type relabel
  @id route_stream_processor
  @label @FB_STREAM_METRICS
</match>

<match host.** v1_logs>
  @type relabel
  @id route_host_telemetry
  @label @ESOC_SIEM
</match>

# Fluentd's own log events (tag fluent.*) are already written to stdout; they must not fall into the catch-all below.
<label @FLUENT_LOG>
  <match fluent.**>
    @type null
    @id null_fluent_log
  </match>
</label>

# Anything not matched above is parked in a local file and counted; it is never forwarded to a sink.
<match **>
  @type relabel
  @id route_unrouted
  @label @UNROUTED
</match>

# Traces: PROMPT §3 Data flow (Errow -> storage), CONTRACT §3 (errow-* daily indices), §5 (@id opensearch-errow, pipelines), §15
# Errow outputs (daily indices via logstash_format / logstash_prefix / logstash_dateformat %Y.%m.%d, e.g. errow-findings-2026.11.12):
#   @OS_ERROW           opensearch-errow           errow-<runs|transcripts|threat-models|coverage|llm-logs|mcp|runtime|proxy|tooling|tui|cloud|
#                                                  telemetry|agent-state|viewer|report-artifacts|sarif>-*   (prefix = chunk key index_prefix)
#   @OS_ERROW_FINDINGS  opensearch-errow-findings  errow-findings-*   + ingest pipeline errow-finding-enrichment (CWE -> OWASP / ATT&CK)
#   @OS_ERROW_ALERTS    opensearch-errow-alerts    vendetta-alerts alias upsert + ingest pipeline sarif-to-vendetta-alert (SARIF -> §4.1)
# Extra @ids (…-findings, …-alerts) exist because an OpenSearch output has one fixed pipeline / index family.
# Idempotency: doc_id = sha256(run + ruleId + primaryLocationLineHash) is the _id, so replays overwrite instead of duplicating;
# records without doc_id (e.g. coverage) get an auto id.

<label @ERROW_SARIF>
  <filter errow.findings>
    @type record_transformer
    @id filter_errow_sarif_prefix
    <record>
      index_prefix sarif
    </record>
  </filter>
  <match **>
    @type relabel
    @id relabel_errow_sarif
    @label @OS_ERROW
  </match>
</label>

# Gateway tool_call events are mirrored into errow-mcp-*; the hash becomes the _id so a replay cannot duplicate them.
<label @OS_AI_TOOL_CALL>
  <filter cs3.ai.tool_call>
    @type record_transformer
    @id filter_ai_tool_call_prefix
    enable_ruby true
    <record>
      index_prefix mcp
      doc_id ${ record['doc_id'] || record['hash'] }
    </record>
  </filter>
  <match **>
    @type relabel
    @id relabel_ai_tool_call
    @label @OS_ERROW
  </match>
</label>

<label @OS_ERROW>
  <filter **>
    @type record_transformer
    @id filter_errow_index_prefix
    enable_ruby true
    <record>
      index_prefix ${ p = record['index_prefix'].to_s; p.empty? ? ({ 'errow.mcp_events' => 'mcp', 'errow.runtime_events' => 'runtime', 'errow.tui_events' => 'tui', 'errow.cloud_events' => 'cloud' }[tag] || tag_parts[1].to_s.tr('_', '-')) : p }
    </record>
  </filter>
  <match **>
    @type opensearch
    @id opensearch-errow
    hosts "#{ENV['OPENSEARCH_URL'] || 'https://opensearch:9200'}"
    user "#{ENV['OPENSEARCH_USER'] || 'admin'}"
    password "#{File.read('/run/secrets/opensearch_admin_password').strip}"
    ssl_verify true
    ca_file /pki/ca.crt
    ssl_min_version TLSv1_2
    ssl_max_version TLSv1_3
    reload_connections false
    reload_on_failure false
    request_timeout 30s
    suppress_type_name true
    verify_os_version_at_startup false
    default_opensearch_version 2
    bulk_message_request_threshold 8MB
    logstash_format true
    logstash_prefix errow-${index_prefix}
    logstash_prefix_separator -
    logstash_dateformat %Y.%m.%d
    write_operation index
    id_key doc_id
    remove_keys index_prefix
    emit_error_label_event true
    include_tag_key false
    <buffer index_prefix>
      @type file
      path /var/log/fluentd/buffer/opensearch-errow
      flush_mode interval
      flush_interval 5s
      flush_thread_count 2
      chunk_limit_size 8MB
      chunk_limit_records 5000
      total_limit_size "#{ENV['FLUENTD_OS_BUFFER_LIMIT'] || '2GB'}"
      retry_type exponential_backoff
      retry_wait 1s
      retry_max_interval 60s
      retry_forever true
      overflow_action block
      compress gzip
    </buffer>
  </match>
</label>


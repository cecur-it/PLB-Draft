# Traces: PROMPT §3 Data flow (Errow findings), CONTRACT §3 (errow-findings/errow-sarif/vendetta-alerts), §15 shipper shapes
# Filter 11: pass-through for every errow.* record. SARIF field names are NOT renamed here: the errow-findings / errow-sarif
# copies keep the raw SARIF result (D1 templates map `source` and `stream` as keyword, so `source` stays the shipper's string).
# The SARIF -> CONTRACT §4.1 alert mapping happens only inside OpenSearch (ingest pipeline `sarif-to-vendetta-alert`), which
# stamps source = {system:"errow", stream:"errow.findings"} on the vendetta-alerts copy.
# This filter guarantees the fields every downstream output relies on: stream, @timestamp and, for findings only, doc_id and
# severity (Fluent Bit already stamps severity; it is derived from properties.errow.severity / level only when missing).

<filter errow.**>
  @type record_transformer
  @id filter_errow_normalize
  enable_ruby true
  <record>
    stream ${ record['stream'].to_s.empty? ? tag_parts[1].to_s : record['stream'].to_s }
    source ${ record['source'].is_a?(String) && !record['source'].empty? ? record['source'] : 'errow' }
    @timestamp ${ record['@timestamp'].to_s.empty? ? Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ') : record['@timestamp'].to_s }
  </record>
</filter>

# SHA-256(run + ruleId + primaryLocationLineHash) is the shipper's dedupe key (CONTRACT §15); recompute it when absent so a
# record that bypassed the shipper still upserts idempotently.
<filter errow.findings>
  @type record_transformer
  @id filter_errow_findings_docid
  enable_ruby true
  <record>
    doc_id ${ record['doc_id'].to_s.empty? ? (require 'digest'; Digest::SHA256.hexdigest([record['run'], record['ruleId'], record.dig('partialFingerprints', 'primaryLocationLineHash'), record.dig('locations', 0, 'physicalLocation', 'artifactLocation', 'uri'), record.dig('message', 'text')].join('|'))) : record['doc_id'].to_s }
    severity ${ record['severity'].to_s.empty? ? (record.dig('properties', 'errow', 'severity') || { 'error' => 'high', 'warning' => 'medium', 'note' => 'low' }[record['level']] || 'info').to_s.downcase : record['severity'].to_s.downcase }
  </record>
</filter>

<filter errow.findings>
  @type prometheus
  @id filter_errow_findings_counter
  <metric>
    name cs3_pipeline_errow_findings_total
    type counter
    desc Errow findings seen by this aggregator, by severity
    <labels>
      severity $.severity
    </labels>
  </metric>
</filter>

# Traces: PROMPT §3 Data flow (Vendetta alerts -> OpenSearch), §4.1 normalized alert; CONTRACT §3, §4.1, §5
# Filter 10: Fluent Bit already ran classify_vendetta (adds @timestamp, stream, severity, source:"vendetta", message, agentName,
# fields{}); those extras are shaped for the Console leg. The OpenSearch copy must be the CONTRACT §4.1 alert:
#   source -> {system:"vendetta", stream}, Console-only helper keys removed, severity recomputed from rule.level
#   (0-3 info, 4-6 low, 7-9 medium, 10-12 high, 13-15 critical), top-level mitre copied from rule.mitre, stable id.
# The id is also the OpenSearch _id (upsert), so a replay after an edge failover rewrites the same document.

<filter vendetta.*>
  @type record_transformer
  @id filter_vendetta_normalize
  enable_ruby true
  remove_keys message,agentName,fields,stream,timestamp_raw
  <record>
    source ${ { 'system' => 'vendetta', 'stream' => tag_parts[1] } }
    rule ${ r = record['rule'].is_a?(Hash) ? record['rule'].dup : {}; r['level'] = r['level'].to_i; r['id'] = r['id'].to_s; r['groups'] = Array(r['groups']).map(&:to_s); r }
    severity ${ l = (record['rule'].is_a?(Hash) ? record['rule']['level'].to_i : 0); l >= 13 ? 'critical' : (l >= 10 ? 'high' : (l >= 7 ? 'medium' : (l >= 4 ? 'low' : 'info'))) }
    mitre ${ m = (record['rule'].is_a?(Hash) && record['rule']['mitre'].is_a?(Hash)) ? record['rule']['mitre'] : {}; { 'id' => Array(m['id']).map(&:to_s), 'tactic' => Array(m['tactic']).map(&:to_s), 'technique' => Array(m['technique']).map(&:to_s) } }
    id ${ (record['id'].to_s.empty? ? (require 'digest'; Digest::SHA256.hexdigest([record['timestamp'], record['@timestamp'], record.dig('agent', 'id'), record.dig('rule', 'id'), record['location'], record['full_log']].join('|'))) : record['id'].to_s) }
    @timestamp ${ (record['@timestamp'].to_s.empty? ? (record['timestamp'].to_s.empty? ? Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ') : record['timestamp'].to_s) : record['@timestamp'].to_s) }
  </record>
</filter>

# Business counter scraped on :24231 (labels are bounded: 4 streams x 5 severities).
<filter vendetta.*>
  @type prometheus
  @id filter_vendetta_counter
  <metric>
    name cs3_pipeline_vendetta_alerts_total
    type counter
    desc Vendetta alerts normalized by this aggregator, by stream and severity
    <labels>
      stream $.source.stream
      severity $.severity
    </labels>
  </metric>
</filter>

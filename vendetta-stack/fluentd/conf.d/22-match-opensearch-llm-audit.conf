# Traces: PROMPT §4 AI tier (AU-9 audit trail, metering), CONTRACT §3 (cs3-ai-audit / cs3-ai-inference), §4.3 hash chain, §5
# <label @OS_AI_AUDIT>  opensearch-llm-audit   cs3-ai-audit-*     hash-chained audit trail (NIST AU-9)
# <label @OS_AI_INFERENCE> opensearch-llm-inference cs3-ai-inference-*  metering / SLO source
# The gateway computes hash = sha256(prev_hash + canonical_json(event)); NOTHING in this tree rewrites an audit record (no filter
# is attached to this label, `@timestamp`, chain_id, seq, prev_hash and hash pass through byte for byte). The audit index is
# written with `write_operation create` and `_id` = hash: a replay (edge failover, retry after a partial bulk) is a 409 that the
# plugin counts as a duplicate, and a tampered record carries a different hash so it can never overwrite the original entry.

<label @OS_AI_AUDIT>
  <match **>
    @type opensearch
    @id opensearch-llm-audit
    hosts "#{ENV['OPENSEARCH_URL'] || 'https://opensearch:9200'}"
    user "#{ENV['OPENSEARCH_USER'] || 'admin'}"
    password "#{File.read('/run/secrets/opensearch_admin_password').strip}"
    ssl_verify true
    ca_file /pki/ca.crt
    ssl_min_version TLSv1_2
    ssl_max_version TLSv1_3
    reload_connections false
    reload_on_failure false
    request_timeout 30s
    suppress_type_name true
    verify_os_version_at_startup false
    default_opensearch_version 2
    bulk_message_request_threshold 8MB
    logstash_format true
    logstash_prefix cs3-ai-audit
    logstash_prefix_separator -
    logstash_dateformat %Y.%m.%d
    write_operation create
    id_key hash
    emit_error_for_missing_id true
    emit_error_label_event true
    include_tag_key false
    <buffer>
      @type file
      path /var/log/fluentd/buffer/opensearch-llm-audit
      flush_mode interval
      flush_interval 2s
      flush_thread_count 1
      chunk_limit_size 4MB
      chunk_limit_records 2000
      total_limit_size "#{ENV['FLUENTD_OS_BUFFER_LIMIT'] || '2GB'}"
      retry_type exponential_backoff
      retry_wait 1s
      retry_max_interval 60s
      retry_forever true
      overflow_action block
      compress gzip
    </buffer>
  </match>
</label>

<label @OS_AI_INFERENCE>

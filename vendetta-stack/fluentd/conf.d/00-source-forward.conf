# Traces: PROMPT §1 Tier 2 (edge -> aggregation), §5 Observability; CONTRACT §2 (ports), §5 (mTLS forward)
# Sources. Only `in_forward` ingests data. The Fluent Bit test-hook HTTP input is NOT replicated here on purpose.

# Fluent Bit / edge Fluentd -> this node. mTLS: the client must present a certificate signed by /pki/ca.crt, so no <security>
# shared key is configured (the certificate is the credential). Fluent Bit's `forward` output sends tags as-is.
<source>
  @type forward
  @id in_forward
  bind 0.0.0.0
  port 24224
  chunk_size_limit 16MB
  chunk_size_warn_limit 8MB
  skip_invalid_event true
  resolve_hostname false
  <transport tls>
    min_version TLSv1_2
    max_version TLSv1_3
    ca_path /pki/ca.crt
    cert_path "/pki/fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}.crt"
    private_key_path "/pki/fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}.key"
    client_cert_auth true
  </transport>
</source>

# With workers > 1 the singleton listeners below must live in one worker.
<worker 0>
  # Prometheus exposition on 24231 (/metrics): fluentd_output_status_*, fluentd_input_status_*, cs3_pipeline_*, cs3_sp_*.
  <source>
    @type prometheus
    @id in_prometheus
    bind 0.0.0.0
    port 24231
    metrics_path /metrics
  </source>
  <source>
    @type prometheus_monitor
    @id in_prometheus_monitor
    interval 10
    <labels>
      node "fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}"
    </labels>
  </source>
  <source>
    @type prometheus_output_monitor
    @id in_prometheus_output_monitor
    interval 10
    <labels>
      node "fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}"
    </labels>
  </source>
  # JSON status API used by the container HEALTHCHECK (loopback by default).
  <source>
    @type monitor_agent
    @id in_monitor_agent
    bind "#{ENV['FLUENTD_MONITOR_BIND'] || '127.0.0.1'}"
    port 24220
  </source>
</worker>

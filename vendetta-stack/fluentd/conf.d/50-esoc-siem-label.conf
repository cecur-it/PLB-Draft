# Traces: PROMPT §4.3 telemetry-loop prevention, CONTRACT §5 (@id esoc-otlp, siem-ndjson), §8.3 (Leg2 / Leg3)
# <label @ESOC_SIEM> is the ONLY destination of cs3.ai.ollama (and of host.* / v1_logs forwarded by other edge nodes). It fans out to
# <label @ESOC> (esoc-otlp) and <label @SIEM> (siem-ndjson). Those two labels live in enabled.d/ because entrypoint.sh renders the
# real output or a null sink from CS3_AGGREGATOR_LEGS (esoc,siem). Default is OFF: Fluent Bit already owns the three legs on the
# edge (CS3_ESOC_ENABLED / CS3_SIEM_ENABLED); enable the aggregator legs ONLY for edge nodes that do not (otherwise ESOC and SIEM
# would receive each host.* record twice, and, as Fluent Bit never forwards cs3.ai.ollama, nothing is lost by leaving them off).
# Nothing in this file can reach OpenSearch, http-llm-triage, http-feedback-loop or the Console.

<label @ESOC_SIEM>
  <match **>
    @type copy
    @id route_esoc_siem
    copy_mode shallow
    <store>
      @type relabel
      @label @ESOC
    </store>
    <store>
      @type relabel
      @label @SIEM
    </store>
  </match>
</label>

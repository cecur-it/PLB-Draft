# Traces: PROMPT §6 Closed-loop (Errow -> Vendetta feedback), CONTRACT §5 (@id http-feedback-loop), §6 (G9 offensive safety)
# <label @FEEDBACK_LOOP>: Errow findings with severity >= high are POSTed (NDJSON, §15 `findings` record shape) to the
# errow-feedback webhook, which runs errow-to-vendetta.sh in its own default DRY-RUN mode; live actions need ERROW_FEEDBACK_LIVE=true
# on THAT service plus a signed approval in APPROVALS.md, so this leg only delivers facts and can never act by itself.
#   ERROW_FEEDBACK_URL   default http://errow-feedback:9102/errow-finding        token: /run/secrets/feedback_webhook_token
# 429 (server busy) and 5xx are retried with backoff; a 400 (invalid body) is unrecoverable and parked in
# /var/log/fluentd/dead-letter/http-feedback-loop. Best-effort sink: overflow drops the OLDEST chunk instead of blocking the
# OpenSearch path (the finding itself is already durable in errow-findings-*).

<label @FEEDBACK_LOOP>
  <filter errow.findings>
    @type grep
    @id filter_feedback_severity
    <regexp>
      key severity
      pattern /\A(high|critical)\z/
    </regexp>
  </filter>
  <match errow.findings>
    @type http_bearer
    @id http-feedback-loop
    endpoint "#{ENV['ERROW_FEEDBACK_URL'] || 'http://errow-feedback:9102/errow-finding'}"
    http_method post
    content_type application/x-ndjson
    bearer_token_file /run/secrets/feedback_webhook_token
    open_timeout 5
    read_timeout 30
    reuse_connections true
    retryable_response_codes 429,500,502,503,504
    <format>
      @type json
    </format>
    <buffer>
      @type file
      path /var/log/fluentd/buffer/http-feedback-loop
      flush_mode interval
      flush_interval 2s
      flush_thread_count 1
      chunk_limit_size 1MB
      chunk_limit_records 25
      total_limit_size 256MB
      retry_type exponential_backoff
      retry_wait 2s
      retry_max_interval 120s
      retry_forever true
      overflow_action drop_oldest_chunk
    </buffer>
    <secondary>
      @type secondary_file
      directory /var/log/fluentd/dead-letter/http-feedback-loop
      basename dead.${chunk_id}
    </secondary>
  </match>
  <match **>
    @type null
    @id null_feedback_other
  </match>
</label>

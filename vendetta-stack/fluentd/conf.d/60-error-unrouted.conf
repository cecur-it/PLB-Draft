# Traces: PROMPT §5 Observability (no silent loss), CONTRACT §5
# <label @ERROR>: plugin error events (OpenSearch per-item 400s / mapping errors, missing audit hash, buffer overflow...) are counted
# and parked, never retried forever and never forwarded to another sink. <label @UNROUTED>: tags no route accepts.
# Files: /var/log/fluentd/dead-letter/{error,unrouted}.<YYYYMMDD_HHMM>.log (plain JSON lines, mode 0600), one per minute that had events,
# visible about 70 s after the event; pruned by entrypoint.sh after FLUENTD_DEADLETTER_RETENTION_DAYS (14).

<label @ERROR>
  <filter **>
    @type prometheus
    @id filter_error_counter
    <metric>
      name cs3_pipeline_error_events_total
      type counter
      desc Events diverted to the dead-letter file after a plugin error
      <labels>
        tag ${tag}
      </labels>
    </metric>
  </filter>
  <match **>
    @type file
    @id dead_letter_error
    path /var/log/fluentd/dead-letter/error
    append true
    <format>
      @type json
    </format>
    <buffer time>
      @type file
      path /var/log/fluentd/buffer/dead-letter-error
      timekey 60
      timekey_wait 10s
      total_limit_size 256MB
      overflow_action drop_oldest_chunk
    </buffer>
  </match>
</label>

<label @UNROUTED>
  <filter **>
    @type prometheus
    @id filter_unrouted_counter
    <metric>
      name cs3_pipeline_unrouted_events_total
      type counter
      desc Events whose tag matched no route (parked locally only)
      <labels>
        tag ${tag}
      </labels>
    </metric>
  </filter>
  <match **>
    @type file
    @id dead_letter_unrouted
    path /var/log/fluentd/dead-letter/unrouted
    append true
    <format>
      @type json
    </format>
    <buffer time>
      @type file
      path /var/log/fluentd/buffer/dead-letter-unrouted
      timekey 60
      timekey_wait 10s
      total_limit_size 128MB
      overflow_action drop_oldest_chunk
    </buffer>
  </match>
</label>

# Traces: PROMPT §4 AI tier (alert triage via sovereign LLM gateway), CONTRACT §4.4 (/triage), §5 (@id http-llm-triage, mTLS), §8.3
# <label @LLM_TRIAGE>: sanitized Vendetta alerts (and, optionally, Errow findings) -> https://llm-gateway:9101/triage as NDJSON.
# The gateway answers asynchronously by emitting cs3.ai.inference + cs3.ai.enrichment events back through Fluent Bit, so the HTTP
# response body is not consumed here.
#   LLM_GATEWAY_URL                       default https://llm-gateway:9101   token: /run/secrets/llm_gateway_token (re-read per request)
#   LLM_TRIAGE_VENDETTA_SEVERITY_REGEX    default ^(medium|high|critical)$   which vendetta.* alerts are triaged
#   LLM_TRIAGE_ERROW_SEVERITY_REGEX       default ^$ (off)                   set to ^(high|critical)$ to triage Errow findings too
# mTLS: client certificate /pki/fluentd-<FLUENTD_NODE_ID>.crt|key, server verified against /pki/ca.crt.
# Telemetry-loop guard: only `vendetta.*` and `errow.findings` can reach the HTTP output; the first match below black-holes any
# cs3.ai.* tag (cs3.ai.ollama never gets here anyway, 15-routing relabels it to @ESOC_SIEM), everything else is nulled.
# Best-effort: a gateway outage drops the OLDEST chunk after the buffer fills instead of blocking OpenSearch writes; alerts stay
# searchable and vendetta-to-errow.sh --via-llm can re-submit them.

<label @LLM_TRIAGE>
  <match cs3.ai.**>
    @type null
    @id null_triage_ai_guard
  </match>
  <filter vendetta.*>
    @type grep
    @id filter_triage_vendetta_severity
    <regexp>
      key severity
      pattern "/#{ENV['LLM_TRIAGE_VENDETTA_SEVERITY_REGEX'] || '^(medium|high|critical)$'}/"
    </regexp>
  </filter>
  <filter errow.findings>
    @type grep
    @id filter_triage_errow_severity
    <regexp>
      key severity
      pattern "/#{ENV['LLM_TRIAGE_ERROW_SEVERITY_REGEX'] || '^$'}/"
    </regexp>
  </filter>
  <match vendetta.* errow.findings>
    @type http_bearer
    @id http-llm-triage
    endpoint "#{ENV['LLM_GATEWAY_URL'] || 'https://llm-gateway:9101'}/triage"
    http_method post
    content_type application/x-ndjson
    bearer_token_file /run/secrets/llm_gateway_token
    tls_ca_cert_path /pki/ca.crt
    tls_client_cert_path "/pki/fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}.crt"
    tls_private_key_path "/pki/fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}.key"
    tls_verify_mode peer
    tls_version TLSv1_2
    open_timeout 5
    read_timeout 300
    reuse_connections true
    retryable_response_codes 429,500,502,503,504
    <format>
      @type json
    </format>
    <buffer>
      @type file
      path /var/log/fluentd/buffer/http-llm-triage
      flush_mode interval
      flush_interval 5s
      flush_thread_count 1
      chunk_limit_size 1MB
      chunk_limit_records 20
      total_limit_size 512MB
      retry_type exponential_backoff
      retry_wait 2s
      retry_max_interval 120s
      retry_timeout 2h
      overflow_action drop_oldest_chunk
    </buffer>
    <secondary>
      @type secondary_file
      directory /var/log/fluentd/dead-letter/http-llm-triage
      basename dead.${chunk_id}
    </secondary>
  </match>
  <match **>
    @type null
    @id null_triage_other
  </match>
</label>

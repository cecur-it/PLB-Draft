# Traces: PROMPT §5 Observability (pipeline metrics), CONTRACT §5 (Prometheus on 24231), streams.conf of the Fluent Bit tier
# <label @FB_STREAM_METRICS>: Fluent Bit stream-processor results (tags cs3.sp.*, 60 s tumbling windows) become Prometheus gauges
# on :24231/metrics. The windows are computed at the edge, so each gauge is "value of the last closed 60 s window" per edge node
# (label edge_node, stamped by Fluent Bit's `sp_edge_node` filter); use sum() across edge nodes.
# These are metrics only: nothing here reaches OpenSearch or any HTTP sink.

<label @FB_STREAM_METRICS>
  <match cs3.sp.vendetta_alert_rate>
    @type prometheus
    @id metric_sp_vendetta_alert_rate
    <metric>
      name cs3_sp_vendetta_alerts_60s
      type gauge
      desc Vendetta alerts seen by an edge node in the last closed 60 s window
      key alerts
    </metric>
    <metric>
      name cs3_sp_vendetta_max_rule_level_60s
      type gauge
      desc Highest rule.level seen by an edge node in the last closed 60 s window
      key max_rule_level
    </metric>
    <labels>
      edge_node $.edge_node
    </labels>
  </match>
  <match cs3.sp.vendetta_by_level>
    @type prometheus
    @id metric_sp_vendetta_by_level
    <metric>
      name cs3_sp_vendetta_alerts_by_level_60s
      type gauge
      desc Vendetta alerts per rule.level in the last closed 60 s window
      key alerts
      <labels>
        rule_level $.rule_level
      </labels>
    </metric>
    <labels>
      edge_node $.edge_node
    </labels>
  </match>
  <match cs3.sp.errow_findings>
    @type prometheus
    @id metric_sp_errow_findings
    <metric>
      name cs3_sp_errow_findings_60s
      type gauge
      desc Errow findings per SARIF level in the last closed 60 s window
      key findings
      <labels>
        level $.level
      </labels>
    </metric>
    <labels>
      edge_node $.edge_node
    </labels>
  </match>
  <match cs3.sp.ai_inference>
    @type prometheus
    @id metric_sp_ai_inference
    <metric>
      name cs3_sp_ai_inferences_60s
      type gauge
      desc AI inferences in the last closed 60 s window
      key inferences
    </metric>
    <metric>
      name cs3_sp_ai_gpu_seconds_60s
      type gauge
      desc GPU seconds metered in the last closed 60 s window
      key gpu_seconds
    </metric>
    <metric>
      name cs3_sp_ai_tokens_in_60s
      type gauge
      desc Prompt tokens in the last closed 60 s window
      key tokens_in
    </metric>
    <metric>
      name cs3_sp_ai_tokens_out_60s
      type gauge
      desc Completion tokens in the last closed 60 s window
      key tokens_out
    </metric>
    <metric>
      name cs3_sp_ai_avg_latency_ms_60s
      type gauge
      desc Mean inference latency (ms) in the last closed 60 s window
      key avg_latency_ms
    </metric>
    <labels>
      edge_node $.edge_node
    </labels>
  </match>
  <match cs3.sp.ai_ollama>
    @type prometheus
    @id metric_sp_ai_ollama
    <metric>
      name cs3_sp_ai_ollama_lines_60s
      type gauge
      desc Ollama journald lines counted at the edge in the last closed 60 s window (content never leaves the edge safety file)
      key lines
    </metric>
    <labels>
      edge_node $.edge_node
    </labels>
  </match>
  <match **>
    @type null
    @id null_sp_other
  </match>
</label>

# Traces: PROMPT §4.3 telemetry-loop prevention (CS3 §4.3), CONTRACT §3, §5, §8.3
# Filter 13: cs3.ai.ollama (Ollama journald lines) may only ever reach the ESOC OTLP + SIEM NDJSON legs. Fluent Bit already keeps
# it off the forward output; if it arrives anyway (an edge node with a different config), it is stamped here and 15-routing.conf
# relabels it to @ESOC_SIEM only. The stamp lets the two sinks (and tests/test_routing.sh) prove which leg a record took.

<filter cs3.ai.ollama>
  @type record_transformer
  @id filter_ai_ollama_leg
  <record>
    leg esoc+siem
  </record>
</filter>

<filter cs3.ai.ollama>
  @type prometheus
  @id filter_ai_ollama_counter
  <metric>
    name cs3_pipeline_ai_ollama_lines_total
    type counter
    desc Ollama journald lines received by this aggregator (diverted to ESOC + SIEM only)
  </metric>
</filter>

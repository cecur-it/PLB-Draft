# Cfgaudit is storage-only during validation: no SARIF conversion, triage, feedback or active-response fan-out.
<label @OS_CFGAUDIT_FINDINGS>
  <match **>
    @type opensearch
    @id opensearch-cfgaudit-findings
    hosts "#{ENV['OPENSEARCH_URL'] || 'https://opensearch:9200'}"
    user "#{ENV['OPENSEARCH_USER'] || 'admin'}"
    password "#{File.read('/run/secrets/opensearch_admin_password').strip}"
    ssl_verify true
    ca_file /pki/ca.crt
    ssl_min_version TLSv1_2
    ssl_max_version TLSv1_3
    reload_connections false
    reload_on_failure false
    request_timeout 30s
    suppress_type_name true
    verify_os_version_at_startup false
    default_opensearch_version 2
    bulk_message_request_threshold 8MB
    logstash_format true
    logstash_prefix cfgaudit-findings
    logstash_prefix_separator -
    logstash_dateformat %Y.%m.%d
    write_operation index
    id_key doc_id
    emit_error_label_event true
    include_tag_key false
    <buffer>
      @type file
      path /var/log/fluentd/buffer/opensearch-cfgaudit-findings
      flush_mode interval
      flush_interval 5s
      flush_thread_count 1
      chunk_limit_size 8MB
      chunk_limit_records 2000
      total_limit_size "#{ENV['FLUENTD_OS_BUFFER_LIMIT'] || '2GB'}"
      retry_type exponential_backoff
      retry_wait 1s
      retry_max_interval 60s
      retry_forever true
      overflow_action block
      compress gzip
    </buffer>
  </match>
</label>


# Traces: PROMPT §4 AI tier (AIIncidentAnalysis -> alert enrichment), CONTRACT §4.1, §4.2, §4.3, §3
# Filter 12: cs3.ai.inference / cs3.ai.enrichment -> CONTRACT §4.1 Vendetta alert, mapping exactly per CONTRACT §4.2
#   severityAssessment -> severity (lowercase)            mitreTactic / mitreTechnique -> mitre.tactic[] / mitre.technique[]
#   probableRootCause -> root_cause                       recommendedImmediateAction -> recommended_action
#   confidenceScore -> ai.confidence   engineUsed -> ai.engine   gpuSeconds -> ai.cost.gpu_seconds
# The inference/audit copies are NEVER touched (their hash chain must stay byte-identical); the transforms below run on the
# deep copies that 15-routing.conf relabels into @AI_ALERT_KNOWN / @AI_ALERT_ORPHAN, mirroring ingest pipeline
# `aiincident-to-vendetta-alert`:
#   known alert  (alert_id set)  -> PARTIAL update (id, severity, mitre, root_cause, recommended_action, ai): the upsert merges
#                                   into the existing alert and never overwrites its source/rule/@timestamp;
#   orphan (no alert_id)         -> full alert, id = request_id, source {system:"cs3-ai", stream:"cs3.ai.inference"},
#                                   rule.level critical 14 / high 11 / medium 8 / low 5.
# Deviation: mirrors the pipeline except that a known alert's rule.level is left to Vendetta (the AI verdict lives in `severity`).

<label @AI_ALERT_KNOWN>
  <filter cs3.ai.inference>
    @type grep
    @id filter_ai_known_select
    <regexp>
      key alert_id
      pattern /\S/
    </regexp>
    <regexp>
      key $.analysis.severityAssessment
      pattern /\A(critical|high|medium|low)\z/i
    </regexp>
  </filter>
  <filter cs3.ai.inference>
    @type record_transformer
    @id filter_ai_known_to_alert
    enable_ruby true
    renew_record true
    <record>
      id ${ record['alert_id'].to_s }
      severity ${ record['analysis']['severityAssessment'].to_s.downcase }
      mitre ${ a = record['analysis']; t = a['mitreTactic'].to_s; q = a['mitreTechnique'].to_s; i = q[/(?<![A-Za-z0-9])T\d{4}(?:\.\d{3})?/]; m = {}; m['tactic'] = [t] unless t.empty?; m['technique'] = [q] unless q.empty?; m['id'] = [i] if i; m }
      root_cause ${ record['analysis']['probableRootCause'].to_s }
      recommended_action ${ record['analysis']['recommendedImmediateAction'].to_s }
      ai ${ a = record['analysis']; g = a['gpuSeconds'] || record['gpu_seconds']; r = record['role'].to_s; { 'engine' => (a['engineUsed'] || record['engine_used'] || record['model']), 'role' => (%w[triage forensic heuristic].include?(r) ? r : 'triage'), 'confidence' => (a['confidenceScore'].nil? ? nil : a['confidenceScore'].to_f), 'verdict' => record['verdict'], 'fallback' => (record['fallback'] == true), 'fallback_reason' => record['fallback_reason'], 'request_id' => record['request_id'], 'needs_verification' => a['needsVerification'], 'summary' => a['triageSummary'].to_s[0, 4000], 'analyzed_at' => record['@timestamp'], 'cost' => (g.nil? ? nil : { 'gpu_seconds' => g.to_f }) }.compact }
    </record>
  </filter>
  <match **>
    @type relabel
    @id relabel_ai_known_to_alerts
    @label @OS_VENDETTA
  </match>
</label>

<label @AI_ALERT_ORPHAN>
  <filter cs3.ai.inference>
    @type grep
    @id filter_ai_orphan_select
    <regexp>
      key request_id
      pattern /\S/
    </regexp>
    <regexp>
      key $.analysis.severityAssessment
      pattern /\A(critical|high|medium|low)\z/i
    </regexp>
    <exclude>
      key alert_id
      pattern /\S/
    </exclude>
  </filter>
  <filter cs3.ai.inference>
    @type record_transformer
    @id filter_ai_orphan_to_alert
    enable_ruby true
    renew_record true
    <record>
      id ${ record['request_id'].to_s }
      @timestamp ${ record['@timestamp'].to_s.empty? ? Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ') : record['@timestamp'].to_s }
      source ${ { 'system' => 'cs3-ai', 'stream' => 'cs3.ai.inference' } }
      severity ${ record['analysis']['severityAssessment'].to_s.downcase }
      rule ${ a = record['analysis']; s = record['analysis']['severityAssessment'].to_s.downcase; q = a['mitreTechnique'].to_s; i = q[/(?<![A-Za-z0-9])T\d{4}(?:\.\d{3})?/]; m = {}; m['tactic'] = [a['mitreTactic'].to_s] unless a['mitreTactic'].to_s.empty?; m['technique'] = [q] unless q.empty?; m['id'] = [i] if i; { 'level' => { 'critical' => 14, 'high' => 11, 'medium' => 8, 'low' => 5 }[s], 'description' => a['triageSummary'].to_s[0, 8000], 'mitre' => m } }
      full_log ${ record['analysis']['triageSummary'].to_s[0, 8000] }
      mitre ${ a = record['analysis']; t = a['mitreTactic'].to_s; q = a['mitreTechnique'].to_s; i = q[/(?<![A-Za-z0-9])T\d{4}(?:\.\d{3})?/]; m = {}; m['tactic'] = [t] unless t.empty?; m['technique'] = [q] unless q.empty?; m['id'] = [i] if i; m }
      root_cause ${ record['analysis']['probableRootCause'].to_s }
      recommended_action ${ record['analysis']['recommendedImmediateAction'].to_s }
      ai ${ a = record['analysis']; g = a['gpuSeconds'] || record['gpu_seconds']; r = record['role'].to_s; { 'engine' => (a['engineUsed'] || record['engine_used'] || record['model']), 'role' => (%w[triage forensic heuristic].include?(r) ? r : 'triage'), 'confidence' => (a['confidenceScore'].nil? ? nil : a['confidenceScore'].to_f), 'verdict' => record['verdict'], 'fallback' => (record['fallback'] == true), 'fallback_reason' => record['fallback_reason'], 'request_id' => record['request_id'], 'needs_verification' => a['needsVerification'], 'summary' => a['triageSummary'].to_s[0, 4000], 'analyzed_at' => record['@timestamp'], 'cost' => (g.nil? ? nil : { 'gpu_seconds' => g.to_f }) }.compact }
    </record>
  </filter>
  <match **>
    @type relabel
    @id relabel_ai_orphan_to_alerts
    @label @OS_VENDETTA
  </match>
</label>

# cs3.ai.enrichment is already the partial alert {id, ai, severity, mitre, root_cause, recommended_action}: upsert by id.
<label @AI_ENRICHMENT>
  <filter cs3.ai.enrichment>
    @type grep
    @id filter_ai_enrichment_select
    <regexp>
      key id
      pattern /\S/
    </regexp>
  </filter>
  <match **>
    @type relabel
    @id relabel_ai_enrichment_to_alerts
    @label @OS_VENDETTA
  </match>
</label>

# Traces: PROMPT §3 Data flow (Tier 3 storage), CONTRACT §3 (vendetta-alerts rollover alias), §5 (OpenSearch auth, @id opensearch)
# <label @OS_VENDETTA>: the single writer of the `vendetta-alerts` rollover alias. Documents are upserted by their alert id
# (write_operation upsert => doc_as_upsert, id_key id), so
#   * vendetta.*            -> the full CONTRACT §4.1 alert (filter 10)
#   * cs3.ai.enrichment     -> partial alert merged into the existing document (12)
#   * cs3.ai.inference      -> partial / orphan alert from AIIncidentAnalysis (12)
# are idempotent under replays from either aggregator. Connection settings are identical for every OpenSearch output in this tree:
#   OPENSEARCH_URL (default https://opensearch:9200)   OPENSEARCH_USER (default admin)   password: /run/secrets/opensearch_admin_password
# Known limitation (documented in RUNTIME.md): an upsert through the write alias lands in the CURRENT write index, so enrichment
# of an alert that has already rolled over creates a partial document in the new index instead of merging into the old one.

<label @OS_VENDETTA>
  <match **>
    @type opensearch
    @id opensearch
    hosts "#{ENV['OPENSEARCH_URL'] || 'https://opensearch:9200'}"
    user "#{ENV['OPENSEARCH_USER'] || 'admin'}"
    password "#{File.read('/run/secrets/opensearch_admin_password').strip}"
    ssl_verify true
    ca_file /pki/ca.crt
    ssl_min_version TLSv1_2
    ssl_max_version TLSv1_3
    reload_connections false
    reload_on_failure false
    request_timeout 30s
    suppress_type_name true
    verify_os_version_at_startup false
    default_opensearch_version 2
    bulk_message_request_threshold 8MB
    logstash_format false
    index_name vendetta-alerts
    write_operation upsert
    id_key id
    emit_error_label_event true
    include_tag_key false
    <buffer>
      @type file
      path /var/log/fluentd/buffer/opensearch
      flush_mode interval
      flush_interval 5s
      flush_thread_count 2
      chunk_limit_size 8MB
      chunk_limit_records 5000
      total_limit_size "#{ENV['FLUENTD_OS_BUFFER_LIMIT'] || '2GB'}"
      retry_type exponential_backoff
      retry_wait 1s
      retry_max_interval 60s
      retry_forever true
      overflow_action block
      compress gzip
    </buffer>
  </match>
</label>

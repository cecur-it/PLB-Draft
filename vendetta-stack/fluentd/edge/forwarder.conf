# Traces: PROMPT §1 Tier 1 -> Tier 2 (edge to aggregator, active-active HA), CONTRACT §2 (fluentd-1/-2 :24224), §5, §8.3
# Edge FLUENTD node (for hosts that run Fluentd instead of Fluent Bit): accepts local `forward` events on 127.0.0.1:24224 and ships
# them to the aggregators with out_forward. Fluent Bit edge nodes use fluent-bit/upstream.conf, which is the same topology.
# Run:  fluentd -c /fluentd/etc/edge/forwarder.conf -p /fluentd/plugins     (entrypoint: CMD ["fluentd","-c","/fluentd/etc/edge/forwarder.conf"])
#
# HA semantics (out_forward, 1.17):
#   * two <server>s, weighted round-robin; phi accrual failure detector over TCP heartbeats (interval 5 s, phi_threshold 16 ~ a node
#     silent for ~20 s is demoted), a demoted node is retried after recover_wait; hard_timeout bounds one send. In 1.17
#     `heartbeat_type tcp` is a deprecated alias of `transport` (a TCP/TLS connect heartbeat), so the modern name is used;
#   * <secondary> only receives a chunk when BOTH aggregators have been failing for the whole retry window (it is parked on disk, replayable
#     with `fluent-cat`), the file buffer keeps everything else across restarts and outages;
#   * an aggregator that does not resolve at start-up is only disabled (ignore_network_errors_at_startup): the edge boots before or
#     without it, re-resolves every expire_dns_cache and re-enables the node when its heartbeat succeeds;
#   * mutual TLS: server verified against /pki/ca.crt, client certificate EDGE_CLIENT_CERT / EDGE_CLIENT_KEY (default: the fluent-bit pair;
#     any CA-signed client certificate is accepted by in_forward's client_cert_auth).
# Aggregators dedupe nothing themselves: every OpenSearch output has a stable _id, so a replay after a failover is idempotent.
#   EDGE_AGGREGATOR_1/2  default fluentd-1 / fluentd-2     EDGE_FORWARD_PORT 24224      EDGE_BUFFER_LIMIT 2GB

<system>
  log_level "#{ENV['FLUENTD_LOG_LEVEL'] || 'info'}"
  file_permission 0600
  dir_permission 0700
  <log>
    format json
  </log>
</system>

<source>
  @type forward
  @id edge_in_forward
  bind 127.0.0.1
  port 24224
</source>

<source>
  @type monitor_agent
  @id edge_monitor_agent
  bind 127.0.0.1
  port 24220
</source>

<label @FLUENT_LOG>
  <match fluent.**>
    @type null
  </match>
</label>

<match **>
  @type forward
  @id edge-forward
  transport tls
  tls_version TLSv1_2
  tls_cert_path /pki/ca.crt
  tls_client_cert_path "#{ENV['EDGE_CLIENT_CERT'] || '/pki/fluent-bit.crt'}"
  tls_client_private_key_path "#{ENV['EDGE_CLIENT_KEY'] || '/pki/fluent-bit.key'}"
  tls_verify_hostname true
  send_timeout 30s
  connect_timeout 10s
  hard_timeout 60s
  ack_response_timeout 30s
  require_ack_response true
  recover_wait 10s
  heartbeat_type transport
  heartbeat_interval 5s
  phi_failure_detector true
  phi_threshold 16
  expire_dns_cache 60s
  dns_round_robin false
  ignore_network_errors_at_startup true
  <server>
    name fluentd-1
    host "#{ENV['EDGE_AGGREGATOR_1'] || 'fluentd-1'}"
    port "#{ENV['EDGE_FORWARD_PORT'] || '24224'}"
    weight 60
  </server>
  <server>
    name fluentd-2
    host "#{ENV['EDGE_AGGREGATOR_2'] || 'fluentd-2'}"
    port "#{ENV['EDGE_FORWARD_PORT'] || '24224'}"
    weight 60
  </server>
  <secondary>
    @type secondary_file
    directory /var/log/fluentd/dead-letter/edge-forward
    basename dead.${chunk_id}
  </secondary>
  <buffer>
    @type file
    path /var/log/fluentd/buffer/edge-forward
    flush_mode interval
    flush_interval 2s
    flush_thread_count 2
    chunk_limit_size 8MB
    total_limit_size "#{ENV['EDGE_BUFFER_LIMIT'] || '2GB'}"
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_interval 60s
    retry_timeout 72h
    overflow_action block
    compress gzip
  </buffer>
</match>

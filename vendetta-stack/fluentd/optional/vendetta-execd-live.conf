# Traces: PROMPT §6 Closed-loop (Errow finding -> Vendetta active response), CONTRACT §5 (@id http-vendetta-execd), §6 (G9) — rendered
# into enabled.d/ ONLY when ERROW_FEEDBACK_LIVE=true.
#
# This leg is now a THIN SHIPPER: it POSTs one JSON object to the errow-feedback gate (POST /approved-action) and the gate —
# errow/feedback-loop/action_gate.py, the same verifier errow-to-vendetta.sh uses — decides whether the manager is called.
# The gate consults APPROVALS.md and holds the manager credential, so this leg carries no JWT and can no longer act without a
# signed approval (entrypoint.sh still mints one at boot, purely as a reachability probe). Gates inside the gate, in order:
#   (1) ERROW_FEEDBACK_LIVE=true (on errow-feedback),
#   (2) properties.errow.vendetta_agent_id is present and matches VENDETTA_EXECD_AGENT_REGEX (default ^$ = nothing; e.g.
#       ^(001|002)$; the manager "000" is always refused) — the grep below pre-filters, the gate re-checks,
#   (3) an unexpired HMAC-signed approval line for the fingerprint exists.
# Responses: 200 = executed or dry-run, 403 = denied (no approval / agent refused: unrecoverable, parked in
# dead-letter/http-vendetta-execd), 401/429/5xx = retried with backoff. The gate echoes {decision,reason,fingerprint} in its
# reply, so the attempt is reconstructible from the log/buffer.
# Body: {"fingerprint":..,"agent_id":..,"command":..,"run":..}; see errow/feedback-loop/RUNTIME.md for the endpoint contract.

<label @VENDETTA_EXECD>
  <filter errow.findings>
    @type grep
    @id filter_execd_select
    <regexp>
      key severity
      pattern "/#{ENV['ERROW_FEEDBACK_SEVERITY_REGEX'] || '^critical$'}/"
    </regexp>
    <regexp>
      key $.properties.errow.vendetta_agent_id
      pattern "/#{ENV['VENDETTA_EXECD_AGENT_REGEX'] || '^$'}/"
    </regexp>
    <exclude>
      key $.properties.errow.vendetta_agent_id
      pattern /\A0+\z/
    </exclude>
  </filter>
  <filter errow.findings>
    @type record_transformer
    @id filter_execd_body
    enable_ruby true
    renew_record true
    <record>
      agent_id ${record.dig('properties', 'errow', 'vendetta_agent_id').to_s}
      body ${require 'json'; fp = (record.dig('partialFingerprints', 'primaryLocationLineHash') || record['doc_id'] || record.dig('properties', 'errow', 'fingerprint')).to_s; JSON.generate({'fingerprint' => fp, 'agent_id' => record.dig('properties', 'errow', 'vendetta_agent_id').to_s, 'command' => (ENV['ERROW_FEEDBACK_AR_COMMAND'] || '!host-isolate.sh'), 'run' => record['run'].to_s})}
    </record>
  </filter>
  <match errow.findings>
    @type http_bearer
    @id http-vendetta-execd
    endpoint "#{(ENV['ERROW_FEEDBACK_URL'] || 'http://errow-feedback:9102/errow-finding').sub(%r{/errow-finding/?\z}, '')}/approved-action"
    http_method post
    content_type application/json
    bearer_token_file /run/secrets/feedback_webhook_token
    open_timeout 5
    read_timeout 35
    reuse_connections false
    retryable_response_codes 401,429,500,502,503,504
    <format>
      @type single_value
      message_key body
      add_newline false
    </format>
    <buffer agent_id>
      @type file
      path /var/log/fluentd/buffer/http-vendetta-execd
      flush_mode immediate
      flush_thread_count 1
      chunk_limit_size 64KB
      chunk_limit_records 1
      total_limit_size 64MB
      retry_type exponential_backoff
      retry_wait 5s
      retry_max_interval 120s
      retry_timeout 15m
      overflow_action block
    </buffer>
    <secondary>
      @type secondary_file
      directory /var/log/fluentd/dead-letter/http-vendetta-execd
      basename dead.${chunk_id}
    </secondary>
  </match>
  <match **>
    @type null
    @id null_execd_other
  </match>
</label>

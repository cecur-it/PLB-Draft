# Traces: PROMPT §4.3 SIEM leg, CONTRACT §5 (@id siem-ndjson), §8.3 Leg3 — rendered into enabled.d/ when CS3_AGGREGATOR_LEGS contains "siem"
# <label @SIEM>: NDJSON (gzip) POST to ${CS3_SIEM_URL}; Authorization "<CS3_SIEM_AUTH_SCHEME> <token from CS3_SIEM_TOKEN_FILE>" (default scheme
# Bearer; the token file is read per request and is optional); trust anchor CS3_SIEM_CA_FILE (default /pki/ca.crt).
# Best-effort fan-out like the ESOC leg: overflow drops the OLDEST chunk instead of blocking OpenSearch.

<label @SIEM>
  <match **>
    @type http_bearer
    @id siem-ndjson
    endpoint "#{ENV.fetch('CS3_SIEM_URL')}"
    http_method post
    content_type application/x-ndjson
    compress gzip
    bearer_token_file "#{ENV['CS3_SIEM_TOKEN_FILE']}"
    bearer_scheme "#{ENV['CS3_SIEM_AUTH_SCHEME'] || 'Bearer'}"
    headers "{\"X-Origin-Sensor\":\"CS3-Aggregator\",\"X-CS3-Agent\":\"fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}\"}"
    tls_ca_cert_path "#{ENV['CS3_SIEM_CA_FILE'] || '/pki/ca.crt'}"
    tls_verify_mode peer
    tls_version TLSv1_2
    open_timeout 10
    read_timeout 30
    reuse_connections true
    retryable_response_codes 429,500,502,503,504
    <format>
      @type json
    </format>
    <buffer>
      @type file
      path /var/log/fluentd/buffer/siem-ndjson
      flush_mode interval
      flush_interval 5s
      flush_thread_count 1
      chunk_limit_size 2MB
      chunk_limit_records 1000
      total_limit_size 1GB
      retry_type exponential_backoff
      retry_wait 2s
      retry_max_interval 120s
      retry_forever true
      overflow_action drop_oldest_chunk
    </buffer>
    <secondary>
      @type secondary_file
      directory /var/log/fluentd/dead-letter/siem-ndjson
      basename dead.${chunk_id}
    </secondary>
  </match>
</label>

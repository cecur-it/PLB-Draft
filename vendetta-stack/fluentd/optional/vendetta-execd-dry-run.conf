# Traces: PROMPT §6 Closed-loop, CONTRACT §5 (@id http-vendetta-execd), §6 — rendered into enabled.d/ when ERROW_FEEDBACK_LIVE is not "true" (default)
# Dry-run twin of vendetta-execd-live.conf: the same selection and the same request body, but nothing is sent. Each would-be action is
# appended as one JSON line to /var/log/fluentd/dry-run/execd.<date>.log ({"agent_id","would":"PUT /active-response?agents_list=..","body"}),
# pruned by entrypoint.sh after FLUENTD_DRYRUN_RETENTION_DAYS (default 14). Without the agent-id property nothing is written.

<label @VENDETTA_EXECD>
  <filter errow.findings>
    @type grep
    @id filter_execd_dry_select
    <regexp>
      key severity
      pattern "/#{ENV['ERROW_FEEDBACK_SEVERITY_REGEX'] || '^critical$'}/"
    </regexp>
    <regexp>
      key $.properties.errow.vendetta_agent_id
      pattern "/#{ENV['VENDETTA_EXECD_AGENT_REGEX'] || '^[0-9]{3,}$'}/"
    </regexp>
    <exclude>
      key $.properties.errow.vendetta_agent_id
      pattern /\A0+\z/
    </exclude>
  </filter>
  <filter errow.findings>
    @type record_transformer
    @id filter_execd_dry_body
    enable_ruby true
    renew_record true
    <record>
      dry_run true
      agent_id ${record.dig('properties', 'errow', 'vendetta_agent_id').to_s}
      would ${"PUT /active-response?agents_list=#{record.dig('properties', 'errow', 'vendetta_agent_id')}"}
      body ${{'command' => (ENV['ERROW_FEEDBACK_AR_COMMAND'] || '!host-isolate.sh'), 'arguments' => ['-'], 'alert' => {'data' => {'action' => 'isolate', 'errow_fingerprint' => (record['doc_id'] || record.dig('properties', 'errow', 'fingerprint')).to_s, 'errow_run' => record['run'].to_s}}}}
    </record>
  </filter>
  <match errow.findings>
    @type file
    @id http-vendetta-execd
    path /var/log/fluentd/dry-run/execd
    append true
    <format>
      @type json
    </format>
    <buffer time>
      @type file
      path /var/log/fluentd/buffer/http-vendetta-execd-dry-run
      timekey 1d
      timekey_wait 1m
      flush_mode interval
      flush_interval 30s
      total_limit_size 64MB
      overflow_action drop_oldest_chunk
    </buffer>
  </match>
  <match **>
    @type null
    @id null_execd_dry_other
  </match>
</label>

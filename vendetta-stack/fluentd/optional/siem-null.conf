# Traces: PROMPT §4.3 SIEM leg, CONTRACT §5, §8.3 — rendered into enabled.d/ when CS3_AGGREGATOR_LEGS does NOT contain "siem" (default)
# <label @SIEM> is still defined so 50-esoc-siem-label.conf can relabel to it; records are discarded here because Fluent Bit already
# delivers the SIEM leg from the edge (CS3_SIEM_ENABLED).

<label @SIEM>
  <match **>
    @type null
    @id siem-ndjson-disabled
  </match>
</label>

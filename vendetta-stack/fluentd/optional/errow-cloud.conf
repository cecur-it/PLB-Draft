# Traces: PROMPT §6 Closed-loop (retest trigger), CONTRACT §5 (@id http-errow-cloud), §8.3 — rendered into enabled.d/ when ERROW_CLOUD_ENABLED=true
# <label @ERROW_CLOUD>: findings with severity matching ERROW_CLOUD_SEVERITY_REGEX (default ^(high|critical)$) are POSTed as NDJSON to
#   ${ERROW_CLOUD_URL}${ERROW_CLOUD_RETEST_PATH:-/api/v1/retests}   Authorization: Bearer <ERROW_CLOUD_TOKEN_FILE, default /run/secrets/errow_api_token>
# Public endpoint: certificate verified against the system trust store. Durable (file buffer, retry_forever, overflow blocks the
# route rather than losing a retest trigger); a 4xx other than 429 is unrecoverable and is parked in dead-letter/http-errow-cloud.

<label @ERROW_CLOUD>
  <filter errow.findings>
    @type grep
    @id filter_errow_cloud_severity
    <regexp>
      key severity
      pattern "/#{ENV['ERROW_CLOUD_SEVERITY_REGEX'] || '^(high|critical)$'}/"
    </regexp>
  </filter>
  <match errow.findings>
    @type http_bearer
    @id http-errow-cloud
    endpoint "#{ENV.fetch('ERROW_CLOUD_URL').chomp('/')}#{ENV['ERROW_CLOUD_RETEST_PATH'] || '/api/v1/retests'}"
    http_method post
    content_type application/x-ndjson
    bearer_token_file "#{ENV['ERROW_CLOUD_TOKEN_FILE'] || '/run/secrets/errow_api_token'}"
    tls_verify_mode peer
    tls_version TLSv1_2
    open_timeout 10
    read_timeout 30
    reuse_connections true
    retryable_response_codes 429,500,502,503,504
    <format>
      @type json
    </format>
    <buffer>
      @type file
      path /var/log/fluentd/buffer/http-errow-cloud
      flush_mode interval
      flush_interval 10s
      flush_thread_count 1
      chunk_limit_size 1MB
      chunk_limit_records 50
      total_limit_size 256MB
      retry_type exponential_backoff
      retry_wait 5s
      retry_max_interval 300s
      retry_forever true
      overflow_action block
    </buffer>
    <secondary>
      @type secondary_file
      directory /var/log/fluentd/dead-letter/http-errow-cloud
      basename dead.${chunk_id}
    </secondary>
  </match>
  <match **>
    @type null
    @id null_errow_cloud_other
  </match>
</label>

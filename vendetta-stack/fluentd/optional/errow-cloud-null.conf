# Traces: PROMPT §6 Closed-loop, CONTRACT §5, §8.3 — rendered into enabled.d/ when ERROW_CLOUD_ENABLED is not "true" (default)
# <label @ERROW_CLOUD> must always exist because 15-routing.conf relabels errow.findings to it; nothing is sent to the cloud.

<label @ERROW_CLOUD>
  <match **>
    @type null
    @id http-errow-cloud-disabled
  </match>
</label>

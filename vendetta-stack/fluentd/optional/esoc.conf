# Traces: PROMPT §4.3 ESOC leg, CONTRACT §5 (@id esoc-otlp), §8.3 Leg2 — rendered into enabled.d/ when CS3_AGGREGATOR_LEGS contains "esoc"
# <label @ESOC>: OTLP/HTTP JSON logs to ${CS3_ESOC_URL}/v1/logs (plugins/out_otlp_http.rb). mTLS with the aggregator's own certificate
# unless CS3_ESOC_CERT_FILE / CS3_ESOC_KEY_FILE say otherwise. Optional bearer in CS3_ESOC_TOKEN_FILE.
# Best-effort fan-out: when the ESOC is unreachable the OLDEST chunk is dropped after the 1 GB buffer fills, so a dead ESOC can never block OpenSearch.

<label @ESOC>
  <match **>
    @type otlp_http
    @id esoc-otlp
    endpoint "#{ENV.fetch('CS3_ESOC_URL').chomp('/')}/v1/logs"
    service_name vendetta-stack-fluentd
    instance_id "fluentd-#{ENV.fetch('FLUENTD_NODE_ID')}"
    compress gzip
    bearer_token_file "#{ENV['CS3_ESOC_TOKEN_FILE']}"
    tls_ca_cert_path "#{ENV['CS3_ESOC_CA_FILE'] || '/pki/ca.crt'}"
    tls_client_cert_path "#{ENV['CS3_ESOC_CERT_FILE'] || '/pki/fluentd-' + ENV.fetch('FLUENTD_NODE_ID') + '.crt'}"
    tls_private_key_path "#{ENV['CS3_ESOC_KEY_FILE'] || '/pki/fluentd-' + ENV.fetch('FLUENTD_NODE_ID') + '.key'}"
    tls_verify_mode peer
    tls_version TLSv1_2
    open_timeout 10
    read_timeout 30
    reuse_connections true
    retryable_response_codes 429,500,502,503,504
    <buffer>
      @type file
      path /var/log/fluentd/buffer/esoc-otlp
      flush_mode interval
      flush_interval 5s
      flush_thread_count 1
      chunk_limit_size 2MB
      chunk_limit_records 1000
      total_limit_size 1GB
      retry_type exponential_backoff
      retry_wait 2s
      retry_max_interval 120s
      retry_forever true
      overflow_action drop_oldest_chunk
    </buffer>
    <secondary>
      @type secondary_file
      directory /var/log/fluentd/dead-letter/esoc-otlp
      basename dead.${chunk_id}
    </secondary>
  </match>
</label>

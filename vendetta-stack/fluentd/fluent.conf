# Traces: PROMPT §1 Tier 2 (Fluentd aggregation, active-active HA), §3 Data flow, §5 Observability; CONTRACT §2, §3, §5, §8.3, §8.13
# Fluentd 1.17 aggregator. Fluent Bit (edge) --forward + mTLS--> fluentd-1 / fluentd-2 (this config, node = FLUENTD_NODE_ID)
#   --> OpenSearch (vendetta-alerts alias, errow-*, cs3-ai-*), LLM gateway /triage, errow-feedback webhook, and the optional
#       ESOC / SIEM / Errow-cloud / Vendetta-execd legs rendered into enabled.d/ by entrypoint.sh.
#
# Environment is read with "#{ENV['X']}" (Fluentd does not expand ${X}); secrets are read from files at load time:
#   FLUENTD_NODE_ID            1|2   selects /pki/fluentd-<id>.crt|key (required; entrypoint.sh validates)
#   FLUENTD_LOG_LEVEL          info  fluentd log level            FLUENTD_WORKERS  1  (>1 moves monitor/prometheus to worker 0)
#   FLUENTD_MONITOR_BIND       127.0.0.1  monitor_agent bind (container healthcheck uses it)
#   FLUENTD_OS_BUFFER_LIMIT    2GB   total_limit_size of each OpenSearch file buffer
# Everything else is documented in RUNTIME.md. File order matters in the root scope (filters before the <match> routes):
#   00 sources | 10-13 filters | 15 routes | 20-60 <label> pipelines | enabled.d/ optional legs (rendered at start).
#
# HA: two identical nodes, no shared state. The edge client (Fluent Bit upstream.conf, or edge/forwarder.conf for an edge
# Fluentd) balances over both and fails over when one stops answering; every output below is idempotent (stable _id) so a
# replay after a failover cannot duplicate documents.

<system>
  log_level "#{ENV['FLUENTD_LOG_LEVEL'] || 'info'}"
  workers "#{ENV['FLUENTD_WORKERS'] || '1'}"
  suppress_repeated_stacktrace true
  ignore_repeated_log_interval 60s
  emit_error_log_interval 30s
  enable_input_metrics true
  enable_size_metrics true
  file_permission 0600
  dir_permission 0700
  <log>
    format json
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </log>
</system>

@include conf.d/*.conf
# Optional legs (esoc / siem / errow-cloud / vendetta-execd), rendered by entrypoint.sh; 00-noop.conf keeps the glob non-empty.
@include enabled.d/*.conf

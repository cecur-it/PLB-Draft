# Static scan target for the `lab` profile: an allow-listed, harmless HTTP endpoint that Errow/MCP tools may probe.
# Mounted over /etc/nginx/nginx.conf (read-only rootfs, uid-agnostic: every writable path is under /tmp).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_name scan-target.vendetta.lab;
    location / { default_type text/plain; return 200 "vendetta-stack scan target\n"; }
    location /health { default_type text/plain; return 200 "ok\n"; }
  }
}

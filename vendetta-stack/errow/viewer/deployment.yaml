# errow-viewer - Kubernetes reference manifests (ServiceAccount, Deployment, Service, NetworkPolicy, Ingress).
# Traces: CONTRACT §2 (viewer :8765, K8s Service names == compose service names), §8 (viewer addendum), §11 (RUNTIME.md notes).
# The deploy tier (kubernetes/**) is authoritative for the namespace and cluster wiring; these are drop-in defaults. Prerequisites:
#   * PVC errow-runs        the runs volume written by the `errow` pod (./errow_runs/<run>/...); mounted READ-ONLY here.
#                           RWX storage, or keep both pods on one node (the preferred podAffinity below does that for RWO).
#   * Secret errow-viewer-basic-auth   htpasswd file under key `auth` for the Ingress gate:
#                             htpasswd -ciB auth errow-viewer < ./secrets/errow_viewer_password
#                             kubectl create secret generic errow-viewer-basic-auth --from-file=auth
#   * Secret vendetta-stack-tls        the SHARED wildcard/SAN certificate of the stack's ingress host (tls.crt/tls.key).
#   * image vendetta-stack/errow:1.0.0 built from errow/Dockerfile.errow (same image as the `errow` scan service).
# How the viewer authenticates (upstream design, verified in errow/interface/viewer/server.py):
#   * `errow view` serves ONE run and mints a random per-process bootstrap token. The first page load must carry `?token=<t>`;
#     the server then sets a SameSite=Strict session cookie and answers 403 to every request without it. There is no static token,
#     no user database, and the token changes whenever the process restarts (also when the entrypoint follows a newer run).
#   * Therefore: exactly ONE replica (a second replica would have another token), and the token is NOT a substitute for real
#     access control - the URL (with the token) lands in browser history and proxy logs. The Ingress below adds HTTP basic auth;
#     swap it for oauth2-proxy (auth-url/auth-signin) or mTLS (auth-tls-secret) if the shared ingress already offers one.
#   * Get the current link:   kubectl exec deploy/errow-viewer -- errow-entrypoint --print-viewer-link
#     (it prints http://0.0.0.0:8765/?token=...; use the Ingress hostname instead of 0.0.0.0). Without an Ingress:
#     kubectl port-forward deploy/errow-viewer 8765:8765  and open http://127.0.0.1:8765/?token=...
#   * The dedicated hostname is required: the frontend fetches absolute /api/* paths, so the viewer cannot live under a sub-path.
# The pod has no egress at all: the viewer only reads the runs volume. That also disables its optional "send report to the Errow
# cloud" action, which is what an on-prem / air-gapped deployment wants.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: errow-viewer
  labels:
    app.kubernetes.io/name: errow-viewer
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/component: errow-viewer
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: errow-viewer
  labels:
    app.kubernetes.io/name: errow-viewer
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/component: errow-viewer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: errow-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: errow-viewer
        app.kubernetes.io/part-of: vendetta-stack
        app.kubernetes.io/component: errow-viewer
    spec:
      serviceAccountName: errow-viewer
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: errow
      containers:
        - name: errow-viewer
          image: vendetta-stack/errow:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: ERROW_MODE
              value: view
            - name: CS3_PROFILE
              value: onprem
            - name: ERROW_VIEWER_HOST
              value: 0.0.0.0
            - name: ERROW_VIEWER_PORT
              value: "8765"
            - name: ERROW_VIEWER_FOLLOW
              value: "true"
            - name: ERROW_WORKDIR
              value: /workspace
            - name: HOME
              value: /home/errow
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            exec:
              command: ["errow-entrypoint", "--healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["errow-entrypoint", "--healthcheck"]
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["errow-entrypoint", "--healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: errow-runs
              mountPath: /workspace/errow_runs
              readOnly: true
            - name: home
              mountPath: /home/errow
            - name: logs
              mountPath: /var/log/errow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: errow-runs
          persistentVolumeClaim:
            claimName: errow-runs
            readOnly: true
        - name: home
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: errow-viewer
  labels:
    app.kubernetes.io/name: errow-viewer
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/component: errow-viewer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: errow-viewer
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: errow-viewer
  labels:
    app.kubernetes.io/name: errow-viewer
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/component: errow-viewer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: errow-viewer
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8765
          protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: errow-viewer
  labels:
    app.kubernetes.io/name: errow-viewer
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/component: errow-viewer
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: errow-viewer-basic-auth
    nginx.ingress.kubernetes.io/auth-secret-type: auth-file
    nginx.ingress.kubernetes.io/auth-realm: Errow viewer
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - errow-viewer.vendetta.lab
      secretName: vendetta-stack-tls
  rules:
    - host: errow-viewer.vendetta.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: errow-viewer
                port:
                  name: http

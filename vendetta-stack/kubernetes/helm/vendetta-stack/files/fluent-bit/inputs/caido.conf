# Traces: PROMPT §1 Tier 1 (Caido proxy); CONTRACT §3 (errow.proxy), §4.5 (Caido runs in the per-run sandbox, :48080, --no-logging)
# Rendered into enabled.d/ by entrypoint.sh only when the directory of ${CAIDO_LOG_GLOB} (default /var/log/errow/caido/*.log)
# exists (a wildcard path in a missing directory makes the tail input log an [error] on every refresh).
# Raw Caido text logs (tracing-subscriber format) wherever an operator mounts them; the shipper's own Caido records arrive as
# NDJSON through conf.d/55-errow-runtime.conf.
[INPUT]
    Name                          tail
    Alias                         errow_caido_log_tail
    Tag                           errow.proxy
    Path                          ${CAIDO_LOG_GLOB}
    Parser                        caido_log
    DB                            /var/log/fluent-bit/db/errow-caido-log.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              10
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Traces: PROMPT §1 Tier 1 (host audit log); deployment/agents/templates/fluent-bit-linux.conf
# Rendered into enabled.d/ by entrypoint.sh when /var/log/audit/audit.log exists (and CS3_HOST_LOGS is not false).
[INPUT]
    Name                          tail
    Alias                         host_audit_tail
    Tag                           host.audit
    Path                          /var/log/audit/audit.log
    DB                            /var/log/fluent-bit/db/host-audit.db
    DB.sync                       normal
    Skip_Long_Lines               On
    Read_from_Head                False
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Traces: PROMPT §1 Tier 1 (host journal), §4 AI tier; CONTRACT §8.3
# Variant of inputs/systemd.conf rendered instead of it when CS3_JOURNAL_ALL=true: the whole journal is read as
# host.journal (CS3 forwarder behaviour); Ollama units are still diverted to `cs3.ai.ollama` by conf.d/60-ai-tier.conf.
# The leaky-bucket throttle (70-filters-global.conf) bounds this stream at ${CS3_EPS_LIMIT} events/s.
[INPUT]
    Name                          systemd
    Alias                         journal_all
    Tag                           host.journal
    Path                          ${FLB_JOURNAL_PATH}
    Read_From_Tail                On
    Strip_Underscores             On
    DB                            /var/log/fluent-bit/db/journal.db
    DB.sync                       normal
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

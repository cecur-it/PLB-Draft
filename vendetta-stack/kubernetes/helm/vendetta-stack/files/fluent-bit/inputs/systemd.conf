# Traces: PROMPT §4 AI tier; CONTRACT §5 (telemetry loop), §8.3 (systemd input guarded by journal presence)
# Rendered into enabled.d/ by entrypoint.sh only when ${FLB_JOURNAL_PATH} (default /var/log/journal, else /run/log/journal)
# exists. Default variant: ONLY the Ollama units are read (AI-tier telemetry). conf.d/60-ai-tier.conf retags them
# `cs3.ai.ollama`. Strip_Underscores On turns _SYSTEMD_UNIT into SYSTEMD_UNIT, which the retag rule keys on.
# Several Systemd_Filter lines are OR-ed.
[INPUT]
    Name                          systemd
    Alias                         journal_ollama
    Tag                           host.journal
    Path                          ${FLB_JOURNAL_PATH}
    Systemd_Filter                _SYSTEMD_UNIT=ollama.service
    Systemd_Filter                _SYSTEMD_UNIT=cs3-ollama.service
    Read_From_Tail                On
    Strip_Underscores             On
    DB                            /var/log/fluent-bit/db/journal.db
    DB.sync                       normal
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Traces: PROMPT §1 Tier 1 (syslog sources); parsers.conf (syslog-rfc3164, syslog-rfc5424)
# Rendered into enabled.d/ by entrypoint.sh when FLB_SYSLOG_ENABLED=true: network syslog from appliances that cannot run an
# agent. UDP carries RFC 3164, TCP carries RFC 5424. Records are tagged host.syslog (Console + ESOC + SIEM legs).
[INPUT]
    Name                          syslog
    Alias                         syslog_udp_rfc3164
    Tag                           host.syslog
    Mode                          udp
    Listen                        0.0.0.0
    Port                          ${FLB_SYSLOG_PORT}
    Parser                        syslog-rfc3164
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[INPUT]
    Name                          syslog
    Alias                         syslog_tcp_rfc5424
    Tag                           host.syslog
    Mode                          tcp
    Listen                        0.0.0.0
    Port                          ${FLB_SYSLOG_PORT}
    Parser                        syslog-rfc5424
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 16MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Traces: PROMPT §1 Tier 1 (Errow reports; the spec's ~/.errow/reports/); CONTRACT §3 (errow.findings, errow.report_artifacts)
# Rendered into enabled.d/ by entrypoint.sh only when the directory ${ERROW_REPORTS_DIR} (default /var/log/errow/reports)
# exists: the tail input logs an [error] on every refresh for a wildcard path whose directory is missing. Restart the
# collector after creating the directory.
# *.sarif.ndjson holds one SARIF result per line (like the shipper's findings stream); every other *.ndjson / *.jsonl is a
# report manifest. Records lacking shipper fields get `stream` / `source` from errow_normalize.
[INPUT]
    Name                          tail
    Alias                         errow_reports_sarif_tail
    Tag                           errow.findings
    Path                          ${ERROW_REPORTS_DIR}/*.sarif.ndjson
    Parser                        errow_sarif_result
    DB                            /var/log/fluent-bit/db/errow-reports-sarif.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              10
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             128k
    Buffer_Max_Size               4M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[INPUT]
    Name                          tail
    Alias                         errow_reports_dir_tail
    Tag                           errow.report_artifacts
    Path                          ${ERROW_REPORTS_DIR}/*.ndjson,${ERROW_REPORTS_DIR}/*.jsonl
    Exclude_Path                  *.sarif.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-reports-dir.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              10
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 4MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Traces: PROMPT §1 Tier 1 (Errow runs -> edge); CONTRACT §2 (errow-runs volume), §8.4/§15 (shipper shapes);
#         errow/errow/report/state.py (run.json, coverage.json, .state/threat_models.json, .state/agents.db)
# Errow runs live in ./errow_runs/<run>/ (cwd-relative, NOT ~/.errow/runs); run.json / coverage.json / threat_models.json
# are atomically REWRITTEN JSON, so errow-shipper converts them to NDJSON (a runs/coverage record is emitted only when the
# file content hash changes) and these tails read /var/log/errow/<stream>.ndjson.

[INPUT]
    Name                          tail
    Alias                         errow_runs_tail
    Tag                           errow.runs
    Path                          /var/log/errow/runs.ndjson
    Parser                        errow_run
    DB                            /var/log/fluent-bit/db/errow-runs.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             128k
    Buffer_Max_Size               4M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[INPUT]
    Name                          tail
    Alias                         errow_coverage_tail
    Tag                           errow.coverage
    Path                          /var/log/errow/coverage.ndjson
    Parser                        errow_run
    DB                            /var/log/fluent-bit/db/errow-coverage.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             128k
    Buffer_Max_Size               4M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[INPUT]
    Name                          tail
    Alias                         errow_threat_models_tail
    Tag                           errow.threat_models
    Path                          /var/log/errow/threat_models.ndjson
    Parser                        errow_threat_model
    DB                            /var/log/fluent-bit/db/errow-threat-models.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             128k
    Buffer_Max_Size               4M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Summaries of .state/agents.db (read-only sqlite in the shipper): agent id, status, role, tokens.
[INPUT]
    Name                          tail
    Alias                         errow_agent_state_tail
    Tag                           errow.agent_state
    Path                          /var/log/errow/agent_state.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-agent-state.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 4MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# Shipper liveness/status. The spec's `exec` bridge (cat status.json) needs the exec input, which the pinned 3.2.10 image
# does not compile in; the equivalent is to tail the status file the shipper rewrites as a single-line JSON document
# (Read_from_Head: each atomic replace is a new inode and is read from its first byte). Same tag as the summaries above.
[INPUT]
    Name                          tail
    Alias                         errow_shipper_status_tail
    Tag                           errow.agent_state
    Path                          ${ERROW_SHIPPER_STATUS_FILE}
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-shipper-status.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   5
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             32k
    Buffer_Max_Size               256k
    Mem_Buf_Limit                 2MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# The shipper's own {artifact,path,sha256,bytes,kind} records (one per generated report file).
[INPUT]
    Name                          tail
    Alias                         errow_report_artifacts_tail
    Tag                           errow.report_artifacts
    Path                          /var/log/errow/report_artifacts.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-report-artifacts.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               1M
    Mem_Buf_Limit                 4MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

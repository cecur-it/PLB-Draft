# Traces: PROMPT §1 Tier 1 (Errow runtime, Caido proxy); CONTRACT §3 (errow.runtime_events, errow.proxy, errow.viewer,
#         errow.cloud_events, errow.telemetry), §4.5 (Caido runs inside the per-run sandbox on :48080 with --no-logging), §8.4
# Runtime-class streams: noisy and loss-tolerant, so they (and only they, with host.journal) sit behind the leaky-bucket
# `throttle` filter in 70-filters-global.conf.

[INPUT]
    Name                          tail
    Alias                         errow_runtime_events_tail
    Tag                           errow.runtime_events
    Path                          /var/log/errow/runtime_events.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-runtime-events.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               2M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

# errow CLI stdout/stderr tee'd by the errow container. Python tracebacks and wrapped lines are stitched into the record
# that started them by the errow_traceback multiline parser; the parser filter below splits errow.log-style lines
# (timestamp, level, scan_id, agent_id, logger) and falls back to level + message for free text.
[INPUT]
    Name                          tail
    Alias                         errow_cli_log_tail
    Tag                           errow.runtime_events
    Path                          /var/log/errow/cli.log
    multiline.parser              errow_traceback
    DB                            /var/log/fluent-bit/db/errow-cli-log.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               2M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[FILTER]
    Name                          parser
    Match                         errow.runtime_events
    Alias                         errow_cli_line_parser
    Key_Name                      log
    Parser                        errow_log_line
    Parser                        errow_cli_log
    Reserve_Data                  On
    Preserve_Key                  Off

# Caido proxy events captured by the shipper from the sandbox containers (NDJSON). Raw Caido text logs are read by

# Traces: PROMPT §1 Tier 1 -> Tier 2 (edge -> aggregation), §4 AI tier; CONTRACT §3, §5 (wiring), §8.3 (legs / safety sink)
# Always-on outputs. The three optional legs (Console / ESOC / SIEM) are rendered into enabled.d/ by entrypoint.sh.

# Edge -> Fluentd aggregators fluentd-1 / fluentd-2 (active-active, mTLS; nodes in upstream.conf).
# `cs3.ai.ollama` is NOT in this regex: it can never reach OpenSearch / the gateway /triage path through Fluentd.
# `errow.tui_events` is matched by this output only (no leg regex can match it).
[OUTPUT]
    Name                          forward
    Alias                         fluentd_forward
    Match_Regex                   ^(vendetta\..*|errow\..*|cfgaudit\.(findings|runs)|cs3\.ai\.(inference|tool_call|enrichment)|cs3\.sp\..*)$
    Upstream                      /etc/fluent-bit/upstream.conf
    Require_ack_response          On
    Compress                      gzip
    Retry_Limit                   False
    Workers                       2
    net.connect_timeout           10
    net.keepalive                 on
    net.keepalive_idle_timeout    30
    storage.total_limit_size      ${FLB_FORWARD_STORAGE_LIMIT}

# Local safety sink for Ollama journal entries: survives any leg being disabled or down, and is the only place a
# `cs3.ai.ollama` record is guaranteed to land. The `file` output has no json_lines format: `plain` writes one
# NDJSON map per line. Size rotation is done by entrypoint.sh (the plugin reopens the file on every flush).
[OUTPUT]
    Name                          file
    Alias                         ollama_safety_file
    Match                         cs3.ai.ollama
    Path                          /var/log/fluent-bit
    File                          cs3-ai-ollama.ndjson
    Format                        plain
    Mkdir                         true
    Retry_Limit                   False
    storage.total_limit_size      256M

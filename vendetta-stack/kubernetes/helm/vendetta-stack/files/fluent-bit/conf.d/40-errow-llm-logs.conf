# Traces: PROMPT §1 Tier 1 (Errow LLM audit -> edge); CONTRACT §3 (errow.llm_logs, errow.transcripts), §15;
#         errow/errow/llm/request_log.py (LlmRequestEvent: provider, model, tokens, latency, status; never prompt bodies)
# llm_logs: one record per LLM request. transcripts: one record per agent message (content already truncated to 8000 chars
# and redacted by the shipper; the global cs3_sanitize filter applies the same algorithm again, idempotently).

[INPUT]
    Name                          tail
    Alias                         errow_llm_logs_tail
    Tag                           errow.llm_logs
    Path                          /var/log/errow/llm_logs.ndjson
    Parser                        errow_llm_request
    DB                            /var/log/fluent-bit/db/errow-llm-logs.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             64k
    Buffer_Max_Size               2M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

[INPUT]
    Name                          tail
    Alias                         errow_transcripts_tail
    Tag                           errow.transcripts
    Path                          /var/log/errow/transcripts.ndjson
    Parser                        errow_ndjson
    DB                            /var/log/fluent-bit/db/errow-transcripts.db
    DB.sync                       normal
    Read_from_Head                On
    Refresh_Interval              5
    Rotate_Wait                   30
    Skip_Long_Lines               On
    Skip_Empty_Lines              On
    Buffer_Chunk_Size             128k
    Buffer_Max_Size               4M
    Mem_Buf_Limit                 8MB
    storage.type                  filesystem
    storage.pause_on_chunks_overlimit on

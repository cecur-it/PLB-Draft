# Traces: PROMPT §1 Tier 1 (edge analytics), §5 Observability; CONTRACT §3, §5
# Stream-processor tasks (Fluent Bit 3.2.10). Each task aggregates a tumbling 60 s window over a tag and emits one
# record under the new tag `cs3.sp.<name>`. Verified on 3.2.10: the SQL sees records AFTER the filter chain, i.e. under their
# final tags (vendetta.fim / vendetta.alerts / cs3.ai.ollama ...), and a record consumed by `rewrite_tag ... false` is only
# counted under its new tag. Severity is counted by SARIF `level` / Wazuh `rule['level']`.
# `cs3.sp.*` records are forwarded to Fluentd (conf.d/90-outputs.conf), which exposes them as Prometheus gauges
# (fluentd/conf.d/30-match-prometheus.conf); they are never sent to the Console, ESOC or SIEM legs.

# Alerts per minute from the Vendetta manager (alerts.json tail and agents forwarding vendetta.*; all four streams).
[STREAM_TASK]
    Name   vendetta_alert_rate
    Exec   CREATE STREAM cs3_sp_vendetta_alert_rate WITH (tag='cs3.sp.vendetta_alert_rate') AS SELECT COUNT(*) AS alerts, MAX(rule['level']) AS max_rule_level FROM TAG:'vendetta.*' WINDOW TUMBLING (60 SECOND);

# Alerts per minute per Wazuh rule level (0-15): the band thresholds of CONTRACT §4.1 are applied downstream.
[STREAM_TASK]
    Name   vendetta_alerts_by_level
    Exec   CREATE STREAM cs3_sp_vendetta_by_level WITH (tag='cs3.sp.vendetta_by_level') AS SELECT rule['level'] AS rule_level, COUNT(*) AS alerts FROM TAG:'vendetta.*' WINDOW TUMBLING (60 SECOND) GROUP BY rule['level'];

# Errow findings per minute by SARIF level (error | warning | note).
[STREAM_TASK]
    Name   errow_findings_by_level
    Exec   CREATE STREAM cs3_sp_errow_findings WITH (tag='cs3.sp.errow_findings') AS SELECT level, COUNT(*) AS findings FROM TAG:'errow.findings' WINDOW TUMBLING (60 SECOND) GROUP BY level;

# Gateway inference metering per minute (GPU-seconds, tokens, mean latency).
[STREAM_TASK]
    Name   ai_inference_usage
    Exec   CREATE STREAM cs3_sp_ai_inference WITH (tag='cs3.sp.ai_inference') AS SELECT COUNT(*) AS inferences, SUM(gpu_seconds) AS gpu_seconds, SUM(tokens_in) AS tokens_in, SUM(tokens_out) AS tokens_out, AVG(latency_ms) AS avg_latency_ms FROM TAG:'cs3.ai.inference' WINDOW TUMBLING (60 SECOND);

# Ollama journal volume (the records themselves stay on the safety file / ESOC / SIEM legs; only this count leaves).
[STREAM_TASK]
    Name   ai_ollama_volume
    Exec   CREATE STREAM cs3_sp_ai_ollama WITH (tag='cs3.sp.ai_ollama') AS SELECT COUNT(*) AS lines FROM TAG:'cs3.ai.ollama' WINDOW TUMBLING (60 SECOND);

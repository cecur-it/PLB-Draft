# Traces: PROMPT §1 Tier 2 (aggregation, active-active); CONTRACT §5 (Fluent Bit -> Fluentd wiring)
# Fluentd aggregators fluentd-1 / fluentd-2 :24224, mTLS (server cert fluentd-N.crt, client cert fluent-bit.crt).
# Upstream mode: Fluent Bit round-robins the two nodes (active-active) and skips a node whose connection is down;
# the other keeps receiving, buffered chunks are re-routed on retry. Referenced by the forward output in
# conf.d/90-outputs.conf (`Upstream /etc/fluent-bit/upstream.conf`).
[UPSTREAM]
    Name       fluentd_aggregators

[NODE]
    Name       fluentd-1
    Host       fluentd-1
    Port       24224
    tls        on
    tls.verify on
    tls.vhost  fluentd-1
    tls.ca_file  /pki/ca.crt
    tls.crt_file /pki/fluent-bit.crt
    tls.key_file /pki/fluent-bit.key

[NODE]
    Name       fluentd-2
    Host       fluentd-2
    Port       24224
    tls        on
    tls.verify on
    tls.vhost  fluentd-2
    tls.ca_file  /pki/ca.crt
    tls.crt_file /pki/fluent-bit.crt
    tls.key_file /pki/fluent-bit.key

# Traces: CONTRACT section 2 (secret names), PROMPT section 1 Tier 3 (External Secrets); values never live in the chart, only remote references.
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $secretNames := list "opensearch_admin_password" "llm_gateway_token" "errow_api_token" "grafana_admin_password" "feedback_webhook_token" "vendetta_api_password" }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
{{ include "vs.labels" (dict "root" . "component" "secrets") | indent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
  {{- range $secretNames }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.remoteKeyPrefix }}/{{ . }}
  {{- end }}
{{- if or .Values.fluentBit.legs.console.enabled .Values.fluentBit.legs.siem.enabled }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.legsSecret }}
  labels:
{{ include "vs.labels" (dict "root" . "component" "secrets") | indent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.legsSecret }}
    creationPolicy: Owner
  data:
  {{- if .Values.fluentBit.legs.console.enabled }}
    - secretKey: {{ .Values.fluentBit.legs.console.ingestKeyKey }}
      remoteRef:
        key: {{ $es.remoteKeyPrefix }}/{{ .Values.fluentBit.legs.console.ingestKeyKey }}
  {{- end }}
  {{- if .Values.fluentBit.legs.siem.enabled }}
    - secretKey: {{ .Values.fluentBit.legs.siem.tokenKey }}
      remoteRef:
        key: {{ $es.remoteKeyPrefix }}/{{ .Values.fluentBit.legs.siem.tokenKey }}
  {{- end }}
{{- end }}
{{- if .Values.config.feedbackLive }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.approvalSecret }}
  labels:
{{ include "vs.labels" (dict "root" . "component" "secrets") | indent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.approvalSecret }}
    creationPolicy: Owner
  data:
    - secretKey: feedback_approval_key
      remoteRef:
        key: {{ $es.remoteKeyPrefix }}/feedback_approval_key
{{- end }}
{{- end }}

[]},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"pieType\": \"donut\", \"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"values\": [\"value\"]}, \"tooltip\": {\"mode\": \"single\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-ai-inference\"}, \"timeField\": \"@timestamp\", \"query\": \"fallback:true AND _exists_:fallback_reason\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"fallback_reason\", \"settings\": {\"size\": \"8\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 31, \"type\": \"piechart\", \"title\": \"Verdicts\", \"description\": \"cs3-ai-inference-*: verdict.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-ai-inference\"},\n      \"gridPos\": {\"h\": 8, \"w\": 4, \"x\": 20, \"y\": 58},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"pieType\": \"donut\", \"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"values\": [\"value\"]}, \"tooltip\": {\"mode\": \"single\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-ai-inference\"}, \"timeField\": \"@timestamp\", \"query\": \"_exists_:verdict\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"verdict\", \"settings\": {\"size\": \"8\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 32, \"type\": \"table\", \"title\": \"Latest audit events (hash chain)\", \"description\": \"cs3-ai-audit-*: newest 50 events with chain_id, seq and hash (gateway-provided, stored untouched; replays are rejected by id_key=hash).\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-ai-audit\"},\n      \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 66},\n      \"fieldConfig\": {\"defaults\": {\"custom\": {\"align\": \"auto\"}}, \"overrides\": []},\n      \"options\": {\"showHeader\": true, \"cellHeight\": \"sm\", \"footer\": {\"show\": false}, \"sortBy\": [{\"displayName\": \"@timestamp\", \"desc\": true}]},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-ai-audit\"}, \"timeField\": \"@timestamp\", \"query\": \"*\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"raw_data\", \"settings\": {\"size\": \"50\"}}],\n        \"bucketAggs\": []\n      }],\n      \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"_id\": true, \"_index\": true, \"_type\": true, \"highlight\": true, \"sort\": true}, \"indexByName\": {\"@timestamp\": 0, \"event_type\": 1, \"role\": 2, \"model\": 3, \"tool\": 4, \"decision\": 5, \"chain_id\": 6, \"seq\": 7, \"hash\": 8, \"prev_hash\": 9}, \"renameByName\": {}}}]\n    }\n  ]\n}\n"
  "pipeline-health.json": "{\n  \"uid\": \"cs3-pipeline-health\",\n  \"title\": \"Vendetta Stack / Pipeline health\",\n  \"description\": \"Fluent Bit edge collector and Fluentd aggregators: throughput, retries, drops, buffers, dead letters. Metrics: fluentbit_* (v2 endpoint), fluentd_output_status_*, cs3_pipeline_*.\",\n  \"tags\": [\"vendetta-stack\", \"pipeline\", \"fluent-bit\", \"fluentd\"],\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": false,\n  \"graphTooltip\": 1,\n  \"refresh\": \"30s\",\n  \"timezone\": \"utc\",\n  \"time\": {\"from\": \"now-6h\", \"to\": \"now\"},\n  \"annotations\": {\"list\": []},\n  \"links\": [\n    {\"title\": \"LLM SLO\", \"type\": \"link\", \"url\": \"/d/cs3-llm-slo\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"Vendetta overview\", \"type\": \"link\", \"url\": \"/d/cs3-vendetta-overview\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"Errow offense\", \"type\": \"link\", \"url\": \"/d/cs3-errow-offense\", \"icon\": \"dashboard\", \"targetBlank\": false}\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"node\", \"label\": \"Fluentd node\", \"type\": \"query\", \"multi\": true, \"includeAll\": true, \"allValue\": \".*\", \"refresh\": 2, \"sort\": 1,\n        \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n        \"definition\": \"label_values(fluentd_output_status_emit_records, node)\",\n        \"query\": {\"query\": \"label_values(fluentd_output_status_emit_records, node)\", \"refId\": \"node\"},\n        \"current\": {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"}\n      },\n      {\n        \"name\": \"fbout\", \"label\": \"Fluent Bit output\", \"type\": \"query\", \"multi\": true, \"includeAll\": true, \"allValue\": \".*\", \"refresh\": 2, \"sort\": 1,\n        \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n        \"definition\": \"label_values(fluentbit_output_proc_records_total, name)\",\n        \"query\": {\"query\": \"label_values(fluentbit_output_proc_records_total, name)\", \"refId\": \"fbout\"},\n        \"current\": {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"}\n      }\n    ]\n  },\n  \"panels\": [\n    {\"id\": 1, \"type\": \"row\", \"title\": \"Edge: Fluent Bit\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0}, \"panels\": []},\n    {\n      \"id\": 2, \"type\": \"stat\", \"title\": \"Fluent Bit scrape\", \"description\": \"up{job=\\\"fluent-bit\\\"}\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 0, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"DOWN\", \"color\": \"red\", \"index\": 0}, \"1\": {\"text\": \"UP\", \"color\": \"green\", \"index\": 1}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"green\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"justifyMode\": \"center\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"up{job=\\\"fluent-bit\\\"}\", \"legendFormat\": \"{{instance}}\", \"instant\": true}]\n    },\n    {\n      \"id\": 3, \"type\": \"stat\", \"title\": \"Records in (all inputs)\", \"description\": \"Sum of fluentbit_input_records_total across every input alias.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 6, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"decimals\": 1, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"blue\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"value\", \"graphMode\": \"area\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(rate(fluentbit_input_records_total[$__rate_interval]))\"}]\n    },\n    {\n      \"id\": 4, \"type\": \"stat\", \"title\": \"Dropped records (1h)\", \"description\": \"fluentbit_output_dropped_records_total: data loss when above 0.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 12, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"red\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(increase(fluentbit_output_dropped_records_total[1h])) or vector(0)\", \"instant\": true}]\n    },\n    {\n      \"id\": 5, \"type\": \"stat\", \"title\": \"Chunks that exhausted retries (1h)\", \"description\": \"fluentbit_output_retries_failed_total: chunks discarded after Retry_Limit.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 18, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"red\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(increase(fluentbit_output_retries_failed_total[1h])) or vector(0)\", \"instant\": true}]\n    },\n    {\n      \"id\": 6, \"type\": \"timeseries\", \"title\": \"Input records/s by input\", \"description\": \"One series per input alias (errow_*_tail, vendetta_alerts_tail, gateway_events_http, edge_forward_in, ...).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 5},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (name) (rate(fluentbit_input_records_total[$__rate_interval]))\", \"legendFormat\": \"{{name}}\"}]\n    },\n    {\n      \"id\": 7, \"type\": \"timeseries\", \"title\": \"Output records/s by output\", \"description\": \"fluentd_forward = edge to Fluentd; console_ingest, esoc_otlp, siem_http = optional legs; ollama_safety_file = local-only sink.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 5},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (name) (rate(fluentbit_output_proc_records_total{name=~\\\"$fbout\\\"}[$__rate_interval]))\", \"legendFormat\": \"{{name}}\"}]\n    },\n    {\n      \"id\": 8, \"type\": \"timeseries\", \"title\": \"Output retries and failed retries\", \"description\": \"Retries/s per output; failed = chunks discarded after Retry_Limit.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 13},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": [{\"matcher\": {\"id\": \"byRegexp\", \"options\": \"failed .*\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"red\"}}]}]},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [\n        {\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (name) (rate(fluentbit_output_retries_total{name=~\\\"$fbout\\\"}[$__rate_interval]))\", \"legendFormat\": \"retry {{name}}\"},\n        {\"refId\": \"B\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (name) (rate(fluentbit_output_retries_failed_total{name=~\\\"$fbout\\\"}[$__rate_interval]))\", \"legendFormat\": \"failed {{name}}\"}\n      ]\n    },\n    {\n      \"id\": 9, \"type\": \"timeseries\", \"title\": \"Output chunk capacity left\", \"description\": \"fluentbit_output_chunk_available_capacity_percent (alert below 20%).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 8, \"y\": 13},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"percent\", \"min\": 0, \"max\": 100, \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\", \"thresholdsStyle\": {\"mode\": \"line\"}}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"transparent\", \"value\": 20}]}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"asc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"min by (name) (fluentbit_output_chunk_available_capacity_percent{name=~\\\"$fbout\\\"})\", \"legendFormat\": \"{{name}}\"}]\n    },\n    {\n      \"id\": 10, \"type\": \"timeseries\", \"title\": \"Filesystem storage chunks\", \"description\": \"storage.type filesystem: chunks on disk, in memory (up) and only on disk (down = backlog).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 16, \"y\": 13},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [\n        {\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(fluentbit_storage_fs_chunks_up)\", \"legendFormat\": \"fs chunks up (memory)\"},\n        {\"refId\": \"B\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(fluentbit_storage_fs_chunks_down)\", \"legendFormat\": \"fs chunks down (disk only)\"},\n        {\"refId\": \"C\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(fluentbit_storage_fs_chunks)\", \"legendFormat\": \"fs chunks total\"}\n      ]\n    },\n    {\n      \"id\": 11, \"type\": \"timeseries\", \"title\": \"Leaky-bucket throttled records/s\", \"description\": \"fluentbit_filter_drop_records_total{name=\\\"leaky_bucket_noisy\\\"}: noisy host tags above CS3_EPS_LIMIT (default 500 events/s, the Vendetta leaky-bucket events_per_second). Vendetta alerts are never throttled.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 21},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(rate(fluentbit_filter_drop_records_total{name=\\\"leaky_bucket_noisy\\\"}[$__rate_interval]))\", \"legendFormat\": \"throttled\"}]\n    },\n    {\n      \"id\": 12, \"type\": \"timeseries\", \"title\": \"Inputs paused (storage over limit)\", \"description\": \"fluentbit_input_storage_overlimit = 1 means pause_on_chunks_overlimit has paused that input.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 8, \"y\": 21},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"max\": 1, \"custom\": {\"lineWidth\": 2, \"fillOpacity\": 20, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (name) (fluentbit_input_storage_overlimit) \u003e 0\", \"legendFormat\": \"{{name}}\"}]\n    },\n    {\n      \"id\": 13, \"type\": \"timeseries\", \"title\": \"Input memory buffers\", \"description\": \"fluentbit_input_storage_memory_bytes per input (bounded by Mem_Buf_Limit).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 16, \"y\": 21},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"bytes\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (name) (fluentbit_input_storage_memory_bytes)\", \"legendFormat\": \"{{name}}\"}]\n    },\n    {\"id\": 14, \"type\": \"row\", \"title\": \"Aggregation: Fluentd\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 29}, \"panels\": []},\n    {\n      \"id\": 15, \"type\": \"stat\", \"title\": \"Fluentd scrape\", \"description\": \"up{job=\\\"fluentd\\\"} per node (active-active: one node down is tolerated).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 8, \"x\": 0, \"y\": 30},\n      \"fieldConfig\": {\"defaults\": {\"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"DOWN\", \"color\": \"red\", \"index\": 0}, \"1\": {\"text\": \"UP\", \"color\": \"green\", \"index\": 1}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"green\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"value_and_name\", \"justifyMode\": \"center\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"up{job=\\\"fluentd\\\"}\", \"legendFormat\": \"{{node}}\", \"instant\": true}]\n    },\n    {\n      \"id\": 16, \"type\": \"stat\", \"title\": \"Records emitted to OpenSearch\", \"description\": \"rate of fluentd_output_status_emit_records over the opensearch* outputs.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 8, \"x\": 8, \"y\": 30},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"decimals\": 1, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"blue\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"value\", \"graphMode\": \"area\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(rate(fluentd_output_status_emit_records{plugin_id=~\\\"opensearch.*\\\",node=~\\\"$node\\\"}[$__rate_interval]))\"}]\n    },\n    {\n      \"id\": 17, \"type\": \"stat\", \"title\": \"Dead-letter + unrouted events (1h)\", \"description\": \"cs3_pipeline_error_events_total + cs3_pipeline_unrouted_events_total (files under /var/log/fluentd/dead-letter).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 8, \"x\": 16, \"y\": 30},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"orange\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"(sum(increase(cs3_pipeline_error_events_total{node=~\\\"$node\\\"}[1h])) or vector(0)) + (sum(increase(cs3_pipeline_unrouted_events_total{node=~\\\"$node\\\"}[1h])) or vector(0))\", \"instant\": true}]\n    },\n    {\n      \"id\": 18, \"type\": \"timeseries\", \"title\": \"Emitted records/s by output\", \"description\": \"Per sink: OpenSearch families, gateway /triage, feedback webhook, Errow cloud, ESOC and SIEM legs.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 34},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (plugin_id) (rate(fluentd_output_status_emit_records{plugin_id=~\\\"opensearch.*|http-.*|esoc-otlp|siem-ndjson\\\",node=~\\\"$node\\\"}[$__rate_interval]))\", \"legendFormat\": \"{{plugin_id}}\"}]\n    },\n    {\n      \"id\": 19, \"type\": \"timeseries\", \"title\": \"Buffer queue length\", \"description\": \"fluentd_output_status_buffer_queue_length (alert above 50 for 10 min).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 34},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (node, plugin_id) (fluentd_output_status_buffer_queue_length{plugin_id=~\\\"opensearch.*|http-.*|esoc-otlp|siem-ndjson\\\",node=~\\\"$node\\\"})\", \"legendFormat\": \"{{node}} {{plugin_id}}\"}]\n    },\n    {\n      \"id\": 20, \"type\": \"timeseries\", \"title\": \"Buffer size on disk\", \"description\": \"fluentd_output_status_buffer_total_bytes: file buffers survive restarts.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 42},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"bytes\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (node, plugin_id) (fluentd_output_status_buffer_total_bytes{plugin_id=~\\\"opensearch.*|http-.*|esoc-otlp|siem-ndjson\\\",node=~\\\"$node\\\"})\", \"legendFormat\": \"{{node}} {{plugin_id}}\"}]\n    },\n    {\n      \"id\": 21, \"type\": \"timeseries\", \"title\": \"Buffer space left\", \"description\": \"fluentd_output_status_buffer_available_space_ratio (percent; alert below 20%).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 8, \"y\": 42},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"percent\", \"min\": 0, \"max\": 100, \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\", \"thresholdsStyle\": {\"mode\": \"line\"}}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"transparent\", \"value\": 20}]}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"asc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"min by (node, plugin_id) (fluentd_output_status_buffer_available_space_ratio{plugin_id=~\\\"opensearch.*|http-.*|esoc-otlp|siem-ndjson\\\",node=~\\\"$node\\\"})\", \"legendFormat\": \"{{node}} {{plugin_id}}\"}]\n    },\n    {\n      \"id\": 22, \"type\": \"timeseries\", \"title\": \"Retry state and flush errors\", \"description\": \"retry_count (current backoff step) and errors per 5 minutes.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 16, \"y\": 42},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [\n        {\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (node, plugin_id) (fluentd_output_status_retry_count{plugin_id=~\\\"opensearch.*|http-.*|esoc-otlp|siem-ndjson\\\",node=~\\\"$node\\\"}) \u003e 0\", \"legendFormat\": \"retry {{node}} {{plugin_id}}\"},\n        {\"refId\": \"B\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (node, plugin_id) (increase(fluentd_output_status_num_errors{plugin_id=~\\\"opensearch.*|http-.*|esoc-otlp|siem-ndjson\\\",node=~\\\"$node\\\"}[5m])) \u003e 0\", \"legendFormat\": \"errors {{node}} {{plugin_id}}\"}\n      ]\n    },\n    {\n      \"id\": 23, \"type\": \"timeseries\", \"title\": \"Dead-letter and unrouted events\", \"description\": \"Events parked locally: plugin errors by tag, and tags no route accepts.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 50},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 20, \"showPoints\": \"never\", \"drawStyle\": \"bars\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"sum\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [\n        {\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (tag) (increase(cs3_pipeline_error_events_total{node=~\\\"$node\\\"}[$__rate_interval])) \u003e 0\", \"legendFormat\": \"error {{tag}}\"},\n        {\"refId\": \"B\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (tag) (increase(cs3_pipeline_unrouted_events_total{node=~\\\"$node\\\"}[$__rate_interval])) \u003e 0\", \"legendFormat\": \"unrouted {{tag}}\"}\n      ]\n    },\n    {\n      \"id\": 24, \"type\": \"table\", \"title\": \"Firing alerts\", \"description\": \"ALERTS{alertstate=\\\"firing\\\"} from Prometheus (rules in prometheus/alerts.yml).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 50},\n      \"fieldConfig\": {\"defaults\": {\"custom\": {\"align\": \"auto\"}}, \"overrides\": [{\"matcher\": {\"id\": \"byName\", \"options\": \"severity\"}, \"properties\": [{\"id\": \"mappings\", \"value\": [{\"type\": \"value\", \"options\": {\"critical\": {\"color\": \"red\", \"index\": 0}, \"warning\": {\"color\": \"orange\", \"index\": 1}, \"info\": {\"color\": \"blue\", \"index\": 2}}}]}, {\"id\": \"custom.cellOptions\", \"value\": {\"type\": \"color-text\"}}]}]},\n      \"options\": {\"showHeader\": true, \"cellHeight\": \"sm\", \"footer\": {\"show\": false}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"ALERTS{alertstate=\\\"firing\\\"}\", \"format\": \"table\", \"instant\": true}],\n      \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"Time\": true, \"Value\": true, \"__name__\": true, \"alertstate\": true, \"stack\": true}, \"indexByName\": {\"severity\": 0, \"alertname\": 1, \"component\": 2}, \"renameByName\": {}}}]\n    }\n  ]\n}\n"
  "vendetta-overview.json": "{\n  \"uid\": \"cs3-vendetta-overview\",\n  \"title\": \"Vendetta Stack / Vendetta XDR overview\",\n  \"description\": \"Detections flowing through the pipeline (Prometheus: cs3_pipeline_vendetta_alerts_total, cs3_sp_vendetta_*) and what is stored in OpenSearch vendetta-alerts-* (severity, agents, MITRE, AI verdicts).\",\n  \"tags\": [\"vendetta-stack\", \"vendetta\", \"xdr\", \"siem\"],\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": false,\n  \"graphTooltip\": 1,\n  \"refresh\": \"1m\",\n  \"timezone\": \"utc\",\n  \"time\": {\"from\": \"now-24h\", \"to\": \"now\"},\n  \"annotations\": {\"list\": []},\n  \"links\": [\n    {\"title\": \"Pipeline health\", \"type\": \"link\", \"url\": \"/d/cs3-pipeline-health\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"Errow offense\", \"type\": \"link\", \"url\": \"/d/cs3-errow-offense\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"LLM SLO\", \"type\": \"link\", \"url\": \"/d/cs3-llm-slo\", \"icon\": \"dashboard\", \"targetBlank\": false}\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"severity\", \"label\": \"Severity\", \"type\": \"custom\", \"multi\": true, \"includeAll\": true,\n        \"query\": \"critical,high,medium,low,info\",\n        \"options\": [\n          {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"},\n          {\"selected\": false, \"text\": \"critical\", \"value\": \"critical\"},\n          {\"selected\": false, \"text\": \"high\", \"value\": \"high\"},\n          {\"selected\": false, \"text\": \"medium\", \"value\": \"medium\"},\n          {\"selected\": false, \"text\": \"low\", \"value\": \"low\"},\n          {\"selected\": false, \"text\": \"info\", \"value\": \"info\"}\n        ],\n        \"current\": {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"}\n      }\n    ]\n  },\n  \"panels\": [\n    {\"id\": 1, \"type\": \"row\", \"title\": \"Pipeline view (Prometheus)\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0}, \"panels\": []},\n    {\n      \"id\": 2, \"type\": \"stat\", \"title\": \"Alerts / min\", \"description\": \"rate of cs3_pipeline_vendetta_alerts_total across every Fluentd node.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 0, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 1, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"blue\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"value\", \"graphMode\": \"area\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(rate(cs3_pipeline_vendetta_alerts_total[$__rate_interval])) * 60\"}]\n    },\n    {\n      \"id\": 3, \"type\": \"stat\", \"title\": \"High + critical (1h)\", \"description\": \"Alerts with severity high or critical seen by Fluentd in the last hour.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 6, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"orange\", \"value\": 1}, {\"color\": \"red\", \"value\": 10}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(increase(cs3_pipeline_vendetta_alerts_total{severity=~\\\"high|critical\\\"}[1h])) or vector(0)\", \"instant\": true}]\n    },\n    {\n      \"id\": 4, \"type\": \"gauge\", \"title\": \"Max rule level (60 s window)\", \"description\": \"cs3_sp_vendetta_max_rule_level_60s from the Fluent Bit stream processor (Vendetta levels 0-15).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 12, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"max\": 15, \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"yellow\", \"value\": 7}, {\"color\": \"orange\", \"value\": 10}, {\"color\": \"red\", \"value\": 13}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"showThresholdMarkers\": true, \"showThresholdLabels\": false},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max(cs3_sp_vendetta_max_rule_level_60s)\"}]\n    },\n    {\n      \"id\": 5, \"type\": \"stat\", \"title\": \"Alerts in last 60 s (edge)\", \"description\": \"cs3_sp_vendetta_alerts_60s: stream-processor tumbling-window count at the edge collectors.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 18, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"blue\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"value\", \"graphMode\": \"area\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(cs3_sp_vendetta_alerts_60s)\"}]\n    },\n    {\n      \"id\": 6, \"type\": \"timeseries\", \"title\": \"Alerts/s by severity\", \"description\": \"Severity is derived from rule.level (0-3 info, 4-6 low, 7-9 medium, 10-12 high, 13-15 critical).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 5},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 25, \"showPoints\": \"never\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": [\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"critical\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"dark-red\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"high\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"orange\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"medium\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"yellow\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"low\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"blue\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"info\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"green\"}}]}\n      ]},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"sum\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (severity) (rate(cs3_pipeline_vendetta_alerts_total{severity=~\\\"$severity\\\"}[$__rate_interval]))\", \"legendFormat\": \"{{severity}}\"}]\n    },\n    {\n      \"id\": 7, \"type\": \"timeseries\", \"title\": \"Alerts/s by stream\", \"description\": \"vendetta.alerts, vendetta.fim, vendetta.vulnerability, vendetta.sca (classify_vendetta in stream_processors.lua).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 5},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 25, \"showPoints\": \"never\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"sum\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (stream) (rate(cs3_pipeline_vendetta_alerts_total{severity=~\\\"$severity\\\"}[$__rate_interval]))\", \"legendFormat\": \"{{stream}}\"}]\n    },\n    {\n      \"id\": 8, \"type\": \"timeseries\", \"title\": \"Edge window: alerts by rule level\", \"description\": \"cs3_sp_vendetta_alerts_by_level_60s{rule_level}: 60-second tumbling counts from the Fluent Bit stream processor.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 13},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 25, \"showPoints\": \"never\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (rule_level) (cs3_sp_vendetta_alerts_by_level_60s)\", \"legendFormat\": \"level {{rule_level}}\"}]\n    },\n    {\n      \"id\": 9, \"type\": \"timeseries\", \"title\": \"Edge window: alerts and max level per collector\", \"description\": \"One series per Fluent Bit edge_node.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 13},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": [{\"matcher\": {\"id\": \"byRegexp\", \"options\": \"max level .*\"}, \"properties\": [{\"id\": \"custom.axisPlacement\", \"value\": \"right\"}, {\"id\": \"custom.lineStyle\", \"value\": {\"fill\": \"dash\", \"dash\": [10, 10]}}, {\"id\": \"max\", \"value\": 15}]}]},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [\n        {\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (edge_node) (cs3_sp_vendetta_alerts_60s)\", \"legendFormat\": \"alerts {{edge_node}}\"},\n        {\"refId\": \"B\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (edge_node) (cs3_sp_vendetta_max_rule_level_60s)\", \"legendFormat\": \"max level {{edge_node}}\"}\n      ]\n    },\n    {\"id\": 10, \"type\": \"row\", \"title\": \"Stored detections (OpenSearch vendetta-alerts-*)\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 21}, \"panels\": []},\n    {\n      \"id\": 11, \"type\": \"timeseries\", \"title\": \"Alerts over time by severity\", \"description\": \"Document count in vendetta-alerts-*, split by severity.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": 22},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 40, \"showPoints\": \"never\", \"drawStyle\": \"bars\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": [\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"critical\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"dark-red\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"high\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"orange\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"medium\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"yellow\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"low\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"blue\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"info\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"green\"}}]}\n      ]},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"severity:$severity\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [\n          {\"id\": \"2\", \"type\": \"terms\", \"field\": \"severity\", \"settings\": {\"size\": \"5\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}},\n          {\"id\": \"3\", \"type\": \"date_histogram\", \"field\": \"@timestamp\", \"settings\": {\"interval\": \"auto\", \"min_doc_count\": \"0\", \"trimEdges\": \"0\"}}\n        ]\n      }]\n    },\n    {\n      \"id\": 12, \"type\": \"bargauge\", \"title\": \"Top agents\", \"description\": \"agent.name with the most alerts in the selected range.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 30},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"blue\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"orientation\": \"horizontal\", \"displayMode\": \"gradient\", \"showUnfilled\": true},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"severity:$severity\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"agent.name\", \"settings\": {\"size\": \"10\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 13, \"type\": \"bargauge\", \"title\": \"Top MITRE ATT\u0026CK techniques\", \"description\": \"mitre.id (set by mitre_enrich at the edge, by the gateway for AI-enriched alerts, and by the SARIF mapping for Errow findings).\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 8, \"y\": 30},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"purple\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"orientation\": \"horizontal\", \"displayMode\": \"gradient\", \"showUnfilled\": true},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"severity:$severity AND _exists_:mitre.id\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"mitre.id\", \"settings\": {\"size\": \"10\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 14, \"type\": \"bargauge\", \"title\": \"Top rules\", \"description\": \"rule.id with the most alerts.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 16, \"y\": 30},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"orange\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"orientation\": \"horizontal\", \"displayMode\": \"gradient\", \"showUnfilled\": true},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"severity:$severity\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"rule.id\", \"settings\": {\"size\": \"10\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 15, \"type\": \"piechart\", \"title\": \"Source stream\", \"description\": \"source.stream: vendetta.alerts, vendetta.fim, vendetta.vulnerability, vendetta.sca, errow.findings, cs3.ai.enrichment.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 38},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"pieType\": \"donut\", \"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"values\": [\"value\"]}, \"tooltip\": {\"mode\": \"single\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"severity:$severity\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"source.stream\", \"settings\": {\"size\": \"10\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 16, \"type\": \"piechart\", \"title\": \"AI verdict\", \"description\": \"ai.verdict written by the sovereign LLM gateway (cs3.ai.enrichment upserts).\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 8, \"y\": 38},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"pieType\": \"donut\", \"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"values\": [\"value\"]}, \"tooltip\": {\"mode\": \"single\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"_exists_:ai.verdict\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"ai.verdict\", \"settings\": {\"size\": \"10\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 17, \"type\": \"piechart\", \"title\": \"AI engine (fallback tiers)\", \"description\": \"ai.engine: the model tag that produced the analysis, or Cecur Heuristics when both LLM tiers failed over.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 16, \"y\": 38},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"pieType\": \"donut\", \"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"values\": [\"value\"]}, \"tooltip\": {\"mode\": \"single\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"_exists_:ai.engine\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"ai.engine\", \"settings\": {\"size\": \"10\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 18, \"type\": \"table\", \"title\": \"Latest high and critical alerts\", \"description\": \"Newest 50 documents with severity high or critical.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"},\n      \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 46},\n      \"fieldConfig\": {\"defaults\": {\"custom\": {\"align\": \"auto\"}}, \"overrides\": [{\"matcher\": {\"id\": \"byName\", \"options\": \"severity\"}, \"properties\": [{\"id\": \"mappings\", \"value\": [{\"type\": \"value\", \"options\": {\"critical\": {\"color\": \"dark-red\", \"index\": 0}, \"high\": {\"color\": \"orange\", \"index\": 1}}}]}, {\"id\": \"custom.cellOptions\", \"value\": {\"type\": \"color-text\"}}]}]},\n      \"options\": {\"showHeader\": true, \"cellHeight\": \"sm\", \"footer\": {\"show\": false}, \"sortBy\": [{\"displayName\": \"@timestamp\", \"desc\": true}]},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-vendetta-alerts\"}, \"timeField\": \"@timestamp\", \"query\": \"severity:(critical OR high)\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"raw_data\", \"settings\": {\"size\": \"50\"}}],\n        \"bucketAggs\": []\n      }],\n      \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"_id\": true, \"_index\": true, \"_type\": true, \"highlight\": true, \"sort\": true, \"full_log\": true, \"ai.needs_verification\": true}, \"indexByName\": {\"@timestamp\": 0, \"severity\": 1, \"rule.id\": 2, \"rule.level\": 3, \"agent.name\": 4, \"mitre.id\": 5, \"source.stream\": 6, \"ai.verdict\": 7}, \"renameByName\": {}}}]\n    }\n  ]\n}\n"

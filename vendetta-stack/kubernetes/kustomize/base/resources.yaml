apiVersion: v1
kind: ConfigMap
metadata:
  name: feedback-approvals
  labels:
    app.kubernetes.io/name: vendetta-stack
    app.kubernetes.io/instance: vendetta-stack
    app.kubernetes.io/component: errow-feedback
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: vendetta-stack-1.0.0
data:
  APPROVALS.md: "# Errow feedback-loop approval ledger\n\nTraces: CONTRACT §6 (G9 offensive safety), `errow-to-vendetta.sh`, `approval.py`.\n\n`errow-to-vendetta.sh` acts on Vendetta (host isolation, SOAR ticket, retest request) only when **both** gates are open:\n\n1. `ERROW_FEEDBACK_LIVE=true` in the environment of the process running the script, and\n2. a **signed, unexpired approval line** for the finding's fingerprint exists in this file.\n\nWithout either gate the script prints `DRY-RUN: would ...` lines and changes nothing. The ledger ships **empty**: this\nrepository contains no real approvals, and lines shown inside code fences below are ignored by the verifier.\n\nThis ledger is the **only** approval path to the manager. Both live active-response legs check it through the same verifier\n(`approval.py`, driven by `action_gate.py`):\n\n| Leg | Caller | Verifier |\n|---|---|---|\n| Errow finding -\u003e `errow-to-vendetta.sh` -\u003e `PUT /active-response` | errow-feedback webhook, `POST /errow-finding` | `approval.py verify` in-process |\n| Vendetta alert (Fluentd `@VENDETTA_EXECD`) -\u003e `POST /approved-action` | Fluentd, delivered to errow-feedback | `action_gate.Gate`, which shells out to `approval.py verify` |\n\nThe Fluentd leg used to call the manager directly and never consulted this file; it now has no credential of its own and cannot\nact unless the gate approves. Both legs additionally require the agent to match `VENDETTA_EXECD_AGENT_REGEX` (the manager\n`000` is always refused).\n\n## Line format\n\nOne approval per line, starting in column 0 (outside code fences):\n\n```\nAPPROVAL fingerprint=\u003c64 hex\u003e approver=\u003cid\u003e expires=\u003cYYYY-MM-DDTHH:MM:SSZ\u003e sig=\u003c64 hex\u003e\n```\n\n| Field | Rule |\n|---|---|\n| `fingerprint` | the SARIF `partialFingerprints.primaryLocationLineHash` of the finding (`errow.fingerprint` in the alert); 64 lowercase hex |\n| `approver` | `[A-Za-z0-9._@-]{1,64}`; optionally restricted with `ERROW_FEEDBACK_APPROVERS=alice,bob` |\n| `expires` | ISO-8601 UTC with the literal `Z`, to the second; must be in the future and at most `ERROW_FEEDBACK_APPROVAL_MAX_DAYS` (default 30) ahead |\n| `sig` | lowercase hex `HMAC-SHA256(key, \"errow-feedback-approval-v1\\nfingerprint=\u003cfp\u003e\\napprover=\u003cid\u003e\\nexpires=\u003ciso\u003e\")` |\n\n`key` is the approver's own key file, `$ERROW_FEEDBACK_APPROVAL_KEYS_DIR/\u003capprover\u003e.key` (default directory:\n`\u003capproval-dir\u003e/keys`, mounted at `/run/approval/keys`), at least 32 characters, mode 0600. Authority is per approver: a\nline is only valid if `sig` verifies with **that approver's** key, so one person's key cannot sign for another.\n\n## Approver keys, thresholds and custody\n\n```\numask 077\npython3 errow/feedback-loop/approval.py keygen --approver alice     # writes keys/alice.key, 0600, 64 hex\n```\n\n- **Threshold.** `ERROW_FEEDBACK_APPROVAL_THRESHOLD` distinct approvers (default **2** = dual control) must have signed\n  the same fingerprint before either leg acts. One line from one approver is not enough.\n- **Custody follows the approver.** Generate the key on the approver's own workstation, sign there, and append only the\n  resulting *line* to this file. The key is then copied once to the host directory that is mounted read-only into\n  `errow-feedback` — verification needs the key material, but no one else ever needs write access to it. One approver\n  holding a copy of another's key file collapses the separation again.\n- **Rotation.** `keygen` refuses to overwrite an existing key without `--force`; after a rotation, re-sign the still-open\n  fingerprints with the new key and revoke the old one. A key rotation invalidates every line that approver signed.\n- **Shared key fallback.** The single shared key `ERROW_FEEDBACK_APPROVAL_KEY_FILE` still works and still counts as one\n  authority, but it clamps the effective threshold to the number of authorities present. A deployment with only the\n  shared key therefore runs at threshold 1 — no dual control — and `scripts/bootstrap.sh --check` warns about exactly\n  that. Give every approver a key and keep the shared key only as a break-glass signer.\n- **Mode.** Keys and the containing directories are checked for loose modes (`bootstrap.sh --check` fails on a key looser\n  than 0600). Mounts are read-only, so a loose *host* mode is the thing to fix.\n\nIf a key is missing, too short, or unreadable, every live action is denied (fail closed).\n\n## Signing and verifying\n\n```\n# print a line valid for 4 hours (max 168) and append it after review\npython3 errow/feedback-loop/approval.py sign --fingerprint \u003cfp\u003e --approver alice --ttl-hours 4 \\\n  --keys-dir secrets/approval/keys \u003e\u003e errow/feedback-loop/APPROVALS.md\n\n# check what the script will decide (exit 0 approved, 1 not approved/threshold unmet, 2 configuration error)\npython3 errow/feedback-loop/approval.py verify --fingerprint \u003cfp\u003e --file errow/feedback-loop/APPROVALS.md \\\n  --keys-dir secrets/approval/keys\n```\n\nUse `--expires 2026-12-01T00:00:00Z` instead of `--ttl-hours` for an explicit expiry. An approval covers all three\nactions for that one fingerprint; it does not cover other findings, other hosts, or hosts outside\n`ERROW_FEEDBACK_ALLOWED_TARGETS`.\n\n## Operations\n\n- Mount this file at `/opt/feedback-loop/APPROVALS.md` read-only (compose bind mount / K8s ConfigMap or Secret). Override the\n  location with `ERROW_FEEDBACK_APPROVALS_FILE`.\n- Expired and malformed lines are ignored; prune them during review. Every decision is logged to\n  `/var/log/feedback-loop/feedback.log` (`DENIED fingerprint=... reason=...` or `LIVE: ...`).\n- Approving a finding's `partialFingerprints.primaryLocationLineHash` covers **both** legs: the Errow webhook and the Fluentd\n  execd leg carry the same value (`errow.fingerprint` in the derived alert), so one line authorises at most one action per leg.\n- Revoke early by deleting the line (or rotating the key, which invalidates all lines at once).\n- Each executed action leaves a marker in `$FEEDBACK_DIR/state/`, so repeating an approved run never repeats the action.\n- Kubernetes: the approval Secret is mounted at `/run/approval` (`defaultMode 0440`), so add each key as a Secret key\n  named `keys/\u003capprover\u003e.key` and set `ERROW_FEEDBACK_APPROVAL_THRESHOLD` (chart value `config.approvalThreshold`). The\n  CA there is cert-manager's `/pki/ca.crt`, so no pin runs are needed; in compose, pin the manager certificate instead\n  (`scripts/pin-manager-cert.sh`) and point `VENDETTA_API_CA_FILE` at the bundle. Without a usable bundle the gate\n  refuses every live action with `503`.\n"
---
# Source: vendetta-stack/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vendetta-manager-integration
  labels:
    app.kubernetes.io/name: vendetta-stack
    app.kubernetes.io/instance: vendetta-stack
    app.kubernetes.io/component: vendetta-manager
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: vendetta-stack-1.0.0
data:
  "05-cs3-manager-integration.sh": "#!/usr/bin/with-contenv bash\n# 05-cs3-manager-integration.sh — s6 cont-init stage (mounted at /etc/cont-init.d/) that wires the manager into CS3.\n#\n# It has to be a cont-init stage, not an entrypoint wrapper: wazuh/wazuh-manager installs /var/ossec from its permanent\n# data in stage 0-wazuh-init, so a wrapper running before /init finds no ossec.conf to patch and its work would be\n# overwritten by the init copy. cont-init stages run in lexical order after 0-wazuh-init and before any service starts, so\n# the patched configuration is in place when wazuh-analysisd reads it.\n#\n# 1. Installs the CS3 decoders/rules into /var/ossec (the mount is read-only, so they are copied). The two files go to\n#    different trees on purpose, see the block below.\n# 2. Either splices the syslog receiver into ossec.conf (default) or swaps in a full template.\n# 3. Owns the CTI / vulnerability feed settings so a deployment without egress does not log a content-updater error forever.\n#\n# CS3_MANAGER_CONF_TEMPLATE is the override: point it at a complete ossec.conf and the splice is skipped entirely. Use it\n# when the deployment owns its own manager configuration (config management, cluster join, extra remotes) and a patch\n# would be the wrong shape.\n#\n# CS3_MANAGER_STRICT=true turns a failed patch into a fatal error; the default only warns, because the manager still\n# reports agents without the receiver.\nset -euo pipefail\n\nHERE=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\"\n# The stage is mounted under /etc/cont-init.d while its files live in the read-only integration mount.\nDIR=\"${CS3_MANAGER_INTEGRATION_DIR:-/manager-integration}\"\n[[ -d \"$DIR\" ]] || DIR=\"$HERE\"\nlog() { printf '[manager-integration] %s\\n' \"$*\" \u003e\u00262; }\n\n[[ -d /var/ossec/etc ]] || {\n  log \"ERROR: /var/ossec/etc is missing; this script must run as a cont-init stage\"\n  exit 1\n}\n\n# The wazuh image owns everything as wazuh:wazuh (999) and has no 'ossec' group; take whatever /var/ossec/etc already uses\n# so analysisd can read what we install.\nGROUP=\"$(stat -c '%G' /var/ossec/etc)\"\ninstall -d -o root -g \"$GROUP\" -m 0750 /var/ossec/etc/decoders\nif [[ -n \"${CS3_MANAGER_RULES_DIR:-}\" || -f \"$DIR/cs3-rules.xml\" ]]; then\n  src=\"${CS3_MANAGER_RULES_DIR:-$DIR}\"\n  # Decoders: /var/ossec/etc/decoders/0001-*, the 0001- prefix is load-bearing, not cosmetic. Decoders are tried in\n  # lexical file order and the stock ruleset ships broad `sshd`/`sudo`/`audit` decoders; without the prefix ours load\n  # after them, the stock decoder claims the line, and the narrow CS3 decoders (the ones that supply srcuser/dstuser/\n  # srcip) never run.\n  #\n  # Rules: /var/ossec/ruleset/rules/9999-*, a different tree, for two reasons. analysisd resolves the stock parent IDs the\n  # CS3 rules hang off (5700, 5400, 80700, 40700, 5100) at load time, so the file has to load after those parents exist;\n  # /var/ossec/etc/rules/ loads before the entire stock ruleset and every parent there is \"not found\". And `9999-` puts\n  # the block last among the ruleset files, which is what keeps a future stock file from being shadowed by a same-named\n  # CS3 rule.\n  for pair in \"cs3-rules.xml:ruleset/rules:9999-cs3-rules.xml\" \"cs3-decoder.xml:etc/decoders:0001-cs3-decoder.xml\"; do\n    file=\"${pair%%:*}\"\n    rest=\"${pair#*:}\"\n    dest=\"${rest%%:*}\"\n    name=\"${rest##*:}\"\n    [[ -f \"$src/$file\" ]] || {\n      log \"ERROR: $src/$file not found\"\n      exit 1\n    }\n    install -d -o root -g \"$GROUP\" -m 0750 \"/var/ossec/$dest\"\n    install -o root -g \"$GROUP\" -m 0640 \"$src/$file\" \"/var/ossec/$dest/$name\"\n  done\n  log \"installed CS3 decoders and rules\"\nfi\n\nif [[ -n \"${CS3_MANAGER_CONF_TEMPLATE:-}\" ]]; then\n  [[ -r \"$CS3_MANAGER_CONF_TEMPLATE\" ]] || {\n    log \"ERROR: CS3_MANAGER_CONF_TEMPLATE=$CS3_MANAGER_CONF_TEMPLATE not readable\"\n    exit 1\n  }\n  if grep -q '\u003cconnection\u003esyslog\u003c/connection\u003e' \"$CS3_MANAGER_CONF_TEMPLATE\" \u0026\u0026 grep -q 'cs3:manager-integration' \"$CS3_MANAGER_CONF_TEMPLATE\"; then\n    install -o root -g \"$GROUP\" -m 0640 \"$CS3_MANAGER_CONF_TEMPLATE\" /var/ossec/etc/ossec.conf\n    log \"ossec.conf replaced from full template (splice skipped)\"\n  else\n    log \"WARN: template has no CS3 syslog receiver; host logs will not pass the rule engine\"\n    install -o root -g \"$GROUP\" -m 0640 \"$CS3_MANAGER_CONF_TEMPLATE\" /var/ossec/etc/ossec.conf\n  fi\nelif ! \"$DIR/patch-ossec-conf.sh\"; then\n  # The manager stays usable without the receiver (agents keep reporting), so a failed patch is a warning by default.\n  # CS3_MANAGER_STRICT=true aborts instead, for deployments where host logs bypassing the rule engine is a defect.\n  if [[ \"${CS3_MANAGER_STRICT:-false}\" == \"true\" ]]; then\n    log \"ERROR: ossec.conf patch failed and CS3_MANAGER_STRICT=true\"\n    exit 1\n  fi\n  log \"WARN: ossec.conf patch failed; host logs will reach CS3 as plain log lines, not manager alerts\"\nfi\n\n# 3. CTI / vulnerability feed settings. The stock image enables the content updater against cti.wazuh.com; without egress\n#    that fails every interval and fills ossec.log with ERROR. configure-feeds.sh can disable it (off) or point it at an\n#    internal mirror, and warns when it is left enabled with no mirror.\nif [[ -f \"$DIR/configure-feeds.sh\" ]]; then\n  if ! bash \"$DIR/configure-feeds.sh\"; then\n    log \"ERROR: configure-feeds.sh failed\"\n    [[ \"${CS3_MANAGER_STRICT:-false}\" == \"true\" ]] \u0026\u0026 exit 1\n    log \"WARN: continuing with the vendor feed settings\"\n  fi\nelse\n  log \"WARN: $DIR/configure-feeds.sh not found; the CTI feed settings are left as the image ships them\"\nfi\n"
  "configure-feeds.sh": "#!/bin/bash\n# configure-feeds.sh — own the manager's CTI / vulnerability-feed settings.\n#\n# Why this exists: the stock manager image ships\n#   \u003cvulnerability-detection\u003e\u003cenabled\u003eyes\u003c/enabled\u003e\u003cfeed-update-interval\u003e60m\u003c/feed-update-interval\u003e\u003c/vulnerability-detection\u003e\n# so wazuh-modulesd's content updater resolves cti.wazuh.com on every interval. A deployment without egress (the usual CS3\n# case: loopback-bound ports, air-gapped enclave) fails that fetch forever and logs\n#   wazuh-modulesd:content-updater: ERROR: Action for 'vulnerability_feed_manager' failed: ... Couldn't resolve host name\n# every interval. That is configuration, not an environment fault to live with: `enabled`, `cti-url` and\n# `feed-update-interval` are all supported keys (they are in the wazuh-modulesd binary).\n#\n# CS3_MANAGER_FEED_MODE:\n#   auto   (default) leave the block alone; log what will happen so the operator can decide\n#   off              \u003cenabled\u003eno\u003c/enabled\u003e — the updater never fetches, and the error disappears\n#   mirror           keep it enabled and point \u003ccti-url\u003e at CS3_MANAGER_CTI_URL (an internal mirror)\n# CS3_MANAGER_CTI_URL: required by `mirror`, honoured by `auto` when set.\n#\n# Idempotent: the block is set to a fixed state, so a second run is byte-identical. Exits non-zero only when it cannot do\n# what it was asked and CS3_MANAGER_STRICT=true; otherwise it warns, because a manager that still analyses logs is more\n# useful than one that refuses to boot over a feed setting.\nset -uo pipefail\n\nCONF=${CS3_MANAGER_CONF:-/var/ossec/etc/ossec.conf}\nMODE=${CS3_MANAGER_FEED_MODE:-auto}\nCTI_URL=${CS3_MANAGER_CTI_URL:-}\nSTRICT=${CS3_MANAGER_STRICT:-false}\nMODULESD=/var/ossec/bin/wazuh-modulesd\n\nlog() { printf '[manager-integration] %s\\n' \"$*\" \u003e\u00262; }\nfail() {\n  log \"ERROR: $*\"\n  [[ \"$STRICT\" == \"true\" ]] \u0026\u0026 exit 1\n  log \"WARN: continuing with the feed settings untouched (CS3_MANAGER_STRICT=$STRICT)\"\n  exit 0\n}\n\n[[ -f \"$CONF\" ]] || fail \"$CONF not found\"\n\n# 'mirror' without a URL is a configuration bug, not something to guess at.\nif [[ \"$MODE\" == \"mirror\" ]]; then\n  [[ -n \"$CTI_URL\" ]] || fail \"CS3_MANAGER_FEED_MODE=mirror needs CS3_MANAGER_CTI_URL\"\nelif [[ \"$MODE\" == \"auto\" \u0026\u0026 -n \"$CTI_URL\" ]]; then\n  MODE=mirror\nfi\n\ncase \"$MODE\" in\n  auto | off | mirror) ;;\n  *) fail \"CS3_MANAGER_FEED_MODE='$MODE' is not one of auto|off|mirror\" ;;\nesac\n\nhave_block() { grep -q '\u003cvulnerability-detection\u003e' \"$CONF\"; }\n\nif ! have_block; then\n  # A full CS3_MANAGER_CONF_TEMPLATE may simply not carry the block; there is then nothing to fetch and nothing to set.\n  [[ \"$MODE\" == \"off\" ]] \u0026\u0026 log \"no \u003cvulnerability-detection\u003e block; the feed updater is not configured, nothing to disable\"\n  [[ \"$MODE\" != \"off\" ]] \u0026\u0026 log \"WARN: no \u003cvulnerability-detection\u003e block; cannot set feed mode '$MODE'\"\n  exit 0\nfi\n\n# Portable extraction (BSD and GNU sed disagree about \\| in a BRE): field 2 between \u003c/?enabled\u003e is the value.\ncurrent=$(awk -F'\u003c/?enabled\u003e' '/\u003cvulnerability-detection\u003e/ { f = 1 } f \u0026\u0026 /\u003cenabled\u003e/ { print $2; exit }' \"$CONF\")\n\nif [[ \"$MODE\" == \"auto\" ]]; then\n  if [[ \"$current\" == \"yes\" ]]; then\n    log \"vulnerability feed updater is enabled and no mirror is configured: it fetches from cti.wazuh.com every 60m. Set CS3_MANAGER_FEED_MODE=off where there is no egress, or set CS3_MANAGER_CTI_URL to an internal mirror.\"\n  else\n    log \"vulnerability feed updater is disabled in $CONF; leaving it disabled\"\n  fi\n  exit 0\nfi\n\nwant_enabled=yes\n[[ \"$MODE\" == \"off\" ]] \u0026\u0026 want_enabled=no\n\ncp -a \"$CONF\" \"$CONF.feeds.bak\"\n# Rewrite only inside the block: set \u003cenabled\u003e, and for mirror mode set/replace \u003ccti-url\u003e. Outside the block the file is\n# copied byte for byte, so no other setting is touched.\ntmp=\"$CONF.feeds.new\"\nMODE=\"$MODE\" WANT=\"$want_enabled\" CTI_URL=\"$CTI_URL\" awk '\n  /\u003cvulnerability-detection\u003e/ { inblk = 1 }\n  inblk \u0026\u0026 /\u003cenabled\u003e/ {\n    match($0, /^[ \\t]*/); indent = substr($0, 1, RLENGTH)\n    print indent \"\u003cenabled\u003e\" ENVIRON[\"WANT\"] \"\u003c/enabled\u003e\"\n    seen_enabled = 1\n    next\n  }\n  inblk \u0026\u0026 /\u003c\\/vulnerability-detection\u003e/ {\n    # A block without \u003cenabled\u003e gets one inserted; mirror mode also inserts \u003ccti-url\u003e if the block never had it.\n    if (!seen_enabled) { match($0, /^[ \\t]*/); indent = substr($0, 1, RLENGTH); print indent \"\u003cenabled\u003e\" ENVIRON[\"WANT\"] \"\u003c/enabled\u003e\" }\n    if (ENVIRON[\"MODE\"] == \"mirror\" \u0026\u0026 !seen_url) { match($0, /^[ \\t]*/); print substr($0, 1, RLENGTH) \"  \u003ccti-url\u003e\" ENVIRON[\"CTI_URL\"] \"\u003c/cti-url\u003e\" }\n    inblk = 0\n  }\n  inblk \u0026\u0026 /\u003ccti-url\u003e/ {\n    match($0, /^[ \\t]*/); indent = substr($0, 1, RLENGTH)\n    if (ENVIRON[\"MODE\"] == \"mirror\") print indent \"\u003ccti-url\u003e\" ENVIRON[\"CTI_URL\"] \"\u003c/cti-url\u003e\"\n    seen_url = 1\n    next\n  }\n  { print }\n' \"$CONF\" \u003e\"$tmp\" || {\n  rm -f \"$tmp\"\n  fail \"cannot rewrite $CONF\"\n}\n\n# The rewrite is a no-op unless something actually differs; skip the swap (and the validation) when nothing changed.\n# Plain `cat` comparison rather than cmp/diff: neither is guaranteed in the manager image.\nif [[ \"$(cat \"$CONF\")\" == \"$(cat \"$tmp\")\" ]]; then\n  rm -f \"$tmp\" \"$CONF.feeds.bak\"\n  log \"feed mode $MODE already applied; nothing to do\"\n  exit 0\nfi\n\n# Written through a redirection, never with mv: replacing the file creates a new inode owned by whoever ran this script,\n# and wazuh-db does not run as that user -- it then reports (1226) Error reading XML file and the whole manager fails to\n# start. Redirection keeps the inode, so ossec.conf keeps the ownership and mode the image gave it.\nif [[ -x \"$MODULESD\" ]]; then\n  cat \"$tmp\" \u003e\"$CONF\" || fail \"cannot write $CONF\"\n  if ! \"$MODULESD\" -t \u003e/tmp/cs3-modulesd-test.log 2\u003e\u00261; then\n    cat \"$CONF.feeds.bak\" \u003e\"$CONF\"\n    cat /tmp/cs3-modulesd-test.log \u003e\u00262 || true\n    fail \"manager configuration did not validate; ossec.conf restored\"\n  fi\n  log \"configuration validated by wazuh-modulesd -t\"\nelse\n  cat \"$tmp\" \u003e\"$CONF\" || fail \"cannot write $CONF\"\n  log \"WARN: $MODULESD missing; skipping configuration validation\"\nfi\nrm -f \"$tmp\"\n\nlog \"vulnerability feed updater set to '$MODE' (backup: $CONF.feeds.bak)\"\n"
  "cs3-decoder.xml": "\u003c!--\ncs3-decoder.xml — decoders for the host-log streams CS3 routes into the manager (host.auth, host.audit,\nhost.endpoint, host.network). Rule IDs live in the reserved CS3 block 10120-10199 (cs3-rules.xml).\n\nInstalled by 05-cs3-manager-integration.sh as /var/ossec/etc/decoders/0001-cs3-decoder.xml — the numeric prefix is\nload order, not decoration. Wazuh compiles decoders in lexical file order and the stock ruleset ships broad\n`sshd`/`sudo`/`auditd` decoders; loaded after them, ours never matched and the stock rules alerted instead of the\nCS3 block. Do not drop the prefix.\n\nThese decoders are deliberately narrow. remoted has already stripped the PRI and split the RFC3164 header the fluent\nbit manager leg writes, so `program_name` is the discriminator and the payload is the part after `sshd[9]:`.\n\n`program_name` here is a literal or a `|` alternation, NOT a regex: `^.*$` never matches anything, `^sshd$` and\n`^sshd$|^sshd-session$` both do. Top-level decoders also cannot match on \u003cprematch\u003e alone — they need a\n`program_name`/`hostname` first stage and prematch on the child.\n--\u003e\n\n\u003cdecoder name=\"cs3-sshd\"\u003e\n  \u003cprogram_name\u003e^sshd$|^sshd-session$\u003c/program_name\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-sshd-failed\"\u003e\n  \u003cparent\u003ecs3-sshd\u003c/parent\u003e\n  \u003cprematch\u003eFailed password for|Failed publickey for|Invalid user \u003c/prematch\u003e\n  \u003cregex\u003e(\\S+) from (\\S+) port (\\d+)\u003c/regex\u003e\n  \u003corder\u003euser, srcip, srcport\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003c!-- prematch is a plain OS_Regex fragment here: groups in prematch fail to compile, so one decoder per method. --\u003e\n\u003cdecoder name=\"cs3-sshd-accepted\"\u003e\n  \u003cparent\u003ecs3-sshd\u003c/parent\u003e\n  \u003cprematch\u003eAccepted password for \u003c/prematch\u003e\n  \u003cregex\u003eAccepted password for (\\S+) from (\\S+) port (\\d+)\u003c/regex\u003e\n  \u003corder\u003euser, srcip, srcport\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-sshd-accepted-key\"\u003e\n  \u003cparent\u003ecs3-sshd\u003c/parent\u003e\n  \u003cprematch\u003eAccepted publickey for \u003c/prematch\u003e\n  \u003cregex\u003eAccepted publickey for (\\S+) from (\\S+) port (\\d+)\u003c/regex\u003e\n  \u003corder\u003euser, srcip, srcport\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-sudo\"\u003e\n  \u003cprogram_name\u003e^sudo$\u003c/program_name\u003e\n\u003c/decoder\u003e\n\n\u003c!-- Sequential extraction via `offset=after_regex`, the same idiom the stock sudo decoders use: a mid-pattern\n     wildcard swallows the rest of the line because OS_Regex has no backtracking. In OS_Regex the \"any character\"\n     wildcard is \\. — a bare `.` is a literal dot, so `.*` silently never matches. --\u003e\n\u003cdecoder name=\"cs3-sudo-fields\"\u003e\n  \u003cparent\u003ecs3-sudo\u003c/parent\u003e\n  \u003cprematch\u003eCOMMAND=\u003c/prematch\u003e\n  \u003cregex\u003e^(\\S+) : \u003c/regex\u003e\n  \u003corder\u003esrcuser\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-sudo-fields\"\u003e\n  \u003cparent\u003ecs3-sudo\u003c/parent\u003e\n  \u003cregex offset=\"after_regex\"\u003eUSER=(\\S+)\u003c/regex\u003e\n  \u003corder\u003edstuser\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-sudo-fields\"\u003e\n  \u003cparent\u003ecs3-sudo\u003c/parent\u003e\n  \u003cregex offset=\"after_regex\"\u003eCOMMAND=(\\.+)\u003c/regex\u003e\n  \u003corder\u003ecommand\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-sudo-authfail\"\u003e\n  \u003cparent\u003ecs3-sudo\u003c/parent\u003e\n  \u003cprematch\u003eauthentication failure|incorrect password attempts\u003c/prematch\u003e\n  \u003cregex\u003euser=(\\S+)\u003c/regex\u003e\n  \u003corder\u003esrcuser\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-auditd\"\u003e\n  \u003cprogram_name\u003e^audit$|^auditd$\u003c/program_name\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-auditd-exec\"\u003e\n  \u003cparent\u003ecs3-auditd\u003c/parent\u003e\n  \u003cprematch\u003etype=EXECVE|type=SYSCALL\u003c/prematch\u003e\n  \u003cregex\u003ecomm=\"(\\S+)\"\u003c/regex\u003e\n  \u003corder\u003ecommand\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-systemd\"\u003e\n  \u003cprogram_name\u003e^systemd$|^kernel$\u003c/program_name\u003e\n\u003c/decoder\u003e\n\n\u003c!-- One decoder per branch: an alternation in \u003cregex\u003e leaves the group of the unused branch empty. --\u003e\n\u003cdecoder name=\"cs3-systemd-failure\"\u003e\n  \u003cparent\u003ecs3-systemd\u003c/parent\u003e\n  \u003cprematch\u003eFailed to start|Out of memory|OOM\u003c/prematch\u003e\n  \u003cregex\u003eFailed to start (\\S+)\u003c/regex\u003e\n  \u003corder\u003eservice\u003c/order\u003e\n\u003c/decoder\u003e\n\n\u003cdecoder name=\"cs3-systemd-segfault\"\u003e\n  \u003cparent\u003ecs3-systemd\u003c/parent\u003e\n  \u003cprematch\u003esegfault\u003c/prematch\u003e\n  \u003cregex\u003e(\\S+) segfault\u003c/regex\u003e\n  \u003corder\u003eservice\u003c/order\u003e\n\u003c/decoder\u003e\n"
  "cs3-manager.conf": "\u003c!--\n  vendetta/manager/cs3-manager.conf — the manager-side block that 05-cs3-manager-integration.sh splices into\n  /var/ossec/etc/ossec.conf at boot (idempotent; skipped when the marker is already present).\n\n  It adds exactly one thing: a syslog receiver the local Fluent Bit can push host endpoint/network/auth/audit logs into,\n  so those lines pass through the manager's decoder/rule engine instead of bypassing it and landing in CS3 as flat logs.\n\n  The listener binds all interfaces because Kubernetes reaches it over a ClusterIP; exposure is bounded by what is\n  published (compose maps 5140/udp to 127.0.0.1) and by the manager NetworkPolicy (Kubernetes allows only fluent-bit).\n  allowed-ips is limited to private RFC1918 + loopback so a stray public packet is not decoded at all; remoted takes one\n  CIDR per \u003callowed-ips\u003e element (a comma list is rejected with \"Invalid ip address\"), so there are four of them.\n  Failure mode when this block is absent: host.* logs still reach CS3, but as unstructured log lines — no rule ID, no\n  manager-derived severity, no MITRE mapping.\n--\u003e\n\u003cossec_config\u003e\n  \u003c!-- cs3:manager-integration --\u003e\n  \u003cremote\u003e\n    \u003cconnection\u003esyslog\u003c/connection\u003e\n    \u003cport\u003e5140\u003c/port\u003e\n    \u003cprotocol\u003eudp\u003c/protocol\u003e\n    \u003callowed-ips\u003e127.0.0.1/32\u003c/allowed-ips\u003e\n    \u003callowed-ips\u003e10.0.0.0/8\u003c/allowed-ips\u003e\n    \u003callowed-ips\u003e172.16.0.0/12\u003c/allowed-ips\u003e\n    \u003callowed-ips\u003e192.168.0.0/16\u003c/allowed-ips\u003e\n  \u003c/remote\u003e\n\u003c/ossec_config\u003e\n"
  "cs3-rules.xml": "\u003c!--\ncs3-rules.xml — the CS3 rule block on the manager: 10120-10199.\n\nRules in this block are owned by CS3 and are additive to the stock ruleset; nothing here overrides a stock ID.\n05-cs3-manager-integration.sh checks every ID of this block and refuses to boot when one falls outside it or collides\nwith a rule already present in the ruleset.\n\nHow a CS3 rule gets to fire at all (each point was established the hard way on a live manager, do not \"simplify\" them):\n\n* analysisd walks rules in load order and stops at the first rule that matches with a level \u003e 0, so a CS3 rule only wins\n  when it is a *child* of the stock grouping rule that owns the line. Every rule below therefore hangs off a stock parent\n  (sshd 5700, sudo 5400, auditd 80700, systemd 40700, kernel 5100/5108) and the file must stay in /var/ossec/ruleset/rules/,\n  after those parents. A rule attached to a private catch-all parent instead loses to the stock parent, which matches\n  first at level 0 and then only descends into its own children.\n* rule IDs are never taken from the stock ruleset, and 10120-10199 has a free gap in it, so a future stock update cannot\n  collide with the block and every child stays above its parent.\n* do not switch to \u003cdecoded_as\u003e for the CS3 decoders: analysisd resolves decoded_as only against stock decoder category\n  names and silently drops a rule naming a decoder from etc/decoders.\n\nAlert flow: host endpoint/network/auth logs enter through the `syslog` remote connection (port 5140, loopback only),\nare decoded here, matched here, and — when the level reaches the global log_alert_level — land in\n/var/ossec/logs/alerts/alerts.json. Fluent Bit tails that file and posts it to POST /api/cecur/manager/alerts, which\nkeeps rule ID, original event timestamp, agent identity and level. Severities therefore map straight onto the\nCS3 alert model; raising a level here is the supported way to make something louder.\n--\u003e\n\n\u003cgroup name=\"cs3,syslog,\"\u003e\n\n  \u003c!-- Grouping parent for the families the stock ruleset groups with \u003cdecoded_as\u003e (sshd 5700, sudo 5400, auditd 80700).\n       Those stock parents stop matching as soon as a CS3 decoder claims the line, so the CS3 decoders need their own\n       parent. It is deliberately narrow: `program_name` keeps the rule off systemd/kernel lines, which are grouped by\n       stock rules on program_name and must keep reaching them. Level 0, so it only ever groups. --\u003e\n  \u003crule id=\"10120\" level=\"0\"\u003e\n    \u003cprogram_name\u003e^sshd$|^sshd-session$|^sudo$|^audit$|^auditd$\u003c/program_name\u003e\n    \u003cdescription\u003eCS3: host auth/audit log grouped\u003c/description\u003e\n    \u003cgroup\u003ecs3_base,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003c!-- ================================================================ host.endpoint: containers and workloads --\u003e\n  \u003c!-- Journald-sourced endpoint events arrive with the emitting program as the appname (containerd, dockerd, kubelet, or a\n       container name). No stock grouping rule owns those names, so a CS3 parent does: without it they fall through to the\n       generic syslog rule 1002 at level 2, below log_alert_level, and are silently dropped. Narrow on purpose: `systemd` and\n       `kernel` are deliberately absent, they keep hanging off the stock parents below. --\u003e\n  \u003crule id=\"10121\" level=\"0\"\u003e\n    \u003cprogram_name\u003e^docker$|^dockerd$|^containerd$|^containerd-shim$|^podman$|^conmon$|^crio$|^runc$|^kubelet$|^k3s$|^k3s-agent$\u003c/program_name\u003e\n    \u003cdescription\u003eCS3: container runtime log grouped\u003c/description\u003e\n    \u003cgroup\u003ecs3_base,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10122\" level=\"9\"\u003e\n    \u003cif_sid\u003e10121\u003c/if_sid\u003e\n    \u003cmatch\u003eOut of Memory|Out Of Memory|oom-kill|Killed process|exit code 137|exited with code 137\u003c/match\u003e\n    \u003cdescription\u003eCS3: container killed under memory pressure\u003c/description\u003e\n    \u003cmitre\u003e\n      \u003cid\u003eT1499\u003c/id\u003e\n    \u003c/mitre\u003e\n    \u003cgroup\u003ecs3_endpoint,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10123\" level=\"7\"\u003e\n    \u003cif_sid\u003e10121\u003c/if_sid\u003e\n    \u003cmatch\u003eFailed to start|exited with|Start request repeated too quickly|panic|fatal error|segfault|core dumped\u003c/match\u003e\n    \u003cdescription\u003eCS3: container or workload failed\u003c/description\u003e\n    \u003cgroup\u003ecs3_endpoint,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10129\" level=\"3\"\u003e\n    \u003cif_sid\u003e10121\u003c/if_sid\u003e\n    \u003cdescription\u003eCS3: unmatched container runtime line\u003c/description\u003e\n    \u003cgroup\u003ecs3_catchall,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003c!-- ================================================================ host.auth --\u003e\n  \u003c!-- The narrow decoders that supply $(srcuser)/$(dstuser)/$(srcip) run before these rules. `match`/`program_name` are\n       plain OS_Regex fragments: no quantifiers in program_name ('^.*$' never matches, '^sshd$' does). --\u003e\n  \u003crule id=\"10130\" level=\"5\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^sshd$|^sshd-session$\u003c/program_name\u003e\n    \u003cmatch\u003eFailed password for|Failed publickey for\u003c/match\u003e\n    \u003cdescription\u003eCS3: SSH authentication failure for $(dstuser) from $(srcip)\u003c/description\u003e\n    \u003cmitre\u003e\n      \u003cid\u003eT1110\u003c/id\u003e\n    \u003c/mitre\u003e\n    \u003cgroup\u003ecs3_auth,authentication_failed,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10131\" level=\"10\" frequency=\"5\" timeframe=\"120\"\u003e\n    \u003cif_matched_sid\u003e10130\u003c/if_matched_sid\u003e\n    \u003csame_source_ip /\u003e\n    \u003cdescription\u003eCS3: repeated SSH authentication failures from $(srcip)\u003c/description\u003e\n    \u003cmitre\u003e\n      \u003cid\u003eT1110\u003c/id\u003e\n    \u003c/mitre\u003e\n    \u003cgroup\u003ecs3_auth,authentication_failed,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10132\" level=\"3\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^sshd$|^sshd-session$\u003c/program_name\u003e\n    \u003cmatch\u003eAccepted password for\u003c/match\u003e\n    \u003cdescription\u003eCS3: SSH login for $(dstuser) from $(srcip)\u003c/description\u003e\n    \u003cgroup\u003ecs3_auth,authentication_success,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10133\" level=\"3\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^sshd$|^sshd-session$\u003c/program_name\u003e\n    \u003cmatch\u003eAccepted publickey for\u003c/match\u003e\n    \u003cdescription\u003eCS3: SSH public-key login for $(dstuser) from $(srcip)\u003c/description\u003e\n    \u003cgroup\u003ecs3_auth,authentication_success,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10135\" level=\"3\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^sshd$|^sshd-session$\u003c/program_name\u003e\n    \u003cdescription\u003eCS3: unmatched sshd line\u003c/description\u003e\n    \u003cgroup\u003ecs3_catchall,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10140\" level=\"3\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^sudo$\u003c/program_name\u003e\n    \u003cmatch\u003eCOMMAND=\u003c/match\u003e\n    \u003cdescription\u003eCS3: $(srcuser) ran a privileged command as $(dstuser): $(command)\u003c/description\u003e\n    \u003cgroup\u003ecs3_auth,privilege_escalation,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10141\" level=\"6\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^sudo$\u003c/program_name\u003e\n    \u003cmatch\u003eauthentication failure\u003c/match\u003e\n    \u003cdescription\u003eCS3: sudo authentication failure for $(srcuser)\u003c/description\u003e\n    \u003cmitre\u003e\n      \u003cid\u003eT1548.003\u003c/id\u003e\n    \u003c/mitre\u003e\n    \u003cgroup\u003ecs3_auth,authentication_failed,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10145\" level=\"3\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^sudo$\u003c/program_name\u003e\n    \u003cdescription\u003eCS3: unmatched sudo line\u003c/description\u003e\n    \u003cgroup\u003ecs3_catchall,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003c!-- ================================================================ host.audit --\u003e\n  \u003crule id=\"10150\" level=\"8\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^audit$|^auditd$\u003c/program_name\u003e\n    \u003cmatch\u003etype=EXECVE|type=SYSCALL\u003c/match\u003e\n    \u003cdescription\u003eCS3: audited process execution: $(command)\u003c/description\u003e\n    \u003cmitre\u003e\n      \u003cid\u003eT1059\u003c/id\u003e\n    \u003c/mitre\u003e\n    \u003cgroup\u003ecs3_audit,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10151\" level=\"10\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^audit$|^auditd$\u003c/program_name\u003e\n    \u003cmatch\u003eauditctl|auditd|ausearch\u003c/match\u003e\n    \u003cdescription\u003eCS3: audit tooling touched: $(command) (possible audit tampering)\u003c/description\u003e\n    \u003cmitre\u003e\n      \u003cid\u003eT1562.001\u003c/id\u003e\n    \u003c/mitre\u003e\n    \u003cgroup\u003ecs3_audit,defense_evasion,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10155\" level=\"3\"\u003e\n    \u003cif_sid\u003e10120\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^audit$|^auditd$\u003c/program_name\u003e\n    \u003cdescription\u003eCS3: unmatched audit line\u003c/description\u003e\n    \u003cgroup\u003ecs3_catchall,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003c!-- ================================================================ host.endpoint --\u003e\n  \u003crule id=\"10160\" level=\"7\"\u003e\n    \u003cif_sid\u003e40700\u003c/if_sid\u003e\n    \u003cprogram_name\u003e^systemd$\u003c/program_name\u003e\n    \u003cmatch\u003eFailed to start\u003c/match\u003e\n    \u003cdescription\u003eCS3: system service failure: $(service)\u003c/description\u003e\n    \u003cgroup\u003ecs3_endpoint,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10165\" level=\"3\"\u003e\n    \u003cif_sid\u003e40700\u003c/if_sid\u003e\n    \u003cdescription\u003eCS3: unmatched systemd line\u003c/description\u003e\n    \u003cgroup\u003ecs3_catchall,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10170\" level=\"9\"\u003e\n    \u003cif_sid\u003e5100\u003c/if_sid\u003e\n    \u003cmatch\u003esegfault|core dumped\u003c/match\u003e\n    \u003cdescription\u003eCS3: process crash reported by the kernel: $(service)\u003c/description\u003e\n    \u003cgroup\u003ecs3_endpoint,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003c!-- ================================================================ host.network --\u003e\n  \u003c!-- Child of stock 5108 (\"Out of Memory: \") rather than of 5100: 5108 loads before every CS3 rule, so as a sibling it\n       would always win the line first. As its child, CS3 still gets the last word, and the level is repeated at 12 so\n       taking the line over does not quieten it. --\u003e\n  \u003crule id=\"10171\" level=\"12\"\u003e\n    \u003cif_sid\u003e5108\u003c/if_sid\u003e\n    \u003cmatch\u003eOut of Memory|Out of memory|OOM killer|oom-kill\u003c/match\u003e\n    \u003cdescription\u003eCS3: kernel memory pressure / OOM event\u003c/description\u003e\n    \u003cmitre\u003e\n      \u003cid\u003eT1499\u003c/id\u003e\n    \u003c/mitre\u003e\n    \u003cgroup\u003ecs3_network,\u003c/group\u003e\n  \u003c/rule\u003e\n\n  \u003crule id=\"10179\" level=\"3\"\u003e\n    \u003cif_sid\u003e5100\u003c/if_sid\u003e\n    \u003cdescription\u003eCS3: unmatched kernel line\u003c/description\u003e\n    \u003cgroup\u003ecs3_catchall,\u003c/group\u003e\n  \u003c/rule\u003e\n\n\u003c/group\u003e"
  "entrypoint.sh": "#!/bin/bash\n# entrypoint.sh — manager-side CS3 integration wrapper for images started without the s6 cont-init mount (the Helm chart).\n#\n# The work itself is 05-cs3-manager-integration.sh, the same stage docker-compose mounts at /etc/cont-init.d. This wrapper\n# only installs it and execs /init, because a pre-init wrapper is the wrong place to patch /var/ossec: 0-wazuh-init\n# restores /var/ossec from the image's permanent data, so anything written before /init is overwritten. Handing the work\n# to a cont-init stage puts it after that restore and before any service starts.\n#\n# CS3_MANAGER_CONF_TEMPLATE is the override: point it at a complete ossec.conf and the splice is skipped entirely. Use it\n# when the deployment owns its own manager configuration (config management, cluster join, extra remotes) and a patch\n# would be the wrong shape. CS3_MANAGER_STRICT=true turns a failed patch into a fatal error.\nset -euo pipefail\n\nHERE=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\"\nlog() { printf '[manager-integration] %s\\n' \"$*\" \u003e\u00262; }\n\nstage=\"$HERE/05-cs3-manager-integration.sh\"\n[[ -f \"$stage\" ]] || {\n  log \"ERROR: $stage not found; the integration mount is incomplete\"\n  exit 1\n}\n# Compose bind-mounts the stage at this path, so it is already there and read-only (it cannot be replaced); the Helm\n# deployment mounts only /manager-integration, so there it has to be copied. `cmp`/`diff` are not in the manager image.\ntarget=/etc/cont-init.d/05-cs3-manager-integration.sh\nif [[ -e \"$target\" ]]; then\n  log \"cont-init stage already present at $target (bind mount); the manager configuration is applied after /init\"\nelif install -o root -g root -m 0755 \"$stage\" \"$target\" 2\u003e/dev/null; then\n  log \"installed the cont-init stage; the manager configuration is applied after /init\"\nelse\n  log \"WARN: could not install $target and none is mounted; host logs will reach CS3 as plain log lines\"\nfi\nexport CS3_MANAGER_INTEGRATION_DIR=\"$HERE\"\n\nexec /init \"$@\"\n"
  "patch-ossec-conf.sh": "#!/bin/bash\n# patch-ossec-conf.sh — splice the CS3 manager block into /var/ossec/etc/ossec.conf, idempotently, with a check that\n# the CS3 rule block is actually ours to use.\n#\n# Exits non-zero (so the manager does not boot half-configured) when:\n#   * a rule ID in cs3-rules.xml falls outside 10120-10199,\n#   * such an ID already exists in the ruleset (a collision would silently shadow one of them),\n#   * ossec.conf cannot be parsed after the splice (wazuh-analysisd -t), in which case ossec.conf is restored.\n#\n# Idempotent through the `cs3:manager-integration` marker: a second run is a no-op, and the block is re-spliced if the\n# marker is present but the receiver is gone.\nset -euo pipefail\n\nCONF=/var/ossec/etc/ossec.conf\nRULES=cs3-rules.xml\nMARKER='cs3:manager-integration'\n# The block sits low in the stock ID space on purpose: analysisd evaluates rules in load order and stops at the first\n# match that raises the level, so a CS3 rule has to be a child of the stock grouping rule that owns the line, and the\n# whole block has to load after those parents exist. 10120-10199 is a free gap in the stock ruleset.\nBLOCK_LO=10120\nBLOCK_HI=10199\nHERE=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\"\n\nlog() { printf '[manager-integration] %s\\n' \"$*\" \u003e\u00262; }\ndie() {\n  log \"ERROR: $*\"\n  exit 1\n}\n\n[[ -f \"$CONF\" ]] || die \"$CONF not found; the base image is not what this wrapper expects\"\n[[ -f \"$HERE/$RULES\" ]] || die \"$HERE/$RULES not found\"\n[[ -f \"$HERE/cs3-manager.conf\" ]] || die \"$HERE/cs3-manager.conf not found\"\n\n# ---- 1. the rule block must be inside the reserved range and free of collisions -------------------------------\nids=$(grep -o 'rule id=\"[0-9]*\"' \"$HERE/$RULES\" | grep -o '[0-9]*' | sort -u)\n[[ -n \"$ids\" ]] || die \"no rule IDs found in $RULES\"\n\nwhile read -r id; do\n  [[ \"$id\" =~ ^[0-9]+$ ]] || die \"rule ID '$id' is not numeric\"\n  if ((10#$id \u003c BLOCK_LO || 10#$id \u003e BLOCK_HI)); then\n    die \"rule ID $id is outside the reserved CS3 block $BLOCK_LO-$BLOCK_HI\"\n  fi\ndone \u003c\u003c\u003c\"$ids\"\n\ncollisions=0\nfor dir in /var/ossec/ruleset/rules /var/ossec/etc/rules; do\n  [[ -d \"$dir\" ]] || continue\n  for f in \"$dir\"/*.xml; do\n    [[ -e \"$f\" ]] || continue\n    # Skip our own copies: the source name when run from etc/rules, and the installed name under ruleset/rules (the\n    # installer writes 9999-$RULES before this runs).\n    base=$(basename \"$f\")\n    [[ \"$base\" == \"$RULES\" || \"$base\" == \"9999-$RULES\" ]] \u0026\u0026 continue\n    while read -r id; do\n      if grep -q \"rule id=\\\"$id\\\"\" \"$f\"; then\n        log \"ERROR: rule ID $id in $RULES already defined by $f\"\n        collisions=$((collisions + 1))\n      fi\n    done \u003c\u003c\u003c\"$ids\"\n  done\ndone\n((collisions == 0)) || die \"$collisions rule ID collision(s); renumber or drop the duplicates\"\nlog \"rule block $BLOCK_LO-$BLOCK_HI validated ($(wc -w \u003c\u003c\u003c\"$ids\" | tr -d ' ') IDs, no collisions)\"\n\n# ---- 2. splice, unless already spliced ----------------------------------------------------------------------\nif grep -q \"$MARKER\" \"$CONF\" \u0026\u0026 grep -q '\u003cconnection\u003esyslog\u003c/connection\u003e' \"$CONF\"; then\n  log \"receiver already present in $CONF; nothing to do\"\n  exit 0\nfi\n\ncp -a \"$CONF\" \"$CONF.cs3.bak\"\n\n# The block is an \u003cossec_config\u003e wrapper; keep only its children so they can sit inside the existing one.\ninner=$(sed -n '/\u003cossec_config\u003e/,/\u003c\\/ossec_config\u003e/p' \"$HERE/cs3-manager.conf\" | sed '1d;$d')\n[[ -n \"$inner\" ]] || die \"manager block has no \u003cossec_config\u003e children\"\n\n# Insert before the LAST closing tag, so the existing top-level block stays intact and ours lands inside it. Pure\n# coreutils (no python3): the manager image is not guaranteed to expose an interpreter on PATH.\nlast=$(grep -n '^[[:space:]]*\u003c/ossec_config\u003e' \"$CONF\" | tail -n 1 | cut -d: -f1)\n[[ -n \"$last\" ]] || die \"$CONF has no closing \u003c/ossec_config\u003e\"\n{\n  head -n \"$((last - 1))\" \"$CONF\"\n  printf '%s\\n' \"$inner\"\n  tail -n +\"$last\" \"$CONF\"\n} \u003e\"$CONF.cs3.new\" || die \"cannot write $CONF.cs3.new\"\n# Copied through a redirection, not `mv`: replacing the file would give it the ownership and mode of whoever ran the patch,\n# and wazuh-db does not run as that user (it then fails with (1226) Error reading XML file and the manager will not boot).\ncat \"$CONF.cs3.new\" \u003e\"$CONF\" || die \"cannot write $CONF\"\nrm -f \"$CONF.cs3.new\"\n\n# ---- 3. the result must parse; otherwise restore and stop ---------------------------------------------\n# analysisd covers decoders/rules, remoted owns \u003cremote\u003e; each reports its own section, so both run. wazuh-logtest style\n# single-daemon checks are not enough: a valid \u003callowed-ips\u003e for remoted still fails analysisd and vice versa.\nchecked=0\nfor daemon in wazuh-analysisd wazuh-remoted; do\n  [[ -x \"/var/ossec/bin/$daemon\" ]] || continue\n  if ! \"/var/ossec/bin/$daemon\" -t \u003e\"/tmp/cs3-$daemon-test.log\" 2\u003e\u00261; then\n    cat \"$CONF.cs3.bak\" \u003e\"$CONF\"\n    cat \"/tmp/cs3-$daemon-test.log\" \u003e\u00262 || true\n    die \"manager configuration did not validate ($daemon -t); ossec.conf restored\"\n  fi\n  checked=$((checked + 1))\n  log \"configuration validated by $daemon -t\"\ndone\n[[ \"$checked\" -gt 0 ]] || log \"WARN: no wazuh daemon found under /var/ossec/bin; skipping configuration validation\"\n\nlog \"syslog receiver spliced into $CONF (backup: $CONF.cs3.bak)\"\n"
---

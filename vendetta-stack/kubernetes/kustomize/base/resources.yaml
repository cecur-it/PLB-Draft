      \"source\": {\n          \"properties\": {\n            \"system\": { \"type\": \"keyword\" },\n            \"stream\": { \"type\": \"keyword\" }\n          }\n        },\n        \"rule\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"level\": { \"type\": \"integer\" },\n            \"description\": {\n              \"type\": \"text\",\n              \"fields\": { \"keyword\": { \"type\": \"keyword\", \"ignore_above\": 512 } }\n            },\n            \"groups\": { \"type\": \"keyword\" },\n            \"mitre\": {\n              \"properties\": {\n                \"id\": { \"type\": \"keyword\" },\n                \"tactic\": { \"type\": \"keyword\" },\n                \"technique\": { \"type\": \"keyword\" }\n              }\n            }\n          }\n        },\n        \"agent\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"name\": { \"type\": \"keyword\" },\n            \"ip\": { \"type\": \"ip\", \"ignore_malformed\": true }\n          }\n        },\n        \"manager\": {\n          \"properties\": {\n            \"name\": { \"type\": \"keyword\" }\n          }\n        },\n        \"location\": { \"type\": \"keyword\", \"ignore_above\": 1024 },\n        \"full_log\": { \"type\": \"text\", \"norms\": false },\n        \"severity\": { \"type\": \"keyword\" },\n        \"mitre\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"tactic\": { \"type\": \"keyword\" },\n            \"technique\": { \"type\": \"keyword\" }\n          }\n        },\n        \"root_cause\": { \"type\": \"text\", \"norms\": false },\n        \"recommended_action\": { \"type\": \"text\", \"norms\": false },\n        \"ai\": {\n          \"properties\": {\n            \"engine\": { \"type\": \"keyword\" },\n            \"role\": { \"type\": \"keyword\" },\n            \"confidence\": { \"type\": \"float\" },\n            \"verdict\": { \"type\": \"keyword\" },\n            \"fallback\": { \"type\": \"boolean\" },\n            \"fallback_reason\": { \"type\": \"keyword\" },\n            \"request_id\": { \"type\": \"keyword\" },\n            \"needs_verification\": { \"type\": \"boolean\" },\n            \"summary\": { \"type\": \"text\", \"norms\": false },\n            \"analyzed_at\": { \"type\": \"date\" },\n            \"cost\": {\n              \"properties\": {\n                \"gpu_seconds\": { \"type\": \"double\" }\n              }\n            }\n          }\n        },\n        \"errow\": {\n          \"properties\": {\n            \"run\": { \"type\": \"keyword\" },\n            \"finding_id\": { \"type\": \"keyword\" },\n            \"cwe\": { \"type\": \"keyword\" },\n            \"cve\": { \"type\": \"keyword\" },\n            \"owasp\": { \"type\": \"keyword\" },\n            \"cvss\": { \"type\": \"float\" },\n            \"confidence\": { \"type\": \"keyword\" },\n            \"target\": { \"type\": \"keyword\" },\n            \"endpoint\": { \"type\": \"keyword\" },\n            \"sarif_rule_id\": { \"type\": \"keyword\" },\n            \"fingerprint\": { \"type\": \"keyword\" },\n            \"triggered\": { \"type\": \"boolean\" }\n          }\n        },\n        \"ingest_error\": {\n          \"type\": \"text\",\n          \"fields\": { \"keyword\": { \"type\": \"keyword\", \"ignore_above\": 512 } }\n        }\n      }\n    }\n  }\n}\n"
  "ingest-pipelines__aiincident-to-vendetta-alert.json": "{\n  \"description\": \"Maps an AIIncidentAnalysis (CONTRACT s4.2) into the normalized Vendetta alert fields of s4.1. Accepts a cs3.ai.inference event (analysis object under `analysis`, plus model/role/fallback/verdict/gpu_seconds/alert_id) or a bare AIIncidentAnalysis. severityAssessment -\u003e severity (lower case) + rule.level (critical 14, high 11, medium 8, low 5); mitreTactic/mitreTechnique -\u003e mitre.tactic[]/mitre.technique[] (+ mitre.id[] when a Txxxx[.xxx] id is present); probableRootCause -\u003e root_cause; recommendedImmediateAction -\u003e recommended_action; confidenceScore -\u003e ai.confidence; engineUsed -\u003e ai.engine; gpuSeconds -\u003e ai.cost.gpu_seconds; ai.role derived from the engine (nemotron=triage, gemma=forensic, Cecur Heuristics=heuristic; the event role is used only for unknown engines); ai.fallback from the event, else true for heuristics. When alert_id is present the output is a pure enrichment of that alert (id = alert_id, no @timestamp/source/description so an update+doc_as_upsert never clobbers the original alert; the event time goes to ai.analyzed_at). Without alert_id a standalone cs3-ai alert is produced (id = request_id). On failure the document is kept and ingest_error is set.\",\n  \"processors\": [\n    {\n      \"set\": {\n        \"description\": \"Ingest time when the event carries no @timestamp.\",\n        \"field\": \"@timestamp\",\n        \"value\": \"{{{_ingest.timestamp}}}\",\n        \"override\": false\n      }\n    },\n    {\n      \"script\": {\n        \"description\": \"Build the alert fields atomically, then replace the AI record with them.\",\n        \"lang\": \"painless\",\n        \"source\": \"String str(def v) {\\n  if (v == null) { return null; }\\n  String s = v.toString();\\n  return s.isEmpty() ? null : s;\\n}\\nString cap(def v, int n) {\\n  String s = str(v);\\n  if (s == null) { return null; }\\n  return s.length() \u003e n ? s.substring(0, n) : s;\\n}\\ndef num(def v) {\\n  if (v == null) { return null; }\\n  if (v instanceof Number) { return ((Number) v).doubleValue(); }\\n  try { return Double.parseDouble(v.toString().trim()); } catch (Exception e) { return null; }\\n}\\nString mitreId(String s) {\\n  if (s == null) { return null; }\\n  int n = s.length();\\n  for (int i = 0; i + 4 \u003c n; i++) {\\n    boolean boundary = i == 0 || ' ,;:/(['.indexOf(s.substring(i - 1, i)) \u003e= 0;\\n    if (boundary \u0026\u0026 s.substring(i, i + 1) == 'T') {\\n      boolean ok = true;\\n      for (int j = 1; j \u003c= 4; j++) {\\n        if ('0123456789'.indexOf(s.substring(i + j, i + j + 1)) \u003c 0) { ok = false; }\\n      }\\n      if (ok) {\\n        int end = i + 5;\\n        if (end + 4 \u003c= n \u0026\u0026 s.substring(end, end + 1) == '.') {\\n          boolean sub = true;\\n          for (int j = 1; j \u003c= 3; j++) {\\n            if ('0123456789'.indexOf(s.substring(end + j, end + j + 1)) \u003c 0) { sub = false; }\\n          }\\n          if (sub) { end = end + 4; }\\n        }\\n        return s.substring(i, end);\\n      }\\n    }\\n  }\\n  return null;\\n}\\nvoid putv(Map m, String k, def v) { if (v != null) { m.put(k, v); } }\\n\\nboolean wrapped = ctx['analysis'] instanceof Map;\\nMap a = wrapped ? (Map) ctx['analysis'] : ctx;\\nif (a['severityAssessment'] == null) {\\n  throw new IllegalArgumentException('no AIIncidentAnalysis found: severityAssessment is missing');\\n}\\nString sev = a['severityAssessment'].toString().trim().toLowerCase();\\nif (!(sev == 'critical' || sev == 'high' || sev == 'medium' || sev == 'low')) {\\n  throw new IllegalArgumentException('invalid severityAssessment: ' + cap(sev, 32));\\n}\\nint lvl = sev == 'critical' ? 14 : (sev == 'high' ? 11 : (sev == 'medium' ? 8 : 5));\\n\\nString engine = str(a['engineUsed']);\\nif (engine == null) { engine = str(ctx['engine_used']); }\\nif (engine == null) { engine = str(ctx['model']); }\\nString el = engine == null ? '' : engine.toLowerCase();\\nString role = null;\\nif (el.contains('nemotron')) { role = 'triage'; }\\nelse if (el.contains('gemma')) { role = 'forensic'; }\\nelse if (el.contains('heuristic') || el.startsWith('cecur') || el.contains('deterministic')) { role = 'heuristic'; }\\nif (role == null) {\\n  String r = str(ctx['role']);\\n  if (r != null) { r = r.toLowerCase(); }\\n  if (r == 'triage' || r == 'forensic' || r == 'heuristic') { role = r; }\\n}\\nif (role == null) { role = 'triage'; }\\nboolean fallback = ctx['fallback'] instanceof Boolean ? (boolean) ctx['fallback'] : role == 'heuristic';\\n\\nString tactic = str(a['mitreTactic']);\\nString technique = str(a['mitreTechnique']);\\nString tid = mitreId(technique);\\ndef gpu = num(a['gpuSeconds']);\\nif (gpu == null \u0026\u0026 wrapped) { gpu = num(ctx['gpu_seconds']); }\\nString alertId = str(ctx['alert_id']);\\nString summary = str(a['triageSummary']);\\n\\nMap out = new HashMap();\\nout['severity'] = sev;\\nMap rl = new HashMap();\\nrl['level'] = lvl;\\nMap mitre = new HashMap();\\nif (tactic != null) { List l = new ArrayList(); l.add(tactic); mitre['tactic'] = l; }\\nif (technique != null) { List l = new ArrayList(); l.add(technique); mitre['technique'] = l; }\\nif (tid != null) { List l = new ArrayList(); l.add(tid); mitre['id'] = l; }\\nif (!mitre.isEmpty()) { out['mitre'] = mitre; rl['mitre'] = new HashMap(mitre); }\\nputv(out, 'root_cause', str(a['probableRootCause']));\\nputv(out, 'recommended_action', str(a['recommendedImmediateAction']));\\n\\nMap ai = new HashMap();\\nputv(ai, 'engine', engine);\\nai['role'] = role;\\nputv(ai, 'confidence', num(a['confidenceScore']));\\nai['fallback'] = fallback;\\nif (wrapped) {\\n  putv(ai, 'verdict', str(ctx['verdict']));\\n  putv(ai, 'fallback_reason', str(ctx['fallback_reason']));\\n  putv(ai, 'request_id', str(ctx['request_id']));\\n}\\nif (a['needsVerification'] instanceof Boolean) { ai['needs_verification'] = a['needsVerification']; }\\nputv(ai, 'summary', cap(summary, 4000));\\nai['analyzed_at'] = ctx['@timestamp'];\\nif (gpu != null) {\\n  Map cost = new HashMap();\\n  cost['gpu_seconds'] = gpu;\\n  ai['cost'] = cost;\\n}\\nout['ai'] = ai;\\n\\nString id = alertId;\\nif (alertId != null) {\\n  out['id'] = alertId;\\n} else {\\n  id = str(ctx['request_id']);\\n  putv(out, 'id', id);\\n  out['@timestamp'] = ctx['@timestamp'];\\n  Map src = new HashMap();\\n  src['system'] = 'cs3-ai';\\n  src['stream'] = 'cs3.ai.inference';\\n  out['source'] = src;\\n  putv(rl, 'description', cap(summary, 8000));\\n  putv(out, 'full_log', cap(summary, 8000));\\n}\\nout['rule'] = rl;\\n\\ndef keepError = ctx['ingest_error'];\\nfor (def k : new ArrayList(ctx.keySet())) {\\n  if (!k.startsWith('_')) { ctx.remove(k); }\\n}\\nctx.putAll(out);\\nif (keepError != null) { ctx['ingest_error'] = keepError; }\\nif (alertId == null \u0026\u0026 id != null) { ctx['_id'] = id; }\"\n      }\n    }\n  ],\n  \"on_failure\": [\n    {\n      \"set\": {\n        \"field\": \"ingest_error\",\n        \"value\": \"aiincident-to-vendetta-alert: {{{_ingest.on_failure_message}}} (processor: {{{_ingest.on_failure_processor_type}}})\"\n      }\n    }\n  ]\n}\n"
  "ingest-pipelines__errow-finding-enrichment.json": "{\n  \"description\": \"Errow finding enrichment: derives cwe, OWASP Top 10:2021 category (owasp), MITRE ATT\u0026CK mapping (mitre.id / mitre.technique / mitre.tactic) and a normalised severity from a raw SARIF-result record shipped by errow-shipper (CONTRACT s15). CWE comes from properties.errow.cwe, else ruleId (CWE-n), else rule.properties.tags. The ATT\u0026CK mapping is a curated CWE-to-technique approximation for triage, not an official MITRE mapping. Unknown CWEs are left unmapped. Nothing is removed from the record.\",\n  \"processors\": [\n    {\n      \"script\": {\n        \"description\": \"CWE -\u003e OWASP/ATT\u0026CK lookup; all derived fields are assigned at the end so a failure leaves the record untouched.\",\n        \"lang\": \"painless\",\n        \"source\": \"int cweNum(def v) {\\n  if (v == null) { return -1; }\\n  String s = v.toString().trim().toUpperCase();\\n  int i = s.indexOf('CWE');\\n  boolean tagged = i \u003e= 0;\\n  i = tagged ? i + 3 : 0;\\n  while (i \u003c s.length() \u0026\u0026 '-_: '.indexOf(s.substring(i, i + 1)) \u003e= 0) { i++; }\\n  int j = i;\\n  while (j \u003c s.length() \u0026\u0026 '0123456789'.indexOf(s.substring(j, j + 1)) \u003e= 0) { j++; }\\n  if (j == i || j - i \u003e 5) { return -1; }\\n  if (!tagged \u0026\u0026 j != s.length()) { return -1; }\\n  return Integer.parseInt(s.substring(i, j));\\n}\\nString sevNorm(def v) {\\n  if (v == null) { return null; }\\n  String s = v.toString().trim().toLowerCase();\\n  if (s == 'informational' || s == 'information' || s == 'none') { return 'info'; }\\n  if (s == 'moderate' || s == 'med') { return 'medium'; }\\n  if (s == 'critical' || s == 'high' || s == 'medium' || s == 'low' || s == 'info') { return s; }\\n  return null;\\n}\\nMap props = ctx['properties'] instanceof Map ? (Map) ctx['properties'] : new HashMap();\\nMap err = props['errow'] instanceof Map ? (Map) props['errow'] : new HashMap();\\nint cwe = cweNum(err['cwe']);\\nif (cwe \u003c 0) { cwe = cweNum(ctx['ruleId']); }\\nif (cwe \u003c 0 \u0026\u0026 ctx['rule'] instanceof Map \u0026\u0026 ((Map) ctx['rule'])['properties'] instanceof Map) {\\n  Map rp = (Map) ((Map) ctx['rule'])['properties'];\\n  if (rp['tags'] instanceof List) {\\n    for (def t : rp['tags']) { if (cwe \u003c 0) { cwe = cweNum(t); } }\\n  }\\n}\\nString sev = sevNorm(err['severity']);\\nif (sev == null \u0026\u0026 ctx['level'] != null) {\\n  String lv = ctx['level'].toString().toLowerCase();\\n  sev = lv == 'error' ? 'high' : (lv == 'warning' ? 'medium' : (lv == 'note' ? 'low' : (lv == 'none' ? 'info' : null)));\\n}\\nString owasp = null;\\nList ids = new ArrayList();\\nList techs = new ArrayList();\\nLinkedHashSet tacs = new LinkedHashSet();\\nif (cwe \u003e= 0) {\\n  for (def e : params['owasp'].entrySet()) {\\n    if (owasp == null \u0026\u0026 e.getValue().contains(cwe)) { owasp = e.getKey(); }\\n  }\\n  def tl = params['attack'][String.valueOf(cwe)];\\n  if (tl != null) {\\n    for (def id : tl) {\\n      def spec = params['techniques'][id];\\n      ids.add(id);\\n      techs.add(spec[0]);\\n      for (String t : spec[1].splitOnToken(',')) { tacs.add(t); }\\n    }\\n  }\\n}\\nif (cwe \u003e= 0) { ctx['cwe'] = 'CWE-' + cwe; }\\nif (owasp != null) { ctx['owasp'] = owasp; }\\nif (sev != null) { ctx['severity'] = sev; }\\nif (!ids.isEmpty()) {\\n  Map m = new HashMap();\\n  m['id'] = ids;\\n  m['technique'] = techs;\\n  m['tactic'] = new ArrayList(tacs);\\n  ctx['mitre'] = m;\\n}\",\n        \"params\": {\n          \"owasp\": {\n            \"A01:2021-Broken Access Control\": [22, 23, 35, 59, 200, 201, 219, 264, 275, 276, 284, 285, 352, 359, 377, 402, 425, 441, 497, 538, 540, 548, 552, 566, 601, 639, 651, 668, 706, 732, 862, 863, 913, 922, 1275],\n            \"A02:2021-Cryptographic Failures\": [261, 296, 310, 319, 321, 322, 323, 324, 325, 326, 327, 328, 329, 330, 331, 335, 336, 337, 338, 340, 347, 523, 720, 757, 759, 760, 780, 818, 916],\n            \"A03:2021-Injection\": [20, 74, 75, 77, 78, 79, 80, 83, 87, 88, 89, 90, 91, 93, 94, 95, 96, 97, 98, 99, 100, 113, 116, 138, 184, 470, 471, 564, 610, 643, 644, 652, 917, 943],\n            \"A04:2021-Insecure Design\": [73, 183, 209, 213, 235, 256, 257, 266, 269, 280, 311, 312, 313, 316, 419, 430, 434, 444, 451, 472, 501, 522, 525, 539, 579, 598, 602, 642, 646, 650, 653, 656, 657, 799, 807, 840, 841, 927, 1021, 1173],\n            \"A05:2021-Security Misconfiguration\": [2, 11, 13, 15, 16, 260, 315, 520, 526, 537, 541, 547, 611, 614, 693, 756, 776, 942, 1004, 1032, 1174],\n            \"A06:2021-Vulnerable and Outdated Components\": [937, 1035, 1104],\n            \"A07:2021-Identification and Authentication Failures\": [255, 259, 287, 288, 290, 294, 295, 297, 300, 302, 304, 306, 307, 346, 384, 521, 613, 620, 640, 798, 940, 1216],\n            \"A08:2021-Software and Data Integrity Failures\": [345, 353, 426, 494, 502, 565, 784, 829, 830, 915],\n            \"A09:2021-Security Logging and Monitoring Failures\": [117, 223, 532, 778],\n            \"A10:2021-Server-Side Request Forgery (SSRF)\": [918]\n          },\n          \"techniques\": {\n            \"T1005\": [\"Data from Local System\", \"Collection\"],\n            \"T1040\": [\"Network Sniffing\", \"Credential Access,Discovery\"],\n            \"T1059\": [\"Command and Scripting Interpreter\", \"Execution\"],\n            \"T1059.007\": [\"JavaScript\", \"Execution\"],\n            \"T1068\": [\"Exploitation for Privilege Escalation\", \"Privilege Escalation\"],\n            \"T1070\": [\"Indicator Removal\", \"Defense Evasion\"],\n            \"T1078\": [\"Valid Accounts\", \"Defense Evasion,Persistence,Privilege Escalation,Initial Access\"],\n            \"T1110\": [\"Brute Force\", \"Credential Access\"],\n            \"T1189\": [\"Drive-by Compromise\", \"Initial Access\"],\n            \"T1190\": [\"Exploit Public-Facing Application\", \"Initial Access\"],\n            \"T1195\": [\"Supply Chain Compromise\", \"Initial Access\"],\n            \"T1195.001\": [\"Compromise Software Dependencies and Development Tools\", \"Initial Access\"],\n            \"T1203\": [\"Exploitation for Client Execution\", \"Execution\"],\n            \"T1204\": [\"User Execution\", \"Execution\"],\n            \"T1204.001\": [\"Malicious Link\", \"Execution\"],\n            \"T1213\": [\"Data from Information Repositories\", \"Collection\"],\n            \"T1222\": [\"File and Directory Permissions Modification\", \"Defense Evasion\"],\n            \"T1499\": [\"Endpoint Denial of Service\", \"Impact\"],\n            \"T1505.003\": [\"Web Shell\", \"Persistence\"],\n            \"T1539\": [\"Steal Web Session Cookie\", \"Credential Access\"],\n            \"T1550\": [\"Use Alternate Authentication Material\", \"Defense Evasion,Lateral Movement\"],\n            \"T1550.004\": [\"Web Session Cookie\", \"Defense Evasion,Lateral Movement\"],\n            \"T1552\": [\"Unsecured Credentials\", \"Credential Access\"],\n            \"T1552.001\": [\"Credentials In Files\", \"Credential Access\"],\n            \"T1552.005\": [\"Cloud Instance Metadata API\", \"Credential Access\"],\n            \"T1556\": [\"Modify Authentication Process\", \"Credential Access,Defense Evasion,Persistence\"],\n            \"T1557\": [\"Adversary-in-the-Middle\", \"Credential Access,Collection\"],\n            \"T1562\": [\"Impair Defenses\", \"Defense Evasion\"],\n            \"T1562.006\": [\"Indicator Blocking\", \"Defense Evasion\"],\n            \"T1566.002\": [\"Spearphishing Link\", \"Initial Access\"],\n            \"T1574\": [\"Hijack Execution Flow\", \"Persistence,Privilege Escalation,Defense Evasion\"],\n            \"T1592\": [\"Gather Victim Host Information\", \"Reconnaissance\"],\n            \"T1600\": [\"Weaken Encryption\", \"Defense Evasion\"],\n            \"T1606\": [\"Forge Web Credentials\", \"Credential Access\"]\n          },\n          \"attack\": {\n            \"20\": [\"T1190\"],\n            \"22\": [\"T1190\", \"T1005\"],\n            \"23\": [\"T1190\", \"T1005\"],\n            \"36\": [\"T1190\", \"T1005\"],\n            \"73\": [\"T1190\"],\n            \"74\": [\"T1190\"],\n            \"77\": [\"T1190\", \"T1059\"],\n            \"78\": [\"T1190\", \"T1059\"],\n            \"79\": [\"T1189\", \"T1059.007\"],\n            \"80\": [\"T1189\", \"T1059.007\"],\n            \"88\": [\"T1059\"],\n            \"89\": [\"T1190\"],\n            \"90\": [\"T1190\"],\n            \"91\": [\"T1190\"],\n            \"94\": [\"T1190\", \"T1059\"],\n            \"95\": [\"T1190\", \"T1059\"],\n            \"96\": [\"T1190\", \"T1059\"],\n            \"98\": [\"T1190\", \"T1059\"],\n            \"113\": [\"T1190\"],\n            \"117\": [\"T1070\"],\n            \"119\": [\"T1203\", \"T1068\"],\n            \"200\": [\"T1592\"],\n            \"201\": [\"T1213\"],\n            \"209\": [\"T1592\"],\n            \"223\": [\"T1562.006\"],\n            \"256\": [\"T1552\"],\n            \"259\": [\"T1552.001\"],\n            \"264\": [\"T1190\"],\n            \"269\": [\"T1068\"],\n            \"276\": [\"T1222\"],\n            \"284\": [\"T1190\"],\n            \"285\": [\"T1190\"],\n            \"287\": [\"T1078\"],\n            \"288\": [\"T1190\"],\n            \"294\": [\"T1550\"],\n            \"295\": [\"T1557\"],\n            \"297\": [\"T1557\"],\n            \"300\": [\"T1557\"],\n            \"306\": [\"T1190\"],\n            \"307\": [\"T1110\"],\n            \"311\": [\"T1040\"],\n            \"312\": [\"T1552\"],\n            \"319\": [\"T1040\"],\n            \"321\": [\"T1552.001\"],\n            \"326\": [\"T1600\"],\n            \"327\": [\"T1600\"],\n            \"328\": [\"T1600\"],\n            \"345\": [\"T1606\"],\n            \"347\": [\"T1606\"],\n            \"352\": [\"T1204.001\"],\n            \"384\": [\"T1550.004\"],\n            \"400\": [\"T1499\"],\n            \"416\": [\"T1203\", \"T1068\"],\n            \"426\": [\"T1574\"],\n            \"427\": [\"T1574\"],\n            \"434\": [\"T1505.003\", \"T1190\"],\n            \"494\": [\"T1195\"],\n            \"497\": [\"T1592\"],\n            \"502\": [\"T1190\", \"T1059\"],\n            \"521\": [\"T1110\"],\n            \"522\": [\"T1552\"],\n            \"532\": [\"T1552\"],\n            \"601\": [\"T1566.002\"],\n            \"611\": [\"T1190\"],\n            \"613\": [\"T1550.004\"],\n            \"614\": [\"T1539\"],\n            \"639\": [\"T1190\", \"T1213\"],\n            \"640\": [\"T1556\"],\n            \"668\": [\"T1190\"],\n            \"693\": [\"T1562\"],\n            \"732\": [\"T1222\"],\n            \"770\": [\"T1499\"],\n            \"778\": [\"T1562.006\"],\n            \"787\": [\"T1203\", \"T1068\"],\n            \"798\": [\"T1552.001\"],\n            \"829\": [\"T1195\"],\n            \"862\": [\"T1190\"],\n            \"863\": [\"T1190\"],\n            \"915\": [\"T1190\"],\n            \"918\": [\"T1190\", \"T1552.005\"],\n            \"922\": [\"T1552\"],\n            \"937\": [\"T1195.001\", \"T1190\"],\n            \"942\": [\"T1190\"],\n            \"943\": [\"T1190\"],\n            \"1004\": [\"T1539\"],\n            \"1021\": [\"T1204\"],\n            \"1035\": [\"T1195.001\", \"T1190\"],\n            \"1104\": [\"T1195.001\", \"T1190\"],\n            \"1275\": [\"T1539\"]\n          }\n        }\n      }\n    }\n  ],\n  \"on_failure\": [\n    {\n      \"set\": {\n        \"field\": \"ingest_error\",\n        \"value\": \"errow-finding-enrichment: {{{ _ingest.on_failure_message }}} (processor: {{{ _ingest.on_failure_processor_type }}})\"\n      }\n    }\n  ]\n}\n"
  "ingest-pipelines__sarif-to-vendetta-alert.json": "{\n  \"description\": \"Transforms one raw SARIF-result record shipped by errow-shipper (CONTRACT s15: SARIF result keys at top level + rule + @timestamp/stream/run/source/doc_id) into the normalized Vendetta alert of CONTRACT s4.1 so Errow findings land in vendetta-alerts-* next to Wazuh alerts. Calls errow-finding-enrichment first (cwe, owasp, mitre). id = doc_id, else a SHA-256 fingerprint of run+ruleId+primaryLocationLineHash+finding id+endpoint. rule.level: critical 14, high 11, medium 8, low 5, info 2. severity = properties.errow.severity, else SARIF level (error=high, warning=medium, note=low, default warning). The raw SARIF keys are dropped from the alert (no PoC/analysis bodies, full_log is a one-line summary). ai.*, root_cause and recommended_action are never emitted so a later AI enrichment upsert is not clobbered. Use with update+doc_as_upsert or index (_id is set to the alert id). On failure the record is kept and ingest_error is set.\",\n  \"processors\": [\n    {\n      \"set\": {\n        \"description\": \"Use the Errow finding timestamp when the shipper did not stamp the record.\",\n        \"field\": \"@timestamp\",\n        \"value\": \"{{{properties.errow.timestamp}}}\",\n        \"override\": false,\n        \"if\": \"ctx.properties instanceof Map \u0026\u0026 ctx.properties.errow instanceof Map \u0026\u0026 ctx.properties.errow.timestamp != null\"\n      }\n    },\n    {\n      \"set\": {\n        \"description\": \"Last resort: ingest time.\",\n        \"field\": \"@timestamp\",\n        \"value\": \"{{{_ingest.timestamp}}}\",\n        \"override\": false\n      }\n    },\n    {\n      \"pipeline\": {\n        \"description\": \"CWE -\u003e OWASP Top 10:2021, MITRE ATT\u0026CK, normalised severity.\",\n        \"name\": \"errow-finding-enrichment\"\n      }\n    },\n    {\n      \"fingerprint\": {\n        \"description\": \"Alert id when the shipper did not provide doc_id.\",\n        \"fields\": [\n          \"run\",\n          \"ruleId\",\n          \"partialFingerprints.primaryLocationLineHash\",\n          \"properties.errow.id\",\n          \"properties.errow.endpoint\"\n        ],\n        \"target_field\": \"tmp_fp\",\n        \"hash_method\": \"SHA-256@2.16.0\",\n        \"ignore_missing\": true,\n        \"if\": \"ctx.doc_id == null\"\n      }\n    },\n    {\n      \"script\": {\n        \"description\": \"Build the s4.1 alert atomically, then replace the raw SARIF keys with it.\",\n        \"lang\": \"painless\",\n        \"source\": \"String str(def v) {\\n  if (v == null) { return null; }\\n  String s = v.toString();\\n  return s.isEmpty() ? null : s;\\n}\\nString cap(def v, int n) {\\n  String s = str(v);\\n  if (s == null) { return null; }\\n  return s.length() \u003e n ? s.substring(0, n) : s;\\n}\\ndef num(def v) {\\n  if (v == null) { return null; }\\n  if (v instanceof Number) { return ((Number) v).doubleValue(); }\\n  try { return Double.parseDouble(v.toString().trim()); } catch (Exception e) { return null; }\\n}\\nString hostOf(def t) {\\n  if (t == null) { return null; }\\n  String s = t.toString().trim();\\n  int p = s.indexOf('://');\\n  if (p \u003e= 0) { s = s.substring(p + 3); }\\n  int sl = s.indexOf('/');\\n  if (sl \u003e= 0) { s = s.substring(0, sl); }\\n  int at = s.lastIndexOf('@');\\n  if (at \u003e= 0) { s = s.substring(at + 1); }\\n  if (s.startsWith('[')) {\\n    int e = s.indexOf(']');\\n    if (e \u003e 0) { return s.substring(1, e); }\\n  }\\n  int c = s.indexOf(':');\\n  if (c \u003e= 0 \u0026\u0026 s.indexOf(':', c + 1) \u003c 0) { s = s.substring(0, c); }\\n  return s.isEmpty() ? null : s;\\n}\\nboolean isIp(String h) {\\n  if (h == null || h.isEmpty()) { return false; }\\n  if (h.indexOf(':') \u003e= 0) {\\n    for (int i = 0; i \u003c h.length(); i++) {\\n      if ('0123456789abcdefABCDEF:.'.indexOf(h.substring(i, i + 1)) \u003c 0) { return false; }\\n    }\\n    return true;\\n  }\\n  String[] parts = h.splitOnToken('.');\\n  if (parts.length != 4) { return false; }\\n  for (String q : parts) {\\n    if (q.isEmpty() || q.length() \u003e 3) { return false; }\\n    for (int i = 0; i \u003c q.length(); i++) {\\n      if ('0123456789'.indexOf(q.substring(i, i + 1)) \u003c 0) { return false; }\\n    }\\n    if (Integer.parseInt(q) \u003e 255) { return false; }\\n  }\\n  return true;\\n}\\nvoid putv(Map m, String k, def v) { if (v != null) { m.put(k, v); } }\\n\\nMap props = ctx['properties'] instanceof Map ? (Map) ctx['properties'] : new HashMap();\\nMap err = props['errow'] instanceof Map ? (Map) props['errow'] : new HashMap();\\nString text = null;\\nif (ctx['message'] instanceof Map) { text = str(((Map) ctx['message'])['text']); }\\nelse if (ctx['message'] instanceof String) { text = str(ctx['message']); }\\nString title = null;\\nif (text != null) {\\n  int nl = text.indexOf(params['nl']);\\n  title = (nl \u003e= 0 ? text.substring(0, nl) : text).trim();\\n}\\nString ruleId = str(ctx['ruleId']);\\n\\nString sev = null;\\nif (err['severity'] != null) {\\n  String s = err['severity'].toString().trim().toLowerCase();\\n  if (s == 'informational' || s == 'information' || s == 'none') { s = 'info'; }\\n  else if (s == 'moderate' || s == 'med') { s = 'medium'; }\\n  if (s == 'critical' || s == 'high' || s == 'medium' || s == 'low' || s == 'info') { sev = s; }\\n}\\nif (sev == null) {\\n  String lv = ctx['level'] == null ? 'warning' : ctx['level'].toString().trim().toLowerCase();\\n  sev = lv == 'error' ? 'high' : (lv == 'note' ? 'low' : (lv == 'none' ? 'info' : 'medium'));\\n}\\nint lvl = sev == 'critical' ? 14 : (sev == 'high' ? 11 : (sev == 'medium' ? 8 : (sev == 'low' ? 5 : 2)));\\n\\nString cwe = str(ctx['cwe']);\\nif (cwe == null) { cwe = str(err['cwe']); }\\nString target = str(err['target']);\\nString endpoint = str(err['endpoint']);\\nString method = str(err['method']);\\nString host = hostOf(target);\\n\\nString loc = null;\\nif (ctx['locations'] instanceof List) {\\n  for (def l : ctx['locations']) {\\n    if (loc == null \u0026\u0026 props['synthetic_location'] != true \u0026\u0026 l instanceof Map \u0026\u0026 l['physicalLocation'] instanceof Map) {\\n      Map pl = (Map) l['physicalLocation'];\\n      if (pl['artifactLocation'] instanceof Map \u0026\u0026 ((Map) pl['artifactLocation'])['uri'] != null) {\\n        loc = str(((Map) pl['artifactLocation'])['uri']);\\n        if (loc != null \u0026\u0026 pl['region'] instanceof Map \u0026\u0026 ((Map) pl['region'])['startLine'] != null) {\\n          loc = loc + ':' + ((Map) pl['region'])['startLine'].toString();\\n        }\\n      }\\n    }\\n  }\\n  if (loc == null) {\\n    for (def l : ctx['locations']) {\\n      if (loc == null \u0026\u0026 l instanceof Map \u0026\u0026 l['logicalLocations'] instanceof List) {\\n        for (def ll : l['logicalLocations']) {\\n          if (loc == null \u0026\u0026 ll instanceof Map) { loc = str(ll['fullyQualifiedName']); }\\n        }\\n      }\\n    }\\n  }\\n}\\nif (endpoint != null \u0026\u0026 (loc == null || props['synthetic_location'] == true)) { loc = endpoint; }\\nif (loc == null) { loc = target; }\\n\\ndef cvss = num(err['cvss']);\\nif (cvss == null) { cvss = num(props['security-severity']); }\\ndef cve = err['cve'];\\nif (cve instanceof String \u0026\u0026 ((String) cve).isEmpty()) { cve = null; }\\nString fp = ctx['partialFingerprints'] instanceof Map ? str(((Map) ctx['partialFingerprints'])['primaryLocationLineHash']) : null;\\nString id = str(ctx['doc_id']);\\nif (id == null \u0026\u0026 str(ctx['tmp_fp']) != null) {\\n  String fpTxt = str(ctx['tmp_fp']);\\n  byte[] fpRaw = Base64.getDecoder().decode(fpTxt.substring(fpTxt.indexOf(':') + 1));\\n  String fpDigits = '0123456789abcdef';\\n  StringBuilder fpHex = new StringBuilder();\\n  for (int fpJ = 0; fpJ \u003c fpRaw.length; fpJ++) {\\n    int fpV = (int) fpRaw[fpJ];\\n    if (fpV \u003c 0) { fpV += 256; }\\n    fpHex.append(fpDigits.substring(fpV / 16, fpV / 16 + 1));\\n    fpHex.append(fpDigits.substring(fpV % 16, fpV % 16 + 1));\\n  }\\n  id = fpHex.toString();\\n}\\n\\nString full = 'errow ' + sev.toUpperCase() + ' ' + (cwe != null ? cwe : (ruleId != null ? ruleId : 'finding'));\\nif (title != null) { full = full + ': ' + title; }\\nif (target != null) { full = full + ' | target=' + target; }\\nif (endpoint != null) { full = full + ' endpoint=' + (method != null ? method + ' ' : '') + endpoint; }\\nif (str(err['id']) != null) { full = full + ' | finding=' + str(err['id']); }\\nif (cvss != null) { full = full + ' cvss=' + cvss; }\\nif (str(err['confidence']) != null) { full = full + ' confidence=' + str(err['confidence']); }\\nfull = cap(full, 1000);\\n\\nList groups = new ArrayList();\\ngroups.add('errow');\\ngroups.add('sarif');\\nif (cwe != null) { groups.add(cwe); }\\n\\nMap alert = new HashMap();\\nalert['@timestamp'] = ctx['@timestamp'];\\nputv(alert, 'id', id);\\nMap src = new HashMap();\\nsrc['system'] = 'errow';\\nsrc['stream'] = 'errow.findings';\\nalert['source'] = src;\\nMap rl = new HashMap();\\nputv(rl, 'id', ruleId);\\nrl['level'] = lvl;\\nputv(rl, 'description', cap(text, 8000));\\nrl['groups'] = groups;\\nMap mitre = ctx['mitre'] instanceof Map ? (Map) ctx['mitre'] : null;\\nif (mitre != null) {\\n  rl['mitre'] = new HashMap(mitre);\\n  alert['mitre'] = new HashMap(mitre);\\n}\\nalert['rule'] = rl;\\nMap ag = new HashMap();\\nputv(ag, 'name', host != null ? host : cap(target, 256));\\nif (isIp(host)) { ag['ip'] = host; }\\nif (!ag.isEmpty()) { alert['agent'] = ag; }\\nputv(alert, 'location', cap(loc, 1024));\\nputv(alert, 'full_log', full);\\nalert['severity'] = sev;\\nMap er = new HashMap();\\nputv(er, 'run', str(ctx['run']));\\nputv(er, 'finding_id', str(err['id']));\\nputv(er, 'cwe', cwe);\\nputv(er, 'cve', cve);\\nputv(er, 'owasp', str(ctx['owasp']));\\nputv(er, 'cvss', cvss);\\nputv(er, 'confidence', str(err['confidence']));\\nputv(er, 'target', target);\\nputv(er, 'endpoint', endpoint);\\nputv(er, 'sarif_rule_id', ruleId);\\nputv(er, 'fingerprint', fp);\\nalert['errow'] = er;\\n\\ndef keepError = ctx['ingest_error'];\\nfor (def k : new ArrayList(ctx.keySet())) {\\n  if (!k.startsWith('_')) { ctx.remove(k); }\\n}\\nctx.putAll(alert);\\nif (keepError != null) { ctx['ingest_error'] = keepError; }\\nif (id != null) { ctx['_id'] = id; }\",\n        \"params\": {\n          \"nl\": \"\\n\"\n        }\n      }\n    }\n  ],\n  \"on_failure\": [\n    {\n      \"set\": {\n        \"field\": \"ingest_error\",\n        \"value\": \"sarif-to-vendetta-alert: {{{_ingest.on_failure_message}}} (processor: {{{_ingest.on_failure_processor_type}}})\"\n      }\n    },\n    {\n      \"script\": {\n        \"description\": \"Keep the record indexable in vendetta-alerts-*: the raw shipper field `source` (string) would clash with the alert's source object.\",\n        \"lang\": \"painless\",\n        \"source\": \"if (ctx['source'] instanceof String) {\\n  ctx['source_raw'] = ctx['source'];\\n  Map s = new HashMap();\\n  s['system'] = 'errow';\\n  s['stream'] = 'errow.findings';\\n  ctx['source'] = s;\\n}\\nif (ctx['id'] == null \u0026\u0026 ctx['doc_id'] != null) { ctx['id'] = ctx['doc_id']; }\"\n      }\n    }\n  ]\n}\n"
  "ingest-pipelines__vendetta-alerts-router.json": "{\n  \"description\": \"index.default_pipeline of vendetta-alerts-*. OpenSearch 2.17 ignores the _bulk ?pipeline= parameter for update + doc_as_upsert actions (only the index default pipeline runs on the upserted doc), so this router picks the transform by record shape: a raw SARIF result (ruleId) -\u003e sarif-to-vendetta-alert; an AIIncidentAnalysis / cs3.ai.inference event (severityAssessment, top level or under analysis) -\u003e aiincident-to-vendetta-alert; native Vendetta alerts and partial updates (rule is an object, no ruleId / severityAssessment) pass through untouched. An explicit ?pipeline= on an index/create request overrides this default. On failure the document is kept and ingest_error is set.\",\n  \"processors\": [\n    {\n      \"pipeline\": {\n        \"description\": \"Raw SARIF result shipped by errow-shipper (CONTRACT s15).\",\n        \"name\": \"sarif-to-vendetta-alert\",\n        \"if\": \"ctx.ruleId != null\"\n      }\n    },\n    {\n      \"pipeline\": {\n        \"description\": \"AIIncidentAnalysis (CONTRACT s4.2), bare or wrapped in a cs3.ai.inference event.\",\n        \"name\": \"aiincident-to-vendetta-alert\",\n        \"if\": \"(ctx.analysis instanceof Map \u0026\u0026 ctx.analysis.severityAssessment != null) || (ctx.severityAssessment != null \u0026\u0026 !(ctx.rule instanceof Map))\"\n      }\n    }\n  ],\n  \"on_failure\": [\n    {\n      \"set\": {\n        \"field\": \"ingest_error\",\n        \"value\": \"vendetta-alerts-router: {{{_ingest.on_failure_message}}} (processor: {{{_ingest.on_failure_processor_type}}})\"\n      }\n    }\n  ]\n}\n"
  "ism-policies__cfgaudit-findings-retention.json": "{\n  \"policy\": {\n    \"description\": \"Cfgaudit findings retention: hot 90d, warm from 90d to 365d, cold after a successful snapshot from 365d, delete after 7 years (2555d).\",\n    \"default_state\": \"hot\",\n    \"states\": [\n      {\n        \"name\": \"hot\",\n        \"actions\": [{ \"index_priority\": { \"priority\": 100 } }],\n        \"transitions\": [{ \"state_name\": \"warm\", \"conditions\": { \"min_index_age\": \"90d\" } }]\n      },\n      {\n        \"name\": \"warm\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 50 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"warm\" }, \"wait_for\": false } },\n          { \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"10m\" }, \"force_merge\": { \"max_num_segments\": 1 } }\n        ],\n        \"transitions\": [{ \"state_name\": \"cold\", \"conditions\": { \"min_index_age\": \"365d\" } }]\n      },\n      {\n        \"name\": \"cold\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 10 } },\n          { \"read_only\": {} },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"30m\" },\n            \"snapshot\": { \"repository\": \"vendetta-snapshots\", \"snapshot\": \"{{ctx.index}}-{{ctx.indexUuid}}\" }\n          },\n          { \"replica_count\": { \"number_of_replicas\": 0 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"cold\" }, \"wait_for\": false } }\n        ],\n        \"transitions\": [{ \"state_name\": \"delete\", \"conditions\": { \"min_index_age\": \"2555d\" } }]\n      },\n      {\n        \"name\": \"delete\",\n        \"actions\": [{ \"delete\": {} }],\n        \"transitions\": []\n      }\n    ],\n    \"ism_template\": [{ \"index_patterns\": [\"cfgaudit-findings-*\"], \"priority\": 100 }]\n  }\n}\n"
  "ism-policies__cfgaudit-runs-retention.json": "{\n  \"policy\": {\n    \"description\": \"Cfgaudit run-summary retention: hot 30d, warm from 30d to 90d, cold after a successful snapshot from 90d, delete after 1 year (365d).\",\n    \"default_state\": \"hot\",\n    \"states\": [\n      {\n        \"name\": \"hot\",\n        \"actions\": [{ \"index_priority\": { \"priority\": 100 } }],\n        \"transitions\": [{ \"state_name\": \"warm\", \"conditions\": { \"min_index_age\": \"30d\" } }]\n      },\n      {\n        \"name\": \"warm\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 50 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"warm\" }, \"wait_for\": false } },\n          { \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"10m\" }, \"force_merge\": { \"max_num_segments\": 1 } }\n        ],\n        \"transitions\": [{ \"state_name\": \"cold\", \"conditions\": { \"min_index_age\": \"90d\" } }]\n      },\n      {\n        \"name\": \"cold\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 10 } },\n          { \"read_only\": {} },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"30m\" },\n            \"snapshot\": { \"repository\": \"vendetta-snapshots\", \"snapshot\": \"{{ctx.index}}-{{ctx.indexUuid}}\" }\n          },\n          { \"replica_count\": { \"number_of_replicas\": 0 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"cold\" }, \"wait_for\": false } }\n        ],\n        \"transitions\": [{ \"state_name\": \"delete\", \"conditions\": { \"min_index_age\": \"365d\" } }]\n      },\n      {\n        \"name\": \"delete\",\n        \"actions\": [{ \"delete\": {} }],\n        \"transitions\": []\n      }\n    ],\n    \"ism_template\": [{ \"index_patterns\": [\"cfgaudit-runs-*\"], \"priority\": 100 }]\n  }\n}\n"
  "ism-policies__cs3-ai-audit-retention.json": "{\n  \"policy\": {\n    \"description\": \"NIST SP 800-53 AU-9 retention for the hash-chained AI audit trail: indices are write-blocked (read_only) after 1d, force-merged and kept with 1 replica, move to box_type=cold at 90d with a snapshot to vendetta-snapshots, and are deleted after 7 years (2555d). The snapshot action sits in the state that precedes delete and is retried; if it keeps failing the index stays in cold and is never deleted without a snapshot. Auto-attached to cs3-ai-audit-* (priority 100). Late events older than 1d are rejected by the write block.\",\n    \"default_state\": \"hot\",\n    \"states\": [\n      {\n        \"name\": \"hot\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 100 } }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"sealed\", \"conditions\": { \"min_index_age\": \"1d\" } }\n        ]\n      },\n      {\n        \"name\": \"sealed\",\n        \"actions\": [\n          { \"read_only\": {} },\n          { \"replica_count\": { \"number_of_replicas\": 1 } },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"10m\" },\n            \"force_merge\": { \"max_num_segments\": 1 }\n          }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"cold\", \"conditions\": { \"min_index_age\": \"90d\" } }\n        ]\n      },\n      {\n        \"name\": \"cold\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 10 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"cold\" }, \"wait_for\": false } },\n          {\n            \"retry\": { \"count\": 10, \"backoff\": \"exponential\", \"delay\": \"30m\" },\n            \"snapshot\": {\n              \"repository\": \"vendetta-snapshots\",\n              \"snapshot\": \"{{ctx.index}}-{{ctx.indexUuid}}\"\n            }\n          }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"delete\", \"conditions\": { \"min_index_age\": \"2555d\" } }\n        ]\n      },\n      {\n        \"name\": \"delete\",\n        \"actions\": [\n          { \"delete\": {} }\n        ],\n        \"transitions\": []\n      }\n    ],\n    \"ism_template\": [\n      { \"index_patterns\": [\"cs3-ai-audit-*\"], \"priority\": 100 }\n    ]\n  }\n}\n"
  "ism-policies__errow-findings-retention.json": "{\n  \"policy\": {\n    \"description\": \"Errow findings retention: hot 90d, warm (box_type=warm, force-merged) from 90d to 365d, cold from 365d (snapshot to vendetta-snapshots first, then 0 replicas, write-blocked, box_type=cold), delete after 7 years (2555d). Auto-attached to errow-findings-* and errow-sarif-* (priority 100). A failed snapshot keeps the index (and its replicas) in the cold state; nothing is deleted without a snapshot.\",\n    \"default_state\": \"hot\",\n    \"states\": [\n      {\n        \"name\": \"hot\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 100 } }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"warm\", \"conditions\": { \"min_index_age\": \"90d\" } }\n        ]\n      },\n      {\n        \"name\": \"warm\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 50 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"warm\" }, \"wait_for\": false } },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"10m\" },\n            \"force_merge\": { \"max_num_segments\": 1 }\n          }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"cold\", \"conditions\": { \"min_index_age\": \"365d\" } }\n        ]\n      },\n      {\n        \"name\": \"cold\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 10 } },\n          { \"read_only\": {} },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"30m\" },\n            \"snapshot\": {\n              \"repository\": \"vendetta-snapshots\",\n              \"snapshot\": \"{{ctx.index}}-{{ctx.indexUuid}}\"\n            }\n          },\n          { \"replica_count\": { \"number_of_replicas\": 0 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"cold\" }, \"wait_for\": false } }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"delete\", \"conditions\": { \"min_index_age\": \"2555d\" } }\n        ]\n      },\n      {\n        \"name\": \"delete\",\n        \"actions\": [\n          { \"delete\": {} }\n        ],\n        \"transitions\": []\n      }\n    ],\n    \"ism_template\": [\n      { \"index_patterns\": [\"errow-findings-*\", \"errow-sarif-*\"], \"priority\": 100 }\n    ]\n  }\n}\n"
  "ism-policies__hot-warm-cold.json": "{\n  \"policy\": {\n    \"description\": \"Tiered lifecycle for daily indices (no rollover - indices are already time-bucketed): hot 7d, warm (box_type=warm, force-merged) until 30d, cold (box_type=cold, write-blocked) until 365d, then delete. Auto-attached to errow-* and cs3-ai-inference-* daily indices (priority 10) and to any vendetta-alerts-* index not claimed by rollover-40gb (priority 50). Requires nodes started with NODE_BOX_TYPE=warm|cold to actually move data; without them shards stay on the hot nodes.\",\n    \"default_state\": \"hot\",\n    \"states\": [\n      {\n        \"name\": \"hot\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 100 } }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"warm\", \"conditions\": { \"min_index_age\": \"7d\" } }\n        ]\n      },\n      {\n        \"name\": \"warm\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 50 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"warm\" }, \"wait_for\": false } },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"10m\" },\n            \"force_merge\": { \"max_num_segments\": 1 }\n          }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"cold\", \"conditions\": { \"min_index_age\": \"30d\" } }\n        ]\n      },\n      {\n        \"name\": \"cold\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 10 } },\n          { \"read_only\": {} },\n          { \"allocation\": { \"require\": { \"box_type\": \"cold\" }, \"wait_for\": false } }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"delete\", \"conditions\": { \"min_index_age\": \"365d\" } }\n        ]\n      },\n      {\n        \"name\": \"delete\",\n        \"actions\": [\n          { \"delete\": {} }\n        ],\n        \"transitions\": []\n      }\n    ],\n    \"ism_template\": [\n      { \"index_patterns\": [\"vendetta-alerts-*\"], \"priority\": 50 },\n      { \"index_patterns\": [\"errow-*\", \"cs3-ai-inference-*\"], \"priority\": 10 }\n    ]\n  }\n}\n"
  "ism-policies__rollover-40gb.json": "{\n  \"policy\": {\n    \"description\": \"Rollover lifecycle for the vendetta-alerts write alias: roll over when the largest primary shard reaches 40gb or the index is 1d old, then warm after 7d, cold after 30d (snapshot to vendetta-snapshots), delete after 365d. Auto-attached to vendetta-alerts-0* (the rollover-numbered backing indices) with priority 100 so it wins over hot-warm-cold. Requires index.plugins.index_state_management.rollover_alias (set by vendetta-alerts-template).\",\n    \"default_state\": \"hot\",\n    \"states\": [\n      {\n        \"name\": \"hot\",\n        \"actions\": [\n          {\n            \"retry\": { \"count\": 3, \"backoff\": \"exponential\", \"delay\": \"1m\" },\n            \"rollover\": { \"min_primary_shard_size\": \"40gb\", \"min_index_age\": \"1d\" }\n          },\n          { \"index_priority\": { \"priority\": 100 } }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"warm\", \"conditions\": { \"min_index_age\": \"7d\" } }\n        ]\n      },\n      {\n        \"name\": \"warm\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 50 } },\n          { \"allocation\": { \"require\": { \"box_type\": \"warm\" }, \"wait_for\": false } },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"10m\" },\n            \"force_merge\": { \"max_num_segments\": 1 }\n          }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"cold\", \"conditions\": { \"min_index_age\": \"30d\" } }\n        ]\n      },\n      {\n        \"name\": \"cold\",\n        \"actions\": [\n          { \"index_priority\": { \"priority\": 10 } },\n          { \"read_only\": {} },\n          { \"allocation\": { \"require\": { \"box_type\": \"cold\" }, \"wait_for\": false } },\n          {\n            \"retry\": { \"count\": 5, \"backoff\": \"exponential\", \"delay\": \"30m\" },\n            \"snapshot\": {\n              \"repository\": \"vendetta-snapshots\",\n              \"snapshot\": \"{{ctx.index}}-{{ctx.indexUuid}}\"\n            }\n          }\n        ],\n        \"transitions\": [\n          { \"state_name\": \"delete\", \"conditions\": { \"min_index_age\": \"365d\" } }\n        ]\n      },\n      {\n        \"name\": \"delete\",\n        \"actions\": [\n          { \"delete\": {} }\n        ],\n        \"transitions\": []\n      }\n    ],\n    \"ism_template\": [\n      { \"index_patterns\": [\"vendetta-alerts-0*\"], \"priority\": 100 }\n    ]\n  }\n}\n"
  "opensearch.single-node.yml": "---\n# vendetta-stack OpenSearch 2.17.1 - single-node variant (compose dev / smoke / CI).\n# Traces: CONTRACT s2 (ports, PKI), s3 (indices/ISM). Same security posture as\n# opensearch.yml: TLS on HTTP + transport, security plugin ON, internal users\n# only. Differences: discovery.type single-node, no seed hosts, memory lock is\n# switchable for hosts that cannot raise RLIMIT_MEMLOCK, shards are not tiered.\n#   NODE_NAME                 default container hostname (entrypoint.sh)\n#   OPENSEARCH_MEMORY_LOCK    true (default) | false\n# TLS material is read from config/certs (mount the stack pki/ dir there).\n\ncluster.name: ${OPENSEARCH_CLUSTER_NAME:vendetta-stack}\nnode.name: ${NODE_NAME}\nnode.roles: [cluster_manager, data, ingest]\nnode.attr.box_type: hot\n\nnetwork.host: 0.0.0.0\nhttp.port: 9200\ntransport.port: 9300\nhttp.compression: true\nhttp.cors.enabled: false\n\ndiscovery.type: single-node\n\nbootstrap.memory_lock: ${OPENSEARCH_MEMORY_LOCK:true}\npath.data: /usr/share/opensearch/data\npath.logs: /usr/share/opensearch/logs\npath.repo: [/usr/share/opensearch/snapshots]\n\ncluster.routing.allocation.disk.threshold_enabled: true\ncluster.routing.allocation.disk.watermark.low: 85%\ncluster.routing.allocation.disk.watermark.high: 90%\ncluster.routing.allocation.disk.watermark.flood_stage: 95%\n\naction.auto_create_index: \"+vendetta-alerts-*,+errow-*,+cs3-ai-*,+security-auditlog-*,+.*,-*\"\naction.destructive_requires_name: true\n\ncompatibility.override_main_response_version: false\n\nplugins.security.ssl.transport.pemcert_filepath: certs/opensearch.crt\nplugins.security.ssl.transport.pemkey_filepath: certs/opensearch.key\nplugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt\nplugins.security.ssl.transport.enforce_hostname_verification: false\nplugins.security.ssl.transport.resolve_hostname: false\nplugins.security.ssl.transport.enabled_protocols: [TLSv1.3, TLSv1.2]\n\nplugins.security.ssl.http.enabled: true\nplugins.security.ssl.http.pemcert_filepath: certs/opensearch.crt\nplugins.security.ssl.http.pemkey_filepath: certs/opensearch.key\nplugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt\nplugins.security.ssl.http.clientauth_mode: OPTIONAL\nplugins.security.ssl.http.enabled_protocols: [TLSv1.3, TLSv1.2]\n\nplugins.security.nodes_dn:\n  - 'CN=opensearch*'\nplugins.security.authcz.admin_dn:\n  - 'CN=vendetta-admin,O=vendetta-stack'\n\nplugins.security.allow_default_init_securityindex: true\nplugins.security.allow_unsafe_democertificates: false\nplugins.security.restapi.roles_enabled: [all_access, security_rest_api_access]\nplugins.security.restapi.password_min_length: 12\nplugins.security.restapi.password_score_based_validation_strength: strong\nplugins.security.system_indices.enabled: true\nplugins.security.enable_snapshot_restore_privilege: true\nplugins.security.check_snapshot_restore_write_privileges: true\nplugins.security.cache.ttl_minutes: 60\n\nplugins.security.audit.type: internal_opensearch\n"
  "opensearch.yml": "---\n# vendetta-stack OpenSearch 2.17.1 - production 3-node cluster configuration.\n# Traces: PROMPT Tier 3 (indexer); CONTRACT s2 (ports, PKI, secrets), s3 (indices/ISM);\n#         deployment/operations/opensearch-cluster.md.\n#\n# Every node runs this same file (mounted ro at\n# /usr/share/opensearch/config/opensearch.yml). Per-node values come from the\n# environment through ${VAR[:default]} substitution:\n#   NODE_NAME                           unique node name (entrypoint.sh defaults it to $HOSTNAME)\n#   NODE_BOX_TYPE                       hot | warm | cold  (default hot) -\u003e node.attr.box_type\n#   OPENSEARCH_CLUSTER_NAME             default vendetta-stack\n#   OPENSEARCH_SEED_HOSTS               comma separated discovery hosts\n#   OPENSEARCH_INITIAL_MANAGERS         comma separated node names (first bootstrap only)\n# TLS material is read from config/certs (mount the stack pki/ dir there):\n#   opensearch.crt, opensearch.key (PKCS#8), ca.crt.\n\ncluster.name: ${OPENSEARCH_CLUSTER_NAME:vendetta-stack}\nnode.name: ${NODE_NAME}\n# 3 identical master-eligible data nodes keep a quorum of 2 with no spare\n# hardware. Add dedicated warm/cold data-only nodes by overriding node.roles\n# with NODE_BOX_TYPE=warm|cold in the same file (roles: see RUNTIME.md).\nnode.roles: [cluster_manager, data, ingest]\n# Hot/warm/cold tier attribute used by ISM `allocation` actions and by the\n# index templates (index.routing.allocation.require.box_type).\nnode.attr.box_type: ${NODE_BOX_TYPE:hot}\n\nnetwork.host: 0.0.0.0\nhttp.port: 9200\ntransport.port: 9300\nhttp.compression: true\nhttp.cors.enabled: false\n\ndiscovery.seed_hosts: ${OPENSEARCH_SEED_HOSTS:opensearch-0.opensearch,opensearch-1.opensearch,opensearch-2.opensearch}\n# Only consulted while the cluster is bootstrapping for the first time.\ncluster.initial_cluster_manager_nodes: ${OPENSEARCH_INITIAL_MANAGERS:opensearch-0,opensearch-1,opensearch-2}\n\nbootstrap.memory_lock: true\npath.data: /usr/share/opensearch/data\npath.logs: /usr/share/opensearch/logs\n# Filesystem snapshot repository (apply.sh registers `vendetta-snapshots`).\n# Must be a volume shared by all nodes (NFS / RWX PVC) in a multi-node cluster.\npath.repo: [/usr/share/opensearch/snapshots]\n\n# Tier-aware allocation. box_type awareness keeps copies of non-tiered\n# (system) indices on different tiers; tier-pinned indices are constrained by\n# index.routing.allocation.require.box_type instead.\ncluster.routing.allocation.awareness.attributes: box_type\ncluster.routing.allocation.disk.threshold_enabled: true\ncluster.routing.allocation.disk.watermark.low: 85%\ncluster.routing.allocation.disk.watermark.high: 90%\ncluster.routing.allocation.disk.watermark.flood_stage: 95%\n\n# Only the stack's index families (CONTRACT s3), system indices and the\n# security audit log may be created implicitly. The bare alias name\n# `vendetta-alerts` is deliberately NOT allowed: a write to it before\n# apply.sh ran would otherwise create a concrete index with the alias name.\naction.auto_create_index: \"+vendetta-alerts-*,+errow-*,+cs3-ai-*,+security-auditlog-*,+.*,-*\"\naction.destructive_requires_name: true\n\n# Reports the real OpenSearch version. Set true only for clients that\n# insist on an Elasticsearch 7.10.2 handshake (legacy Beats / Wazuh tooling).\ncompatibility.override_main_response_version: false\n\n# ---- Security plugin: TLS on transport and HTTP, internal user database ----\nplugins.security.ssl.transport.pemcert_filepath: certs/opensearch.crt\nplugins.security.ssl.transport.pemkey_filepath: certs/opensearch.key\nplugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt\nplugins.security.ssl.transport.enforce_hostname_verification: false\nplugins.security.ssl.transport.resolve_hostname: false\nplugins.security.ssl.transport.enabled_protocols: [TLSv1.3, TLSv1.2]\n\nplugins.security.ssl.http.enabled: true\nplugins.security.ssl.http.pemcert_filepath: certs/opensearch.crt\nplugins.security.ssl.http.pemkey_filepath: certs/opensearch.key\nplugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt\nplugins.security.ssl.http.clientauth_mode: OPTIONAL\nplugins.security.ssl.http.enabled_protocols: [TLSv1.3, TLSv1.2]\n\n# Node certificates: CN=opensearch* (the pki/ `opensearch` service cert).\nplugins.security.nodes_dn:\n  - 'CN=opensearch*'\n# Client certificate allowed to run securityadmin.sh / the security REST API.\nplugins.security.authcz.admin_dn:\n  - 'CN=vendetta-admin,O=vendetta-stack'\n\n# First start loads config/opensearch-security/*.yml (rendered by\n# entrypoint.sh from opensearch/security/) into the security index.\nplugins.security.allow_default_init_securityindex: true\nplugins.security.allow_unsafe_democertificates: false\nplugins.security.restapi.roles_enabled: [all_access, security_rest_api_access]\nplugins.security.restapi.password_min_length: 12\nplugins.security.restapi.password_score_based_validation_strength: strong\nplugins.security.system_indices.enabled: true\nplugins.security.enable_snapshot_restore_privilege: true\nplugins.security.check_snapshot_restore_write_privileges: true\nplugins.security.cache.ttl_minutes: 60\n\n# Audit categories / noise filters live in security/audit.yml.\nplugins.security.audit.type: internal_opensearch\n"
  "security__action_groups.yml": "---\n_meta:\n  type: \"actiongroups\"\n  config_version: 2\n"
  "security__allowlist.yml": "---\n_meta:\n  type: \"allowlist\"\n  config_version: 2\n\nconfig:\n  enabled: false\n  requests: {}\n"
  "security__audit.yml": "---\n# Audit log of the security plugin -\u003e security-auditlog-YYYY.MM.dd indices.\n# Failed logins, missing privileges, bad headers, TLS errors and changes to the\n# security configuration are recorded; successful reads/writes by the data\n# plane (AUTHENTICATED / GRANTED_PRIVILEGES) are not, to keep ingest quiet.\n# Request bodies are never logged (they may contain telemetry).\n_meta:\n  type: \"audit\"\n  config_version: 2\n\nconfig:\n  enabled: true\n  audit:\n    enable_rest: true\n    disabled_rest_categories:\n      - AUTHENTICATED\n      - GRANTED_PRIVILEGES\n    enable_transport: true\n    disabled_transport_categories:\n      - AUTHENTICATED\n      - GRANTED_PRIVILEGES\n    ignore_users:\n      - kibanaserver\n    ignore_requests: []\n    resolve_bulk_requests: false\n    log_request_body: false\n    resolve_indices: true\n    exclude_sensitive_headers: true\n  compliance:\n    enabled: true\n    internal_config: true\n    external_config: false\n    read_metadata_only: true\n    read_watched_fields: {}\n    read_ignore_users:\n      - kibanaserver\n    write_metadata_only: true\n    write_log_diffs: false\n    write_watched_indices: []\n    write_ignore_users:\n      - kibanaserver\n"
  "security__config.yml": "---\n# Security plugin dynamic configuration (loaded into the security index on the\n# first start). Traces: CONTRACT s2 (basic-auth on 9200). Only the internal\n# user database over HTTP basic is enabled; anonymous access, proxy, JWT, LDAP\n# and Kerberos are off. Dashboards multi-tenancy is off: the SOC works in one\n# global space so saved objects import without a tenant header.\n_meta:\n  type: \"config\"\n  config_version: 2\n\nconfig:\n  dynamic:\n    http:\n      anonymous_auth_enabled: false\n      xff:\n        enabled: false\n    authc:\n      basic_internal_auth_domain:\n        description: \"Authenticate via HTTP Basic against the internal users database\"\n        http_enabled: true\n        transport_enabled: true\n        order: 0\n        http_authenticator:\n          type: basic\n          challenge: true\n        authentication_backend:\n          type: intern\n    authz: {}\n    kibana:\n      multitenancy_enabled: false\n      server_username: kibanaserver\n      index: .kibana\n    hosts_resolver_mode: ip-only\n    do_not_fail_on_forbidden: false\n"
  "security__nodes_dn.yml": "---\n_meta:\n  type: \"nodesdn\"\n  config_version: 2\n"
  "security__roles.yml": "---\n# Custom roles for the stack's data plane (CONTRACT s3 index families).\n# `admin` (all_access) is the only user created by entrypoint.sh; map further\n# users to these roles through the security REST API with least privilege:\n#   vendetta_ingest  - writers (Fluentd, apply init job with a non-admin user)\n#   vendetta_analyst - read-only analysts / Grafana / vendetta-to-errow poller\n_meta:\n  type: \"roles\"\n  config_version: 2\n\nvendetta_ingest:\n  reserved: false\n  description: \"Fluentd / shim writers for the stack index families\"\n  cluster_permissions:\n    - \"cluster_composite_ops\"\n    - \"cluster:monitor/main\"\n    - \"cluster:monitor/health\"\n    - \"indices:admin/template/get\"\n    - \"indices:admin/index_template/get\"\n  index_permissions:\n    - index_patterns:\n        - \"vendetta-alerts*\"\n        - \"errow-*\"\n        - \"cs3-ai-*\"\n      allowed_actions:\n        - \"indices:data/write/*\"\n        - \"indices:data/read/get*\"\n        - \"indices:data/read/search*\"\n        - \"indices:admin/create\"\n        - \"indices:admin/mapping/put\"\n        - \"indices:admin/aliases/get\"\n        - \"indices:admin/get\"\n        - \"indices:monitor/stats\"\n\nvendetta_analyst:\n  reserved: false\n  description: \"Read-only access to alerts, findings and AI audit data\"\n  cluster_permissions:\n    - \"cluster_composite_ops_ro\"\n    - \"cluster:monitor/main\"\n    - \"cluster:monitor/health\"\n  index_permissions:\n    - index_patterns:\n        - \"vendetta-alerts*\"\n        - \"errow-*\"\n        - \"cs3-ai-*\"\n      allowed_actions:\n        - \"read\"\n        - \"indices:admin/get\"\n        - \"indices:admin/mappings/get\"\n        - \"indices:monitor/settings/get\"\n    - index_patterns:\n        - \".kibana*\"\n      allowed_actions:\n        - \"read\"\n        - \"write\"\n        - \"delete\"\n        - \"create_index\"\n"
  "security__roles_mapping.yml": "---\n_meta:\n  type: \"rolesmapping\"\n  config_version: 2\n\nall_access:\n  reserved: false\n  backend_roles:\n    - \"admin\"\n  description: \"Maps the admin backend role to all_access\"\n\nsecurity_rest_api_access:\n  reserved: true\n  backend_roles:\n    - \"admin\"\n  description: \"Lets admin call the security REST API\"\n\nvendetta_ingest:\n  reserved: false\n  backend_roles:\n    - \"vendetta-ingest\"\n  description: \"Maps backend role vendetta-ingest\"\n\nvendetta_analyst:\n  reserved: false\n  backend_roles:\n    - \"vendetta-analyst\"\n  description: \"Maps backend role vendetta-analyst\"\n"
  "security__tenants.yml": "---\n_meta:\n  type: \"tenants\"\n  config_version: 2\n"

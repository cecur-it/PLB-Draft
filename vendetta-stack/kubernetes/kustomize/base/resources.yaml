  "index-templates__errow-generic-template.json": "{\n  \"index_patterns\": [\n    \"errow-coverage-*\",\n    \"errow-llm-logs-*\",\n    \"errow-mcp-*\",\n    \"errow-runtime-*\",\n    \"errow-proxy-*\",\n    \"errow-tooling-*\",\n    \"errow-tui-*\",\n    \"errow-cloud-*\",\n    \"errow-telemetry-*\",\n    \"errow-agent-state-*\",\n    \"errow-viewer-*\",\n    \"errow-report-artifacts-*\",\n    \"errow-sarif-*\"\n  ],\n  \"priority\": 100,\n  \"version\": 1,\n  \"_meta\": {\n    \"description\": \"Generic mapping for the remaining Errow stream families (CONTRACT s3/s15). Priority 100 \u003c 200 so the specific templates (errow-findings/-sarif, -runs, -transcripts, -threat-models) always win: composable templates are not merged, the highest priority match applies alone. errow-sarif-* is listed here only as a safety net; its specific mapping is errow-findings-template.json. Includes the LlmRequestEvent fields (errow-llm-logs-*) and the cs3.ai.tool_call fields that the gateway also routes into errow-mcp-*.\",\n    \"managed_by\": \"vendetta-stack/opensearch/apply.sh\"\n  },\n  \"template\": {\n    \"settings\": {\n      \"index.number_of_shards\": 1,\n      \"index.number_of_replicas\": 1,\n      \"index.refresh_interval\": \"10s\",\n      \"index.codec\": \"best_compression\",\n      \"index.routing.allocation.require.box_type\": \"hot\",\n      \"index.mapping.total_fields.limit\": 2000,\n      \"index.mapping.ignore_malformed\": true\n    },\n    \"mappings\": {\n      \"dynamic\": true,\n      \"date_detection\": false,\n      \"numeric_detection\": false,\n      \"dynamic_templates\": [\n        {\n          \"free_text_strings\": {\n            \"match_mapping_type\": \"string\",\n            \"match_pattern\": \"regex\",\n            \"match\": \"^(message|msg|line|log|raw|content|text|.*_(message|description|summary|output|log))$\",\n            \"mapping\": { \"type\": \"text\", \"norms\": false }\n          }\n        },\n        {\n          \"strings_as_ke
# Source: vendetta-stack/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-lb-config
  labels:
    app.kubernetes.io/name: vendetta-stack
    app.kubernetes.io/instance: vendetta-stack
    app.kubernetes.io/component: llm-gateway
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: vendetta-stack-1.0.0
data:
  "haproxy.cfg": "# haproxy.cfg — ollama-lb: sovereign LLM load balancer in the llm-gateway network namespace.\n#\n# Traces: PROMPT §1 Tier 4 (model failover cascade, no single GPU node), PROMPT §3 (mTLS between tiers,\n#         no admin surface), CONTRACT §8.1 (worker topology), CS3 §4.5 (LB topologies; this file is the\n#         hardened port of deployment/docker/ollama-lb/haproxy.cfg).\n#\n# Topology: llm-gateway --plain HTTP--\u003e 127.0.0.1:11434 (this LB, same netns)\n#                       --mTLS--\u003e ollama-workers:11443 (worker-proxy.cfg sidecar) --\u003e Ollama 127.0.0.1:11434\n#   * Workers are discovered by DNS name `ollama-workers` (compose network alias / K8s headless Service);\n#     server-template keeps up to 8 slots in sync with the A records (resolvers `sys` = /etc/resolv.conf),\n#     and `init-addr none` lets the LB start before any worker exists.\n#   * Every worker certificate is the shared /pki/ollama-1.pem identity (CONTRACT §12.6) =\u003e verifyhost ollama-1.\n#   * Backpressure protects the GPU KV-cache: per-server maxconn 4 (= OLLAMA_NUM_PARALLEL), excess requests\n#     queue up to 30s, a deeper queue is rejected at once with 429, then 503 when the queue times out.\n#   * Model-management and admin endpoints are NEVER forwarded (403): weights change only through the\n#     provisioning path (pull-models.sh), not through the inference path.\n# Files: /pki/ca.crt, /pki/ollama-lb.pem (cert+key). Mount this file at /usr/local/etc/haproxy/haproxy.cfg:ro.\n# Validate: haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg   (needs the /pki files and a resolv.conf).\n\nglobal\n  log stdout format raw local0\n  maxconn 512\n  expose-experimental-directives\n  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets\n  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256\n  ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets\n  ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256\n\nresolvers sys\n  parse-resolv-conf\n  accepted_payload_size 8192\n  hold valid 10s\n  hold nx 5s\n  hold timeout 5s\n  resolve_retries 3\n  timeout resolve 1s\n  timeout retry 1s\n\ndefaults\n  mode http\n  log global\n  option httplog\n  option dontlognull\n  option redispatch\n  retries 2\n  retry-on conn-failure\n  timeout connect 3s\n  timeout client 600s\n  timeout server 600s\n  timeout http-request 15s\n  timeout queue 30s\n  timeout tunnel 1h\n  timeout check 5s\n\nfrontend ollama_in\n  bind 127.0.0.1:11434\n  maxconn 256\n\n  # Normalise first so encodings, doubled slashes and dot-segments cannot dodge the path rules.\n  http-request normalize-uri percent-decode-unreserved\n  http-request normalize-uri path-merge-slashes\n  http-request normalize-uri path-strip-dotdot full\n\n  acl p_mutating path_reg -i ^/api/(pull|push|create|delete|copy|blobs)(/|$)\n  acl p_admin path_reg -i ^/(admin|debug|metrics|stats|healthz|__control)(/|$)\n  acl p_inference path_reg -i ^/(api/(chat|generate|tags|version|show|ps|embed|embeddings)|v1/(chat/completions|completions|models|embeddings)(/.*)?)?$\n  http-request deny deny_status 403 if p_mutating\n  http-request deny deny_status 403 if p_admin\n  http-request deny deny_status 403 if !p_inference\n\n  # Queue too deep to be served inside timeout queue: shed load so the gateway can fail over quickly.\n  http-request deny deny_status 429 if { queue(ollama_pool) gt 32 }\n  default_backend ollama_pool\n\nbackend ollama_pool\n  balance leastconn\n  option httpchk GET /api/tags\n  http-check expect status 200\n  default-server ssl verify required ca-file /pki/ca.crt crt /pki/ollama-lb.pem verifyhost ollama-1 sni str(ollama-1) check check-sni ollama-1 inter 5s fall 3 rise 2 maxconn 4 slowstart 30s on-marked-down shutdown-sessions\n  server-template ollama 1-8 ollama-workers:11443 resolvers sys resolve-prefer ipv4 init-addr none\n\n# Operations listener (same netns as the gateway): liveness, Prometheus metrics and the stats page.\nfrontend ollama_ops\n  bind 127.0.0.1:8404\n  mode http\n  option dontlog-normal\n  monitor-uri /healthz\n  # /healthz = process liveness (stays 200 with no worker so the gateway still boots and degrades to\n  # heuristics); /ready = at least one healthy worker.\n  http-request return status 503 content-type text/plain string \"no healthy ollama worker\\n\" if { path /ready } { nbsrv(ollama_pool) lt 1 }\n  http-request return status 200 content-type text/plain string \"ready\\n\" if { path /ready }\n  http-request use-service prometheus-exporter if { path /metrics }\n  stats enable\n  stats uri /stats\n  stats refresh 10s\n  stats show-legends\n"
  "worker-proxy.cfg": "# worker-proxy.cfg — ollama-N-proxy: mTLS terminator sidecar in each Ollama worker's network namespace.\n#\n# Traces: PROMPT §1 Tier 4 (HAProxy -\u003e Ollama workers over mTLS), PROMPT §3 (Ollama never exposed in\n#         clear text), CONTRACT §8.1 (Ollama stays on 127.0.0.1:11434; this proxy publishes :11443).\n#\n# Netns: shares the worker's namespace (compose `network_mode: service:ollama-1`, K8s sidecar container),\n#        so 127.0.0.1:11434 is the Ollama API. Only the LB (client certificate signed by /pki/ca.crt)\n#        can reach the worker; no certificate =\u003e TLS handshake fails.\n# Files: /pki/ollama-1.pem (cert+key, shared worker identity, SAN ollama-1), /pki/ca.crt (read-only).\n#        Mount this file at /usr/local/etc/haproxy/haproxy.cfg:ro. Runs as the image's `haproxy` user.\n# Health: plain-HTTP loopback listener 127.0.0.1:8405 `GET /healthz` (200 only while Ollama answers\n#         /api/tags). Container check: wget -q -O /dev/null http://127.0.0.1:8405/healthz\n#         The same `monitor-uri /healthz` is also served on the mTLS listener for clients holding a cert.\n# Same path policy as haproxy.cfg: model-management and admin endpoints answer 403 even from the LB.\n# Validate: haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg   (needs the /pki files).\n\nglobal\n  log stdout format raw local0\n  maxconn 256\n  expose-experimental-directives\n  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets\n  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256\n\ndefaults\n  mode http\n  log global\n  option httplog\n  option dontlognull\n  retries 1\n  retry-on conn-failure\n  timeout connect 3s\n  timeout client 600s\n  timeout server 600s\n  timeout http-request 15s\n  timeout queue 30s\n  timeout tunnel 1h\n  timeout check 5s\n\nfrontend ollama_mtls\n  bind :11443 ssl crt /pki/ollama-1.pem ca-file /pki/ca.crt verify required\n  maxconn 128\n  monitor-uri /healthz\n  monitor fail if { nbsrv(ollama_local) lt 1 }\n\n  http-request normalize-uri percent-decode-unreserved\n  http-request normalize-uri path-merge-slashes\n  http-request normalize-uri path-strip-dotdot full\n\n  acl p_mutating path_reg -i ^/api/(pull|push|create|delete|copy|blobs)(/|$)\n  acl p_admin path_reg -i ^/(admin|debug|metrics|stats|healthz|__control)(/|$)\n  acl p_inference path_reg -i ^/(api/(chat|generate|tags|version|show|ps|embed|embeddings)|v1/(chat/completions|completions|models|embeddings)(/.*)?)?$\n  http-request deny deny_status 403 if p_mutating\n  http-request deny deny_status 403 if p_admin\n  http-request deny deny_status 403 if !p_inference\n  default_backend ollama_local\n\nfrontend worker_health\n  bind 127.0.0.1:8405\n  mode http\n  option dontlog-normal\n  monitor-uri /healthz\n  monitor fail if { nbsrv(ollama_local) lt 1 }\n\nbackend ollama_local\n  balance first\n  option httpchk GET /api/tags\n  http-check expect status 200\n  server ollama 127.0.0.1:11434 check inter 5s fall 3 rise 2 maxconn 8\n"
---
# Source: vendetta-stack/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
  labels:
    app.kubernetes.io/name: vendetta-stack
    app.kubernetes.io/instance: vendetta-stack
    app.kubernetes.io/component: errow-mcp
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: vendetta-stack-1.0.0
data:
  "errow-config.yaml": "# errow-config.yaml - documented, env-style configuration of the stack's Errow orchestrator (service `errow`, `errow-viewer`).\n# Traces: CONTRACT §2 (paths/ports), §4.4 (gateway-only LLM), §8 (Errow addenda), §11 (RUNTIME.md).\n#\n# Read by errow-entrypoint at start (installed at /etc/errow/errow-config.yaml; override with ERROW_CONFIG_FILE) through\n# stack-config.py. Precedence for every setting: container environment (compose `environment:`) \u003e this file \u003e built-in default,\n# so an operator can always override a value without editing the image. `profiles.\u003cCS3_PROFILE\u003e.env` overlays `env`.\n#\n# What this file may NOT contain: secrets and gateway wiring. Names outside the allow-list in stack-config.py are rejected\n# (entrypoint exit 78): keys/tokens come only from files (/run/secrets/llm_gateway_token, LLM_API_KEY_FILE in profile `cloud`),\n# and LLM_API_BASE / errow_LLM / errow_APP_URL / errow_IMAGE / errow_TELEMETRY are derived by the entrypoint from the settings below.\n#\n# Where Errow writes things (not configurable upstream, listed so operators know what to mount):\n#   /workspace/errow_runs/\u003crun\u003e/   run.json vulnerabilities.json findings.sarif coverage.json errow.log .state/  (volume errow-runs)\n#   /var/log/errow/cli.log         redacted copy of the CLI stdout/stderr                                         (volume errow-ndjson)\n#   /var/log/errow/*.ndjson        written by errow-shipper from the run artifacts\n#   $HOME/.errow/                  Errow's 0600 config (cli-config.json, written via errow/utils/secret_files.py) - keep HOME on a tmpfs\nversion: 1\n\nenv:\n  # ------------------------------------------------------------------ scan defaults (errow --scan-mode / --fail-on / --instruction-file)\n  # quick    fast CI/CD-style checks; the stack default so an unattended scan stays short on a local model\n  # standard routine testing\n  # deep     thorough review (Errow's own default); use for scheduled lab scans with the forensic model\n  ERROW_SCAN_MODE: quick\n  # Exit-code gate for CI use (errow --fail-on); unset keeps Errow's default (any finding exits 2).\n  # ERROW_FAIL_ON: high\n  # Optional per-run instructions file; mount it read-only.\n  # ERROW_INSTRUCTION_FILE: /workspace/instructions/scope.md\n\n  # ------------------------------------------------------------------ sandbox (Kali image run inside the errow-dind daemon)\n  # Built from errow/Dockerfile.sandbox (upstream containers/Dockerfile + gobuster + bbot). Default (when unset):\n  # vendetta-stack/errow-sandbox:${STACK_VERSION}; set ERROW_SANDBOX_IMAGE in the environment to pin another tag or a digest.\n  # When the daemon does not have the image yet, mount a `docker save` tarball and set ERROW_SANDBOX_IMAGE_TAR (loaded before the\n  # first scan).\n  # ERROW_SANDBOX_IMAGE_TAR: /images/errow-sandbox.tar\n  ERROW_DIND_TIMEOUT: 120\n\n  # ------------------------------------------------------------------ telemetry: OPT-IN (default OFF in every profile)\n  # `true` enables Errow's PostHog events (errow_TELEMETRY) in profiles cloud/onprem/edge only. Profile airgap forces false.\n  ERROW_TELEMETRY: false\n  # Errow Cloud (reports, email verification, remote source upload) stays blackholed (errow_APP_URL=http://127.0.0.1:9)\n  # unless a cloud-profile deployment explicitly enables it; profile airgap refuses it (fail-closed).\n  ERROW_CLOUD_ENABLED: false\n  ERROW_CLOUD_URL: https://app.errow.ai\n\n  # ------------------------------------------------------------------ target safety\n  # Comma-separated host globs a scan target must match (entrypoint exit 77 otherwise). The shipped default only permits the\n  # Vendetta lab target; widen it per engagement, and do not remove it in production.\n  ERROW_ALLOWED_TARGETS: \"scan-target.vendetta.lab,*.vendetta.lab\"\n\n  # ------------------------------------------------------------------ report / log directories (inside the container)\n  ERROW_WORKDIR: /workspace\n  ERROW_LOG_DIR: /var/log/errow\n\n  # ------------------------------------------------------------------ viewer (`errow-viewer`, mode view)\n  ERROW_VIEWER_HOST: 0.0.0.0\n  ERROW_VIEWER_PORT: 8765\n  # re-serve the newest run when a newer run.json appears (the upstream viewer serves exactly one run per process)\n  ERROW_VIEWER_FOLLOW: true\n  ERROW_VIEWER_POLL: 10\n  ERROW_VIEWER_MIN_RESTART: 60\n\n  # ------------------------------------------------------------------ Errow tuning passed through untouched\n  errow_MAX_CONTEXT_IMAGES: 3\n  errow_TOOL_OUTPUT_MAX_TOKENS: 8000\n  # local models behind the gateway have no provider-side prompt cache\n  errow_PROMPT_CACHE: false\n\nprofiles:\n  cloud: {}\n  onprem: {}\n  edge:\n    env:\n      # small edge nodes: keep tool output compact for the local model's context window\n      errow_TOOL_OUTPUT_MAX_TOKENS: 4000\n  airgap:\n    env:\n      ERROW_TELEMETRY: false\n      ERROW_CLOUD_ENABLED: false\n"
  "llm-providers.yaml": "# llm-providers.yaml - LLM provider policy of the stack's Errow orchestrator: sovereign Ollama tier reached ONLY through the llm-gateway.\n# Traces: CONTRACT §4.4 (gateway /v1/chat/completions, bearer, allow-listed models), §4.5 (policy), §8 (Errow addenda), §11 (RUNTIME.md).\n#\n# Installed at /etc/errow/llm-providers.yaml and enforced by errow-entrypoint (stack-config.py check-llm): in every profile except\n# `cloud` the effective model (errow_LLM=openai/\u003cCS3_MODEL_ERROW_SECURITY\u003e, i.e. the route cs3-errow-security or its bare model tag) must be an approved model of an enabled gateway provider, and a\n# policy file that enables the direct cloud provider outside `cloud` fails closed (exit 78).\n#\n# How Errow reaches the model (Errow speaks LiteLLM; `openai/\u003cid\u003e` selects the OpenAI-compatible adapter):\n#   errow_LLM=openai/nemotron-3-nano:30b   LLM_API_BASE=https://llm-gateway:9101/v1   LLM_API_KEY=\u003cllm_gateway_token file content\u003e\n#   (the security classes are served by the agentic tier; the gateway answers /v1/chat/completions and degrades nemotron -\u003e gemma4:31b inside the\n#    chain, logging degraded_model_fallback=true. OLLAMA_SECURITY_MODEL must therefore stay listed below.)\n#   LLM_DISABLE_STREAMING=true             (the gateway returns whole, schema-checked responses)\n#   Ollama itself (127.0.0.1:11434) is never contacted by Errow: the gateway adds the guardrails, audit, metrics and the allow-list.\n#\n# Secrets (honours errow/utils/secret_files.py, the file-path secret contract): no key appears in this file, in the environment of the\n# image, or in compose `environment:`. The gateway bearer is read by the entrypoint from LLM_GATEWAY_TOKEN_FILE (/run/secrets/llm_gateway_token)\n# and exported into the Errow process only. Errow's own TUI persistence writes env values to ~/.errow/cli-config.json through\n# write_secret_text (atomic, 0600, O_EXCL under ~/.errow/); the stack never loosens that: HOME is an ephemeral tmpfs, the entrypoint scans\n# the file for stale cloud keys before every start, and its logs redact tokens. In profile `cloud` the direct route reads the key from\n# LLM_API_KEY_FILE the same way (a path, never the value).\nversion: 1\n\ngateway:\n  url_env: LLM_GATEWAY_URL                  # default https://llm-gateway:9101 (TLS from the stack PKI, trust anchor /pki/ca.crt)\n  api_path: /v1\n  api_type: chat_completions                # LlmSettings.api_type (errow_API_TYPE); Ollama/gateway implement chat completions only\n  bearer_token_file: /run/secrets/llm_gateway_token\n  request_headers:                          # optional correlation, sent through LLM_EXTRA_HEADERS from ERROW_TENANT_ID / ERROW_INCIDENT_ID\n    - X-Tenant-Id\n    - X-Incident-Id\n    - X-Request-Id\n\ndefaults:\n  temperature: 0.2                          # also the gateway's own default and clamp base (llm-gateway/prompts.py)\n  streaming: false                          # LLM_DISABLE_STREAMING=true\n  timeout_seconds: 600                      # LLM_TIMEOUT; CPU-only local inference is slow, the gateway enforces INFERENCE_TIMEOUT_MS per tier\n  # strict JSON: every machine-consumed answer (alert triage, forensic analysis, retest decisions) must validate against the\n  # AIIncidentAnalysis schema (CONTRACT §4.2). The gateway enforces it on /triage and /forensic and falls back tier by tier\n  # (primary -\u003e forensic -\u003e deterministic heuristics); Errow's own agent loop uses tool calls, so it is not forced into JSON mode.\n  strict_json: true\n\nproviders:\n  ollama-gateway:\n    kind: openai-compatible                 # litellm prefix `openai/`\n    endpoint: gateway                       # see `gateway:` above; never a direct Ollama or vendor URL\n    models:\n      - id: nemotron-3-nano:30b             # security classes are served by the agentic tier (OLLAMA_SECURITY_MODEL, INFERENCE_MODEL_ERROW_SECURITY)\n        role: errow-security\n      - id: cs3-errow-security              # the same tier as a router ROUTE (CS3_MODEL_ERROW_SECURITY): nemotron -\u003e gemma4:31b,\n        role: errow-security                # so Errow can name the route and let the gateway own the degraded chain\n      - id: nemotron-3-nano:30b             # primary / triage tier (OLLAMA_PRIMARY_MODEL, INFERENCE_MODEL_TRIAGE)\n        role: primary\n      - id: gemma4:26b                      # forensic fallback tier (OLLAMA_FALLBACK_MODEL, INFERENCE_MODEL_FORENSIC)\n        role: forensic\n      - id: gemma4:31b                      # deep reasoning and the only security/Errow fallback (INFERENCE_MODEL_REASONING_DEEP)\n        role: security-fallback\n  cloud-direct:\n    # The ONLY place a cloud credential may exist. Disabled everywhere except profile `cloud`, and even there only with\n    # ERROW_LLM_ROUTE=direct: errow_LLM=\u003clitellm model id\u003e, LLM_API_BASE optional, key read from the file named by LLM_API_KEY_FILE.\n    kind: cloud-direct\n    key_file_env: LLM_API_KEY_FILE\n    models: []                              # operator's choice; not checked by the stack\n\nprofiles:\n  cloud:\n    providers: [ollama-gateway, cloud-direct]\n  onprem:\n    providers: [ollama-gateway]\n  airgap:\n    providers: [ollama-gateway]\n  edge:\n    providers: [ollama-gateway]\n\n# Environment names that make a non-cloud profile refuse to start (entrypoint exit 78; names only are logged, never values; each is\n# also refused with the _FILE suffix). Keep identical to CLOUD_KEY_VARS in entrypoint.sh (tests/test_stack_config.py enforces it).\nforbidden_env:\n  - GEMINI_API_KEY\n  - GOOGLE_API_KEY\n  - DEEPSEEK_API_KEY\n  - OPENAI_API_KEY\n  - ANTHROPIC_API_KEY\n  - AZURE_API_KEY\n  - AZURE_OPENAI_API_KEY\n  - GROQ_API_KEY\n  - MISTRAL_API_KEY\n  - OPENROUTER_API_KEY\n  - COHERE_API_KEY\n  - TOGETHERAI_API_KEY\n  - XAI_API_KEY\n  - PERPLEXITYAI_API_KEY\n  - PERPLEXITY_API_KEY\n  - EXA_API_KEY\n  - AWS_ACCESS_KEY_ID\n  - AWS_SECRET_ACCESS_KEY\n  - AWS_BEARER_TOKEN_BEDROCK\n  - GOOGLE_APPLICATION_CREDENTIALS\n"
  "scan-target.nginx.conf": "# Static scan target for the `lab` profile: an allow-listed, harmless HTTP endpoint that Errow/MCP tools may probe.\n# Mounted over /etc/nginx/nginx.conf (read-only rootfs, uid-agnostic: every writable path is under /tmp).\nworker_processes 1;\npid /tmp/nginx.pid;\nevents { worker_connections 64; }\nhttp {\n  access_log /dev/stdout;\n  error_log /dev/stderr warn;\n  client_body_temp_path /tmp/body;\n  proxy_temp_path /tmp/proxy;\n  fastcgi_temp_path /tmp/fastcgi;\n  uwsgi_temp_path /tmp/uwsgi;\n  scgi_temp_path /tmp/scgi;\n  server {\n    listen 8080;\n    server_name scan-target.vendetta.lab;\n    location / { default_type text/plain; return 200 \"vendetta-stack scan target\\n\"; }\n    location /health { default_type text/plain; return 200 \"ok\\n\"; }\n  }\n}\n"
---

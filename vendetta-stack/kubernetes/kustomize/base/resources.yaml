  "llm-slo.json": "{\n  \"uid\": \"cs3-llm-slo\",\n  \"title\": \"Vendetta Stack / Sovereign LLM SLO\",\n  \"description\": \"llm-gateway and Ollama tier: triage latency SLO (p95 30 s), failover, token and GPU cost, guardrails, audit chain, spool. Metrics: llm_gateway_*, ollama_gpu_memory_util, cs3_pipeline_ai_*. OpenSearch: cs3-ai-inference-*, cs3-ai-audit-*.\",\n  \"tags\": [\"vendetta-stack\", \"llm\", \"ollama\", \"slo\"],\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": false,\n  \"graphTooltip\": 1,\n  \"refresh\": \"30s\",\n  \"timezone\": \"utc\",\n  \"time\": {\"from\": \"now-6h\", \"to\": \"now\"},\n  \"annotations\": {\"list\": []},\n  \"links\": [\n    {\"title\": \"Pipeline health\", \"type\": \"link\", \"url\": \"/d/cs3-pipeline-health\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"Vendetta overview\", \"type\": \"link\", \"url\": \"/d/cs3-vendetta-overview\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"Errow offense\", \"type\": \"link\", \"url\": \"/d/cs3-errow-offense\", \"icon\": \"dashboard\", \"targetBlank\": false}\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"role\", \"label\": \"Role\", \"type\": \"query\", \"multi\": true, \"includeAll\": true, \"allValue\": \".*\", \"refresh\": 2, \"sort\": 1,\n        \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n        \"definition\": \"label_values(llm_gateway_requests_total, role)\",\n        \"query\": {\"query\": \"label_values(llm_gateway_requests_total, role)\", \"refId\": \"role\"},\n        \"current\": {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"}\n      },\n      {\n        \"name\": \"model\", \"label\": \"Model\", \"type\": \"query\", \"multi\": true, \"includeAll\": true, \"allValue\": \".*\", \"refresh\": 2, \"sort\": 1,\n        \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n        \"definition\": \"label_values(llm_gateway_gpu_seconds_total, model)\",\n        \"query\": {\"query\": \"label_values(llm_gateway_gpu_seconds_total, model)\", \"refId\": \"model\"},\n        \"current\": {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"}\n      }\n    ]\n  },\n  \"panels\": [\n    {\"id\": 1, \"type\": \"row\", \"title\": \"SLO and integrity\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0}, \"panels\": []},\n    {\n      \"id\": 2, \"type\": \"stat\", \"title\": \"p95 triage latency\", \"description\": \"histogram_quantile(0.95) of llm_gateway_triage_latency_seconds over 10 minutes. SLO: 30 s (warning alert), 60 s (critical).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 0, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"decimals\": 2, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"orange\", \"value\": 30}, {\"color\": \"red\", \"value\": 60}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"area\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(llm_gateway_triage_latency_seconds_bucket[10m])))\"}]\n    },\n    {\n      \"id\": 3, \"type\": \"stat\", \"title\": \"Triage within 30 s\", \"description\": \"Share of analysed records answered within the 30 s SLO over the dashboard range.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 4, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"percentunit\", \"decimals\": 2, \"min\": 0, \"max\": 1, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": nu
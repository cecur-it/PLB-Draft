  "entrypoint.sh": "#!/usr/bin/env bash\n# vendetta-stack OpenSearch entrypoint wrapper (CONTRACT s2: secrets from files).\n# Renders the security plugin configuration for the FIRST start of a cluster:\n#   - internal_users.yml with a single `admin` user whose bcrypt hash is\n#     computed from the password file (never an inline / demo password);\n#   - copies the static security/*.yml files from the mounted opensearch/ dir.\n# Then hands over to the stock image entrypoint with the demo installer off.\n#\n# Env: OPENSEARCH_PASSWORD_FILE  default /run/secrets/opensearch_admin_password\n#      OPENSEARCH_SECURITY_SRC   default /opensearch/security\n#      NODE_NAME                 default $HOSTNAME\nset -euo pipefail\nIFS=$'\\n\\t'\n\nOS_HOME=/usr/share/opensearch\nPASSWORD_FILE=\"${OPENSEARCH_PASSWORD_FILE:-/run/secrets/opensearch_admin_password}\"\nSECURITY_SRC=\"${OPENSEARCH_SECURITY_SRC:-/opensearch/security}\"\nSECURITY_DST=\"${OS_HOME}/config/opensearch-security\"\nCERT_DIR=\"${OS_HOME}/config/certs\"\n\ndie() { printf 'opensearch-entrypoint: %s\\n' \"$*\" \u003e\u00262; exit 1; }\n\n[[ -r \"$PASSWORD_FILE\" ]] || die \"admin password file not readable: ${PASSWORD_FILE}\"\n[[ -d \"$SECURITY_SRC\" ]] || die \"security config directory missing: ${SECURITY_SRC}\"\nfor f in opensearch.crt opensearch.key ca.crt; do\n  [[ -r \"${CERT_DIR}/${f}\" ]] || die \"TLS material not readable: ${CERT_DIR}/${f} (mount the stack pki/ dir there)\"\ndone\ngrep -q 'BEGIN PRIVATE KEY' \"${CERT_DIR}/opensearch.key\" \\\n  || die \"${CERT_DIR}/opensearch.key must be an unencrypted PKCS#8 key (BEGIN PRIVATE KEY)\"\n\nOSPW=\"$(tr -d '\\r\\n' \u003c\"$PASSWORD_FILE\")\"\n[[ ${#OSPW} -ge 12 ]] || die \"admin password must be at least 12 characters\"\nexport OSPW\nADMIN_HASH=\"$(\"${OS_HOME}/plugins/opensearch-security/tools/hash.sh\" -env OSPW | tail -n 1)\"\nunset OSPW\n[[ \"$ADMIN_HASH\" == \\$2* ]] || die \"could not compute the bcrypt hash of the admin password\"\n\nmkdir -p \"$SECURITY_DST\"\nfor f in \"$SECURITY_SRC\"/*.yml; do\n  [[ -e \"$f\" ]] || continue\n  [[ \"$(basename \"$f\")\" == internal_users.yml ]] \u0026\u0026 continue\n  cp -f \"$f\" \"$SECURITY_DST/\"\ndone\n\numask 077\n{\n  printf -- '---\\n'\n  printf '_meta:\\n  type: \"internalusers\"\\n  config_version: 2\\n\\n'\n  printf 'admin:\\n'\n  printf '  hash: \"%s\"\\n' \"$ADMIN_HASH\"\n  printf '  reserved: true\\n'\n  printf '  backend_roles:\\n    - \"admin\"\\n'\n  printf '  description: \"vendetta-stack administrator\"\\n'\n} \u003e\"${SECURITY_DST}/internal_users.yml\"\n\nexport NODE_NAME=\"${NODE_NAME:-$(hostname)}\"\nexport DISABLE_INSTALL_DEMO_CONFIG=true\nexport DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true\n\nexec \"${OS_HOME}/opensearch-docker-entrypoint.sh\" opensearch \"$@\"\n"
  "index-templates__cfgaudit-findings-template.json": "{\n  \"index_patterns\": [\"cfgaudit-findings-*\"],\n  \"priority\": 200,\n  \"version\": 1,\n  \"_meta\": {\n    \"description\": \"Cfgaudit network configuration findings. Dedicated schema; not SARIF and not a Vendetta alert. Deterministic finding ids make replayed assessments idempotent.\",\n    \"managed_by\": \"vendetta-stack/opensearch/apply.sh\"\n  },\n  \"template\": {\n    \"settings\": {\n      \"index.number_of_shards\": 1,\n      \"index.number_of_replicas\": 1,\n      \"index.refresh_interval\": \"10s\",\n      \"index.codec\": \"best_compression\",\n      \"index.routing.allocation.require.box_type\": \"hot\",\n      \"index.mapping.total_fields.limit\": 1000,\n      \"index.mapping.ignore_malformed\": false\n    },\n    \"mappings\": {\n      \"dynamic\": false,\n      \"date_detection\": false,\n      \"numeric_detection\": false,\n      \"properties\": {\n        \"schema_version\": { \"type\": \"keyword\" },\n        \"record_type\": { \"type\": \"keyword\" },\n        \"@timestamp\": { \"type\": \"date\" },\n        \"doc_id\": { \"type\": \"keyword\" },\n        \"source\": {\n          \"properties\": {\n            \"system\": { \"type\": \"keyword\" },\n            \"stream\": { \"type\": \"keyword\" }\n          }\n        },\n        \"run\": {\n          \"properties\": { \"id\": { \"type\": \"keyword\" } }\n        },\n        \"asset\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"name\": { \"type\": \"keyword\", \"ignore_above\": 1024 },\n            \"vendor\": { \"type\": \"keyword\" }\n          }\n        },\n        \"config\": {\n          \"properties\": {\n            \"name\": { \"type\": \"keyword\", \"ignore_above\": 1024 },\n            \"sha256\": { \"type\": \"keyword\" }\n          }\n        },\n        \"control\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"title\": { \"type\": \"text\", \"norms\": false },\n            \"frameworks\": {\n              \"type\": \"nested\",\n              \"properties\": {\n                \"name\": { \"type\": \"keyword\" },\n                \"reference\": { \"type\": \"keyword\" },\n                \"mapping\": { \"type\": \"keyword\" }\n              }\n            }\n          }\n        },\n        \"finding\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"key\": { \"type\": \"keyword\" }\n          }\n        },\n        \"status\": { \"type\": \"keyword\" },\n        \"severity\": { \"type\": \"keyword\" },\n        \"evidence\": {\n          \"properties\": {\n            \"sha256\": { \"type\": \"keyword\" },\n            \"items\": { \"type\": \"text\", \"norms\": false }\n          }\n        },\n        \"remediation\": { \"type\": \"text\", \"norms\": false }\n      }\n    }\n  }\n}\n"
  "index-templates__cfgaudit-runs-template.json": "{\n  \"index_patterns\": [\"cfgaudit-runs-*\"],\n  \"priority\": 200,\n  \"version\": 1,\n  \"_meta\": {\n    \"description\": \"Cfgaudit manual audit run summaries and per-asset outcomes for the selected checks. These records do not assert complete framework compliance.\",\n    \"managed_by\": \"vendetta-stack/opensearch/apply.sh\"\n  },\n  \"template\": {\n    \"settings\": {\n      \"index.number_of_shards\": 1,\n      \"index.number_of_replicas\": 1,\n      \"index.refresh_interval\": \"10s\",\n      \"index.codec\": \"best_compression\",\n      \"index.routing.allocation.require.box_type\": \"hot\",\n      \"index.mapping.total_fields.limit\": 1000,\n      \"index.mapping.ignore_malformed\": false\n    },\n    \"mappings\": {\n      \"dynamic\": false,\n      \"date_detection\": false,\n      \"numeric_detection\": false,\n      \"properties\": {\n        \"schema_version\": { \"type\": \"keyword\" },\n        \"record_type\": { \"type\": \"keyword\" },\n        \"@timestamp\": { \"type\": \"date\" },\n        \"doc_id\": { \"type\": \"keyword\" },\n        \"source\": {\n          \"properties\": {\n            \"system\": { \"type\": \"keyword\" },\n            \"stream\": { \"type\": \"keyword\" }\n          }\n        },\n        \"tool\": {\n          \"properties\": {\n            \"name\": { \"type\": \"keyword\" },\n            \"version\": { \"type\": \"keyword\" }\n          }\n        },\n        \"run\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"started_at\": { \"type\": \"date\" },\n            \"completed_at\": { \"type\": \"date\" },\n            \"status\": { \"type\": \"keyword\" },\n            \"min_severity\": { \"type\": \"keyword\" },\n            \"shadow_mode\": { \"type\": \"keyword\" }\n          }\n        },\n        \"status\": { \"type\": \"keyword\" },\n        \"summary\": {\n          \"properties\": {\n            \"files_total\": { \"type\": \"integer\" },\n            \"files_audited\": { \"type\": \"integer\" },\n            \"files_skipped\": { \"type\": \"integer\" },\n            \"assets_audited\": { \"type\": \"integer\" },\n            \"findings_total\": { \"type\": \"integer\" },\n            \"severity\": {\n              \"properties\": {\n                \"critical\": { \"type\": \"integer\" },\n                \"high\": { \"type\": \"integer\" },\n                \"medium\": { \"type\": \"integer\" },\n                \"low\": { \"type\": \"integer\" },\n                \"info\": { \"type\": \"integer\" }\n              }\n            }\n          }\n        },\n        \"assets\": {\n          \"properties\": {\n            \"id\": { \"type\": \"keyword\" },\n            \"name\": { \"type\": \"keyword\", \"ignore_above\": 1024 },\n            \"vendor\": { \"type\": \"keyword\" },\n            \"config_sha256\": { \"type\": \"keyword\" },\n            \"status\": { \"type\": \"keyword\" },\n            \"findings_total\": { \"type\": \"integer\" },\n            \"severity\": {\n              \"properties\": {\n                \"critical\": { \"type\": \"integer\" },\n                \"high\": { \"type\": \"integer\" },\n                \"medium\": { \"type\": \"integer\" },\n                \"low\": { \"type\": \"integer\" },\n                \"info\": { \"type\": \"integer\" }\n              }\n            }\n          }\n        },\n        \"warnings\": { \"type\": \"text\", \"norms\": false }\n      }\n    }\n  }\n}\n"
  "index-templates__cs3-ai-audit-template.json": "{\n  \"index_patterns\": [\"cs3-ai-audit-*\"],\n  \"priority\": 200,\n  \"version\": 1,\n  \"_meta\": {\n    \"description\": \"Hash-chained AI audit trail (NIST SP 800-53 AU-9): every cs3.ai.inference and cs3.ai.tool_call event from the LLM gateway, with chain_id/seq/prev_hash/hash (hash = sha256(prev_hash + canonical_json(event without hash))). IMMUTABLE BY INTENT: documents are append-only and must never be updated or deleted. Writers SHOULD index with op_type=create and _id=\u003chash\u003e so a replayed event is rejected rather than overwritten. The write block is applied by the cs3-ai-audit-retention ISM policy after 1 day (not here: index.blocks.write in a template would reject the first write); retention is 7 years with a snapshot to repository vendetta-snapshots before delete. Fields are mapped explicitly and unknown fields are kept in _source only (dynamic=false) so the audit schema cannot be widened by a writer.\",\n    \"immutable\": true,\n    \"retention_policy\": \"cs3-ai-audit-retention\",\n    \"snapshot_repository\": \"vendetta-snapshots\",\n    \"managed_by\": \"vendetta-stack/opensearch/apply.sh\"\n  },\n  \"template\": {\n    \"settings\": {\n      \"index.number_of_shards\": 1,\n      \"index.number_of_replicas\": 1,\n      \"index.refresh_interval\": \"5s\",\n      \"index.codec\": \"best_compression\",\n      \"index.routing.allocation.require.box_type\": \"hot\",\n      \"index.mapping.total_fields.limit\": 500,\n      \"index.mapping.ignore_malformed\": true\n    },\n    \"mappings\": {\n      \"dynamic\": false,\n      \"date_detection\": false,\n      \"numeric_detection\": false,\n      \"properties\": {\n        \"@timestamp\": { \"type\": \"date\" },\n        \"event_type\": { \"type\": \"keyword\" },\n        \"request_id\": { \"type\": \"keyword\" },\n        \"tenant_id\": { \"type\": \"keyword\" },\n        \"incident_id\": { \"type\": \"keyword\" },\n        \"alert_id\": { \"type\": \"keyword\" },\n        \"role\": { \"type\": \"keyword\" },\n        \"model\": { \"type\": \"keyword\" },\n        \"engine_used\": { \"type\": \"keyword\" },\n        \"fallback\": { \"type\": \"boolean\" },\n        \"fallback_reason\": { \"type\": \"keyword\" },\n        \"latency_ms\": { \"type\": \"double\" },\n        \"gpu_seconds\": { \"type\": \"double\" },\n        \"tokens_in\": { \"type\": \"long\" },\n        \"tokens_out\": { \"type\": \"long\" },\n        \"verdict\": { \"type\": \"keyword\" },\n        \"guardrail\": {\n          \"properties\": {\n            \"passed\": { \"type\": \"boolean\" },\n            \"violations\": { \"type\": \"keyword\" }\n          }\n        },\n        \"input_sha256\": { \"type\": \"keyword\" },\n        \"input_chars\": { \"type\": \"long\" },\n        \"analysis\": {\n          \"properties\": {\n            \"triageSummary\": { \"type\": \"text\", \"norms\": false },\n            \"severityAssessment\": { \"type\": \"keyword\" },\n            \"mitreTactic\": { \"type\": \"keyword\" },\n            \"mitreTechnique\": { \"type\": \"keyword\" },\n            \"engineUsed\": { \"type\": \"keyword\" },\n            \"confidenceScore\": { \"type\": \"float\" },\n            \"needsVerification\": { \"type\": \"boolean\" },\n            \"gpuSeconds\": { \"type\": \"double\" }\n          }\n        },\n        \"tool\": { \"type\": \"keyword\" },\n        \"args\": { \"type\": \"flat_object\" },\n        \"target\": { \"type\": \"keyword\", \"ignore_above\": 1024 },\n        \"decision\": { \"type\": \"keyword\" },\n        \"violations\": { \"type\": \"keyword\" },\n        \"rationale\": { \"type\": \"text\", \"norms\": false },\n        \"live\": { \"type\": \"boolean\" },\n        \"result_summary\": { \"type\": \"text\", \"norms\": false },\n        \"chain_id\": { \"type\": \"keyword\" },\n        \"seq\": { \"type\": \"long\" },\n        \"prev_hash\": { \"type\": \"keyword\" },\n        \"hash\": { \"type\": \"keyword\" }\n      }\n    }\n  }\n}\n"
  "index-templates__cs3-ai-inference-template.json": "{\n  \"index_patterns\": [\"cs3-ai-inference-*\"],\n  \"priority\": 200,\n  \"version\": 1,\n  \"_meta\": {\n    \"description\": \"cs3.ai.inference metering events from the LLM gateway (CONTRACT s4.3): per-request model, role, latency, GPU seconds, token counts, guardrail result and the validated AIIncidentAnalysis. The tamper-evident copy of every event lives in cs3-ai-audit-*; this family is the queryable metering/analytics copy.\",\n    \"managed_by\": \"vendetta-stack/opensearch/apply.sh\"\n  },\n  \"template\": {\n    \"settings\": {\n      \"index.number_of_shards\": 1,\n      \"index.number_of_replicas\": 1,\n      \"index.refresh_interval\": \"5s\",\n      \"index.codec\": \"best_compression\",\n      \"index.routing.allocation.require.box_type\": \"hot\",\n      \"index.mapping.total_fields.limit\": 1000,\n      \"index.mapping.ignore_malformed\": true\n    },\n    \"mappings\": {\n      \"dynamic\": true,\n      \"date_detection\": false,\n      \"numeric_detection\": false,\n      \"dynamic_templates\": [\n        {\n          \"strings_as_keyword\": {\n            \"match_mapping_type\": \"string\",\n            \"mapping\": { \"type\": \"keyword\", \"ignore_above\": 1024 }\n          }\n        }\n      ],\n      \"properties\": {\n        \"@timestamp\": { \"type\": \"date\" },\n        \"event_type\": { \"type\": \"keyword\" },\n        \"request_id\": { \"type\": \"keyword\" },\n        \"tenant_id\": { \"type\": \"keyword\" },\n        \"incident_id\": { \"type\": \"keyword\" },\n        \"alert_id\": { \"type\": \"keyword\" },\n        \"model\": { \"type\": \"keyword\" },\n        \"role\": { \"type\": \"keyword\" },\n        \"engine_used\": { \"type\": \"keyword\" },\n        \"fallback\": { \"type\": \"boolean\" },\n        \"fallback_reason\": { \"type\": \"keyword\" },\n        \"latency_ms\": { \"type\": \"double\" },\n        \"gpu_seconds\": { \"type\": \"double\" },\n        \"tokens_
  "index-templates__errow-findings-template.json": "{\n  \"index_patterns\": [\"errow-findings-*\", \"errow-sarif-*\"],\n  \"priority\": 200,\n  \"version\": 1,\n  \"_meta\": {\n    \"description\": \"Errow findings: one raw SARIF 2.1.0 result per document as shipped by errow-shipper (CONTRACT s15) plus `rule` (the matching tool.driver.rules[] descriptor). Field names are the SARIF/Errow names; renames into the Vendetta alert schema happen only in the sarif-to-vendetta-alert pipeline. Daily indices errow-findings-YYYY.MM.dd and errow-sarif-YYYY.MM.dd share this mapping.\",\n    \"managed_by\": \"vendetta-stack/opensearch/apply.sh\"\n  },\n  \"template\": {\n    \"settings\": {\n      \"index.number_of_shards\": 1,\n      \"index.number_of_replicas\": 1,\n      \"index.refresh_interval\": \"5s\",\n      \"index.codec\": \"best_compression\",\n      \"index.routing.allocation.require.box_type\": \"hot\",\n      \"index.mapping.total_fields.limit\": 2000,\n      \"index.mapping.ignore_malformed\": true\n    },\n    \"mappings\": {\n      \"dynamic\": true,\n      \"date_detection\": false,\n      \"numeric_detection\": false,\n      \"dynamic_templates\": [\n        {\n          \"strings_as_keyword\": {\n            \"match_mapping_type\": \"string\",\n            \"mapping\": { \"type\": \"keyword\", \"ignore_above\": 1024 }\n          }\n        }\n      ],\n      \"properties\": {\n        \"@timestamp\": { \"type\": \"date\" },\n        \"stream\": { \"type\": \"keyword\" },\n        \"run\": { \"type\": \"keyword\" },\n        \"source\": { \"type\": \"keyword\" },\n        \"doc_id\": { \"type\": \"keyword\" },\n        \"ruleId\": { \"type\": \"keyword\" },\n        \"ruleIndex\": { \"type\": \"integer\" },\n        \"level\": { \"type\": \"keyword\" },\n        \"kind\": { \"type\": \"keyword\" },\n        \"message\": {\n          \"properties\": {\n            \"text\": { \"type\": \"text\", \"norms\": false },\n            \"markdown\": { \"type\": \"text\"
# Source: vendetta-stack/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: vendetta-stack
    app.kubernetes.io/instance: vendetta-stack
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: vendetta-stack-1.0.0
data:
  "alertmanager.yml": "# Traces: PROMPT §5 Observability (alert routing), CONTRACT §2 (alertmanager 9093), §8.11\n# Alertmanager v0.27.0. Routes by `severity` (critical | warning | info) set in alerts.yml. The receivers are deliberately empty\n# (no e-mail/Slack/PagerDuty): those integrations need credentials and endpoints that exist only per site, and this stack never\n# carries secrets in config files. Alerts stay visible and silenceable in the Alertmanager UI/API (:9093) and in Grafana, which\n# has an `alertmanager` datasource. To page someone, deploy a copy of this file whose receivers add integrations that read their\n# credentials from files (webhook url_file, email auth_password_file, pagerduty routing_key_file, slack api_url_file, ...)\n# and keep the route/inhibit tree unchanged; validate it with `amtool check-config`.\n\nglobal:\n  resolve_timeout: 5m\n\nroute:\n  receiver: ops-warning\n  group_by: [alertname, component]\n  group_wait: 30s\n  group_interval: 5m\n  repeat_interval: 4h\n  routes:\n    - matchers: [severity=\"critical\"]\n      receiver: ops-critical\n      group_wait: 10s\n      group_interval: 2m\n      repeat_interval: 1h\n    - matchers: [severity=\"warning\"]\n      receiver: ops-warning\n    - matchers: [severity=\"info\"]\n      receiver: ops-info\n      group_wait: 5m\n      repeat_interval: 24h\n\nreceivers:\n  - name: ops-critical\n  - name: ops-warning\n  - name: ops-info\n\ninhibit_rules:\n  - source_matchers: [alertname=\"FluentdAllNodesDown\"]\n    target_matchers: [component=\"fluentd\"]\n    equal: []\n  - source_matchers: [alertname=\"FluentBitDown\"]\n    target_matchers: [component=\"fluent-bit\"]\n    equal: []\n  - source_matchers: [alertname=\"LlmGatewayDown\"]\n    target_matchers: [component=~\"llm-gateway|ollama|errow-mcp\", alertname!=\"LlmGatewayDown\"]\n    equal: []\n  - source_matchers: [alertname=\"LlmTriageLatencyP95Critical\"]\n    target_matchers: [alertname=\"LlmTriageLatencyP95High\"]\n    equal: []\n  - source_matchers: [alertname=\"LlmSpoolNearlyFull\"]\n    target_matchers: [alertname=\"LlmSpoolBacklogGrowing\"]\n    equal: []\n  - source_matchers: [alertname=\"FluentdBufferNearlyFull\"]\n    target_matchers: [alertname=\"FluentdBufferBacklog\"]\n    equal: [node, plugin_id]\n  - source_matchers: [alertname=\"FluentBitRetriesExhausted\"]\n    target_matchers: [alertname=\"FluentBitOutputRetrying\"]\n    equal: [instance, name]\n"
  "alerts.yml": "# Traces: PROMPT §5 Observability (alerting on pipeline health, LLM SLO, audit integrity), CONTRACT §4.4 (gateway metrics), §5 (outputs)\n# Every metric below exists in the pinned components:\n#   Fluent Bit 3.2.10  /api/v2/metrics/prometheus  fluentbit_*           (labels: name = plugin instance alias)\n#   Fluentd 1.17       :24231/metrics              fluentd_output_status_* (labels: node, plugin_id), cs3_pipeline_*\n#   llm-gateway        :9101/metrics               llm_gateway_*, ollama_gpu_memory_util\n# Severity: critical = page, data loss or integrity risk now; warning = act within the business day; info = awareness.\n# Each rule's `runbook` annotation is an anchor in docs/runbooks.md; the anchor list is prometheus/runbook-anchors.txt and is\n# verified by prometheus/tests/validate.sh. Thresholds assume the defaults in the component RUNTIME.md files (gateway queue 512,\n# spool 100000 events, Fluentd buffers 2GB, Fluent Bit storage.max_chunks_up) and are meant to be tuned with the same variables.\n\ngroups:\n  - name: fluent-bit-edge\n    rules:\n      - alert: FluentBitDown\n        expr: up{job=\"fluent-bit\"} == 0\n        for: 2m\n        labels: {severity: critical, component: fluent-bit}\n        annotations:\n          summary: \"Fluent Bit {{ $labels.instance }} is not scraped\"\n          description: \"No metrics from the edge collector for 2 minutes. Logs stay on disk (storage.type filesystem) but nothing is shipped.\"\n          runbook: \"docs/runbooks.md#fluent-bit-down\"\n\n      - alert: FluentBitOutputRetrying\n        expr: sum by (instance, name) (rate(fluentbit_output_retries_total[5m])) \u003e 0.05\n        for: 10m\n        labels: {severity: warning, component: fluent-bit}\n        annotations:\n          summary: \"Fluent Bit output {{ $labels.name }} keeps retrying\"\n          description: \"{{ $labels.name }} on {{ $labels.instance }} retried {{ $value | humanize }} chunks/s over 10 minutes; the destination is slow, down or rejecting data.\"\n          runbook: \"docs/runbooks.md#fluent-bit-output-retrying\"\n\n      - alert: FluentBitRetriesExhausted\n        expr: sum by (instance, name) (increase(fluentbit_output_retries_failed_total[10m])) \u003e 0\n        labels: {severity: critical, component: fluent-bit}\n        annotations:\n          summary: \"Fluent Bit output {{ $labels.name }} gave up on chunks\"\n          description: \"{{ $value | humanize }} chunks exhausted Retry_Limit on {{ $labels.name }} ({{ $labels.instance }}) in 10 minutes and were discarded.\"\n          runbook: \"docs/runbooks.md#fluent-bit-data-loss\"\n\n      - alert: FluentBitRecordsDropped\n        expr: sum by (instance, name) (increase(fluentbit_output_dropped_records_total[10m])) \u003e 0\n        labels: {severity: critical, component: fluent-bit}\n        annotations:\n          summary: \"Fluent Bit dropped records on {{ $labels.name }}\"\n          description: \"{{ $value | humanize }} records were dropped by {{ $labels.name }} on {{ $labels.instance }} in 10 minutes.\"\n          runbook: \"docs/runbooks.md#fluent-bit-data-loss\"\n\n      - alert: FluentBitInputPaused\n        expr: max by (instance, name) (fluentbit_input_storage_overlimit) == 1\n        for: 5m\n        labels: {severity: warning, component: fluent-bit}\n        annotations:\n          summary: \"Fluent Bit input {{ $labels.name }} is paused (storage over limit)\"\n          description: \"storage.pause_on_chunks_overlimit has paused {{ $labels.name }} on {{ $labels.instance }} for 5 minutes; sources buffer on their own disks until downstream drains.\"\n          runbook: \"docs/runbooks.md#fluent-bit-backpressure\"\n\n      - alert: FluentBitOutputCapacityLow\n        expr: min by (instance, name) (fluentbit_output_chunk_available_capacity_percent) \u003c 20\n        for: 10m\n        labels: {severity: warning, component: fluent-bit}\n        annotations:\n          summary: \"Fluent Bit output {{ $labels.name }} has {{ $value | humanize }}% chunk capacity left\"\n          description: \"The output's chunk queue on {{ $labels.instance }} is nearly full; paused inputs and delays follow.\"\n          runbook: \"docs/runbooks.md#fluent-bit-backpressure\"\n\n      - alert: FluentBitDiskBacklogGrowing\n        expr: max by (instance) (fluentbit_storage_fs_chunks_down) \u003e 100 and max by (instance) (deriv(fluentbit_storage_fs_chunks_down[15m])) \u003e 0\n        for: 15m\n        labels: {severity: warning, component: fluent-bit}\n        annotations:\n          summary: \"Fluent Bit filesystem backlog is growing on {{ $labels.instance }}\"\n          description: \"{{ $value | humanize }} chunks are queued on disk and still increasing; check the Fluentd upstream and /var/log/fluent-bit free space.\"\n          runbook: \"docs/runbooks.md#fluent-bit-backpressure\"\n\n  - name: fluentd-aggregator\n    rules:\n      - alert: FluentdNodeDown\n        expr: up{job=\"fluentd\"} == 0\n        for: 2m\n        labels: {severity: warning, component: fluentd}\n        annotations:\n          summary: \"Fluentd {{ $labels.node }} is not scraped\"\n          description: \"One aggregator is gone; the other still accepts the edge traffic (active-active) but there is no redundancy.\"\n          runbook: \"docs/runbooks.md#fluentd-node-down\"\n\n      - alert: FluentdAllNodesDown\n        expr: absent(up{job=\"fluentd\"} == 1)\n        for: 2m\n        labels: {severity: critical, component: fluentd}\n        annotations:\n          summary: \"No Fluentd aggregator is reachable\"\n          description: \"Both fluentd-1 and fluentd-2 are down or not scraped; Fluent Bit buffers to disk but nothing reaches OpenSearch.\"\n          runbook: \"docs/runbooks.md#fluentd-node-down\"\n\n      - alert: FluentdBufferBacklog\n        expr: max by (node, plugin_id) (fluentd_output_status_buffer_queue_length{plugin_id!~\"dead_letter.*\"}) \u003e 50\n        for: 10m\n        labels: {severity: warning, component: fluentd}\n        annotations:\n          summary: \"Fluentd output {{ $labels.plugin_id }} on {{ $labels.node }} has {{ $value | humanize }} queued chunks\"\n          description: \"The destination drains slower than events arrive for 10 minutes.\"\n          runbook: \"docs/runbooks.md#fluentd-buffer-backlog\"\n\n      - alert: FluentdBufferNearlyFull\n        expr: min by (node, plugin_id) (fluentd_output_status_buffer_available_space_ratio{plugin_id!~\"dead_letter.*\"}) \u003c 20\n        for: 5m\n        labels: {severity: critical, component: fluentd}\n        annotations:\n          summary: \"Fluentd buffer {{ $labels.plugin_id }} on {{ $labels.node }} has {{ $value | humanize }}% space left\"\n          description: \"overflow_action block backpressures Fluent Bit once the file buffer is full (best-effort legs drop the oldest chunk instead).\"\n          runbook: \"docs/runbooks.md#fluentd-buffer-nearly-full\"\n\n      - alert: FluentdOutputRetrying\n        expr: max by (node, plugin_id) (fluentd_output_status_retry_count) \u003e 0\n        for: 10m\n        labels: {severity: warning, component: fluentd}\n        annotations:\n          summary: \"Fluentd output {{ $labels.plugin_id }} on {{ $labels.node }} is in retry for 10 minutes\"\n          description: \"retry_count={{ $value }}; the destination is failing flushes (OpenSearch red/read-only, gateway down, TLS or token mismatch).\"\n          runbook: \"docs/runbooks.md#fluentd-output-retrying\"\n\n      - alert: FluentdOutputErrors\n        expr: sum by (node, plugin_id) (increase(fluentd_output_status_num_errors[10m])) \u003e 5\n        labels: {severity: warning, component: fluentd}\n        annotations:\n          summary: \"Fluentd output {{ $labels.plugin_id }} on {{ $labels.node }} raised {{ $value | humanize }} errors in 10 minutes\"\n          description: \"Flush errors (connection, 4xx/5xx, bulk item rejections).\"\n          runbook: \"docs/runbooks.md#fluentd-output-errors\"\n\n      - alert: FluentdEmitStall\n        expr: |\n          sum by (node) (rate(fluentd_output_status_emit_records{plugin_id=~\"opensearch.*\"}[10m])) == 0\n          and on() sum(rate(fluentbit_output_proc_records_total{name=\"fluentd_forward\"}[10m])) \u003e 0\n        for: 10m\n        labels: {severity: critical, component: fluentd}\n        annotations:\n          summary: \"Fluentd {{ $labels.node }} emits nothing to OpenSearch while Fluent Bit keeps forwarding\"\n          description: \"Fluent Bit's forward output processes records but the OpenSearch outputs of {{ $labels.node }} received none for 10 minutes: routing, TLS client-cert or label wiring problem.\"\n          runbook: \"docs/runbooks.md#fluentd-emit-stall\"\n\n      - alert: PipelineDeadLetterEvents\n        expr: sum by (node) (increase(cs3_pipeline_error_events_total[10m])) \u003e 0\n        labels: {severity: warning, component: fluentd}\n        annotations:\n          summary: \"Fluentd {{ $labels.node }} parked {{ $value | humanize }} events in dead-letter/error\"\n          description: \"Plugin errors (mapping conflicts, missing audit hash, buffer overflow) diverted events to /var/log/fluentd/dead-letter/error*.\"\n          runbook: \"docs/runbooks.md#pipeline-dead-letter\"\n\n      - alert: PipelineUnroutedEvents\n        expr: sum by (node) (increase(cs3_pipeline_unrouted_events_total[10m])) \u003e 0\n        labels: {severity: warning, component: fluentd}\n        annotations:\n          summary: \"Fluentd {{ $labels.node }} received events with an unknown tag\"\n          description: \"{{ $value | humanize }} events matched no route and were parked in dead-letter/unrouted*; a producer uses a tag this stack does not know.\"\n          runbook: \"docs/runbooks.md#pipeline-dead-letter\"\n\n  - name: llm-gateway-slo\n    rules:\n      - alert: LlmGatewayDown\n        expr: up{job=\"llm-gateway\"} == 0\n        for: 2m\n        labels: {severity: critical, component: llm-gateway}\n        annotations:\n          summary: \"LLM gateway {{ $labels.instance }} is not scraped\"\n          description: \"AI triage, forensic analysis and MCP policy decisions are unavailable; Vendetta keeps alerting without AI enrichment.\"\n          runbook: \"docs/runbooks.md#llm-gateway-down\"\n\n      - alert: LlmGatewayFailover\n        expr: sum by (from, to, reason) (rate(llm_gateway_failover_total[10m])) * 60 \u003e 1\n        for: 5m\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"LLM tier failover {{ $labels.from }} -\u003e {{ $labels.to }} ({{ $labels.reason }}) at {{ $value | humanize }}/min\"\n          description: \"The triage -\u003e forensic -\u003e heuristics cascade is engaging repeatedly: Ollama timeouts, GPU maintenance or a backend outage.\"\n          runbook: \"docs/runbooks.md#llm-failover\"\n\n      - alert: LlmHeuristicFallbackRatioHigh\n        expr: |\n          sum(rate(llm_gateway_requests_total{fallback=\"true\"}[15m]))\n            / sum(rate(llm_gateway_requests_total[15m])) \u003e 0.5\n        for: 15m\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"{{ $value | humanizePercentage }} of analyses are served by fallback engines\"\n          description: \"More than half of the answered records come from the forensic/heuristic fallback instead of the primary model.\"\n          runbook: \"docs/runbooks.md#llm-failover\"\n\n      - alert: LlmTriageLatencyP95High\n        expr: histogram_quantile(0.95, sum by (le) (rate(llm_gateway_triage_latency_seconds_bucket[10m]))) \u003e 30\n        for: 10m\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"p95 triage latency {{ $value | humanizeDuration }} (SLO 30s)\"\n          description: \"Backend latency per analysed record (queue wait excluded) is above the 30 s SLO for 10 minutes.\"\n          runbook: \"docs/runbooks.md#llm-triage-latency\"\n\n      - alert: LlmTriageLatencyP95Critical\n        expr: histogram_quantile(0.95, sum by (le) (rate(llm_gateway_triage_latency_seconds_bucket[10m]))) \u003e 60\n        for: 10m\n        labels: {severity: critical, component: llm-gateway}\n        annotations:\n          summary: \"p95 triage latency {{ $value | humanizeDuration }} (2x the SLO)\"\n          description: \"Triage is too slow to keep up; expect queue growth and heuristic fallbacks.\"\n          runbook: \"docs/runbooks.md#llm-triage-latency\"\n\n      - alert: LlmQueueSaturated\n        expr: max(llm_gateway_queue_depth) \u003e 256\n        for: 10m\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"LLM gateway queue holds {{ $value | humanize }} records (limit 512 by default)\"\n          description: \"Inference slots are saturated; the gateway starts rejecting at GATEWAY_MAX_QUEUE.\"\n          runbook: \"docs/runbooks.md#llm-queue-saturated\"\n\n      - alert: LlmPromptInjectionBurst\n        expr: sum(increase(llm_gateway_prompt_injection_blocked_total[5m])) \u003e 10\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"{{ $value | humanize }} prompt-injection attempts blocked in 5 minutes\"\n          description: \"Log content is being crafted against the AI tier (the records were triaged defensively); review the source hosts.\"\n          runbook: \"docs/runbooks.md#llm-prompt-injection-burst\"\n\n      - alert: LlmSchemaViolations\n        expr: sum(increase(llm_gateway_output_schema_violations_total[15m])) \u003e 5\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"{{ $value | humanize }} model outputs failed JSON-schema validation in 15 minutes\"\n          description: \"The model answers outside AIIncidentAnalysis; a model or prompt regression, or an adversarial input.\"\n          runbook: \"docs/runbooks.md#llm-schema-violations\"\n\n      - alert: LlmAuditChainBroken\n        expr: min(llm_gateway_audit_chain_ok) == 0\n        for: 1m\n        labels: {severity: critical, component: llm-gateway}\n        annotations:\n          summary: \"LLM audit hash chain is broken or not fully spooled\"\n          description: \"llm_gateway_audit_chain_ok == 0: tampering, a corrupt spool or a gap in the chain. Treat as an AU-9 integrity incident.\"\n          runbook: \"docs/runbooks.md#llm-audit-chain-broken\"\n\n      - alert: LlmSpoolBacklogGrowing\n        expr: max(llm_gateway_spool_depth) \u003e 1000 and max(deriv(llm_gateway_spool_depth[15m])) \u003e 0\n        for: 15m\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"Gateway spool holds {{ $value | humanize }} undelivered audit events and keeps growing\"\n          description: \"Fluent Bit at :9880 is unreachable or rejecting; events are safe on disk but not yet in OpenSearch.\"\n          runbook: \"docs/runbooks.md#llm-audit-spool-backlog\"\n\n      - alert: LlmSpoolNearlyFull\n        expr: max(llm_gateway_spool_depth) \u003e 50000\n        for: 5m\n        labels: {severity: critical, component: llm-gateway}\n        annotations:\n          summary: \"Gateway spool holds {{ $value | humanize }} events (default capacity 100000)\"\n          description: \"Once GATEWAY_SPOOL_MAX_EVENTS is reached unchained events are dropped and the audit trail gets gaps.\"\n          runbook: \"docs/runbooks.md#llm-audit-spool-backlog\"\n\n      - alert: LlmAuditEventsLost\n        expr: sum by (tag) (increase(llm_gateway_audit_dropped_total[10m])) \u003e 0\n        labels: {severity: critical, component: llm-gateway}\n        annotations:\n          summary: \"Gateway dropped {{ $value | humanize }} {{ $labels.tag }} events because the spool is full\"\n          description: \"Audit/enrichment events were lost; restore delivery to Fluent Bit and reconcile from the gateway logs.\"\n          runbook: \"docs/runbooks.md#llm-audit-data-loss\"\n\n      - alert: LlmAuditEventsQuarantined\n        expr: sum by (tag) (increase(llm_gateway_audit_quarantined_total[30m])) \u003e 0\n        labels: {severity: warning, component: llm-gateway}\n        annotations:\n          summary: \"Gateway quarantined {{ $value | humanize }} {{ $labels.tag }} events after repeated 4xx from Fluent Bit\"\n          description: \"Events were moved aside instead of delivered; inspect the quarantine directory and the Fluent Bit input.\"\n          runbook: \"docs/runbooks.md#llm-audit-data-loss\"\n\n      - alert: OllamaGpuMemoryHigh\n        expr: max by (instance) (ollama_gpu_memory_util) \u003e 0.95\n        for: 10m\n        labels: {severity: warning, component: ollama}\n        annotations:\n          summary: \"Ollama GPU memory at {{ $value | humanizePercentage }}\"\n          description: \"Model eviction and OOM-driven failovers are likely; reduce concurrency or move the forensic model to another worker.\"\n          runbook: \"docs/runbooks.md#ollama-gpu-memory\"\n\n      - alert: LlmNoInferenceTraffic\n        expr: (sum(increase(llm_gateway_requests_total[1h])) or vector(0)) == 0 and on() (max(up{job=\"llm-gateway\"}) == 1)\n        for: 30m\n        labels: {severity: info, component: llm-gateway}\n        annotations:\n          summary: \"The LLM gateway answered no record in the last hour\"\n          description: \"The gateway is up but Fluentd's /triage leg delivers nothing: no alerts, a gated severity regex, or a broken http-llm-triage output.\"\n          runbook: \"docs/runbooks.md#llm-no-inference-traffic\"\n\n  - name: errow-mcp\n    rules:\n      - alert: ErrowMcpDown\n        expr: up{job=\"errow-mcp\"} == 0\n        for: 10m\n        labels: {severity: warning, component: errow-mcp}\n        annotations:\n          summary: \"Errow MCP bridge {{ $labels.instance }} is not scraped\"\n          description: \"Not an error when the errow profile is off; otherwise tool calls from the AI tier cannot be executed or audited.\"\n          runbook: \"docs/runbooks.md#errow-mcp-down\"\n\n      - alert: McpDeniedCallBurst\n        expr: sum by (tool) (increase(llm_gateway_mcp_tool_calls_total{decision=~\"denied|rate_limited\"}[5m])) \u003e 10\n        labels: {severity: warning, component: errow-mcp}\n        annotations:\n          summary: \"{{ $value | humanize }} MCP calls to {{ $labels.tool }} were denied in 5 minutes\"\n          description: \"The policy (scope, allowlist, rate limit, approvals) refused repeated tool calls: a prompt-injection attempt or a misconfigured agent.\"\n          runbook: \"docs/runbooks.md#errow-mcp-denied-burst\"\n\n  - name: observability-self\n    rules:\n      - alert: AlertmanagerDown\n        expr: up{job=\"alertmanager\"} == 0\n        for: 5m\n        labels: {severity: critical, component: alertmanager}\n        annotations:\n          summary: \"Alertmanager is not scraped\"\n          description: \"Alerts are evaluated but cannot be routed or silenced.\"\n          runbook: \"docs/runbooks.md#observability-self-monitoring\"\n\n      - alert: PrometheusAlertmanagerNotConnected\n        expr: prometheus_notifications_alertmanagers_discovered \u003c 1\n        for: 5m\n        labels: {severity: critical, component: prometheus}\n        annotations:\n          summary: \"Prometheus sees no Alertmanager\"\n          description: \"Firing alerts are not delivered anywhere.\"\n          runbook: \"docs/runbooks.md#observability-self-monitoring\"\n\n      - alert: PrometheusRuleEvaluationFailing\n        expr: increase(prometheus_rule_evaluation_failures_total[10m]) \u003e 0\n        labels: {severity: warning, component: prometheus}\n        annotations:\n          summary: \"Prometheus failed to evaluate {{ $value | humanize }} rules in 10 minutes\"\n          description: \"A rule references a missing series or a malformed expression; check the Prometheus log.\"\n          runbook: \"docs/runbooks.md#observability-self-monitoring\"\n"
  "prometheus.yml": "# Traces: PROMPT §5 Observability (metrics, alerting), CONTRACT §2 (ports), §4.4 (gateway metrics), §8.11\n# Prometheus v2.55.1 scrape + alerting config. Mount this directory read-only at /etc/prometheus (this file + alerts.yml).\n# Files it reads: /pki/ca.crt, /pki/prometheus.crt|key (client cert for the mTLS endpoints), /run/secrets/llm_gateway_token.\n# Not scraped on purpose: OpenSearch. The pinned opensearch image ships no prometheus-exporter plugin (air-gap safe, no plugin\n# install), so cluster health is read by Grafana through the OpenSearch datasource and by the opensearch/ healthchecks instead.\n# Not scraped: Ollama itself (it binds loopback only; the gateway republishes ollama_gpu_memory_util) and the Errow runtime.\n# A target that is not deployed in a compose profile simply reports up == 0; alerts.yml pages on that only for the core\n# pipeline (fluent-bit, fluentd, llm-gateway); optional components (errow-mcp) get a warning with a longer `for`.\n\nglobal:\n  scrape_interval: 15s\n  scrape_timeout: 10s\n  evaluation_interval: 15s\n  external_labels:\n    stack: vendetta-stack\n\nrule_files:\n  - /etc/prometheus/alerts.yml\n\nalerting:\n  alertmanagers:\n    - scheme: http\n      timeout: 10s\n      static_configs:\n        - targets: [\"alertmanager:9093\"]\n\nscrape_configs:\n  - job_name: prometheus\n    static_configs:\n      - targets: [\"localhost:9090\"]\n\n  - job_name: alertmanager\n    static_configs:\n      - targets: [\"alertmanager:9093\"]\n\n  - job_name: fluent-bit\n    metrics_path: /api/v2/metrics/prometheus\n    static_configs:\n      - targets: [\"fluent-bit:2020\"]\n        labels:\n          tier: edge\n\n  - job_name: fluentd\n    metrics_path: /metrics\n    # Every Fluentd series already carries node=\"fluentd-N\"; honor_labels keeps the exporter's value instead of exported_node.\n    honor_labels: true\n    static_configs:\n      - targets: [\"fluentd-1:24231\"]\n        labels:\n          node: fluentd-1\n          tier: aggregator\n      - targets: [\"fluentd-2:24231\"]\n        labels:\n          node: fluentd-2\n          tier: aggregator\n\n  - job_name: llm-gateway\n    scheme: https\n    metrics_path: /metrics\n    bearer_token_file: /run/secrets/llm_gateway_token\n    tls_config:\n      ca_file: /pki/ca.crt\n      server_name: llm-gateway\n      cert_file: /pki/prometheus.crt\n      key_file: /pki/prometheus.key\n      min_version: TLS12\n    static_configs:\n      - targets: [\"llm-gateway:9101\"]\n        labels:\n          tier: ai\n\n  - job_name: errow-mcp\n    scheme: https\n    metrics_path: /metrics\n    tls_config:\n      ca_file: /pki/ca.crt\n      server_name: errow-mcp\n      cert_file: /pki/prometheus.crt\n      key_file: /pki/prometheus.key\n      min_version: TLS12\n    static_configs:\n      - targets: [\"errow-mcp:9103\"]\n        labels:\n          tier: errow\n"
---
# Source: vendetta-stack/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app.kubernetes.io/name: vendetta-stack
    app.kubernetes.io/instance: vendetta-stack
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: vendetta-stack-1.0.0
data:
  "alerting__alerting.yml": "# Traces: PROMPT §1 Tier 1 (Grafana, air-gapped)\n# Grafana-managed alert rules are unused: alert rules are Prometheus rules (prometheus/alerts.yml).\napiVersion: 1\n"
  "dashboards__dashboards.yml": "# Traces: PROMPT §5 Observability (dashboards as code), CONTRACT §8.11\n# File provider: every *.json in /var/lib/grafana/dashboards (mount grafana/dashboards there, ro) is loaded into the folder\n# \"Vendetta Stack\". Dashboards are code: UI edits are not persisted (allowUiUpdates false, disableDeletion true); copy a\n# dashboard with \"Save as\" to experiment. Mount: this directory at /etc/grafana/provisioning/dashboards (ro).\napiVersion: 1\n\nproviders:\n  - name: vendetta-stack\n    orgId: 1\n    folder: Vendetta Stack\n    folderUid: cs3-vendetta-stack\n    type: file\n    disableDeletion: true\n    allowUiUpdates: false\n    updateIntervalSeconds: 30\n    options:\n      path: /var/lib/grafana/dashboards\n      foldersFromFilesStructure: false\n"
  "datasources__datasources.yml": "# Traces: PROMPT §5 Observability (Grafana datasources), CONTRACT §2 (grafana 3000), §3 (index prefixes), §8.11\n# Grafana 10.4.19. Air-gap safe: only BUILT-IN datasource types (prometheus, alertmanager, elasticsearch); no plugin is downloaded.\n# OpenSearch 2.x is queried through the built-in `elasticsearch` type (esVersion 7.10.0 is the last API level OpenSearch keeps).\n# The ES datasource binds to ONE index pattern, hence one datasource per index family used by the dashboards.\n# Secrets are read from files at provisioning time ($__file{}), never stored in this file:\n#   /run/secrets/opensearch_admin_password   /pki/ca.crt (trust anchor for https://opensearch:9200)\n# Mount: this directory at /etc/grafana/provisioning/datasources (ro).\napiVersion: 1\n\ndatasources:\n  - name: Prometheus\n    uid: cs3-prometheus\n    type: prometheus\n    access: proxy\n    orgId: 1\n    url: http://prometheus:9090\n    isDefault: true\n    editable: false\n    jsonData:\n      httpMethod: POST\n      timeInterval: 15s\n      manageAlerts: false\n      prometheusType: Prometheus\n      prometheusVersion: 2.55.1\n\n  - name: Alertmanager\n    uid: cs3-alertmanager\n    type: alertmanager\n    access: proxy\n    orgId: 1\n    url: http://alertmanager:9093\n    editable: false\n    jsonData:\n      implementation: prometheus\n      handleGrafanaManagedAlerts: false\n\n  - \u0026opensearch\n    name: OpenSearch Vendetta Alerts\n    uid: cs3-os-vendetta-alerts\n    type: elasticsearch\n    access: proxy\n    orgId: 1\n    url: https://opensearch:9200\n    basicAuth: true\n    basicAuthUser: admin\n    editable: false\n    jsonData: \u0026opensearch_json\n      index: \"vendetta-alerts-*\"\n      timeField: \"@timestamp\"\n      esVersion: \"7.10.0\"\n      maxConcurrentShardRequests: 5\n      timeInterval: 10s\n      logMessageField: rule.description\n      logLevelField: severity\n      tlsAuthWithCACert: true\n      serverName: opensearch\n    secureJsonData: \u0026opensearch_secure\n      basicAuthPassword: $__file{/run/secrets/opensearch_admin_password}\n      tlsCACert: $__file{/pki/ca.crt}\n\n  - \u003c\u003c: *opensearch\n    name: OpenSearch Errow Findings\n    uid: cs3-os-errow-findings\n    jsonData:\n      \u003c\u003c: *opensearch_json\n      index: \"errow-findings-*\"\n      logMessageField: message.text\n      logLevelField: level\n    secureJsonData: *opensearch_secure\n\n  - \u003c\u003c: *opensearch\n    name: OpenSearch Errow Runs\n    uid: cs3-os-errow-runs\n    jsonData:\n      \u003c\u003c: *opensearch_json\n      index: \"errow-runs-*\"\n      logMessageField: run_name\n      logLevelField: status\n    secureJsonData: *opensearch_secure\n\n  - \u003c\u003c: *opensearch\n    name: OpenSearch Errow LLM Logs\n    uid: cs3-os-errow-llm\n    jsonData:\n      \u003c\u003c: *opensearch_json\n      index: \"errow-llm-logs-*\"\n      logMessageField: message\n      logLevelField: outcome\n    secureJsonData: *opensearch_secure\n\n  - \u003c\u003c: *opensearch\n    name: OpenSearch Errow MCP\n    uid: cs3-os-errow-mcp\n    jsonData:\n      \u003c\u003c: *opensearch_json\n      index: \"errow-mcp-*\"\n      logMessageField: rationale\n      logLevelField: decision\n    secureJsonData: *opensearch_secure\n\n  - \u003c\u003c: *opensearch\n    name: OpenSearch AI Inference\n    uid: cs3-os-ai-inference\n    jsonData:\n      \u003c\u003c: *opensearch_json\n      index: \"cs3-ai-inference-*\"\n      logMessageField: analysis.triageSummary\n      logLevelField: analysis.severityAssessment\n    secureJsonData: *opensearch_secure\n\n  - \u003c\u003c: *opensearch\n    name: OpenSearch AI Audit\n    uid: cs3-os-ai-audit\n    jsonData:\n      \u003c\u003c: *opensearch_json\n      index: \"cs3-ai-audit-*\"\n      logMessageField: rationale\n      logLevelField: event_type\n    secureJsonData: *opensearch_secure\n"
  "notifiers__notifiers.yml": "# Traces: PROMPT §1 Tier 1 (Grafana, air-gapped)\n# Legacy notifiers are unused: alerting lives in Prometheus/Alertmanager (prometheus/alerts.yml).\napiVersion: 1\nnotifiers: []\n"
  "plugins__plugins.yml": "# Traces: PROMPT §1 Tier 1 (Grafana, air-gapped)\n# No app plugin is provisioned. The file exists so Grafana does not log level=error for a missing directory.\napiVersion: 1\napps: []\n"
---
# Source: vendetta-stack/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app.kubernetes.io/name: vendetta-stack
    app.kubernetes.io/instance: vendetta-stack
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: vendetta-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: vendetta-stack-1.0.0
data:
  "errow-offense.json": "{\n  \"uid\": \"cs3-errow-offense\",\n  \"title\": \"Vendetta Stack / Errow offensive platform\",\n  \"description\": \"Errow findings, runs, LLM spend and MCP tool decisions. Prometheus: cs3_pipeline_errow_findings_total, cs3_sp_errow_findings_60s, fluentd_output_status_* for the feedback/cloud/execd legs, llm_gateway_mcp_tool_calls_total. OpenSearch: errow-findings-*, errow-runs-*, errow-llm-logs-*, errow-mcp-*.\",\n  \"tags\": [\"vendetta-stack\", \"errow\", \"offense\"],\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": false,\n  \"graphTooltip\": 1,\n  \"refresh\": \"1m\",\n  \"timezone\": \"utc\",\n  \"time\": {\"from\": \"now-24h\", \"to\": \"now\"},\n  \"annotations\": {\"list\": []},\n  \"links\": [\n    {\"title\": \"Pipeline health\", \"type\": \"link\", \"url\": \"/d/cs3-pipeline-health\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"Vendetta overview\", \"type\": \"link\", \"url\": \"/d/cs3-vendetta-overview\", \"icon\": \"dashboard\", \"targetBlank\": false},\n    {\"title\": \"LLM SLO\", \"type\": \"link\", \"url\": \"/d/cs3-llm-slo\", \"icon\": \"dashboard\", \"targetBlank\": false}\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"level\", \"label\": \"SARIF level\", \"type\": \"custom\", \"multi\": true, \"includeAll\": true,\n        \"query\": \"error,warning,note,none\",\n        \"options\": [\n          {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"},\n          {\"selected\": false, \"text\": \"error\", \"value\": \"error\"},\n          {\"selected\": false, \"text\": \"warning\", \"value\": \"warning\"},\n          {\"selected\": false, \"text\": \"note\", \"value\": \"note\"},\n          {\"selected\": false, \"text\": \"none\", \"value\": \"none\"}\n        ],\n        \"current\": {\"selected\": true, \"text\": \"All\", \"value\": \"$__all\"}\n      }\n    ]\n  },\n  \"panels\": [\n    {\"id\": 1, \"type\": \"row\", \"title\": \"Findings pipeline (Prometheus)\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0}, \"panels\": []},\n    {\n      \"id\": 2, \"type\": \"stat\", \"title\": \"Findings in range\", \"description\": \"increase of cs3_pipeline_errow_findings_total over the dashboard range.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 0, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"blue\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(increase(cs3_pipeline_errow_findings_total[$__range])) or vector(0)\", \"instant\": true}]\n    },\n    {\n      \"id\": 3, \"type\": \"stat\", \"title\": \"High + critical in range\", \"description\": \"Findings that also go to the feedback webhook (severity \u003e= high).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 6, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"orange\", \"value\": 1}, {\"color\": \"red\", \"value\": 10}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(increase(cs3_pipeline_errow_findings_total{severity=~\\\"high|critical\\\"}[$__range])) or vector(0)\", \"instant\": true}]\n    },\n    {\n      \"id\": 4, \"type\": \"stat\", \"title\": \"Feedback webhook errors (1h)\", \"description\": \"fluentd_output_status_num_errors for http-feedback-loop (Errow finding -\u003e Vendetta feedback service).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 12, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}, {\"color\": \"red\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum(increase(fluentd_output_status_num_errors{plugin_id=\\\"http-feedback-loop\\\"}[1h])) or vector(0)\", \"instant\": true}]\n    },\n    {\n      \"id\": 5, \"type\": \"stat\", \"title\": \"errow-mcp scrape\", \"description\": \"up{job=\\\"errow-mcp\\\"} (errow-mcp is scraped for liveness; the tool-call decisions come from the gateway metric).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 4, \"w\": 6, \"x\": 18, \"y\": 1},\n      \"fieldConfig\": {\"defaults\": {\"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"DOWN\", \"color\": \"red\", \"index\": 0}, \"1\": {\"text\": \"UP\", \"color\": \"green\", \"index\": 1}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"green\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"justifyMode\": \"center\"},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"min(up{job=\\\"errow-mcp\\\"})\", \"instant\": true}]\n    },\n    {\n      \"id\": 6, \"type\": \"timeseries\", \"title\": \"Findings/s by severity\", \"description\": \"severity = result.properties.errow.severity (critical/high/medium/low/info).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 5},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 25, \"showPoints\": \"never\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": [\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"critical\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"dark-red\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"high\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"orange\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"medium\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"yellow\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"low\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"blue\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"info\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"green\"}}]}\n      ]},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"sum\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (severity) (rate(cs3_pipeline_errow_findings_total[$__rate_interval]))\", \"legendFormat\": \"{{severity}}\"}]\n    },\n    {\n      \"id\": 7, \"type\": \"timeseries\", \"title\": \"Edge window: findings by SARIF level\", \"description\": \"cs3_sp_errow_findings_60s{level}: 60-second tumbling counts from the Fluent Bit stream processor.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 5},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 25, \"showPoints\": \"never\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (level) (cs3_sp_errow_findings_60s{level=~\\\"$level\\\"})\", \"legendFormat\": \"{{level}}\"}]\n    },\n    {\n      \"id\": 8, \"type\": \"timeseries\", \"title\": \"Errow streams ingested by Fluent Bit (records/s)\", \"description\": \"Per errow_* tail/forward input alias (findings, runs, coverage, llm_logs, mcp_events, runtime_events, tui_events, proxy, ...).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 13},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (name) (rate(fluentbit_input_records_total{name=~\\\"errow_.*\\\"}[$__rate_interval])) \u003e 0\", \"legendFormat\": \"{{name}}\"}]\n    },\n    {\n      \"id\": 9, \"type\": \"timeseries\", \"title\": \"Errow sinks emitted by Fluentd (records/s)\", \"description\": \"opensearch-errow* indices, http-feedback-loop (severity \u003e= high), http-errow-cloud (opt-in), http-vendetta-execd (opt-in live execution).\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 13},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (plugin_id) (rate(fluentd_output_status_emit_records{plugin_id=~\\\"opensearch-errow.*|http-feedback-loop|http-errow-cloud|http-vendetta-execd\\\"}[$__rate_interval]))\", \"legendFormat\": \"{{plugin_id}}\"}]\n    },\n    {\"id\": 10, \"type\": \"row\", \"title\": \"MCP tool calls (llm-gateway)\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 21}, \"panels\": []},\n    {\n      \"id\": 11, \"type\": \"timeseries\", \"title\": \"Tool calls/s by decision\", \"description\": \"llm_gateway_mcp_tool_calls_total{decision}: allowed, denied, rate_limited, dry_run, executed, error.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 22},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 25, \"showPoints\": \"never\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": [\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"denied\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"red\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"rate_limited\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"orange\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"error\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"dark-red\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"allowed\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"green\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"executed\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"blue\"}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"dry_run\"}, \"properties\": [{\"id\": \"color\", \"value\": {\"mode\": \"fixed\", \"fixedColor\": \"purple\"}}]}\n      ]},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"sum\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"sum by (decision) (rate(llm_gateway_mcp_tool_calls_total[$__rate_interval]))\", \"legendFormat\": \"{{decision}}\"}]\n    },\n    {\n      \"id\": 12, \"type\": \"bargauge\", \"title\": \"Top tools in range (by decision)\", \"description\": \"increase of llm_gateway_mcp_tool_calls_total per tool and decision.\",\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 22},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"min\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"blue\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}, \"orientation\": \"horizontal\", \"displayMode\": \"gradient\", \"showUnfilled\": true},\n      \"targets\": [{\"refId\": \"A\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"topk(12, sum by (tool, decision) (increase(llm_gateway_mcp_tool_calls_total[$__range]))) \u003e 0\", \"legendFormat\": \"{{tool}} / {{decision}}\", \"instant\": true}]\n    },\n    {\"id\": 13, \"type\": \"row\", \"title\": \"Stored Errow data (OpenSearch)\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 30}, \"panels\": []},\n    {\n      \"id\": 14, \"type\": \"timeseries\", \"title\": \"Findings over time by SARIF level\", \"description\": \"errow-findings-*: one document per SARIF result.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-findings\"},\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 31},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 40, \"showPoints\": \"never\", \"drawStyle\": \"bars\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-findings\"}, \"timeField\": \"@timestamp\", \"query\": \"level:$level\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [\n          {\"id\": \"2\", \"type\": \"terms\", \"field\": \"level\", \"settings\": {\"size\": \"5\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}},\n          {\"id\": \"3\", \"type\": \"date_histogram\", \"field\": \"@timestamp\", \"settings\": {\"interval\": \"auto\", \"min_doc_count\": \"0\", \"trimEdges\": \"0\"}}\n        ]\n      }]\n    },\n    {\n      \"id\": 15, \"type\": \"piechart\", \"title\": \"Findings by Errow severity\", \"description\": \"properties.errow.severity.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-findings\"},\n      \"gridPos\": {\"h\": 8, \"w\": 6, \"x\": 12, \"y\": 31},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"pieType\": \"donut\", \"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"values\": [\"value\"]}, \"tooltip\": {\"mode\": \"single\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-findings\"}, \"timeField\": \"@timestamp\", \"query\": \"level:$level\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"count\"}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"terms\", \"field\": \"properties.errow.severity\", \"settings\": {\"size\": \"6\", \"order\": \"desc\", \"orderBy\": \"_count\", \"min_doc_count\": \"1\"}}]\n      }]\n    },\n    {\n      \"id\": 16, \"type\": \"bargauge\", \"title\": \"Top CWE\", \"description\": \"properties.errow.cwe.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-findings\"},\n      \"gridPos\": {\"h\": 8, \"w\": 6, \"x\": 18, \"y\": 31},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"purple\", \"value\": null}]}}, \"overrides\": []},\n      \"options\": {\"reduceOptions\": {\"calcs\": [], \"fields\": \"/^Count$/\", \"values\": true}, \"orientation\": \"horizontal\", \"displayMode\": \"gradient\", \"showUnfilled\": true},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-findings\"}, \"timeField\": \"@timestamp\", \"query\": \"
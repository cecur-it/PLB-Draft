 \"B\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (edge_node) (cs3_sp_ai_inferences_60s)\", \"legendFormat\": \"inferences {{edge_node}}\"},\n        {\"refId\": \"C\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"cs3-prometheus\"}, \"expr\": \"max by (edge_node) (cs3_sp_ai_avg_latency_ms_60s)\", \"legendFormat\": \"avg latency ms {{edge_node}}\"}\n      ]\n    },\n    {\"id\": 27, \"type\": \"row\", \"title\": \"Stored inference and audit (OpenSearch)\", \"collapsed\": false, \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 57}, \"panels\": []},\n    {\n      \"id\": 28, \"type\": \"timeseries\", \"title\": \"Inference latency from stored events (ms)\", \"description\": \"cs3-ai-inference-*: p50/p95 of latency_ms.\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-ai-inference\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 58},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ms\", \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\"}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-ai-inference\"}, \"timeField\": \"@timestamp\", \"query\": \"_exists_:latency_ms\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"percentiles\", \"field\": \"latency_ms\", \"settings\": {\"percents\": [\"50\", \"95\"]}}],\n        \"bucketAggs\": [{\"id\": \"2\", \"type\": \"date_histogram\", \"field\": \"@timestamp\", \"settings\": {\"interval\": \"auto\", \"min_doc_count\": \"0\", \"trimEdges\": \"0\"}}]\n      }]\n    },\n    {\n      \"id\": 29, \"type\": \"timeseries\", \"title\": \"Tokens in / out from stored events\", \"description\": \"cs3-ai-inference-*: sum of tokens_in and tokens_out per interval.\",\n      \"datasou
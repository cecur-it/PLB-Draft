"}, \"timeField\": \"@timestamp\", \"query\": \"*\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"raw_data\", \"settings\": {\"size\": \"50\"}}],\n        \"bucketAggs\": []\n      }],\n      \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"_id\": true, \"_index\": true, \"_type\": true, \"highlight\": true, \"sort\": true, \"instruction\": true, \"user_instruction\": true}, \"indexByName\": {\"@timestamp\": 0, \"run_name\": 1, \"status\": 2, \"scan_mode\": 3, \"scope_mode\": 4, \"llm_usage.total_tokens\": 5, \"llm_usage.cost\": 6}, \"renameByName\": {}}}]\n    },\n    {\n      \"id\": 22, \"type\": \"timeseries\", \"title\": \"LLM cost per model (USD)\", \"description\": \"errow-llm-logs-*: sum of cost_usd (one record per LLM request; prompt bodies are never stored).\",\n      \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-llm\"},\n      \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 55},\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"currencyUSD\", \"decimals\": 4, \"custom\": {\"lineWidth\": 1, \"fillOpacity\": 30, \"showPoints\": \"never\", \"drawStyle\": \"bars\", \"stacking\": {\"mode\": \"normal\", \"group\": \"A\"}}}, \"overrides\": []},\n      \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"sum\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}},\n      \"targets\": [{\n        \"refId\": \"A\", \"datasource\": {\"type\": \"elasticsearch\", \"uid\": \"cs3-os-errow-llm\"}, \"timeField\": \"@timestamp\", \"query\": \"_exists_:cost_usd\",\n        \"metrics\": [{\"id\": \"1\", \"type\": \"sum\", \"field\": \"cost_usd\"}],\n        \"bucketAggs\": [\n          {\"id\": \"2\", \"type\": \"terms\", \"field\": \"model\", \"settings\": {\"size\": \"6\", \"order\": \"desc\", \"orderBy\": \"_term\", \"min_doc_count\": \"1\"}},\n          {\"id\": \"3\", \"type\": \"date_histogram\", \"field\": \"@timestamp\", \"settings\": {\"interval\": \"aut
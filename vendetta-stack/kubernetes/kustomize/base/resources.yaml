data:
  models.json: "{\n  \"releaseTag\": \"v1.0.0\",\n  \"updated\": \"2026-11-27\",\n  \"description\": \"Single source of truth for approved on-prem/air-gapped model tags of the vendetta-stack LLM tier (mirrors CS3 onboarding/models.json). sha256 values are pinned per release by scripts/pin-model-digests.mjs and must match the digest of the exact quantized weight blob shipped in that release's air-gap bundle.\",\n  \"tiers\": {\n    \"entry\": {\n      \"label\": \"Entry / edge workstation\",\n      \"models\": [\"gemma4:26b\"]\n    },\n    \"frontier\": {\n      \"label\": \"Frontier / reasoning tier\",\n      \"models\": [\"gemma4:31b\"]\n    },\n    \"agentic\": {\n      \"label\": \"Agentic tool-use tier\",\n      \"models\": [\"nemotron-3-nano:30b\"]\n    },\n    \"security\": {\n      \"label\": \"Cybersecurity reasoning tier (served by the agentic tier; the RAG index supplies domain knowledge)\",\n      \"models\": []\n    },\n    \"eval\": {\n      \"label\": \"Optional evaluation tier (not part of the default pull set)\",\n      \"models\": [\"qwensploit-v2:9b\"]\n    }\n  },\n  \"models\": [\n    {\n      \"id\": \"gemma4:26b\",\n      \"family\": \"gemma-4\",\n      \"variant\": \"MoE\",\n      \"activeParams\": \"4B\",\n      \"totalParams\": \"26B\",\n      \"minVramGb\": 16,\n      \"minSystemRamGb\": 32,\n      \"functionCalling\": true,\n      \"multimodal\": true,\n      \"thinkingModeConfigurable\": false,\n      \"tier\": \"entry\",\n      \"sha256\": \"a8bdd07a49b895083bb1420bb895ad9ab3e3b8f7d5cc42c7582ca0fa765eede2\"\n    },\n    {\n      \"id\": \"gemma4:31b\",\n      \"family\": \"gemma-4\",\n      \"variant\": \"Dense\",\n      \"activeParams\": \"31B\",\n      \"totalParams\": \"31B\",\n      \"minVramGb\": 24,\n      \"minSystemRamGb\": 64,\n      \"functionCalling\": true,\n      \"multimodal\": true,\n      \"thinkingModeConfigurable\": false,\n      \"tier\": \"frontier\",\n      \"sha256\": \"cd20f2b3f2e30239023189c04e65754b0cc7c38959665ac727461ee470df16cf\"\n    },\n    {\n      \"id\": \"nemotron-3-nano:30b\",\n      \"family\": \"nemotron-3-nano\",\n      \"variant\": \"hybrid-MoE\",\n      \"activeParams\": \"3.5B\",\n      \"totalParams\": \"30B\",\n      \"minVramGb\": 24,\n      \"minSystemRamGb\": 64,\n      \"functionCalling\": true,\n      \"multimodal\": false,\n      \"thinkingModeConfigurable\": true,\n      \"tier\": \"agentic\",\n      \"sha256\": \"a70437c41b3b0b768c48737e15f8160c90f13dc963f5226aabb3a160f708d1ce\"\n    },\n    {\n      \"id\": \"qwensploit-v2:9b\",\n      \"family\": \"qwensploit-v2\",\n      \"variant\": \"dense\",\n      \"activeParams\": \"9B\",\n      \"totalParams\": \"9B\",\n      \"minVramGb\": 8,\n      \"minSystemRamGb\": 32,\n      \"functionCalling\": true,\n      \"multimodal\": false,\n      \"thinkingModeConfigurable\": false,\n      \"tier\": \"eval\",\n      \"optional\": true,\n      \"role\": \"cybersecurity-reasoning-eval\",\n      \"safetyProfile\": \"heretic-ablated\",\n      \"quantization\": \"Q4_K_M\",\n      \"upstream\": \"hf.co/xtools-at/Qwensploit-V2-9B-CyberSecurity-Qwen3.5-GGUF:Q4_K_M\",\n      \"upstreamFallback\": \"hf.co/bartowski/Qwensploit-V2-9B-CyberSecurity-Qwen3.5-GGUF:Q4_K_M\",\n      \"neverJudge\": \"Qwensploit is never the output-guard/safety classifier (INFERENCE_MODEL_GUARD); its heretic ablation makes it optimistic about severity.\",\n      \"sha256\": \"2eb53a090487b2b2e4391b88f6109fe64ba32f5c95ddbd9196bc54204b88ef53\"\n    }\n  ]\n}\n"

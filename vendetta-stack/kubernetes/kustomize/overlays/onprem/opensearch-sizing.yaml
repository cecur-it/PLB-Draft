# Traces: PROMPT section 1 Tier 3 (on-prem sizing); opensearch/RUNTIME.md (heap = half of the container memory, at most 31 GB).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  template:
    spec:
      containers:
        - name: opensearch
          env:
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms4g -Xmx4g"}
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "4", memory: 8Gi}

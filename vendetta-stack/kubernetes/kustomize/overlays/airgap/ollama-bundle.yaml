# Traces: PROMPT section 1 Tier 3 (air-gapped deployment); ollama/RUNTIME.md (OLLAMA_AIRGAP_BUNDLE_DIR holds <tag, ':' -> '_'>.gguf files).
# The PVC ollama-model-bundle is created and filled by the operator (kubernetes/README.md "Air-gapped install"); the models are never pulled.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
spec:
  template:
    spec:
      containers:
        - name: ollama
          volumeMounts:
            - {name: bundle, mountPath: /bundle, readOnly: true}
      volumes:
        - name: bundle
          persistentVolumeClaim:
            claimName: ollama-model-bundle
            readOnly: true

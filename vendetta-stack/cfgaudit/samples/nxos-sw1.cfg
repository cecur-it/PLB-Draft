!Command: show running-config
version 9.3(8) Bios:version
hostname nxos-sw1
feature telnet
feature nxapi
feature ssh
feature tacacs+
snmp-server community public group network-operator
snmp-server community Xk29!vT group network-admin
ntp server 10.0.0.1 use-vrf management
ip access-list ACL-EXAMPLE
  10 permit ip 10.0.0.0/8 any
  20 deny tcp 10.1.0.0/16 any eq 80
  30 permit ip any any
  40 permit tcp any any eq 22
line vty
  exec-timeout 0

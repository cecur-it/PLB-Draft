ASA Version 9.14(2)
hostname asa-fw1
interface GigabitEthernet0/0
 nameif outside
telnet 0.0.0.0 0.0.0.0 outside
http 0.0.0.0 0.0.0.0 outside
ssh 0.0.0.0 0.0.0.0 outside
snmp-server community public
access-list OUT extended permit ip any any
access-list IN extended permit ip 192.168.0.0 255.255.0.0 any
access-list IN extended deny tcp 192.168.5.0 255.255.255.0 any eq 80
access-list IN extended permit tcp 192.168.9.0 255.255.255.0 any eq 443

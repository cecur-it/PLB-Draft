version 15.2
service timestamps log datetime
hostname edge-rtr1
enable password cisco123
username admin password 0 admin
ip http server
ip source-route
snmp-server community public RO
snmp-server community private RW
ip access-list extended OUTSIDE-IN
 10 permit ip any any
line con 0
 exec-timeout 5 0
line vty 0 4
 exec-timeout 0 0
 transport input all
ip access-list extended INSIDE-IN
 10 deny ip 10.1.0.0 0.0.255.255 any
 20 permit tcp 10.1.1.0 0.0.0.255 any eq 443
 30 permit tcp 10.1.2.0 0.0.0.255 any eq www
 40 deny ip any any
 50 permit ip any any
ip access-list extended MGMT-IN
 10 permit tcp 10.2.0.0 0.0.0.127 any eq 22
 20 permit tcp 10.2.0.128 0.0.0.127 any eq 22
 30 deny tcp 10.2.0.0 0.0.0.255 any eq 22
 40 permit tcp 10.2.0.0 0.0.0.255 any eq 22

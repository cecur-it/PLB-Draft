config system global
    set hostname "fgt-fw1"
    set admintimeout 30
end
config system interface
    edit "port1"
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping https ssh http telnet
    next
    edit "port2"
        set ip 203.0.113.2 255.255.255.0
        set allowaccess ping
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config firewall address
    edit "lan-net"
        set subnet 10.10.0.0 255.255.0.0
    next
end
config firewall policy
    edit 1
        set name "lan-https"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "lan-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set ips-sensor "default"
    next
    edit 2
        set name "deny-lan"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "lan-net"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "lan-http"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "lan-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP"
        set logtraffic all
        set ips-sensor "default"
    next
    edit 4
        set name "any-any"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 5
        set name "wan-http"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP"
    next
end

# Drop-in installed by install-forwarder.sh --profile gateway as
# /etc/systemd/system/cecur-forwarder.service.d/10-gateway.conf.
# The OTLP listener, Lua normaliser and ESOC/SIEM egress need more headroom than the <25 MB edge
# budget (base unit: MemoryMax=100M). Disk buffers live under /var/lib/cecur-forwarder (already writable).
[Service]
MemoryMax=256M

# Cecur CS3 — OPTIONAL Fluentd aggregation tier (regional ESOC / collector).
#
# Fluent Bit (deployment/agents/templates/gateway.d/) is the edge tier and the default everywhere.
# Use this Fluentd tier only where you want a regional relay with fan-out in front of the central
# XDR/OpenTelemetry core and a customer SIEM, built on the Fluent plugin nursery:
#   fluent-plugin-opentelemetry  https://github.com/fluent-plugins-nursery/fluent-plugin-opentelemetry
#   fluent-plugin-out-http       https://github.com/fluent-plugins-nursery/fluent-plugin-out-http
#   gem install fluent-plugin-opentelemetry fluent-plugin-out-http grpc      # `grpc` is NOT pulled in automatically
#
# Topology: Fluent Bit gateways --OTLP/gRPC mTLS--> this tier --OTLP/gRPC mTLS--> XDR core
#                                                              \--OTLP/JSON over HTTPS--> customer SIEM (logs only)
# This tier is a relay: opentelemetry events carry the whole OTLP request as an opaque JSON `message`
# ({ "type": "logs|metrics|traces", "message": "<OTLP JSON>" }). Parse/normalise at the edge (Fluent Bit
# Lua) or in the console; do not point tail/JSON records at the opentelemetry output.
#
# Validate:  fluentd --dry-run -c fluentd-aggregator.conf   (needs the CS3_* variables below)
# Docs: deployment/operations/fluent-telemetry-fabric.md
#
# Variables are read with "#{ENV['NAME']}" (Fluentd does NOT expand ${NAME}); ENV.fetch() makes the
# process refuse to start when a required secret/path is missing instead of silently running open.
#   CS3_FLUENTD_BIND        listener address              (default 127.0.0.1; set the NIC address to expose)
#   CS3_FLUENTD_OTLP_PORT   OTLP/gRPC listen port         (default 4317)
#   CS3_FLUENTD_CA          CA that signs the gateway client certificates (required)
#   CS3_FLUENTD_CERT/KEY    this tier's server certificate/key             (required)
#   CS3_XDR_ENDPOINT        host:port of the XDR/OTel core gRPC endpoint   (required)
#   CS3_XDR_CA/CERT/KEY     CA + client certificate for the upstream mTLS  (required)
#   CS3_SIEM_OTLP_URL       https://... OTLP/JSON logs endpoint            (required; to run without a SIEM leg delete
#                                                                           the @SIEM <label> and its <store> in section 2)
#   CS3_SIEM_TOKEN          bearer token for the SIEM                      (required with the SIEM leg)
#   CS3_SIEM_CA             CA bundle for a private SIEM CA                (optional)
#   CS3_BUFFER_DIR          disk buffer root                               (default /var/lib/cs3-fluentd/buffer)

<system>
  log_level info
</system>

# ----------------------------------------------------------------------------------------------
# 1. INGEST — OTLP/gRPC with mutual TLS (tag expands to cs3.otlp.logs | .metrics | .traces)
# ----------------------------------------------------------------------------------------------
<source>
  @type opentelemetry
  tag cs3.otlp.${type}
  <grpc>
    bind "#{ENV['CS3_FLUENTD_BIND'] || '127.0.0.1'}"
    port "#{ENV['CS3_FLUENTD_OTLP_PORT'] || '4317'}"
  </grpc>
  # Only clients holding a certificate signed by CS3_FLUENTD_CA may push events.
  # NOTE: for gRPC listeners only ca_path/cert_path/private_key_path/client_cert_auth apply;
  # min_version/ciphers are ignored, so the TLS floor is gRPC's own (1.2+). Enforce TLS 1.3 at the
  # Fluent Bit gateways (tls.min_version TLSv1.3) or a fronting proxy when 1.3-only is mandated.
  <transport tls>
    ca_path "#{ENV.fetch('CS3_FLUENTD_CA')}"
    cert_path "#{ENV.fetch('CS3_FLUENTD_CERT')}"
    private_key_path "#{ENV.fetch('CS3_FLUENTD_KEY')}"
    client_cert_auth true
  </transport>
</source>

# Self-telemetry of this tier (worker RSS/CPU, buffer queue length, retry count): a missing or
# stalled series is the control plane's cue that the aggregator was suppressed.
<source>
  @type opentelemetry_metrics
  tag cs3.health.metrics
  emit_interval 30s
  metric_name_prefix cs3.aggregator.
</source>

# ----------------------------------------------------------------------------------------------
# 2. ROUTING — tags are distinct namespaces so no <match> shadows another (first match wins).
#    Logs fan out to the XDR core AND the SIEM; metrics/traces/health go to the XDR core only.
# ----------------------------------------------------------------------------------------------
<match cs3.otlp.logs>
  @type copy
  <store>
    @type relabel
    @label @XDR
  </store>
  <store>
    @type relabel
    @label @SIEM
  </store>
</match>

<match cs3.**>
  @type relabel
  @label @XDR
</match>

# ----------------------------------------------------------------------------------------------
# 3. EGRESS — central XDR / OpenTelemetry core: OTLP/gRPC + gzip + mTLS, disk-buffered
# ----------------------------------------------------------------------------------------------
<label @XDR>
  <match **>
    @type opentelemetry
    <grpc>
      endpoint "#{ENV.fetch('CS3_XDR_ENDPOINT')}"
      compress gzip
      timeout 30
    </grpc>
    <transport tls>
      ca_path "#{ENV.fetch('CS3_XDR_CA')}"
      cert_path "#{ENV.fetch('CS3_XDR_CERT')}"
      private_key_path "#{ENV.fetch('CS3_XDR_KEY')}"
    </transport>
    <buffer>
      @type file
      path "#{ENV['CS3_BUFFER_DIR'] || '/var/lib/cs3-fluentd/buffer'}/xdr"
      # Keep chunks below the downstream request limit (plugin default is 8M, which can yield 413).
      chunk_limit_size 4m
      total_limit_size 4g
      flush_interval 2s
      flush_thread_count 2
      retry_type exponential_backoff
      retry_max_interval 30s
      retry_forever true
      overflow_action block
    </buffer>
  </match>
</label>

# ----------------------------------------------------------------------------------------------
# 4. EGRESS — customer SIEM: OTLP/JSON logs over HTTPS (needs CS3_SIEM_OTLP_URL + CS3_SIEM_TOKEN).
#    The body is the verbatim OTLP ExportLogsServiceRequest JSON, so the SIEM endpoint must speak
#    OTLP/HTTP (e.g. an OpenTelemetry Collector, Datadog/Splunk OTLP intake). For SIEMs that need
#    flat events (Splunk HEC, Elastic), have the Fluent Bit gateway ship them instead
#    (templates/gateway.d/50-siem-http.conf).
# ----------------------------------------------------------------------------------------------
<label @SIEM>
  <match **>
    @type http
    endpoint_url "#{ENV.fetch('CS3_SIEM_OTLP_URL')}"
    http_method post
    # Without `buffered true` the plugin ignores <buffer> and sends synchronously with no disk spool.
    buffered true
    # One OTLP ExportLogsServiceRequest JSON document per request: the formatter extracts the raw
    # OTLP JSON string and `raw` sends it unmodified. (bulk_request would wrap it in NDJSON.)
    serializer raw
    custom_headers {"Content-Type":"application/json","X-Origin-Sensor":"CS3-Aggregator"}
    <format>
      @type single_value
      message_key message
      add_newline false
    </format>
    compress_request true
    raise_on_error true
    ssl_no_verify false
    # Empty = system trust store; set CS3_SIEM_CA for a private CA.
    cacert_file "#{ENV['CS3_SIEM_CA'] || ''}"
    # 'authentication bearer' + token is the supported form ('token' is not an auth type).
    authentication bearer
    token "#{ENV.fetch('CS3_SIEM_TOKEN')}"
    # Retry rate limiting and transient gateway failures (plugin default is only 503).
    recoverable_status_codes 429, 500, 502, 503, 504
    <buffer tag>
      @type file
      path "#{ENV['CS3_BUFFER_DIR'] || '/var/lib/cs3-fluentd/buffer'}/siem"
      chunk_limit_size 2m
      total_limit_size 2g
      flush_interval 5s
      retry_type exponential_backoff
      retry_max_interval 30s
      retry_forever true
      overflow_action block
    </buffer>
  </match>
</label>

# Cecur CS3 forwarder parsers (installed by install-forwarder.sh to /etc/cecur/parsers.conf and
# loaded by [SERVICE] Parsers_File in fluent-bit.conf).
#
# Self-contained on purpose: the forwarder does not depend on the distro package's
# /etc/fluent-bit/parsers.conf, whose location and content vary by package and version.
# The installer overwrites this file on every run. To add parsers, edit this template in your
# deployment bundle (Fluent Bit rejects [PARSER] sections in fluent-bit.d fragments).

# Plain JSON-lines logs. No Time_Key: the record is stamped with its ingest time, which is what
# the console ingest contract needs. Use with `Parser json` on a tail input (see
# gateway.d/70-app-logs.conf.example).
[PARSER]
    Name   json
    Format json

# Cecur CS3 gateway profile — forward everything to the central ESOC as OTLP/gRPC over mTLS.
# Installed by install-forwarder.sh when --esoc-host is given.
#
# `Match *` = logs (host.*, v1_logs, cs3.ai.*), metrics (v1_metrics + this node's own health) and
# traces. Delivery is at-least-once: filesystem-buffered (storage.type filesystem on the inputs),
# unlimited retries with backoff, so an ESOC outage never degrades local detection.
#
# Variables: CS3_ESOC_HOST, CS3_ESOC_PORT, CS3_ESOC_CA_FILE, CS3_ESOC_CERT_FILE, CS3_ESOC_KEY_FILE,
# CS3_AGENT_ID, CS3_HEALTH_SCRAPE_SEC.

# Sensor self-telemetry: input/output records, retries, drops, buffer (storage) usage, uptime.
# An agentic ESOC control plane alerts on cadence loss (suppression) or on rising retries/buffer
# depth (egress tampering/exhaustion), and on buffer fill vs. storage.total_limit_size (capacity).
[INPUT]
    Name             fluentbit_metrics
    Alias            cs3_health_metrics
    Tag              cs3.health.metrics
    scrape_interval  ${CS3_HEALTH_SCRAPE_SEC}
    scrape_on_start  true

[OUTPUT]
    Name                      opentelemetry
    Alias                     cs3_esoc_otlp
    Match                     *
    Host                      ${CS3_ESOC_HOST}
    Port                      ${CS3_ESOC_PORT}
    grpc                      On
    compress                  gzip
    add_label                 agent_id ${CS3_AGENT_ID}
    Retry_Limit               False
    Workers                   2
    net.connect_timeout       10
    net.keepalive             on
    storage.total_limit_size  2G
    tls                       On
    tls.verify                On
    tls.min_version           TLSv1.3
    tls.ca_file               ${CS3_ESOC_CA_FILE}
    tls.crt_file              ${CS3_ESOC_CERT_FILE}
    tls.key_file              ${CS3_ESOC_KEY_FILE}

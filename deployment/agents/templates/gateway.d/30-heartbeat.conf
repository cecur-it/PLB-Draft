# Cecur CS3 gateway profile — sensor liveness heartbeat (anti-tamper signal).
#
# Emits one benign event per CS3_HEARTBEAT_SEC through the normal edge pipeline, so it reaches the
# console (every authenticated ingest refreshes the agent's lastKeepAlive), the ESOC and the SIEM.
# A drop in cadence means the sensor was killed, throttled or cut off from egress; a gap in
# otherwise-busy telemetry is the AI/agentic control plane's cue to investigate.
#
# The message intentionally avoids the words the console flags as anomalous ("failed", "error",
# "tamper"), so a healthy heartbeat never shows up as an anomaly queued for AI triage.
# Variables: CS3_HEARTBEAT_SEC, CS3_HOSTNAME, CS3_AGENT_ID.

[INPUT]
    Name          dummy
    Alias         cs3_heartbeat
    Tag           host.heartbeat
    Dummy         {"message":"cs3 sensor heartbeat","source":"cs3-sensor-health","agentName":"${CS3_HOSTNAME}","severity":"info","fields":{"agentId":"${CS3_AGENT_ID}","profile":"gateway"}}
    Rate          1
    Interval_Sec  ${CS3_HEARTBEAT_SEC}
    Interval_Nsec 0

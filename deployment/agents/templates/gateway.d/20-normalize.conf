# Cecur CS3 gateway profile — shape OTLP logs into the console ingest contract
# (POST /api/cecur/logs/ingest: string `message` + string `source` are required).
#
# Runs before the edge `grep` filter (the installer places this directory's include ahead of it).
# Metrics and traces are not touched: record filters only apply to logs, and those signals are
# routed to the ESOC by 40-esoc-otlp.conf.

[FILTER]
    Name    lua
    Match   v1_logs
    Alias   cs3_otlp_normalize
    script  /etc/cecur/fluent-bit.d/cs3-otlp-normalize.lua
    call    cs3_normalize

# Defaults for emitters that do not set them (a CS3 EDR can send a kvlist body with its own values).
[FILTER]
    Name    modify
    Match   v1_logs
    Add     source cs3-otlp
    Add     agentName ${CS3_HOSTNAME}

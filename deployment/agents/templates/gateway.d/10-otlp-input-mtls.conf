# Cecur CS3 gateway profile — OTLP listener with mutual TLS. Selected by install-forwarder.sh when
# the listener is reachable off-host (--otlp-listen other than 127.0.0.1/::1). The installer refuses
# to expose plaintext OTLP beyond loopback.
#
# Only sensors presenting a client certificate signed by CS3_OTLP_CA_FILE can push events, which
# removes local-injection and spoofing vectors. See operations/mtls-certificate-pinning.md.
# Variables: CS3_OTLP_LISTEN, CS3_OTLP_PORT, CS3_OTLP_CA_FILE, CS3_OTLP_CERT_FILE, CS3_OTLP_KEY_FILE.

[INPUT]
    Name                    opentelemetry
    Alias                   cs3_otlp_in
    Listen                  ${CS3_OTLP_LISTEN}
    Port                    ${CS3_OTLP_PORT}
    storage.type            filesystem
    Mem_Buf_Limit           32MB
    logs_max_size           8M
    tls                     On
    tls.verify              On
    tls.verify_client_cert  On
    tls.min_version         TLSv1.3
    tls.ca_file             ${CS3_OTLP_CA_FILE}
    tls.crt_file            ${CS3_OTLP_CERT_FILE}
    tls.key_file            ${CS3_OTLP_KEY_FILE}

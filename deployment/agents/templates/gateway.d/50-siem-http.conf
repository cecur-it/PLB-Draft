# Cecur CS3 gateway profile — stream events to a customer SIEM/analytics gateway over HTTPS.
# Installed by install-forwarder.sh when --siem-url is given.
#
# Sends logs only (host.*, normalised OTLP logs, AI-tier logs) as NDJSON, gzip-compressed and
# disk-buffered. The credential is read from the environment at runtime (/etc/cecur/forwarder.env,
# mode 0600) — it is never part of the image, template or a ConfigMap.
#
# Need Splunk HEC / Elasticsearch / Datadog natively? Replace this file with the matching Fluent Bit
# output (splunk, es, datadog); the Match_Regex and buffering lines stay the same.
#
# Variables: CS3_SIEM_HOST, CS3_SIEM_PORT, CS3_SIEM_URI, CS3_SIEM_TLS, CS3_SIEM_CA_FILE,
# CS3_SIEM_FORMAT, CS3_SIEM_AUTH_SCHEME, CS3_SIEM_TOKEN, CS3_AGENT_ID, CS3_HOSTNAME.

[OUTPUT]
    Name                      http
    Alias                     cs3_siem_http
    Match_Regex               ^(host\..*|v1_logs|cs3\.ai\..*)$
    Host                      ${CS3_SIEM_HOST}
    Port                      ${CS3_SIEM_PORT}
    URI                       ${CS3_SIEM_URI}
    Format                    ${CS3_SIEM_FORMAT}
    Compress                  gzip
    Header                    Authorization ${CS3_SIEM_AUTH_SCHEME} ${CS3_SIEM_TOKEN}
    Header                    X-Origin-Sensor CS3-Edge
    Header                    X-CS3-Agent ${CS3_AGENT_ID}
    Header                    X-Enterprise-Source ${CS3_HOSTNAME}
    Retry_Limit               False
    Workers                   2
    net.connect_timeout       10
    net.keepalive             on
    storage.total_limit_size  1G
    tls                       ${CS3_SIEM_TLS}
    tls.verify                On
    tls.min_version           TLSv1.2
    tls.ca_file               ${CS3_SIEM_CA_FILE}
    # Egress through an internal proxy (air-gapped enclaves): enabled by --siem-proxy.
    # Proxy                   ${CS3_SIEM_PROXY}

# Cecur CS3 gateway profile — AI inference tier (Ollama: Nemotron-3-Nano / Gemma-4).
# Installed by install-forwarder.sh --ai-tier on nodes that run ollama.service.
#
# Ollama's journal entries are tagged cs3.ai.ollama instead of host.journal. That keeps them out of
# the console's anomaly flagging (an inference-server "error" line would be flagged and offered for
# triage by the very model server that produced it — a feedback loop) while still shipping them to
# the ESOC (`Match *`) and the SIEM (cs3.ai.*). Console-side GPU-second metering is separate
# (server/inference/meter.ts, INFERENCE_* variables).
#
# Requires the systemd input in the edge config (Strip_Underscores On -> field SYSTEMD_UNIT).
# Variables: CS3_HOSTNAME.

[FILTER]
    Name          rewrite_tag
    Match         host.journal
    Rule          $SYSTEMD_UNIT ^ollama\.service$ cs3.ai.ollama false
    Emitter_Name  cs3_ai_tag_emitter

[FILTER]
    Name    modify
    Match   cs3.ai.ollama
    Rename  MESSAGE message
    Add     source cs3-ai-ollama
    Add     agentName ${CS3_HOSTNAME}

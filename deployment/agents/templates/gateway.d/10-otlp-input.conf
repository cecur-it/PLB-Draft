# Cecur CS3 gateway profile — OTLP listener (loopback, plaintext). Installed by install-forwarder.sh
# --profile gateway. Replaced by 10-otlp-input-mtls.conf when --otlp-listen is not loopback.
#
# One port serves OTLP/HTTP and OTLP/gRPC. Fluent Bit tags records by signal, identically for both
# transports: v1_logs, v1_metrics, v1_traces (the `tag_from_uri` equivalent of cs3.sensor.${type}).
# Variables (all from /etc/cecur/forwarder.env): CS3_OTLP_LISTEN, CS3_OTLP_PORT.

[INPUT]
    Name              opentelemetry
    Alias             cs3_otlp_in
    Listen            ${CS3_OTLP_LISTEN}
    Port              ${CS3_OTLP_PORT}
    # Survive a console/ESOC outage without back-pressuring the sensor: spool to disk.
    storage.type      filesystem
    Mem_Buf_Limit     32MB
    # Hard cap on a single logs request (defence against oversized/abusive payloads).
    logs_max_size     8M
